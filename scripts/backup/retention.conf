# T-1568 -- retention policy for scripts/backup/prune.sh. Parsed, not sourced: only KEY=number lines.
# A purged tenant's data survives in backups for at most DUMP_KEEP_DAYS (docs/runbooks/backup-restore.md).

# Daily logical dumps (dump/<db>/<stamp>): delete a set older than this many days ...
DUMP_KEEP_DAYS=14
# ... but never leave fewer than this many sets per database.
DUMP_KEEP_MIN=7
# Weekly base backups (base/<stamp>): how many to keep.
BASE_KEEP=2
# WAL files (wal/): extra days of slack kept besides what the oldest kept base backup needs.
WAL_KEEP_DAYS=14
