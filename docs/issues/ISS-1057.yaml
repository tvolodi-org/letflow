description: >
  The AC-5 test is tagged :lua_wallclock_race, but its assertion still compares measured elapsed times for a
  short and a long wall-clock timeout, so it races the wall-clock under contention. Same family as ISS-0426
  (done) and ISS-0469 (closed, the same raw wall-clock comparison at :625). Q-1040 / GH #2379 (ISS-1040)
  covers only :518 and :817, not this test. Under the S7 rule a repeat is a defect, so this is recorded as a
  recurrence (occurrence 2 of the family).
resolution: >
  Open. Remove the raw elapsed-time dependence under contention, or run the assertion only under the
  lua_wallclock_race isolation with a deterministic bound. Queue Q-1057 / GH #2403.
