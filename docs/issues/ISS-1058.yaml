id: ISS-1058
title: "Flaky property 'any set of row writers is invisible after the boundary, and never rebuilds' (tenant_fixture_pool_test.exs ~L1402): reported as a row left in a pooled tenant after recycle"
discovered_by: CI main (run 38235738863, shard 3/3 partition 11, seed 40898); reproduced locally with seed 193355
discovered_in_run: "Q-1058 / GH #2406, regression report of Q-1042 (PR #2397)"
discovered_at: "2026-10-12T00:00:00Z"
severity: MAJOR
owner: "CODE-DESIGNER (fix design) then TEST-DESIGNER/ELIXIR-DEV; test-only, no lib/ change"
scope: test-support
description: >
  Verdict H2 (test defect), isolation hole H1 ruled out. The assertion
  `nonseed_rows(a.schema_name) == []` (L1430) is the symptom of a later, misleading failure, not the
  first failure. Chain: (1) write!(:fk_chain, s) inserts fixed primary keys
  (groups.id 00000000-0000-0000-0000-0000000000a1, users.id ...b1), and the generator
  list_of(member_of(@prop_writers), max_length: 5) can emit :fk_chain twice, so the second write
  raises 23505 groups_pkey inside the iteration (reproduced: writers [:fk_chain, :fk_chain], via
  :test, seeds 193355 and 40898). (2) That aborts the iteration BEFORE recycle_pool!/0, so the
  per-test claims map ({TenantFixture, :claims}) keeps {shape_a => 1}. (3) StreamData shrinking re-runs
  the body in the same test process: fx(:a) now claims k=1, i.e. the second declared slot (slots: [@a,
  @a, @b]), schema B; recycle_pool!/0 clears the claims, and the post-recycle fx(:a) claims k=0, i.e.
  schema A. nonseed_rows(a.schema_name) therefore inspects slot B, which the pool correctly leaves
  untouched until its next acquire (reset is lazy, at acquire, INV-P12), so it shows the writes. The
  pool's own report for fx(:a) (slot A) is rightly clean. Evidence from instrumented run: first=
  tenant_a6418b..., after_recycle=tenant_4a4c4e..., same=false, rows_first=[{groups,1}],
  rows_second=[]; and the next acquire of slot B was reported clean?: true with the earlier rows gone
  (so no later attach sees them). Seed 40898 shows the same first failure; its shrink then trips
  the ArgumentError 'asked a pooled module for slot {shape, 2}, which start_pool!/2 did not declare'
  (claims leaked twice).
resolution: >
  Open (diagnosis complete, fix not implemented). Design: (a) make write!(:fk_chain) repeatable
  (ids from uniq/gen_random_uuid), or dedupe; (b) start each iteration with recycle_pool!/0 so an
  aborted prior attempt cannot leak claims into the next, and assert fx(:a).schema_name ==
  a.schema_name after the boundary so a wrong-schema check can never pass or fail silently;
  (c) add fixed regression cases for [:fk_chain, :fk_chain]/:test and [:groups]/:test after an aborted
  attempt. The property's claim is unchanged.
