resolved_at: "2026-10-13T13:45:00Z"
resolution: >
  PR 1 (ACs 1-5): POST /onboarding no longer drops the administrator fields (administrator,
  ignored_fields, login in the 201 body), an optional validated idp_realm_id and the bind-once
  POST /onboarding/:id/bind-realm, and the runbook. PR 2 (ACs 6-8): a tenant-schema table
  pending_tenant_admin_grants (TENANT_ADMIN only, by CHECK); admin_email at onboarding is stored
  as a pending grant; the grant binds at the first login through the tenant's own realm on a
  verified e-mail claim (or the operator-set per-realm setting, default OFF), exactly once, in one
  transaction with a tenant-chain entry (NIL actor) and a platform-chain entry (operator id); the
  operator list with AGE and revoke routes; the tenant-admin read route. Decision 0048.
follow_ups:
  - "Wizard-driven realm and user creation (BA item 4): awaiting the platform owner's decision; NOT built."
  - "Tenant-admin revoke of a pending grant."
  - "Re-creation (replacement) of a pending grant after a typo."
  - "A platform-wide sweep of pending grants across all tenants."
  - "Q-1032 / GH #2351 (patch_tenant_with_audit wrote the operator's user id into the tenant audit chain): DONE, merged as a separate PR (9a8aa7ca), same split as design section 7a."
