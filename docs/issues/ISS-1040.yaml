regression_test: test/letflow/engine/lua/executor_test.exs
resolution: >
  Root cause removed. The two in-flight-child tests (AC-5 "the running script is a child of
  Letflow.Engine.Lua.TaskSupervisor while in flight" and "a nil max_heap_words leaves the REQ-155
  TaskSupervisor-based path unchanged") polled the global TaskSupervisor from the test process for
  ~200 ms against a 300 ms script life, both ends wall-clock, so the window could close before the
  test looked, and the global check could also be satisfied by another test's child. Fix (test-only,
  no lib/ change, no global timing change): each call's own timeout_ms is 30_000 ms so the script's
  life is bounded by the test; the shared helper await_own_child/2 finds THIS call's child via the
  "$callers" process-dictionary entry within a monotonic 5 s deadline; the test then releases the
  script deterministically with Process.exit(child, :kill) and asserts the resulting crash shape.
  Both tests and their @tag :lua_wallclock_race tags are kept (property test count unchanged).
  Evidence: mutant async_nolink -> Task.async in lib/letflow/engine/lua/executor.ex fails both target
  tests; TEST-DESIGN-VALIDATOR's own mutants M1/M2 also fail them; 100/100 seeded stress runs green
  under 6 busy loops (~34 min); RELEASE-VALIDATOR plain run of the file: 60 passed
  (handoffs/WF03-ISS1040-20261012/step-05v-release-validator.json).
