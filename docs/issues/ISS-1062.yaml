description: >
  The backend path filter in .github/workflows/ci.yml does not set backend=true for .formatter.exs, for
  priv/ outside migrations (keycloak, modules, solutions, wasm_fixtures, expr_conformance), and for the
  docs, handoffs and web files that backend tests read. A change confined to those paths can merge
  without the backend gate running. Related: Q-1038 / GH #2365 (its local record on main is ISS-1059, resolved)
  covers scripts/*.sh only, and PR #2410 is letflow-16's change for that line.
resolution: >
  Open. Widen the backend path filter to every path the backend gate reads, with a check that fails when
  a read path is missing from the filter. Queue Q-1059 / GH #2411.
