description: >
  docs/issues holds 640 issue files in about 8 weeks (214 in 2026-08, 310 in 2026-09, 106 in 2026-10 so far). By
  severity: MINOR 374, MAJOR 215, BLOCKER 41. Each issue runs its own WF-03 chain and its own PR. WF-03 has no batching
  rule. Proposed: up to 4 open MINOR issues in one run and one PR when they share owned_modules or one directory, have no
  depends_on between them, and none touches a tenant-data path. BLOCKER and MAJOR are never batched. Records only.
resolution: >
  Open. Eligibility test, claim and release protocol for a batch (a failed issue is split out; the rest proceed), the
  named exception to 'one PR per issue', and one worked example. Queue Q-1065 / GH #2419.
