recommended_lever: >
  (c) refined: a module-scoped pooled tenant with a DIRTY-TABLE-ONLY reset, opt-in per module via
  a fixture option (default stays a fresh clone), rolled out starting with the highest-clone
  modules. Per test: probe the tenant schema's tables for rows in one query, TRUNCATE only the
  dirty ones (RESTART IDENTITY, one statement), re-seed event_type_registry/schema_migrations if
  touched, and reset any public-schema rows keyed to that tenant; per module: one clone via the
  existing do_clone path. Keeps the committed / Sandbox :auto semantics unchanged. Estimated gain
  on the measured partition: ~357 s (run A fixture total) -> ~16 s (19 clones) + ~403 x
  (~50-100 ms reset) = ~35-55 s, i.e. test phase 483 s -> ~160-180 s (about -63%); an ESTIMATE
  from the micro-benchmarks, to be replaced by the implementer's measured 5-run before/after.
levers_evaluated:
  a_clone_only_needed_tables: "Rejected as primary. Per-table cost is ~12 ms, so clone cost scales with table count, but FK closure and the 182-file blast radius (each call site would declare its tables) make it high-effort for <=5x on at most the LIKE loop; also does not remove the 110 ms index-rename or 55 ms FK re-add steps. Possible add-on."
  b_shared_readonly_tenant_or_sandbox_rollback: "Rejected as primary. A truly read-only shared tenant helps few modules (the heavy ones mutate: promotions, definitions, identity writes). Sandbox-rollback needs tests in manual mode, contradicting the fixture's :auto contract (ISS-0113) and tests that commit across connections; sequences also are not rolled back. High leak/flake risk."
  c_pooled_tenant_per_module_with_reset: "RECOMMENDED in the dirty-only form. Measured: truncate-all (932-1055 ms) is WORSE than a clone, so the lever only pays with dirty-table detection (probe 3.6 ms; truncate ~8 ms per dirty table)."
  d_create_database_template: "Rejected: not applicable. The Repo pool, Sandbox ownership and the public-schema tables (tenants, tenant_schemas, ...) are bound to one database per partition (letflow_test<i>); a database per test would need a per-test pool and would not clone faster than ~50 table DDLs of a small schema. Not measured."
  e_server_side_single_roundtrip: "Rejected by measurement: the server-side one-transaction LIKE loop alone costs ~420 ms for 57 tables; round trips are not the floor."
constraints_on_any_fix:
  - "No change to required CI check names (Backend gate (mix letflow.check), Frontend gate (npm run check), and the aggregator)."
  - "No paid runners."
  - "Isolation proof: a test that leaves data behind (tenant schema rows AND public rows keyed to the tenant, sequences, and an UPDATE to a seeded table such as event_type_registry) must not leak into the next test; mutation test required."
  - "Keep the existing clone parity checks (assert_clone_parity!, template_self_check!) green and keep template: :replay as the escape hatch for migration-replay/schema-vanish tests."
  - "Before/after wall time of the test phase, 5 runs each, with run ids; instrumentation used for diagnosis was local and reverted."
acceptance_criteria:
