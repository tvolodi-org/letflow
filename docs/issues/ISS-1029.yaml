id: ISS-1029
title: "Promotion review READ routes (GET /promotions/:id/context, GET /promotions/:id, GET /promotions) do not re-check the stored source/target tenant ids for a non-operator (status disclosure of foreign-named reviews)"
discovered_by: SECURITY-REVIEWER (ISS-1026, Q-1008)
discovered_in_run: WF03-ISS1026-Q1008-20261006
discovered_at: "2026-10-06T20:30:00Z"
severity: MINOR
failure_class: defect
occurrence: 1
owner: ELIXIR-DEV (after CODE-DESIGNER / CODE-DESIGN-VALIDATOR on the diagnosis handoff)
description: >
  In lib/letflow/routers/promotions.ex the approve, reject, apply and run-assertions handlers re-check
  the review's STORED source/target tenant ids against the caller (stored_tenants_authorized?/3,
  ISS-1026). The three read handlers do not: handle_context (~L526), handle_get_assertion_run (~L487)
  and handle_list_reviews (~L1157) go straight to PromotionReviewStore.get_review/2 /
  list_reviews/2. A non-operator holding :PromotionsRead can therefore read the status, requested_by,
  def_type, def_id, created_at, row_version (context), the assertion-run counts and failing assertion
  ids (GET /:id) and the status/metadata (list) of a review whose stored plan names foreign tenants,
  when such a review sits in the caller's own schema (operator-created review in the platform
  tenant's schema, or a legacy row). No cross-tenant plan content leaks (serialised_plan is
  allowlisted, ISS-1021 / ISS-1023). INV-10 family (Q-981 / Q-1003 / Q-1005 / Q-1008). Real exposure:
  platform-tenant pin unset, legacy rows, and after REQ-447 grants :PromotionsRead to
  TENANT_ADMIN/TENANT_AUDITOR.
  Diagnosis and fix design: handoffs/WF03-ISS1029READSTORED-20261013/step-01-issue-fixer.json
  (revision 3; rev2: the read predicate is PARTY-based, source OR target == the authenticated tenant; the
  write routes keep the strict both-sides predicate). List decision: omit, filter in the store's keyset
  loop, no scan cap, cursors only ever encode emitted (visible) rows (mechanism accepted by the filer,
  GH #2311 comment 6146252089). Repro measured 2/5 passed, 3 failed; it must be re-seeded with a non-party.
acceptance_criteria:
  # REVISED ACs (letflow-2, GH #2311 comment of 2026-10-13T10:53Z, AC6 clarified in comment 6146252089)
  - "AC1: a tenant admin whose tenant is a named PARTY (source or target) of the review keeps the ISS-1023 own-side view: 200, own-side fields, entries [], foreign ids omitted; the four pinning tests (T-8/T-11/T-13) stay as they are"
  - "AC2: a 404 is returned only to a non-operator caller who is NOT a named party"
  - "AC3: party status is decided from the stored source and target ids compared with the authenticated tenant context, never from anything in the request"
  - "AC4: the 404 has the same status and body as for a nonexistent id on GET /:id, GET /:id/context and the list (omission); a test compares the bodies byte for byte"
  - "AC5: for a party, GET /:id may return the assertion run status; nothing of the foreign side beyond what ISS-1023 allows (rev3: the existing 7-key run map is kept, no new shape; the teardown_error / failing_assertion_ids residual is pre-existing, for SECURITY-REVIEWER and a separate follow-up issue)"
  - "AC6: the list omits non-parties for non-operators (in SQL or in a chunked in-app filter); no placeholder row (mechanism accepted by the filer)"
  - "AC7: a legacy row whose stored ids cannot be read as JSON is non-party for non-operators (fail closed) and stays visible to operators; never a 500 for any caller (operator /context uses a tolerant decode: 200, serialised_plan null)"
  - "AC8: keyset pagination shows no gaps and no counts that reveal omitted rows; page-boundary test incl. an all-hidden page"
  - "AC9: SECURITY-REVIEWER reviews before TEST-DESIGN-VALIDATOR"
  - "AC10: the failing case is re-seeded with a non-party caller so the test exercises the 404 path, plus a party control expecting 200"
  - "The approve/reject/apply/run-assertions write routes keep the strict both-sides predicate (behaviour unchanged)"
