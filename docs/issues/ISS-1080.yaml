resolution: >
  Four root causes fixed: RC-A (EXIT trap inherited by the watchdog subshell deleted the tmp dir), RC-B (ready-file/liveness check order in poll_template_ready_dir), RC-C (wait -n -p left finished_pid unbound), RC-D (diag test wall-clock window). Fixes in scripts/test_parallel.sh S1..S3 and the test windows; regression file test/scripts/test_parallel_race_regression_test.exs; failure_context capture added; mutants killed. Known residual: orphan test "EXIT-trap path" intermittently hangs on the Windows git-bash host only (pre-existing, same rate on origin/main script); test_parallel_pool_sizing_test.sh is stale and not in CI. Both are candidates for separate issues.
