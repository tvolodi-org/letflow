title: "test_parallel.sh family flakes under CI load: shard test :241 (admission-control poll TOCTOU) and :274 (EXIT trap rm -rf'd in the watchdog subshell), orphan test :339 (wait -n -p leaves finished_pid unset), diag test :247 (stub emission vs a 2 s watchdog)"
