description: >
  Decision: KEEP the convention. Tenant-schema tests run in Sandbox :auto and do not restore :manual (ISS-0113 / INV-F-6).
  No sweep over the 121 files that call Sandbox.mode(..., :auto) on main. The exposure is closed from the victim side:
  no test may depend on a sandbox mode a previous test left behind; every async: false module that touches the Repo sets
  its own mode in setup. The ISS-0113 / INV-F-6 position is recorded once in the moduledoc of
  test/support/sandbox_auto_mode.ex. Test-only. Related: ISS-0512 (closed), ISS-0513 (closed), ISS-0705 (closed).
resolution: >
  Open. Checker (extend mix letflow.check_async_sandbox_reachability or a test) for async: false Repo modules without
  DataCase or a setup mode; fails on a new inline Sandbox.mode(_, :auto) outside a frozen allow-list; the existing async
  checker shown to catch an async: true file reaching :auto. Queue Q-1070 / GH #2424.
