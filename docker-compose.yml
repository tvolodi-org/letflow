services:
  postgres:
    image: postgres:16
    # Survive a host reboot / power loss: without a policy Docker leaves the
    # container stopped and every test run fails with `connection refused`
    # (GH #2513). A container created before this key existed keeps its old
    # policy until recreated -- see README "After a reboot".
    restart: unless-stopped
    environment:
      POSTGRES_USER: letflow
      POSTGRES_PASSWORD: letflow
      POSTGRES_DB: letflow_dev
    ports:
      # Host port is per-workspace, not global: two workspaces (letflow,
      # letflow-2) run this stack side by side against the same repo, so a
      # hardcoded port would collide. Default 5462 keeps the original
      # single-workspace behaviour; a workspace that needs its own instance
      # sets LETFLOW_DB_PORT in an untracked .env next to this file (docker
      # compose reads it automatically, and config/dev.exs + config/test.exs
      # read the same file so Ecto and the container never disagree).
      - "${LETFLOW_DB_PORT:-5462}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letflow -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - letflow_pg:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "false"
    ports:
      # Same per-workspace pattern as postgres above (LETFLOW_DB_PORT).
      # Default 8082: R-Co's own stack (c:\Users\tvolo\dev\ai-dala\R-Co\docker-compose.yml)
      # maps 8081:8080 for its nginx-fronted Keycloak gateway, plus 5432/5433
      # for postgres -- 8082 avoids all three. Letflow exposes Keycloak
      # directly with no nginx gateway: R-Co's gateway exists solely to raise
      # nginx's large_client_header_buffers past 8k for oversized
      # service-account JWTs, which is not a problem Letflow has today. A
      # workspace running its own instance alongside another sets
      # LETFLOW_KEYCLOAK_PORT in the untracked .env next to this file (read
      # by both docker compose here and config/keycloak_port.exs, so the
      # container and Ecto/Oidcc never disagree -- same pattern as
      # LETFLOW_DB_PORT/config/db_port.exs).
      - "${LETFLOW_KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - ./priv/keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  letflow_pg:
