# Work-board label definitions (ISS-1073 / GH #2430).
# Source of truth for the labels documented in docs/agents/protocols/WORK_BOARD.md.
# This file is DECLARATIVE: nothing in the repo applies it. The supervisor creates
# the labels on GitHub (e.g. `gh label create <name> --color <hex> --description <text>`
# for each entry; `gh label create --force` updates an existing one).
#
# Rules (WORK_BOARD.md): exactly one state: label per open item; at most one
# claimed: and one next:. claimed:<checkout> is set and removed ONLY by the
# supervisor or the user. 'blocked-on' is a body convention, never a label.
#
# lane:<name> is an open family: the supervisor creates a lane label when a
# lane is opened (color 0e8a16). No fixed list is committed here.

labels:
  - name: "state:ready"
    color: "0e8a16"
    description: "Eligible for pickup once every Depends-on issue is closed"
  - name: "state:in-progress"
    color: "fbca04"
    description: "Claimed and being worked; has a claimed: label"
  - name: "state:blocked"
    color: "b60205"
    description: "Waiting; the body names blocked-on: #N or a reason"
  - name: "prio:1"
    color: "d93f0b"
    description: "Highest priority; within one prio the lower issue number goes first"
  - name: "prio:2"
    color: "e99695"
    description: "Normal priority"
  - name: "prio:3"
    color: "f9d0c4"
    description: "Low priority"
  - name: "type:requirement"
    color: "1d76db"
    description: "A REQ-NNN work package (docs/requirements.yaml)"
  - name: "type:issue"
    color: "5319e7"
    description: "A defect, finding or follow-up (ISS history or new)"
  - name: "stage:S0"
    color: "c5def5"
    description: "Migration/product stage S0"
  - name: "stage:S1"
    color: "c5def5"
    description: "Migration/product stage S1"
  - name: "stage:S2"
    color: "c5def5"
    description: "Migration/product stage S2"
  - name: "stage:S3"
    color: "c5def5"
    description: "Migration/product stage S3"
  - name: "stage:S4"
    color: "c5def5"
    description: "Migration/product stage S4"
  - name: "stage:S5"
    color: "c5def5"
    description: "Migration/product stage S5"
  - name: "stage:S6"
    color: "c5def5"
    description: "Migration/product stage S6"
  - name: "stage:S7"
    color: "c5def5"
    description: "Migration/product stage S7"
  - name: "stage:S8"
    color: "c5def5"
    description: "Migration/product stage S8"
  - name: "stage:S9"
    color: "c5def5"
    description: "Migration/product stage S9"
  - name: "stage:S10"
    color: "c5def5"
    description: "Migration/product stage S10"
  - name: "stage:S11"
    color: "c5def5"
