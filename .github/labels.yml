  - name: "claimed:letflow"
    color: "bfd4f2"
    description: "Claimed by checkout letflow -- set by the supervisor or the user only"
  - name: "claimed:letflow-2"
    color: "bfd4f2"
    description: "Claimed by checkout letflow-2 -- set by the supervisor or the user only"
  - name: "claimed:letflow-3"
    color: "bfd4f2"
    description: "Claimed by checkout letflow-3 -- set by the supervisor or the user only"
  - name: "claimed:letflow-4"
