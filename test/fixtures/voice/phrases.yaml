# T-1348 / D2d: the regression phrase list of the stock voice draft (voice-port-design section 8).
# 20 phrases: 10 Russian, 10 Kazakh. Typed layer: `text` goes through the real VoiceService.draft_text;
# `model_answer` is what a correct model returns (stored, never generated by the test); `expected` is the
# draft the server must return after its own check (`dropped` holds reasons only).
#
# Catalog of the fixture tenant (see voice_regression_test.exs): items NUT-M8, NUT-M10, BLT-M8-40,
# BLT-M10-60, WSH-8, CBL-3x2.5, CBL-3x1.5; locations A-01, B-02, LA3 (zone word "слева а три"), LN2.
#
# Split (fixed, never change without a written reason here): per language tune = 01,02,03,05,06,07,
# heldout = 04,08,09,10. Counts are guarded by test R-4.
#
# kk-NN carries the same cases as ru-NN. Every Kazakh text is an unverified draft: checked_by is
# pending_native until a native speaker has checked it (owner input outstanding).
# cases labels: letter_article, zone_word, shared_name, transfer, missing_quantity, missing_location, noise
- id: ru-01
  lang: ru
  split: tune
  cases: [zone_word]
  text: "приход гайка м восемь восемьдесят штук слева а три"
  model_answer: {kind: receipt, item_codes: [NUT-M8], location_words: "слева а три", location_code: LA3, to_location_words: null, to_location_code: null, quantity: 80}
  expected: {kind: receipt, items: [NUT-M8], location: LA3, to_location: null, quantity: "80", dropped: []}
- id: ru-02
  lang: ru
  split: tune
  cases: [transfer, shared_name]
  text: "переместил гайки со слева а три на слева н два"
  model_answer: {kind: transfer, item_codes: [NUT-M8, NUT-M10], location_words: "слева а три", location_code: LA3, to_location_words: "слева н два", to_location_code: LN2, quantity: null}
  expected: {kind: transfer, items: [NUT-M8, NUT-M10], location: LA3, to_location: LN2, quantity: null, dropped: []}
- id: ru-03
  lang: ru
  split: tune
  cases: [missing_location]
  text: "расход шайба восемь двадцать штук"
  # Defective answer: the model guessed a location that was not said; the server drops it.
  model_answer: {kind: issue, item_codes: [WSH-8], location_words: null, location_code: A-01, to_location_words: null, to_location_code: null, quantity: 20}
  expected: {kind: issue, items: [WSH-8], location: null, to_location: null, quantity: "20", dropped: [location_not_said]}
