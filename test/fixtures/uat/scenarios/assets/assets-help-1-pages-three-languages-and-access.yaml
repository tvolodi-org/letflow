# T-1585 (BA batch 3 item 3, covers merged B2#8, #4103): help pages of the asset and stock screens in English, Russian and Kazakh.
# Sources: web/src/modules/assets/help/assetsHelpTopics.ts (topics cards, documents, balances, movements; the cards topic needs the card-write right, the others the asset read right), web/src/modules/stock/help/stockHelpTopics.ts (documents, balances, movements, counts; stock read right),
# web/src/modules/assets/help/AssetsHelpPage.tsx (an unknown topic shows the not-found page; a user without the right is refused), assetsHelpMessages.ts and stockHelpMessages.ts (texts: "What this screen is for", "Three common tasks", "What a refusal means"), docs/roles.md (TASK_WORKER holds no asset or stock right; only TENANT_ADMIN and PLATFORM_ADMIN hold the asset rights; STOREKEEPER holds the stock rights but there is no storekeeper actor in the roster).
# KNOWN CONFLICT to be judged in step 6 (not hidden): the English help text of the counts screen says "Stock movements during counting are not blocked", while scenario stock-counts-4-count-freeze-refuses-postings-and-cancel-lifts-it records that a count ordered with the option "freeze locations" refuses postings into its places. The freeze is an option, so the sentence is true only without it. EO-004 asks the tester to compare them.
# UAT assumption, to be confirmed by the process owner: help gives plain descriptions only, no advice on money or legal terms (T-1551 item 8). Kazakh texts are machine drafts until the owner's native check (docs/uat/ui-text-walk.md).
---
id: assets-help-1-pages-three-languages-and-access
scope: assets
title: Each asset and stock screen has a help page in three languages with a purpose, three tasks and the meaning of refusals; a worker cannot open it
version: "1.0"
tags: [assets, stock, help, ru, kk, en, refusal]

description: >
  The SwiftRoute administrator opens the "Help" link on the asset cards screen and on the counts screen, reads the three parts of each page, and reads them in Russian and Kazakh. A topic name that does not exist shows the not-found page.
  The task worker Marco, who has no asset or stock right, types the help addresses by hand and is refused. The administrator compares what the counts help says about stock movements with what the count freeze does.

actors:
  admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco

preconditions:
  - description: SwiftRoute has the assets and stock modules active.
    check: system_seeded
    detail: If the stock module is not active, report BLOCKED for steps 3 and 6 only.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator opens the asset cards screen, presses "Help" and reads the page: the part "What this screen is for", the part "Three common tasks" and the part "What a refusal means".
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator switches the language to Russian and then to Kazakh on the same help page and reads the three parts again. The administrator then presses "Back to the screen".
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator opens the counts screen, presses "Help" and reads the three parts.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator types the address of the asset help with a topic that does not exist ("invoices") by hand.
    via: ui
  - step: 5
    actor: worker
    action: >
      The task worker types the address of the asset cards help, then the address of the counts help, by hand in the browser.
    expect_refusal: true
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator reads the refusal entry of the counts help about stock movements during a count and compares it with the result of scenario stock-counts-4-count-freeze-refuses-postings-and-cancel-lifts-it (postings into the places of a count ordered with the freeze are refused).
    via: ui

expected_outcomes:
  - id: EO-001
    description: Each help page has the three parts, in plain words.
    verification:
      method: gui_screen
      detail: Steps 1 and 3 show a title that starts with the word Help, a purpose sentence, exactly three tasks and a list of refusals each with a title and a body. No screenshot, no technical code, no money or legal advice.
      evidence: Screenshots.
    on_fail:
      severity: MAJOR
      business_impact: A pilot user has no answer on the screen and calls the team.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The pages exist in Russian and Kazakh.
    verification:
      method: gui_screen
      detail: Step 2 shows the headings "Для чего этот экран", "Три частые задачи", "Что значит отказ" in Russian and their Kazakh equivalents, with every body text in the chosen language and "Back to the screen" returning to the cards screen.
      evidence: Screenshots in Russian and Kazakh.
    on_fail:
      severity: MINOR
      business_impact: Users of the other languages have no help.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: A wrong topic and a user without the right see no help.
    verification:
      method: gui_screen
      detail: Step 4 shows the not-found page. Both addresses of step 5 show no help text (a refusal or the not-found page).
      evidence: Screenshots.
    on_fail:
      severity: MAJOR
      business_impact: Help pages leak the existence of screens a user may not open.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: The help does not contradict the behaviour it describes.
    verification:
      method: gui_screen
      detail: The counts help (step 6) does not say that stock movements are never blocked during a count without naming the option "freeze locations", which does block them. If it says so without the option, the tester reports a defect against the help text.
      evidence: Screenshot of the help entry and the freeze result.
    on_fail:
      severity: MAJOR
      business_impact: A clerk trusts the help, posts during a count, and is refused with no explanation.
      suggested_action: route_to_frontend_dev
