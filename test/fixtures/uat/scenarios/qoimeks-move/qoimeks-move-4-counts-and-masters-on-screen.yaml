# T-2266 code-reading pass (PM 2026-11-19), group qoimeks-move; every expectation below was read against origin/main 98848962e.
# 1. Scope: scope qoimeks-qa2; tenant and realm qoimeks-qa2 exist (actors.yaml, T-2219); the group directory name is not the scope; run title UAT qoimeks-move.
# 2. Actors: actor-qoimeks-qa2-admin (TENANT_ADMIN) reads the Locations screen, because web/src/modules/locations/locationsRoutes.tsx guards every route with LocationsWrite and docs/roles.md says the storekeeper must not write locations; actor-qoimeks-qa2-storekeeper (STOREKEEPER, StockRead) reads the Items screen (catalogItemsRoutes.tsx guard is the stock read permission) and the Balances screen. Both are in actors.yaml for qoimeks-qa2; live logins are verified by acceptance from the credential source (no credential in any file); a missing credential blocks the outcome, never a PASS.
# 3. Host and screens: https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 answered HTTP 200 on 2026-11-19 (T-2190). Read at main: LocationTreePage.tsx (a count "<n> locations" next to the tree, and the notice "Showing the first {count} records only; the list is longer..." when truncated), ItemsPage.tsx (range text "{from}-{to} of {total}"; retired items hidden until "Show retired"), BalancesPage.tsx (no total, "Load more"), stockMessages.ts, catalogItemsItemsMessages.ts, locationsMessages.ts.
# 4. Data: P (places), I (items), B (rows with a non-zero quantity) and Neg (negative rows) are read at the start of the run, never hard-coded. Seed baseline per the owner task for orientation only: 150 places incl. A-01 A-02 A-03 B-01 B-02 C-01 RAMP LA3, 678 items incl. 12 demo items, 603 balances of which 3 negative. scripts/pilot/qoimeks_gen.py: place names "Склад", "Зона <letter>", "Справа <letter> <n>" (the older runbook figures are not used); item names "<type>-<number>", every 100th with one Cyrillic look-alike letter at the end, unit pcs; item codes zero-padded to four digits (0001, 0100).
# 5. Executable: browser steps at 1440 px and 390 px with real controls only: Items search "Search by code or title", the tree count, "Load more". The three compare tools are offline command-line scripts and are not run here.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and a live host); static check run, see the task result. Acceptance runs preflight with title "UAT qoimeks-move".
# EXPECTATION CORRECTIONS (this scenario, 6): (a) the Locations screen is run by the administrator (storekeeper cannot open it: LocationsWrite guard), the old text ran it as the storekeeper; (b) the Items screen DOES show a total ("<from>-<to> of <total>") and hides retired items by default, so I is that total with "Show retired" off and the run notes retired items separately; (c) the Balances screen shows no total, so B is counted by loading every page ("Load more"), no "total if the screen shows one" branch; (d) the Locations count is the count beside the tree, and a "first N records only" notice makes the count a lower bound (reported); (e) the negative rows are counted from the screen, not fixed at 3; (f) the old reading "B equals the unique rows" is now "B rows on the screen, each one item/place/org unit/responsible/lot/unit", compared with the workbook in qoimeks-move-1, not here.
# NOT UAT-OBSERVABLE (origin T-2167): the three compare tools qoimeks_compare.sh (record counts), qoimeks_balances_compare.py (quantity hash) and qoimeks_masters_compare.py (hash per table of places, units and items; REQ-881) are offline command-line scripts run by the operator on files; the Qoimeks extract they compare with is outside the QA tenant and outside the browser, and no screen shows a hash. The observable stand-in is what the screens show: the numbers of places, items and balances and a few names read by code, the same facts the tools compare. Matching hashes cannot be shown here. Also not walked: the write freeze, ANALYZE after the load, rollback, the working-hours rule, the 30-day copy (operator and infrastructure rules, no screen, REQ-880). Automated checks: test/scripts/qoimeks_masters_compare_test.exs and test/scripts/qoimeks_balances_compare_test.exs.
# The unauthorized-access refusal step of the group is in scenario qoimeks-move-1 (step 8); this scenario writes nothing.
# Requirements covered: REQ-880 (the move rules check list: "counts and hashes per table", "current balances equal"), REQ-881 (master data compare of places, units, items by code and name; the observable part).
# Cleanup: read-only, nothing is written.
# Label sources: web/src/modules/stock/stockMessages.ts, web/src/modules/catalog_items/catalogItemsItemsMessages.ts, web/src/modules/locations/locationsMessages.ts.
---
id: qoimeks-move-4-counts-and-masters-on-screen
scope: qoimeks-qa2
title: >-
  The Qoimeks QA administrator and storekeeper read the places, items and balances on the screens and find the counts
  and the master names the move checks compare, on a desktop and at 390 px
version: '1.2'
tags:
- qoimeks
- move
- counts
- masters
- locations
- catalog
- balances
- desktop
- phone
- ru
- read_only
description: >-
  After the move rehearsal the tenant must hold the same tables as the Qoimeks extract: P places, I items and B
  non-zero balances, all read at the start of the run from the screens. The offline compare tools check this by counts
  and hashes and cannot be run from a browser (see the header). This scenario walks what can be seen: the administrator
  reads the Locations screen (the warehouse "Склад", its zones, a rack place, the count of places), the storekeeper reads
  the Items screen (the total, items 0001 and 0100 with their names and unit) and the Balances screen (every page loaded,
  the rows with a negative quantity). The same reading is repeated at 390 px in Russian. The scenario makes no write.
actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The Qoimeks QA tenant holds the synthetic data (places, items, posted balances) and the modules locations, catalog
    items and stock are active; P, I, B and Neg are read at the start of the run.
  check: system_seeded
  detail: >-
    If a screen is empty, report BLOCKED-by-environment for that screen's steps and say what it showed. If the numbers
    differ from the orientation figures in the header, report the numbers as found.
- description: >-
    The run can drive a real browser at 1440 px and at 390 px.
  check: runner_prepared
  detail: >-
    If no browser can be started, report BLOCKED-by-environment for the whole scenario.
- description: >-
    Both actors can sign in at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2; the browser language is
    English at the start.
  check: runner_prepared
  detail: >-
    Missing credentials block the affected steps. Do not seed, grant roles or change any rule.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in at 1440 px in English and opens the Locations screen. The administrator reads the top of
    the tree (the warehouse and its zones), the count shown beside the tree (P), whether the notice about showing only
    the first records is present, and expands one zone to read a rack place.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper signs in, opens the Items screen and reads the total in the range text (I). The storekeeper types 0001
    and then 0100 in "Search by code or title", opens each item and reads its name and unit. The storekeeper also
    switches on "Show retired" and notes how the total changes.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper opens the Balances screen, presses "Load more" until it is no longer offered, counts the rows with a
    quantity other than zero (B) and finds the rows with a negative quantity (Neg).
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The window is made 390 px wide and the language is switched to Russian. The storekeeper opens the Balances screen and
    reads the first rows.
  via: ui
- step: 5
  actor: admin
  action: >-
    In the same window width and language the administrator opens the Locations screen and reads the first rows of the
    tree.
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The storekeeper switches the language back to English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The Locations screen shows the warehouse, the zones and the rack places with their Russian names whole, and the count
    P (REQ-881).
  verification:
    method: gui_screen
    detail: >-
      Step 1 shows the warehouse "Склад" at the top with zones named "Зона <letter>" under it and rack places named like
      "Справа <letter> <number>"; no name shows a question mark or broken character; the count beside the tree is P. If the
      notice "Showing the first ... records only" is present, P is a lower bound and the run says so; the number is quoted as
      found and no pass is claimed for equality with the extract.
    evidence: >-
      Screenshot of the tree and the count, quoted.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The master data of the move does not equal the extract, so stock would sit at wrong or missing places.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: >-
    The Items screen shows the total I and the names and unit as in the extract (REQ-881).
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows the total I in the range text; item 0001 has a name of the form "<type>-0001" and the unit pcs; item 0100
      has a name of the form "<type>-0100" with one Cyrillic letter at its end that looks like a Latin one, not a question
      mark. The run quotes the names as shown. Switching on "Show retired" may raise the total; the run quotes both totals and
      uses the one with retired items hidden as I.
    evidence: >-
      Screenshot of the two items and the total, quoted.
  on_fail:
    severity: MAJOR
    business_impact: >-
      An item master that differs from the extract makes every stock figure after the move unreliable.
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    The Balances screen holds the B balances with the negative ones visible (REQ-880 rule "current balances equal").
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows, once every page is loaded, B rows with a quantity other than zero and Neg rows with a negative quantity
      shown as negative numbers. The run quotes B and Neg as found and compares them with the counts the operator who seeded the tenant
      gives; a difference is reported with the reason it suggests (a later run may have posted).
    evidence: >-
      Screenshot of a negative row and the counts, quoted.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The move rule "current balances equal" fails: the stock in the new system differs from the old one.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    At 390 px in Russian the balances and places screens read in Russian and fit the width.
  verification:
    method: gui_screen
    detail: >-
      Steps 4 and 5 show the Russian screen title "Остатки" for the balances and the Russian place names unchanged on the
      locations screen; nothing is cut off at the right edge, no sideways scrolling is needed to read a row, and no
      control overlaps another.
    evidence: >-
      Screenshots at 390 px of both screens.
  on_fail:
    severity: MINOR
    business_impact: >-
      Phone-width users cannot read the stock after the move.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    The language is back to English at the end.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows the English title "Balances" with the language code EN.
    evidence: >-
      Screenshot at step 6.
  on_fail:
    severity: MINOR
    business_impact: >-
      The account is left in the wrong language for the next run.
    suggested_action: route_to_frontend_dev
