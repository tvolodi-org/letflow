# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-move. Live authenticated tenant enumeration not repeated.
# 2. Actors: actors.yaml maps actor-qoimeks-qa2-admin / TENANT_ADMIN and actor-qoimeks-qa2-storekeeper / STOREKEEPER to tenant/realm qoimeks-qa2, as supplied by the T-2219 PM decision. Both actors are available in the roster; live login not repeated; missing credentials block affected outcomes.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, responsible-key balances, downloaded workbook bytes, QOI-OU-1, master totals and current screen counts: listed in scenario preconditions. Responsible-key workbook remarks are expected; usual-place and no-stock cases require verified existing rows. Offline compare tools and operator rules remain outside the visible walk as recorded in move-4. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the administrator used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-move.
# T-2190: run title UAT qoimeks-move; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2167 (BA): Qoimeks QA walk, group qoimeks-move. QA only, synthetic data, never the real tenant.
# Requirements covered: REQ-866 (button, caption and banners in en, ru and kk on the Balances screen), REQ-865 (the workbook the button downloads).
# Sources opened: web/src/modules/stock/stockMessages.ts (keys stock.balances.workbook and stock.balances.workbookHint in the three languages, quoted below);
# web/src/components/ui/LanguageSwitcher.tsx via scenario qoimeks-qa-4 (the globe menu).
# The 390 px width is a browser window setting of the run, not a real phone. A real phone, the Android app and the PWA install are not UAT-observable here (no device in the run).
# Cleanup: nothing is written; the browser language is put back to English at the last step.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-move-2-stock-workbook-button-phone-ru-kk
scope: qoimeks-qa2
title: >-
  On a phone width of 390 px the Balances screen of the Qoimeks QA tenant shows the stock workbook button and its
  caption in Russian and Kazakh, fits the width, and the download still works
version: '1.1'
tags:
- qoimeks
- move
- stock
- balances
- workbook
- phone
- ru
- kk
- i18n
description: >-
  The browser window is 390 px wide. The administrator opens the Balances screen, switches the language to Russian,
  reads the workbook button and the caption, presses the button and sees the file saved; then does the same in Kazakh;
  then returns to English. In each language the button and caption are in that language with no English word left
  and no raw message key, nothing is cut off at the right edge, no sideways scrolling is needed to reach the button,
  and the button does not overlap the other buttons. Not exercised, with reasons: the wording of the two refusal
  banners (too many rows, reader of the whole company needed): the tenant cannot reach those states (see scenario
  qoimeks-move-1).
actors:
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant holds the synthetic stock (posted opening balances, counted at the start of the run) and the stock module is active;
    the administrator account works.
  check: system_seeded
  detail: >-
    If the Balances screen is empty, report BLOCKED for the whole scenario.
- description: >-
    The run can drive a real browser at a window width of 390 px and can save a download.
  check: system_seeded
  detail: >-
    If no browser can be started, report BLOCKED for the whole scenario.
- description: >-
    The language choice of the administrator's browser starts as English.
  check: system_seeded
  detail: >-
    If not, switch to English first and carry on.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For any before/after count comparison, record the same full traversal of the balance or document list, loading
    further pages until exhausted. Do not compare a first-page count with a whole-workbook count, and do not compare
    journal operations with legs.
  check: runner_prepared
  detail: >-
    Retain the traversal/count method and sampled full keys. If another walk posts during the comparison, the equality
    outcome is BLOCKED-by-environment; do not call the first-page count a total.
steps:
- step: 1
  actor: admin
  action: >-
    In a window 390 px wide the administrator signs in on https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    in English, opens the side navigation (folded behind a button on a narrow window) and opens the Balances screen
    of the stock section.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator opens the language menu, chooses Russian, and reads the buttons above the balances list and
    the caption under the workbook button.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator presses the workbook button and checks that a file named stock-<year>-<month>-<day>.xlsx is
    saved and no error banner appears.
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator opens the language menu, chooses Kazakh, and reads the same buttons and caption.
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator presses the workbook button again and checks that a file is saved and no error banner appears.
  via: ui
- step: 6
  actor: admin
  action: >-
    The administrator opens the language menu and chooses English, and reads the screen.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    In Russian the button and caption speak Russian.
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows the button "Остатки для Excel (как в Qoimeks)" and the caption "В файл попадают все текущие остатки,
      независимо от фильтров и страницы на этом экране."; the other export button reads "Выгрузить в Excel"; no
      raw key such as "stock.balances.workbook".
    evidence: >-
      Screenshot at step 2.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking bookkeepers get a half-English screen on the one button they need after the move.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    In Kazakh the button and caption speak Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows the button "Excel үшін қалдықтар (Qoimeks сияқты)" and the caption "Файлға барлық ағымдағы қалдықтар
      түседі, бұл экрандағы сүзгілер мен беттің маңызы жоқ."; the other export button reads "Excel-ге жүктеу"; no
      raw key.
    evidence: >-
      Screenshot at step 4.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Kazakh-speaking users get a half-English screen.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The download works in both languages on a narrow window.
  verification:
    method: file_content
    detail: >-
      Steps 3 and 5 each save a file named stock-YYYY-MM-DD.xlsx that opens as a workbook with the header "Артикул"
      in cell A1; the error text of the screen (ru "Не удалось выгрузить файл. Повторите попытку." or kk "Файлды
      жүктеу мүмкін болмады. Қайталап көріңіз.") is not shown.
    evidence: >-
      The two file names and screenshots after each press.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Phone users cannot get the stock file.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    The layout fits 390 px.
  verification:
    method: gui_screen
    detail: >-
      At steps 2 and 4 the button text and caption are not cut off at the edge, no horizontal scrolling is needed
      to read them, and the button does not overlap the other buttons or the list.
    evidence: >-
      Screenshots at steps 2 and 4 at 390 px.
  on_fail:
    severity: MINOR
    business_impact: >-
      The button is hard to use on a phone-width window.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    Returning to English restores the English texts.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows "Stock workbook (Qoimeks layout)" with its English caption and the language code EN in the top
      bar.
    evidence: >-
      Screenshot at step 6.
  on_fail:
    severity: MINOR
    business_impact: >-
      The account is left in the wrong language for the next run.
    suggested_action: route_to_frontend_dev
