# T-2167 (BA): Qoimeks QA walk, group qoimeks-move. QA only, synthetic data, never the real tenant.
# Requirements covered: REQ-884 (check a Qoimeks-layout workbook against the stock of one org unit, writes nothing), REQ-885 (the load button writes only after a check with at least one change), REQ-886 (list of earlier loads),
# REQ-887 (the screen "Load balances from Excel"), REQ-865 (the file that is checked is the workbook downloaded from the Balances screen). Move rule served: "current balances equal" (REQ-880).
# Sources opened: web/src/modules/stock/workbook/workbookMessages.ts (texts quoted below); docs/requirements.yaml REQ-884..887 (load button enabled only after a check with at least one change; the remarks are Russian in every language);
# web/src/modules/stock/stockRoutes.tsx (route admin/stock/workbook-import, opened from a button on the Balances screen).
# WRITE SAFETY: this scenario never presses "Write balances from the file" successfully (it must be disabled), so no stock document and no balance change is created and nothing needs cleaning up.
# A real load (a file with a change), the approval of the load document and the cancel/reversal of a load are NOT walked: they would change the 603 opening balances of the QA tenant, and the task allows only clearly named test records of the run's own.
#   They are not UAT-observable without a changed workbook (a binary file cannot be given byte by byte in a scenario); they are covered by the component and backend tests of REQ-884..887.
# The SHA-256 of the uploaded file is not shown on this screen (nothing in the workbook messages shows a hash); it is not UAT-observable.
---
id: qoimeks-move-3-round-trip-check-no-difference
scope: qoimeks-qa
title: The Qoimeks QA administrator checks the downloaded stock workbook against the stock, sees no difference and no remarks, cannot write it, and a non-workbook file is refused
version: "1.0"
tags: [qoimeks, move, stock, workbook, check, desktop, phone, ru, kk, refusal]

description: >
  The administrator downloads the whole-stock workbook from the Balances screen and, without changing it, loads it on the screen "Load balances from Excel" to check it against one org unit.
  The check must find no difference: rows read equals the rows of the file, changes 0, remarks 0, and the screen says "No balance differs from the file." The button "Write balances from the file"
  stays disabled, so nothing can be written; a press on it changes nothing. A file that is not a workbook is refused by the screen. The list "Previous loads" is the same before and after.
  The check is repeated at 390 px in Russian and in Kazakh, where the screen texts change but the remarks stay Russian by design.
  Precondition for the number: the opening balances of the tenant were all posted into one org unit; if they sit in several, the check of one org unit shows the others' balances as changes and the run reports that, it does not call it a defect.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant holds the synthetic stock (603 posted opening balances) and the stock module is active; the administrator holds the right to quick counts (the tenant administrator does).
    check: system_seeded
    detail: If the Balances screen has no button "Load balances from Excel", report BLOCKED for steps 3 to 9 and say so.
  - description: The run knows which org unit received the opening balances (the one named in the seed record of the QA tenant).
    check: system_seeded
    detail: If the org unit cannot be told, the run takes the only org unit in the select; with several, report BLOCKED for steps 4 to 6 and name the choices.
  - description: The run can drive a real browser at 1440 px and at 390 px, can save a download and upload a file from disk, and can create a small text file.
    check: system_seeded
    detail: If a file cannot be uploaded in the run's browser, report BLOCKED for steps 4 to 9.
  - description: The browser language starts as English.
    check: system_seeded
    detail: If not, switch to English first.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator signs in on https://qoimeks-qa.letflow.qa.bizdala.com at 1440 px in English, opens the Balances screen and presses "Stock workbook (Qoimeks layout)"; the file is saved and not changed.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator counts the data rows of the saved file (the rows under the header row) and notes the number.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator presses the button "Load balances from Excel" on the Balances screen. The screen "Load balances from Excel" opens. The administrator reads the list "Previous loads" and notes what it shows.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator chooses the org unit that holds the opening balances in the select "Org unit" and chooses the saved, unchanged file in the file field.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator presses "Check" and reads the check summary (Rows read, Changed, Unchanged, Remarks), the result text and the button "Write balances from the file".
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator presses the button "Write balances from the file" while it is disabled, and then reads the list "Previous loads" again.
    expect_refusal: true
    via: ui
  - step: 7
    actor: admin
    action: >
      The administrator creates a text file named notes.txt on the run's disk whose whole content is the single line `This is not a workbook.` (no line break after it), and tries to choose it in the file field.
    expect_refusal: true
    via: ui
  - step: 8
    actor: admin
    action: >
      The window is made 390 px wide and the language is switched to Russian. The administrator opens the screen again, chooses the same org unit and the same unchanged file, presses the check button ("Проверить") and reads the screen.
    via: ui
  - step: 9
    actor: admin
    action: >
      The language is switched to Kazakh. The administrator chooses the same org unit and file again, presses the check button ("Тексеру"), reads the screen, and then switches the language back to English.
    via: ui

expected_outcomes:
  - id: EO-001
    description: The screen opens from the Balances screen and shows the previous loads.
    verification:
      method: gui_screen
      detail: Step 3 shows the title "Load balances from Excel", the select "Org unit", the file field, the button "Check", and a card "Previous loads" that lists loads or says "No loads yet."; no error banner. The run notes the list for the comparison in EO-004.
      evidence: Screenshot at step 3.
    on_fail:
      severity: MAJOR
      business_impact: The bookkeepers cannot reach the check that proves the stock equals their file.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The unchanged downloaded file checks clean against the stock.
    verification:
      method: gui_screen
      detail: Step 5 shows Rows read equal to the row count of step 2, Changed 0, Remarks 0, Unchanged equal to Rows read (or to the number of stock balances; the run quotes both numbers), and the text "No balance differs from the file."; no remark list. If the org unit chosen does not hold all balances, the run reports the shown counts and stops with a note, see the description.
      evidence: Screenshot at step 5 and both numbers quoted.
    on_fail:
      severity: BLOCKER
      business_impact: The check that proves "current balances equal" after the move gives a false difference, or the export and import disagree, so the move cannot be signed off.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: With no change the write button is disabled and a press does nothing.
    verification:
      method: gui_screen
      detail: At step 5 the button "Write balances from the file" is disabled; at step 6 the press produces no new document number, no success message "The load is recorded as document", and no error banner.
      evidence: Screenshots at steps 5 and 6.
    on_fail:
      severity: BLOCKER
      business_impact: A load with no difference could create a stock document, and the balances could change by accident in a QA tenant used as the dress rehearsal of a real move.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: >-
      Nothing was written: the list of previous loads is unchanged.
    verification:
      method: gui_screen
      detail: After step 6 the list "Previous loads" shows exactly what it showed at step 3 (same rows, or still "No loads yet.").
      evidence: Screenshots at steps 3 and 6.
    on_fail:
      severity: BLOCKER
      business_impact: A check wrote a load record or a stock document.
      suggested_action: route_to_elixir_dev
  - id: EO-005
    description: A file that is not a workbook is refused by the screen.
    verification:
      method: gui_screen
      detail: Step 7 shows "Only .xlsx files are accepted" (or the file is not taken into the field), the button "Check" stays unusable for it, and no check result appears.
      evidence: Screenshot at step 7.
    on_fail:
      severity: MAJOR
      business_impact: A wrong file would be sent to the server, which answers with a technical refusal the bookkeeper cannot read.
      suggested_action: route_to_frontend_dev
  - id: EO-006
    description: In Russian at 390 px the check gives the same numbers with Russian texts and fits the width.
    verification:
      method: gui_screen
      detail: Step 8 shows the title "Загрузка остатков из Excel", the labels "Подразделение" and "Проверить", the summary "Итоги проверки" with "Прочитано строк", "Изменений" 0, "Без изменений", "Замечаний" 0, the text "В файле нет отличий от текущих остатков."; the numbers equal those of step 5; nothing is cut off at the right edge and no sideways scrolling is needed.
      evidence: Screenshot at step 8 at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: Russian-speaking bookkeepers on a narrow window cannot read the check result.
      suggested_action: route_to_frontend_dev
  - id: EO-007
    description: In Kazakh the screen texts are Kazakh and the numbers stay the same.
    verification:
      method: gui_screen
      detail: Step 9 shows the title "Excel-ден қалдықтарды жүктеу", "Бөлімше", "Тексеру", the summary "Тексеру қорытындысы" with "Оқылған жолдар", "Өзгерістер" 0, "Өзгеріссіз", "Ескертпелер" 0, and "Файлда ағымдағы қалдықтардан айырмашылық жоқ."; numbers equal those of step 5; after the last action the language is English again.
      evidence: Screenshot at step 9.
    on_fail:
      severity: MINOR
      business_impact: Kazakh-speaking users get a half-English screen on the check.
      suggested_action: route_to_frontend_dev
