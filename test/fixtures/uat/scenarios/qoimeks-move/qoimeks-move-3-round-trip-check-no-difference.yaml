# T-2266 code-reading pass (PM 2026-11-19), group qoimeks-move; every expectation below was read against origin/main 98848962e.
# 1. Scope: scope qoimeks-qa2; tenant and realm qoimeks-qa2 exist (actors.yaml, T-2219); the group directory name is not the scope; run title UAT qoimeks-move.
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) downloads the workbook (StockRead); actor-qoimeks-qa2-admin (TENANT_ADMIN) loads and checks it, because the Excel load screen is admin-only here: web/src/modules/stock/stockRoutes.tsx guards admin/stock/workbook-import with StockQuickCount, BalancesPage.tsx shows the button "Load balances from Excel" only with StockQuickCount, and lib/letflow/modules/stock/stock.ex role_grants for STOREKEEPER does not hold it (task T-2239 may add it later; this scenario does not depend on that). Both actors are in actors.yaml for qoimeks-qa2; live logins are verified by acceptance from the credential source (no credential in any file); a missing credential blocks the outcome, never a PASS.
# 3. Host and screens: https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 answered HTTP 200 on 2026-11-19 (T-2190). Read at main: WorkbookImportPage.tsx (select "Org unit", drop zone, button "Check", tally Rows read / Changed / Unchanged / Remarks, button "Write balances from the file" enabled only when the check has at least one change, card "Previous loads"), workbookMessages.ts (every en, ru, kk text quoted below exists), StockWorkbookImport (lib/letflow/modules/stock/stock_workbook_import.ex) for the check rules.
# 4. Data: R (data rows) and S (distinct articles with a non-zero quantity) are counted from the downloaded file at the start of the run. Every seeded balance carries a responsible employee and the org unit QOI-OU-1 (converter requires both), so by the check rule R7 (stock held per responsible is not touched) each stocked article is left out of the comparison. Four-eyes OFF for the opening approval and ON for the quick count is the tenant state: read, not changed. No write is done: the group does not load, approve or cancel (it would change the 603 opening balances); the write path is walked in group qoimeks-import.
# 5. Executable: browser steps at 1440 px and 390 px, file drop of a file saved from disk, a small text file made by the run with exactly the bytes given in step 8. The write button's disabled state is read, never forced.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and a live host); static check run, see the task result. Acceptance runs preflight with title "UAT qoimeks-move".
# EXPECTATION CORRECTIONS (this scenario, 6): (a) the load screen is run by the administrator, not the storekeeper (route guard StockQuickCount; the old text ran it as the storekeeper and expected a product defect); (b) Remarks are S (one R7 remark per stocked article, on its first row) PLUS any place-read remark (R11: a place text read as another code) that the file raises: the old "Remarks = S" is now "S R7 remarks plus the R11 count the run reports"; (c) Unchanged is not predicted: R7 articles are left out so it does not count them, it is recorded as shown and must not exceed R; (d) the org unit is chosen by the label the select shows (the run reads the org unit list and picks the one that received the opening balances, QOI-OU-1 in the seed), no label is quoted; (e) the "Check" button is pressed only after the unit and file are set (disabled otherwise): step order made explicit; (f) the Russian and Kazakh remark hints differ (ru: describes errors; kk: says remarks are Russian), only the kk claim is made.
# Not UAT-observable here: the SHA-256 of the uploaded file (no screen shows a hash); the write, the approval and the cancel of a load (they change the 603 opening balances; see qoimeks-import); the offline compare tools (see qoimeks-move-4).
# The unauthorized-access refusal step of the group is in scenario qoimeks-move-1 (step 8); step 8 here is the refusal of a wrong file type.
# Requirements covered: REQ-865 (the workbook), REQ-884 (the check writes nothing), REQ-880 (move rule "current balances equal": an unchanged round trip shows no difference).
# Label sources: web/src/modules/stock/workbook/workbookMessages.ts, web/src/modules/stock/stockMessages.ts.
---
id: qoimeks-move-3-round-trip-check-no-difference
scope: qoimeks-qa2
title: >-
  The unchanged synthetic workbook gives zero changes and the responsible-stock remarks; writing stays disabled, a
  text file is refused and no load is made
version: '1.2'
tags:
- qoimeks
- move
- stock
- workbook
- check
- desktop
- phone
- ru
- kk
- refusal
description: >-
  The storekeeper downloads the unchanged whole-stock workbook; the administrator checks it on the Load balances from
  Excel screen against the org unit that holds the opening balances. On the synthetic baseline the check reads R data
  rows, finds zero changes and one responsible-stock remark per stocked article (S of them, plus any place-read remarks
  the run reports). The write button stays disabled and the list of previous loads is the same before and after. A
  text file is refused. The same check is repeated at 390 px in Russian and Kazakh with the same bytes. This proves
  that responsible stock is left out of a round trip; it is not evidence that the import can set those balances.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant holds the synthetic stock (posted opening balances, each with a responsible employee in org
    unit QOI-OU-1) and the stock module is active; the administrator account works.
  check: system_seeded
  detail: >-
    If the Balances screen is empty, or the administrator sees no button "Load balances from Excel" on it, report
    BLOCKED-by-environment for steps 3 to 10 and say what was seen; the walk is not moved to another actor.
- description: >-
    The run knows which org unit received the opening balances (QOI-OU-1 in the seed).
  check: system_seeded
  detail: >-
    If the org unit cannot be told, the run takes the only org unit in the select; with several it reports
    BLOCKED-by-environment for steps 4 to 10 and names the choices.
- description: >-
    The run can drive a real browser at 1440 px and 390 px, save a download, upload a file from disk and create a small
    text file.
  check: runner_prepared
  detail: >-
    If a file cannot be uploaded in the run's browser, report BLOCKED-by-environment for steps 4 to 10.
- description: >-
    Both actors can sign in at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2; the browser language is
    English at the start.
  check: runner_prepared
  detail: >-
    Missing credentials block the affected steps. Do not seed, grant roles or change approval rules.
- description: >-
    The run counts R (data rows under the header row) and S (distinct article codes with a quantity other than zero)
    from the downloaded file at the start; nothing else posts during the walk.
  check: runner_prepared
  detail: >-
    If another walk changed the stock during the comparison, the outcomes that use R and S are BLOCKED-by-environment.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper signs in at 1440 px in English, opens the Balances screen, presses "Stock workbook (Qoimeks layout)"
    and saves the file; the file is kept unchanged.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    From the saved file the run counts the data rows (the rows under the header row) and notes R, and counts the distinct
    article codes that have a quantity other than zero and notes S.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator signs in, opens the Balances screen and presses the button "Load balances from Excel". The screen
    "Load balances from Excel" opens. The administrator reads the card "Previous loads" and notes every entry (number,
    date, file, state) or the text "No loads yet.".
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator chooses the org unit that holds the opening balances in the select "Org unit" and puts the saved,
    unchanged file into the file drop zone.
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator presses "Check" and reads the check summary (Rows read, Changed, Unchanged, Remarks), the list of
    remarks, the text under it and the button "Write balances from the file".
  via: ui
- step: 6
  actor: admin
  action: >-
    The administrator observes that the button "Write balances from the file" is disabled and cannot be activated. No
    forced click and no API write.
  via: ui
- step: 7
  actor: admin
  action: >-
    The administrator reads the card "Previous loads" again and compares it with the entries noted at step 3.
  via: ui
- step: 8
  actor: admin
  action: >-
    The administrator drops a file named notes.txt into the file drop zone. Its complete UTF-8 bytes are This is not a
    workbook. with no trailing newline. The whole step is refused.
  expect_refusal: true
  via: ui
- step: 9
  actor: admin
  action: >-
    The window is made 390 px wide and the language is switched to Russian. The administrator opens the screen again,
    chooses the same org unit and the same unchanged file, presses "Проверить" and reads the screen.
  via: ui
- step: 10
  actor: admin
  action: >-
    The language is switched to Kazakh. The administrator chooses the same org unit and file again, presses "Тексеру",
    reads the screen, and then switches the language back to English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The screen opens from the Balances screen and shows the previous loads (REQ-884, REQ-886).
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the title "Load balances from Excel", the select "Org unit", the drop zone, the button "Check", and a
      card "Previous loads" that lists loads or says "No loads yet."; no error banner. The run notes the entries for
      EO-004.
    evidence: >-
      Screenshot at step 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The bookkeepers cannot reach the check that proves the stock equals their file.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The unchanged workbook gives no change and the responsible-stock remarks (REQ-884 rule for stock held per
    responsible, REQ-865).
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows Rows read equal to R and Changed 0. Remarks is at least S: one remark per stocked article, naming the
      article and saying in Russian that the stock is kept separately by org unit, responsible, lot or unit and that the
      stock of this article in the system is not changed; the run counts the remarks of that kind (must equal S) and
      separately any remark that says a place was read as another code (R11): on this UNCHANGED export an R11 remark is a FAIL, because the workbook was written from the system's own places and must read back as the same places (REQ-865 round trip; product defect). Unchanged is recorded as
      shown (not more than R). The text "No balance differs from the file." is shown.
    evidence: >-
      Screenshot at step 5 with R, S, the remark counts and Unchanged quoted.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The check that proves "current balances equal" after the move gives a false difference, or the export and import
      disagree, so the move cannot be signed off.
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    Writing is unavailable when there are no changes.
  verification:
    method: gui_screen
    detail: >-
      At step 5 the button "Write balances from the file" is disabled; step 6 confirms it cannot be activated.
    evidence: >-
      Screenshots at steps 5 and 6.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A load with no difference could create a stock document, and the balances could change by accident in the tenant
      used as the dress rehearsal of a real move.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    The check created no load (REQ-884: the check writes nothing).
  verification:
    method: gui_screen
    detail: >-
      At step 7 the entries of "Previous loads" are the same as at step 3: same numbers, dates, files and states.
    evidence: >-
      Screenshots at steps 3 and 7.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A check wrote a load record or a stock document.
    suggested_action: route_to_elixir_dev
- id: EO-005
  description: >-
    A text file is refused.
  verification:
    method: gui_screen
    detail: >-
      Step 8 shows "Only .xlsx files are accepted" and notes.txt is not taken as the chosen file, so it cannot be checked
      as a workbook; the previously chosen state is not reported as checked for it.
    evidence: >-
      Screenshot at step 8.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A wrong file would be sent to the server, which answers with a technical refusal the bookkeeper cannot read.
    suggested_action: route_to_frontend_dev
- id: EO-006
  description: >-
    The Russian phone-width view shows the same result.
  verification:
    method: gui_screen
    detail: >-
      Step 9 at 390 px shows "Загрузка остатков из Excel", "Подразделение", "Проверить", and the same R rows, 0 changes
      and the same remark count as step 5. The remark list is readable and nothing is cut off at the right edge.
    evidence: >-
      Screenshot at step 9 at 390 px.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking bookkeepers on a narrow window cannot read the check result.
    suggested_action: route_to_frontend_dev
- id: EO-007
  description: >-
    The Kazakh view keeps the same counts and the Russian remarks.
  verification:
    method: gui_screen
    detail: >-
      Step 10 shows "Excel-ден қалдықтарды жүктеу", "Бөлімше", "Тексеру", and the same counts as step 5. The remarks stay
      in Russian and the Kazakh hint says so ("Ескертпелер орыс тілінде жазылған; олар файлдағы мәселелерді сипаттайды.").
      English is restored at the end.
    evidence: >-
      Screenshot at step 10.
  on_fail:
    severity: MINOR
    business_impact: >-
      Kazakh-speaking users get a half-English screen on the check.
    suggested_action: route_to_frontend_dev
