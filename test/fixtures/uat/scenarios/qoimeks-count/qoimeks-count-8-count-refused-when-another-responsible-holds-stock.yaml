# T-2343 (BA, checklist pass 2026-11-20), group qoimeks-count. Run title: UAT qoimeks-count. QA only, synthetic data, no production.
# 1. Scope: scope qoimeks-qa2, the synthetic QA tenant and its realm qoimeks-qa2 (the group directory name is not the scope).
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) makes the receipt, counts and starts the reversal; actor-qoimeks-qa2-admin (TENANT_ADMIN) completes the post task and the reversal task in My Tasks (those tasks are routed to the role TENANT_ADMIN; the storekeeper does not see them). Both are in actors.yaml; live login is an acceptance precondition (credentials from the acceptance credential source, never from files).
# 3. Host and screens: tenant host https://qoimeks-qa2.letflow.qa.bizdala.com. Read on main: web/src/modules/stock/stockRoutes.tsx (admin/stock/quick-count), quickCount/QuickCountPage.tsx, quickCountModel.ts (errorReasonToMessageId, isBannerError), quickCountMessages.ts, documents/DocumentForm.tsx (the Responsible field of a receipt), documents/documentsMessages.ts (New document, Receipt, Issue, Reverse), register/BalancesPage.tsx and BalanceHistoryPanel.tsx (stock.history.open "Show the history of this balance"), pages/tasks (My Tasks).
# 4. Data: no code is named. The run reads Balances and picks a row with positive quantity B, no lot, no lot tracking, a place of one org unit, no other Responsible holding non-zero stock of that item at that place and org unit, no formal count order open over the place; it reads one ACTIVE employee different from the Responsible of that row (E2) in the Responsible picker of the receipt form. Record the item, place and balance counts at the start of the run (Items total, Locations total, Balances rows) and compare to those. The fixture (one receipt of quantity 1 under E2) is made by the walk through the screens and undone by reversal. No generator task is needed.
# 5. Executable: browser only (no pipeline_test); the refusal of step 5 is read on the screen. A step whose fixture is missing stops before any write as BLOCKED-by-environment.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and the run title UAT qoimeks-count); parse and schema checks only.
# EXPECTATION CORRECTIONS (this file): 1. The refusal is expected as the requirement asks (T-2286 rule in docs/runbooks/stock-counts.md, section "Total of the item at the place": 422 balance_in_other_rows, nothing stored, no number) WITH a clear message. quickCountModel.ts errorReasonToMessageId has no case for balance_in_other_rows, so main shows the generic text (stock.qc.error.generic, "The count could not be submitted. Try again."), which the expectation does not accept: that is a product DEFECT (missing message), written as a FAIL expectation, not as current behaviour. 2. The key history panel is used instead of a Movements item filter (the Movements screen has no item filter).
---
id: qoimeks-count-8-count-refused-when-another-responsible-holds-stock
scope: qoimeks-qa2
title: A quick count of one Responsible employee row is refused with a clear message and nothing is stored when
  another employee holds stock of the same item at the same place
version: '1.0'
tags:
- qoimeks
- stock
- quick_count
- refusal
- reverse
- desktop
- en
description: >-
  REQ-854 point 2 (the count sets the balance of one item at one place) and the T-2286 rule of the stock runbook.
  The storekeeper receives one unit of the item of a Balances row under ANOTHER Responsible employee through the
  screens and the administrator completes the post task. The item at that place now has two Responsible rows.
  The storekeeper then counts the original row. The count is refused (422 balance_in_other_rows), the screen
  gives a clear message that stock of this item at this place is held under another responsible employee and says to
  count that row, no result panel and no document number appear, and nothing is stored: both rows and the history
  of the original key are unchanged. Cleanup: the storekeeper starts the reversal of the receipt and the
  administrator completes it; the extra row returns to zero.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    Approval rule state, explicit (owner D-165: a new tenant has the second-person approval OFF by default, so this walk never relies on the default). Before the walk the operator has set stock_quick_count / approve ON (the qa2 tenant keeps explicit ON rows) and stock_opening / approve OFF. This scenario needs stock_quick_count / approve ON: every step that expects, withholds or refuses the second-person approval of a count is written for that state.
  check: system_seeded
  detail: >-
    Read both rules on the Approval rules screen at the start (administrator) and record them. If a rule is not in the stated state or cannot be read, report BLOCKED-by-environment; do not switch a rule to make the walk pass and do not take the default as the state. This scenario never changes a rule.
- description: Sign in as actor-qoimeks-qa2-storekeeper (STOREKEEPER) at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    and confirm the tenant before any action. Read the counts of items, places and posted balances at the start
    of the run and compare to those later.
  check: runner_prepared
  detail: Missing login, module, browser or fixture means BLOCKED-by-environment for the affected steps. Do not
    seed, grant roles or change approval rules to satisfy a precondition.
- description: A Balances row exists with a positive quantity B, no lot, an item without lot tracking, a place of
    one org unit, and no other Responsible employee holds non-zero stock of the same item at that place, org unit and lot.
    An active employee E2 different from the Responsible shown by the row exists (the row may be Unassigned stock).
  check: runner_prepared
  detail: Record item, place, org unit, the Responsible of the row (R1 or Unassigned stock) and B. If no such row or no
    second employee exists, report BLOCKED-by-environment before any write; do not create stock or employees.
- description: No formal count order is open over the chosen place for the same org unit, and nobody else posts to
    the item at that place during the walk.
  check: system_seeded
  detail: UAT assumption, to be confirmed by the process owner. If a message names a count in progress or a frozen
    place, quote it and report BLOCKED-by-environment.
- description: The storekeeper sees "Quick count" in the stock navigation (stock 0.22.0).
  check: system_seeded
  detail: If the entry is missing, report a PRODUCT defect (#4764); do not move the walk to the administrator.
steps:
- step: 1
  actor: storekeeper
  action: The storekeeper opens Balances, notes a row as in the preconditions (item, place, org unit, Responsible R1 or
    Unassigned stock, B), opens the history of the balance of that row ("Show the history of this balance") and notes how
    many lines it lists as H0. The storekeeper also notes every Balances row of the same item at the same place.
  via: ui
- step: 2
  actor: storekeeper
  action: The storekeeper opens "New document", chooses the kind "Receipt", the org unit and location of the key,
    the Responsible employee E2, one line of the same item with quantity 1 (no lot), and presses "Issue". The
    document number is noted as RN.
  via: ui
- step: 3
  actor: admin
  action: The administrator, signed in separately, opens My Tasks, selects the posting task of RN, takes it
    ("Claim") if the screen offers it and completes it. The receipt RN reads Posted.
  via: ui
- step: 4
  actor: storekeeper
  action: The storekeeper reads the Balances rows of the item at that place, now two Responsible rows - the original key
    at B and a new row of quantity 1 under E2.
  via: ui
- step: 5
  actor: storekeeper
  action: The storekeeper opens "Quick count", chooses the original key (item, place, org unit and Responsible R1, or
    Unassigned stock), types B plus 2 as counted quantity, keeps the reason "Recount" and presses "Submit count".
  expect_refusal: true
  via: ui
- step: 6
  actor: storekeeper
  action: The storekeeper reads Balances for the item at that place and the history of the balance of the original key.
  via: ui
- step: 7
  actor: storekeeper
  action: Cleanup. The storekeeper opens RN in the stock documents list, presses "Reverse", chooses the reason "Other",
    types the note "UAT qoimeks-count-8 undo" and confirms.
  via: ui
- step: 8
  actor: admin
  action: The administrator opens My Tasks, selects the reversal task of RN, takes it if offered and completes it ("Reverse").
  via: ui
- step: 9
  actor: storekeeper
  action: The storekeeper reads RN, the Balances rows of the item at that place and the history of the balance of the original key.
  via: ui
expected_outcomes:
- id: EO-001
  description: The fixture is real, the item at that place has two Responsible rows (setup for the refusal).
  verification:
    method: gui_screen
    detail: Step 3 shows RN Posted. Step 4 shows the original key at B and a new row of quantity 1 under E2, so the total of the item at that place is B plus 1.
    evidence: Screenshots of steps 3 and 4.
  on_fail:
    severity: MAJOR
    business_impact: The refusal cannot be tested; report BLOCKED-by-environment if the receipt cannot be posted.
    suggested_action: route_to_wf03
- id: EO-002
  description: A count of one row is refused when another responsible holds stock of the same item, place, org unit and lot
    (REQ-854 point 2; T-2286 rule of docs/runbooks/stock-counts.md; 422 balance_in_other_rows), with a clear message.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows a message in the screen language that says stock of this item at this place is held under another
      responsible employee and that the row holding the stock has to be counted, and shows no result panel and no
      document number. The generic text "The count could not be submitted. Try again." is NOT accepted (it hides the reason
      and invites a retry that cannot succeed): it is a FAIL of a product gap, the message for balance_in_other_rows is missing in the quick count screen.
    evidence: Screenshot of step 5 with the message text quoted.
  on_fail:
    severity: MAJOR
    business_impact: A count would add a parallel row and the item total would become the old quantity plus the counted one; a refusal without a reason leaves the counter guessing.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: The refused count stored nothing (nothing is stored, no number is taken).
  verification:
    method: gui_screen
    detail: Step 6 shows the original key still at B and the row under E2 at 1, and the history of the original key with exactly H0 lines.
    evidence: Screenshot of step 6.
  on_fail:
    severity: BLOCKER
    business_impact: A refused count that still changes stock makes the book wrong.
    suggested_action: route_to_backend_dev
- id: EO-004
  description: The cleanup reversal restores the fixture.
  verification:
    method: gui_screen
    detail: Step 7 is accepted and RN still reads Posted until the task is done. Step 9 shows RN Reversed, the row under E2 at 0 (or no row), the original key at B and the history of the original key with H0 lines.
    evidence: Screenshots of step 9.
  on_fail:
    severity: MAJOR
    business_impact: Synthetic stock stays changed.
    suggested_action: route_to_backend_dev
