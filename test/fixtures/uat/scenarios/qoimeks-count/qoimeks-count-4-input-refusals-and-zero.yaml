# T-2262 code-reading pass, group qoimeks-count (PM 2026-11-19). Run title: UAT qoimeks-count. QA only, synthetic data, no production.
# 1. Scope: every scenario has scope qoimeks-qa2, the synthetic QA tenant and its realm (qoimeks-qa2, host in the preconditions); the group directory name is not the scope.
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) counts, reads and starts reversals; actor-qoimeks-qa2-admin (TENANT_ADMIN) is the second person who approves a count or completes a reversal task (the approve and reverse tasks are routed to the role TENANT_ADMIN, so the storekeeper does not see them in My Tasks: the storekeeper holds no TasksReadAll) and the counter in the self-approval step of qoimeks-count-6. Both are in actors.yaml for qoimeks-qa2; live login is verified by acceptance (credentials from the acceptance credential source, never from files). State since stock 0.22.0 (T-2239, issue 4764, merged: lib/letflow/modules/stock/stock.ex STOREKEEPER grants, docs/roles.md): the storekeeper holds StockQuickCount and CodesRead; if the quick count entry is missing for the storekeeper the walk reports a PRODUCT defect, no step is moved to the administrator.
# 3. Host and screens: tenant host https://qoimeks-qa2.letflow.qa.bizdala.com (answered HTTP 200 on 2026-11-19, T-2190; not re-run here). Read on main: web/src/modules/stock/stockRoutes.tsx (route admin/stock/quick-count), stock/index.ts (nav entry), quickCount/QuickCountPage.tsx, quickCountModel.ts, quickCountMessages.ts, documents/documentsModel.ts (actionsFor), register/stockRegisterModel.ts (CAUSES), pages/tasks/taskMessages.ts and TaskDetail.tsx.
# 4. Data: no balance, item or place is named by code. Every walk reads the Balances screen at run time and picks a row with a positive quantity, no lot, an item with no lot tracking, a place of one org unit and not one of the negative balances; it records item, place, org unit, the Responsible employee the row shows (none: the form selector stays at Unassigned stock) and the quantity B. Record the item, place and balance counts at the start of the run (Items total, Locations total, Balances rows) and compare to those, never to a number written here. Tenant state read, not set: all stock process definitions active, quick count approval four-eyes ON, no formal count order open over the place, shared stock access enabled. No generator task is needed.
# 5. Executable: browser steps only for the screens above (real browser script supplied by the runner, no pipeline_test); API steps only in qoimeks-count-6 step 7 (a plain HTTP client). A step whose fixture is missing stops before any write as BLOCKED-by-environment.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and the run title UAT qoimeks-count); parse and schema checks only; acceptance runs the preflight.
---
id: qoimeks-count-4-input-refusals-and-zero
scope: qoimeks-qa2
title: The quick count form refuses a negative quantity, more than nine decimals, an empty quantity, the reason
  Other without a note and a lot-tracked item without a lot, and accepts zero as a counted quantity
version: '2.0'
tags:
- qoimeks
- stock
- quick_count
- validation
- desktop
- en
description: 'REQ-854 criterion 9 and criterion 4 (zero), REQ-855 criterion 3. The storekeeper tries bad inputs
  one after another, each in its own step: a negative quantity, ten decimals, an empty quantity, the reason "Other"
  with an empty note; each is refused at its field and nothing is recorded. If the tenant holds a lot-tracked item,
  submitting it without a lot is refused with the lot message. Then, in a step that is not a refusal, the storekeeper
  types zero: it is a valid count, the form shows the difference as minus the book quantity and no field error.
  The storekeeper leaves without submitting; no document, no balance change.'
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: Sign in as actor-qoimeks-qa2-storekeeper (STOREKEEPER) at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    and confirm the tenant before any action. Read the counts of items, places and posted balances at the start
    of the run and compare to those later.
  check: runner_prepared
  detail: Missing login, module, browser or fixture means BLOCKED-by-environment for the affected steps. Do not
    seed, grant roles or change approval rules to satisfy a precondition.
- description: A Balances row exists with a positive quantity B, no lot, an item without lot tracking, a place of
    one org unit, not one of the negative balances. Record item, place, org unit, the Responsible employee the row
    shows and B before any count.
  check: runner_prepared
  detail: If the row shows no Responsible employee the form selector stays at "Unassigned stock", otherwise the
    selector is set to that employee (the form books against that exact key). If no such row exists, report BLOCKED-by-environment
    before submitting; do not create stock.
- description: 'Since stock 0.22.0 (T-2239, issue 4764, merged): the storekeeper sees "Quick count" in the stock navigation and
    may open it.'
  check: system_seeded
  detail: If the entry is missing for the storekeeper, report a PRODUCT defect (#4764) and do not type the address;
    the walk is not moved to the administrator. A missing entry is a product defect and the affected outcomes FAIL; they are not weakened.
- description: 'For step 6 only: a lot-tracked item exists (the Lot field appears when it is chosen in the item
    field).'
  check: runner_prepared
  detail: If none exists in the tenant, step 6 is BLOCKED-by-environment (record that no lot-tracked item was found);
    the other steps are unaffected.
steps:
- step: 1
  actor: storekeeper
  action: The storekeeper opens Balances and notes a row as in the preconditions (item, place, org unit, Responsible
    employee, B) and the newest document number in the stock documents list as N0, then opens "Quick count" and
    chooses that item, place, org unit and Responsible employee.
  via: ui
- step: 2
  actor: storekeeper
  action: The storekeeper types -1 as counted quantity, keeps the reason "Recount" and presses "Submit count".
  expect_refusal: true
  via: ui
- step: 3
  actor: storekeeper
  action: The storekeeper types 1.0000000001 (ten decimals) as counted quantity and presses "Submit count".
  expect_refusal: true
  via: ui
- step: 4
  actor: storekeeper
  action: The storekeeper clears the counted quantity field and presses "Submit count".
  expect_refusal: true
  via: ui
- step: 5
  actor: storekeeper
  action: The storekeeper types 1 as counted quantity, chooses the reason "Other", leaves the note empty and presses
    "Submit count".
  expect_refusal: true
  via: ui
- step: 6
  actor: storekeeper
  action: The storekeeper chooses a lot-tracked item (and any place and org unit), types 1 as counted quantity,
    keeps the reason "Recount", leaves the Lot field empty and presses "Submit count".
  expect_refusal: true
  via: ui
- step: 7
  actor: storekeeper
  action: The storekeeper chooses the item, place, org unit and Responsible employee of step 1 again, types 0 as
    counted quantity, keeps the reason "Recount" and reads the form. The storekeeper does NOT press "Submit count".
  via: ui
- step: 8
  actor: storekeeper
  action: The storekeeper leaves the screen through the stock navigation, reads the key on Balances and the newest
    document number in the stock documents list.
  via: ui
expected_outcomes:
- id: EO-001
  description: A negative quantity is refused at its field (REQ-854 criterion 9, REQ-855 criterion 3).
  verification:
    method: gui_screen
    detail: Step 2 shows "The quantity cannot be negative." at the counted quantity field and no result panel.
    evidence: Screenshot of step 2.
  on_fail:
    severity: MAJOR
    business_impact: A negative count would be sent.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: More than nine decimals are refused at the field (REQ-854 criterion 9).
  verification:
    method: gui_screen
    detail: Step 3 shows "No more than 9 decimal places." and no result panel.
    evidence: Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: A quantity beyond the ledger precision would be sent.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: An empty quantity is refused at the field.
  verification:
    method: gui_screen
    detail: Step 4 shows "Enter the counted quantity." and no result panel.
    evidence: Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: A count with no number would be sent.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: The reason Other needs a note (REQ-854 criterion 9, reason_invalid; REQ-855 criterion 3).
  verification:
    method: gui_screen
    detail: Step 5 shows 'Enter a note for "Other".' at the note field and no result panel.
    evidence: Screenshot of step 5.
  on_fail:
    severity: MAJOR
    business_impact: A write-off style count without a reason text would be recorded.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: A lot-tracked item cannot be counted without a lot (REQ-854 criterion 9).
  verification:
    method: gui_screen
    detail: Step 6 shows "This item is lot-tracked. Choose a lot." at the Lot field and no result panel.
    evidence: Screenshot of step 6.
  on_fail:
    severity: MAJOR
    business_impact: Stock would be counted against a mixed lot.
    suggested_action: route_to_backend_dev
- id: EO-006
  description: Zero is accepted as a counted quantity and shows the difference (REQ-854 criterion 4).
  verification:
    method: gui_screen
    detail: Step 7 shows no field error on the quantity and "Difference" equal to minus B (read B at run time).
    evidence: Screenshot of step 7.
  on_fail:
    severity: MAJOR
    business_impact: An empty shelf could not be recorded.
    suggested_action: route_to_frontend_dev
- id: EO-007
  description: Nothing was written by the refusals or by the zero preview.
  verification:
    method: gui_screen
    detail: Step 8 shows the key at B on Balances and the newest document number equal to N0.
    evidence: Screenshot of step 8.
  on_fail:
    severity: BLOCKER
    business_impact: A refused or unsent count would change stock.
    suggested_action: route_to_backend_dev
