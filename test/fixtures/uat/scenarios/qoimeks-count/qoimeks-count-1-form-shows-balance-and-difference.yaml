# T-2159 (BA): Qoimeks QA walk, function "quick count that sets the balance". QA only, SYNTHETIC data, never the real tenant, no production.
# Covers: REQ-855 (web screen: form, balance shown, difference shown; criteria 1, 2 first half, 6 empty and filled form), REQ-854 (route behind the screen),
# REQ-853 (compare-and-set rule, indirectly: this scenario only reads).
# Sources opened: docs/requirements.yaml REQ-853..856; web/src/modules/stock/quickCount/QuickCountPage.tsx (form: item picker, place, org unit, lot only for a lot-tracked item,
# counted quantity, reason; balance and difference shown once item, place and org unit are chosen); quickCountMessages.ts (en/ru/kk texts quoted below);
# web/src/modules/stock/stockRoutes.tsx and components/layout/navMessages.ts (the screen sits in the stock navigation as "Quick count" / "Быстрый пересчёт" / "Жылдам санақ").
# This scenario writes nothing. Window: desktop 1440 px, English; phone width and ru/kk are walked in qoimeks-count-5.
# NOT UAT-observable, whole group (reasons):
#  (a) the phone APK count screens and voice entry (REQ-856, REQ-731): an app on a handset and a microphone cannot be driven by the browser run; the phone is walked here only as a 390 px browser window (qoimeks-count-5).
#  (b) refusal count_in_progress / location_frozen (a formal count order opened over the key): the roster has one actor and the tenant holds no open count order; creating one would change shared QA data. Not walked; covered by REQ-854 criterion 7 tests.
#  (c) refusal quick_count_stale (the balance moved between count and approval): needs a second posting in the gap; not forceable by one actor in a browser. Covered by REQ-854 criterion 5 tests.
#  (d) four-eyes refusal (counter approves own count): the tenant switch for this step is not known to the BA; see the precondition and the branch in qoimeks-count-3. The roster has no second actor for this realm.
---
id: qoimeks-count-1-form-shows-balance-and-difference
scope: qoimeks-count
title: The Qoimeks QA administrator opens the quick count form, chooses an item and a place, sees the current balance, types a counted quantity and sees the difference, without saving anything
version: "1.0"
tags: [qoimeks, stock, quick_count, balance, desktop, read_only, en]

description: >
  The administrator opens "Quick count" from the stock navigation. The form is empty: item, location, org unit, counted quantity, reason. The administrator
  chooses an item that already holds a posted opening balance and the place and org unit where it lies (the same place and org unit the Balances screen shows for it).
  The form then shows the book quantity of that key. The administrator types a counted quantity and the form shows the difference (counted minus book).
  Changing the typed quantity changes the difference at once; clearing the item hides the balance. Nothing is submitted: no document, no movement, no balance changes.
  Preconditions are in the list below. Name of the test data: none created.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant has the stock module active with the synthetic data (142 places, 666 items, 603 posted opening balances, 3 of them negative).
    check: system_seeded
    detail: If the stock module has no balances, report BLOCKED for the whole scenario.
  - description: The administrator can see "Quick count" in the stock navigation (the account holds the quick count permission by being the tenant administrator).
    check: system_seeded
    detail: UAT assumption, to be confirmed by the process owner. If the entry is missing, report BLOCKED and say so; do not open the screen by typing its address.
  - description: The run can drive a real browser at a window width of 1440 px, in English.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator signs in on https://qoimeks-qa.letflow.qa.bizdala.com, opens the Balances screen in the stock navigation, and notes one row with a positive quantity (not one of the three
      negative balances): its item, its location, its org unit and its quantity. This quantity is called B below. The row must belong to an item without lots, so that the form asks for no lot; if the row shows a lot, take another row.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens "Quick count" from the stock navigation and reads the empty form.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator chooses the item noted in step 1 (typing its code or name in the item field), then the location, then the org unit. The administrator reads the form.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator types in the counted quantity field the number B plus 2 (for example B is 10, types 12) and reads the form.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator replaces the typed number by the number B minus 1 and reads the form again.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator clears the item field and reads the form, then leaves the screen through the stock navigation (to Balances) without submitting.
    via: ui
  - step: 7
    actor: admin
    action: >
      The administrator reads the row of the same key on the Balances screen again.
    via: ui

expected_outcomes:
  - id: EO-001
    description: The quick count screen is in the stock navigation and its form is empty at the start.
    verification:
      method: gui_screen
      detail: Step 2 shows the title "Quick count", the fields Item, Location, Org unit, Counted quantity, Reason, the button "Submit count", and no balance line.
      evidence: Screenshot of step 2.
    on_fail:
      severity: MAJOR
      business_impact: The storekeeper cannot find the one-form count that the old Qoimeks system had.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: Once item, place and org unit are chosen the form shows the book quantity, equal to the Balances screen.
    verification:
      method: gui_screen
      detail: Step 3 shows the line "Book quantity" with the value B with B equal to the quantity noted in step 1; no lot field is shown for an item without lots.
      evidence: Screenshot of step 3 beside the Balances row of step 1.
    on_fail:
      severity: BLOCKER
      business_impact: A counter would be shown a wrong current balance and would count against it.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: The difference is the counted quantity minus the book quantity and follows the typed number.
    verification:
      method: gui_screen
      detail: Step 4 shows Difference 2; step 5 shows Difference -1 (the minus sign visible); the book quantity stays B in both.
      evidence: Screenshots of steps 4 and 5.
    on_fail:
      severity: MAJOR
      business_impact: The counter cannot see what the count will change before saving.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: Clearing the item hides the balance and nothing is saved by looking at the form.
    verification:
      method: gui_screen
      detail: Step 6 shows no book quantity line. Step 7 shows the same row with quantity B (unchanged); the stock documents screen holds no new document made by this scenario.
      evidence: Screenshots of steps 6 and 7.
    on_fail:
      severity: MAJOR
      business_impact: A read-only look would change stock, or a stale balance stays on screen after the item is cleared.
      suggested_action: route_to_frontend_dev
