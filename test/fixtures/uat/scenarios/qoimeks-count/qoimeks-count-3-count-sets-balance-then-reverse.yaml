# T-2262 code-reading pass, group qoimeks-count (PM 2026-11-19). Run title: UAT qoimeks-count. QA only, synthetic data, no production.
# 1. Scope: every scenario has scope qoimeks-qa2, the synthetic QA tenant and its realm (qoimeks-qa2, host in the preconditions); the group directory name is not the scope.
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) counts, reads and starts reversals; actor-qoimeks-qa2-admin (TENANT_ADMIN) is the second person who approves a count or completes a reversal task (the approve and reverse tasks are routed to the role TENANT_ADMIN, so the storekeeper does not see them in My Tasks: the storekeeper holds no TasksReadAll) and the counter in the self-approval step of qoimeks-count-6. Both are in actors.yaml for qoimeks-qa2; live login is verified by acceptance (credentials from the acceptance credential source, never from files). TARGET state after T-2239 (#4764, not merged on main at writing): the storekeeper also holds StockQuickCount and CodesRead; until then the quick count entry is missing for the storekeeper and the walk reports a PRODUCT defect, no step is moved to the administrator.
# 3. Host and screens: tenant host https://qoimeks-qa2.letflow.qa.bizdala.com (answered HTTP 200 on 2026-11-19, T-2190; not re-run here). Read on main: web/src/modules/stock/stockRoutes.tsx (route admin/stock/quick-count), stock/index.ts (nav entry), quickCount/QuickCountPage.tsx, quickCountModel.ts, quickCountMessages.ts, documents/documentsModel.ts (actionsFor), register/stockRegisterModel.ts (CAUSES), pages/tasks/taskMessages.ts and TaskDetail.tsx.
# 4. Data: no balance, item or place is named by code. Every walk reads the Balances screen at run time and picks a row with a positive quantity, no lot, an item with no lot tracking, a place of one org unit and not one of the negative balances; it records item, place, org unit, the Responsible employee the row shows (none: the form selector stays at Unassigned stock) and the quantity B. Record the item, place and balance counts at the start of the run (Items total, Locations total, Balances rows) and compare to those, never to a number written here. Tenant state read, not set: all stock process definitions active, quick count approval four-eyes ON, no formal count order open over the place, shared stock access enabled. No generator task is needed.
# 5. Executable: browser steps only for the screens above (real browser script supplied by the runner, no pipeline_test); API steps only in qoimeks-count-6 step 7 (a plain HTTP client). A step whose fixture is missing stops before any write as BLOCKED-by-environment.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and the run title UAT qoimeks-count); parse and schema checks only; acceptance runs the preflight.
---
id: qoimeks-count-3-count-sets-balance-then-reverse
scope: qoimeks-qa2
title: The Qoimeks QA storekeeper counts one more unit than the book, the administrator approves as the second person,
  the balance becomes exactly the counted quantity, then the count is reversed and the balance returns
version: '2.0'
tags:
- qoimeks
- stock
- quick_count
- balance
- approve
- reverse
- desktop
- en
description: REQ-853, REQ-854 points 3 and 4 and criteria 1, 2 and 12, REQ-855. The storekeeper counts a key at
  B plus 1. The result shows book B, counted B plus 1, difference 1 and a hint that a second person approves in
  My Tasks, no Approve button; the balance stays B. The administrator approves the approval task in My Tasks; the
  balance becomes exactly B plus 1 (not B plus counted) and Movements shows one new entry of +1 linked to the count
  document with the cause of the count. The storekeeper starts the reversal of the posted document with the reason
  "Other" and a note; the administrator completes the reversal task; the document is Reversed, Balances shows B
  and Movements shows a second entry of -1. A reversed document offers no second reversal.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: Sign in as actor-qoimeks-qa2-storekeeper (STOREKEEPER) at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    and confirm the tenant before any action. Read the counts of items, places and posted balances at the start
    of the run and compare to those later.
  check: runner_prepared
  detail: Missing login, module, browser or fixture means BLOCKED-by-environment for the affected steps. Do not
    seed, grant roles or change approval rules to satisfy a precondition.
- description: A Balances row exists with a positive quantity B, no lot, an item without lot tracking, a place of
    one org unit, not one of the negative balances. Record item, place, org unit, the Responsible employee the row
    shows and B before any count.
  check: runner_prepared
  detail: If the row shows no Responsible employee the form selector stays at "Unassigned stock", otherwise the
    selector is set to that employee (the form books against that exact key). If no such row exists, report BLOCKED-by-environment
    before submitting; do not create stock.
- description: No formal count order is open over the chosen place for the same org unit, and nobody else posts
    to the key during the walk.
  check: system_seeded
  detail: UAT assumption, to be confirmed by the process owner. If the screen refuses with a message that a count
    is in progress or the place is frozen, quote it and its order number and report BLOCKED-by-environment. If the
    posting is refused because the balance changed, keep the evidence, cancel the unposted document, read a fresh
    B and repeat once.
- description: 'TARGET state after T-2239 (#4764): the storekeeper sees "Quick count" in the stock navigation and
    may open it.'
  check: system_seeded
  detail: If the entry is missing for the storekeeper, report a PRODUCT defect (#4764) and do not type the address;
    the walk is not moved to the administrator. Until T-2239 merges the affected outcomes of this scenario FAIL
    as product defects, they are not weakened.
- description: 'Four-eyes is ON for the quick count approval (second person approves) and a different person from
    the counter can complete the approve task: the administrator. The administrator can sign in separately.'
  check: runner_prepared
  detail: Read the state through the visible hint after the first submit. If the administrator cannot sign in, the
    outcomes that need the second person are BLOCKED-by-environment.
steps:
- step: 1
  actor: storekeeper
  action: 'The storekeeper opens Balances and notes a row as in the preconditions (item, place, org unit, Responsible
    employee, B), and Movements: the number of the newest movement of the key as M0.'
  via: ui
- step: 2
  actor: storekeeper
  action: The storekeeper opens "Quick count", chooses that item, place, org unit and Responsible employee, types
    B plus 1 as counted quantity, chooses the reason "Other", types the note "UAT qoimeks-count-3" and presses "Submit
    count".
  via: ui
- step: 3
  actor: storekeeper
  action: 'The storekeeper reads the recorded count: book, counted quantity, difference, state, and the hint under
    it; records the document number. Then reads Balances: the key still shows B.'
  via: ui
- step: 4
  actor: admin
  action: The administrator, signed in separately, opens My Tasks, selects the approval task of that count document,
    takes it ("Claim") if the screen offers it, and presses "Approve". The screen shows "Approved".
  via: ui
- step: 5
  actor: storekeeper
  action: The storekeeper reads the key on Balances and the new entries of the key on Movements.
  via: ui
- step: 6
  actor: storekeeper
  action: The storekeeper opens the count document in the stock documents list, presses "Reverse", chooses the reason
    "Other", types the note "UAT qoimeks-count-3 undo" and confirms. The document still reads Posted until the reversal
    task is done.
  via: ui
- step: 7
  actor: admin
  action: The administrator opens My Tasks, selects the reversal task of that document, takes it if offered and
    completes it ("Reverse").
  via: ui
- step: 8
  actor: storekeeper
  action: The storekeeper reads the document, then Balances and Movements for the key.
  via: ui
- step: 9
  actor: storekeeper
  action: The storekeeper looks at the actions offered on the reversed document in order to reverse it a second
    time. The storekeeper does not press "Cancel document".
  expect_refusal: true
  via: ui
expected_outcomes:
- id: EO-001
  description: The submitted count shows book, counted quantity and difference and says who approves (REQ-855 criteria
    2 and 5).
  verification:
    method: gui_screen
    detail: 'Step 3 shows "Count recorded", "Book quantity" B, "Counted quantity" B plus 1, "Difference" 1, state
      "Issued", no "Approve" button and a hint to approve in My Tasks: the four-eyes hint "A second person needs
      to approve this count in My Tasks." (REQ-855 criterion 5 target), or, when the storekeeper cannot see the
      administrator-routed task, "This count is waiting for approval. Open My Tasks to approve it."; either is accepted,
      record which one is shown. Balances still shows B.'
    evidence: Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: The counter does not know whether the count is finished.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: After the second person approves, the balance IS the counted quantity, written as one movement of
    the difference (REQ-854 criterion 2, REQ-853).
  verification:
    method: gui_screen
    detail: 'Step 4 shows "Approved". Step 5 shows the key at B plus 1 on Balances (not 2B plus 1) and exactly one
      new movement of +1 for the key, linked to the count document, newer than M0. The cause column shows the cause
      of the quick count (count_set): the Movements screen catalog has no label for it, so it may read as the raw
      code; record that as a screen note, not a failure.'
    evidence: Screenshots of steps 4 and 5.
  on_fail:
    severity: BLOCKER
    business_impact: The central promise, that a count sets the balance, is broken and stock is wrong.
    suggested_action: route_to_backend_dev
- id: EO-003
  description: Reversing the count returns the balance to what it was (REQ-854 criterion 12).
  verification:
    method: gui_screen
    detail: 'Step 6 shows the reversal dialog accepted and the document not yet Reversed. Step 8 shows the document
      "Reversed", the key at B on Balances and a second movement of -1 with the cause "Reversal". If no reversal
      task appears or the administrator cannot complete it, steps 6 to 9 are BLOCKED-by-environment: record the
      document number and the changed key.'
    evidence: Screenshots of steps 6 and 8.
  on_fail:
    severity: MAJOR
    business_impact: A wrong count cannot be undone and the test data stays changed.
    suggested_action: route_to_backend_dev
- id: EO-004
  description: A reversed count cannot be reversed again (REQ-854 criterion 12).
  verification:
    method: gui_screen
    detail: Step 9 shows no "Reverse" button on the reversed document (only "Cancel document" is offered for state
      Reversed); Balances still shows B.
    evidence: Screenshot of step 9.
  on_fail:
    severity: MAJOR
    business_impact: A second reversal would take the balance below the true quantity.
    suggested_action: route_to_backend_dev
