# T-2262 code-reading pass, group qoimeks-count (PM 2026-11-19). Run title: UAT qoimeks-count. QA only, synthetic data, no production.
# 1. Scope: every scenario has scope qoimeks-qa2, the synthetic QA tenant and its realm (qoimeks-qa2, host in the preconditions); the group directory name is not the scope.
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) counts, reads and starts reversals; actor-qoimeks-qa2-admin (TENANT_ADMIN) is the second person who approves a count or completes a reversal task (the approve and reverse tasks are routed to the role TENANT_ADMIN, so the storekeeper does not see them in My Tasks: the storekeeper holds no TasksReadAll) and the counter in the self-approval step of qoimeks-count-6. Both are in actors.yaml for qoimeks-qa2; live login is verified by acceptance (credentials from the acceptance credential source, never from files). TARGET state after T-2239 (#4764, not merged on main at writing): the storekeeper also holds StockQuickCount and CodesRead; until then the quick count entry is missing for the storekeeper and the walk reports a PRODUCT defect, no step is moved to the administrator.
# 3. Host and screens: tenant host https://qoimeks-qa2.letflow.qa.bizdala.com (answered HTTP 200 on 2026-11-19, T-2190; not re-run here). Read on main: web/src/modules/stock/stockRoutes.tsx (route admin/stock/quick-count), stock/index.ts (nav entry), quickCount/QuickCountPage.tsx, quickCountModel.ts, quickCountMessages.ts, documents/documentsModel.ts (actionsFor), register/stockRegisterModel.ts (CAUSES), pages/tasks/taskMessages.ts and TaskDetail.tsx.
# 4. Data: no balance, item or place is named by code. Every walk reads the Balances screen at run time and picks a row with a positive quantity, no lot, an item with no lot tracking, a place of one org unit and not one of the negative balances; it records item, place, org unit, the Responsible employee the row shows (none: the form selector stays at Unassigned stock) and the quantity B. Record the item, place and balance counts at the start of the run (Items total, Locations total, Balances rows) and compare to those, never to a number written here. Tenant state read, not set: all stock process definitions active, quick count approval four-eyes ON, no formal count order open over the place, shared stock access enabled. No generator task is needed.
# 5. Executable: browser steps only for the screens above (real browser script supplied by the runner, no pipeline_test); API steps only in qoimeks-count-6 step 7 (a plain HTTP client). A step whose fixture is missing stops before any write as BLOCKED-by-environment.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and the run title UAT qoimeks-count); parse and schema checks only; acceptance runs the preflight.
---
id: qoimeks-count-2-count-equal-to-book-confirms
scope: qoimeks-qa2
title: The Qoimeks QA storekeeper counts an item and enters exactly the book quantity, and the count is recorded
  as confirmed with difference zero and the balance does not move
version: '2.0'
tags:
- qoimeks
- stock
- quick_count
- confirmed
- desktop
- en
description: REQ-854 point 4 and criterion 6, REQ-855. The storekeeper fills the form for a Balances key and types
  the same quantity the form shows as book quantity, reason "Other" with a note. The result shows a document number,
  book B, counted B, difference 0, state Confirmed and asks for no approval, because nothing has to be posted. The
  Balances screen still shows B and Movements has no new entry for the key. The document is found in the stock documents
  list with its number and state Confirmed.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: Sign in as actor-qoimeks-qa2-storekeeper (STOREKEEPER) at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    and confirm the tenant before any action. Read the counts of items, places and posted balances at the start
    of the run and compare to those later.
  check: runner_prepared
  detail: Missing login, module, browser or fixture means BLOCKED-by-environment for the affected steps. Do not
    seed, grant roles or change approval rules to satisfy a precondition.
- description: A Balances row exists with a positive quantity B, no lot, an item without lot tracking, a place of
    one org unit, not one of the negative balances. Record item, place, org unit, the Responsible employee the row
    shows and B before any count.
  check: runner_prepared
  detail: If the row shows no Responsible employee the form selector stays at "Unassigned stock", otherwise the
    selector is set to that employee (the form books against that exact key). If no such row exists, report BLOCKED-by-environment
    before submitting; do not create stock.
- description: No formal count order is open over the chosen place for the same org unit, and nobody else posts
    to the key during the walk.
  check: system_seeded
  detail: UAT assumption, to be confirmed by the process owner. If the screen refuses with a message that a count
    is in progress or the place is frozen, quote it and its order number and report BLOCKED-by-environment. If the
    posting is refused because the balance changed, keep the evidence, cancel the unposted document, read a fresh
    B and repeat once.
- description: 'TARGET state after T-2239 (#4764): the storekeeper sees "Quick count" in the stock navigation and
    may open it.'
  check: system_seeded
  detail: If the entry is missing for the storekeeper, report a PRODUCT defect (#4764) and do not type the address;
    the walk is not moved to the administrator. Until T-2239 merges the affected outcomes of this scenario FAIL
    as product defects, they are not weakened.
steps:
- step: 1
  actor: storekeeper
  action: The storekeeper opens Balances, notes a row as in the preconditions (item, place, org unit, Responsible
    employee, B), then opens Movements filtered to that item and notes the number of the newest movement of the
    key (or "none") as M0, and the stock documents list newest document number as N0.
  via: ui
- step: 2
  actor: storekeeper
  action: The storekeeper opens "Quick count", chooses that item, place, org unit and Responsible employee, reads
    the book quantity, types the same number as counted quantity, chooses the reason "Other" and types the note
    "UAT qoimeks-count-2" in the note field that appears.
  via: ui
- step: 3
  actor: storekeeper
  action: The storekeeper presses "Submit count" and reads the result.
  via: ui
- step: 4
  actor: storekeeper
  action: The storekeeper opens the stock documents screen, finds the document by its number and opens it.
  via: ui
- step: 5
  actor: storekeeper
  action: The storekeeper reads the same key on Balances and the newest movement of the key on Movements.
  via: ui
expected_outcomes:
- id: EO-001
  description: The count is accepted and shown as confirmed with difference zero and no approval is asked (REQ-854
    criterion 6).
  verification:
    method: gui_screen
    detail: Step 3 shows "Count recorded", a document number, "Book quantity" B, "Counted quantity" B, "Difference"
      0, "State" "Confirmed", reason "Other" with the note; no "Approve" button and no hint to approve in My Tasks.
    evidence: Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: A count that confirmed the book is lost, or the user is asked to approve a count with nothing
      to post.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: The recorded document is found in the stock documents with its number and state.
  verification:
    method: gui_screen
    detail: 'Step 4 shows the document with the number of step 3 and state "Confirmed", and the org unit chosen.
      Book, counted and difference are read from the result of step 3: the document detail lines table shows item,
      lot and quantity columns only.'
    evidence: Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: There is no record of who counted and when.
    suggested_action: route_to_backend_dev
- id: EO-003
  description: The balance did not move and no movement was written (REQ-854 criterion 6).
  verification:
    method: gui_screen
    detail: Step 5 shows the key at B on Balances and the newest movement of the key equal to M0.
    evidence: Screenshots of step 5.
  on_fail:
    severity: BLOCKER
    business_impact: A count that agrees with the book would change stock.
    suggested_action: route_to_backend_dev
