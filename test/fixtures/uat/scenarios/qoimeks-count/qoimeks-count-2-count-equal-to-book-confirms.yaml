# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-count. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2222, PM 2026-11-19): every step a storekeeper does in real life (open the form, read the book quantity, submit the count, read the difference, input refusals, reading balances and movements, starting a reversal) runs as actor-qoimeks-qa2-storekeeper / STOREKEEPER; actor-qoimeks-qa2-admin / TENANT_ADMIN appears only as the second person who approves a count or completes a reversal task when four-eyes is on (qoimeks-count-3 steps 4 and 6). Both exist in actors.yaml for tenant/realm qoimeks-qa2 (T-2219 PM decision); the live login was not exercised in this writing step (acceptance verifies it; credentials come from the acceptance credential source, never from files); missing credentials block the affected outcomes. Source fact (lib/letflow/modules/stock/stock.ex role_grants, docs/roles.md): STOREKEEPER holds StockRead, StockPost, StockReverse, StockCountOrder, StockCountRecord but NOT StockQuickCount; the Quick count and workbook-import screens need StockQuickCount, so for the storekeeper they are expected to be refused. The walk runs them as the storekeeper anyway and reports a PRODUCT defect; no step is moved to the administrator to make it pass.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places linked to QOI-OU-1, base units, lots, book quantity B, no open formal count and effective quick-count approval rule: listed in scenario preconditions. Every seeded balance carries a responsible employee, so the steps choose the Responsible employee of the Balances row (task 4740); a second approver is an absent baseline fixture and dependent outcomes are BLOCKED-by-environment. Re-read B before each retry; concurrent postings invalidate the environment precondition. Counts of items, places and balances are read at the start of the run (the seed changes them); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the administrator used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-count.
# T-2190: run title UAT qoimeks-count; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2159 (BA): Qoimeks QA walk, quick count. QA only, SYNTHETIC data, no production.
# Covers: REQ-854 criterion 6 (counted equal to book: document issued with difference 0, no posting, state confirmed), REQ-855 criteria 2 (submit result: number, book, counted, difference)
# and 6 (result state of the screen). Sources: docs/requirements.yaml REQ-854 point (4) and criterion 6; QuickCountPage.tsx (result facts: Document, Book quantity, Counted quantity, Difference, State);
# documentsMessages.ts ("Confirmed" / "Подтверждён" / "Расталды").
# Writes: ONE quick count document with the reason note "UAT qoimeks-count-2". No ledger entry, so no balance changes. A document cannot be deleted; it stays as history on the QA tenant and is
# named by that note. Clean-up: nothing to undo in the balance; the run lists the document number in its report.
# Not UAT-observable: see the group list in qoimeks-count-1 (phone app, voice, count_in_progress, quick_count_stale, four-eyes).
# Responsible rule (task 4740): the quick count form has a 'Responsible employee' selector (default 'Unassigned stock'); every step that compares a book quantity chooses the Responsible employee of the Balances row it noted. No stock without a responsible is needed.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-count-2-count-equal-to-book-confirms
scope: qoimeks-qa2
title: >-
  The Qoimeks QA storekeeper counts an item and enters exactly the book quantity, and the count is recorded as
  confirmed with difference zero and the balance does not move
version: '1.1'
tags:
- qoimeks
- stock
- quick_count
- confirmed
- desktop
- en
description: >-
  The storekeeper fills the quick count form for an item, place and the Responsible employee of the Balances row, types the same quantity the form shows as
  the book quantity, chooses the reason "Other" (only "Other" has a note field), types the note "UAT qoimeks-count-2" and submits. The screen
  shows the recorded count: a document number, book quantity B, counted quantity B, difference 0, state Confirmed,
  and no approval is asked (nothing has to be posted). The balance of the key on the Balances screen is still B
  and the Movements screen shows no new movement for it from this count. The document is found in the stock documents
  list as a quick count with the same numbers.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    Same tenant, data, permission and browser as qoimeks-count-1 (desktop 1440 px, English).
  check: system_seeded
  detail: >-
    Any missing part is BLOCKED for the whole scenario.
- description: >-
    No formal count (inventory) order is open over the chosen place in the same org unit.
  check: system_seeded
  detail: >-
    UAT assumption, to be confirmed by the process owner (the tenant holds none as far as the task text says). If
    the screen refuses with a message that a count is in progress, report BLOCKED and quote the message and its
    order number.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Read the counts of items, places and posted balances at the start of the run (the seed changes them); every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For the steps that compare a book quantity, first read the full balance key on the Balances screen: a row with a
    positive quantity, no lot, the item base unit, at a place linked to QOI-OU-1. Record item, place, org unit, the
    Responsible employee of that row and its quantity B before any count.
  check: runner_prepared
  detail: >-
    Every seeded balance carries a responsible employee, so the quick count form needs that employee chosen in its
    "Responsible employee" selector (default "Unassigned stock"); with the default the form shows book quantity 0 for a
    seeded row (task 4740, issue 4720). The run chooses the Responsible employee of the Balances row it noted, and B is
    the quantity of that same row. No separate stock without a responsible is needed. Read the counts of items, places
    and balances at the start of the run (the seed changes them). If no such row exists, report BLOCKED-by-environment
    before submitting. Do not create stock to satisfy this precondition.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper opens Balances, notes a row with a positive quantity B for an item without lots (not one of
    the three negative rows) with its location, org unit and Responsible employee, and records the current first page of Movements, its
    operation document numbers, and the chosen plain balance key.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper opens "Quick count", chooses that item, location, org unit and Responsible employee, reads the book quantity, types
    the same number in the counted quantity field, chooses the reason "Other" (the note field exists only for "Other") and types the note "UAT qoimeks-count-2".
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper presses "Submit count" and reads the result.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper opens the stock documents screen, finds the document by its number and opens it.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper opens Balances and Movements again and reads the same key.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The count is accepted and shown as confirmed with difference zero, with no approval asked.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows "Count recorded", a document number, Book quantity B, Counted quantity B, Difference 0, State
      "Confirmed", item, location and org unit and Responsible employee as chosen, reason "Other"; no Approve button and no hint to approve
      in My Tasks.
    evidence: >-
      Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A count that confirmed the book is lost, or the user is asked to approve a count that has nothing to post.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The recorded document is found in the stock documents and carries the same numbers.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows the document with the number of step 3, a quick count type, state Confirmed, book B, counted
      B, difference 0.
    evidence: >-
      Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: >-
      There is no record of who counted and when.
    suggested_action: route_to_backend_dev
- id: EO-003
  description: >-
    The balance did not move and no movement was written.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows the key still at B on Balances and no new movement on Movements compared with step 1.
    evidence: >-
      Screenshots of step 5.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A count that agrees with the book would change stock.
    suggested_action: route_to_backend_dev
