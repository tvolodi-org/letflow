# T-2190: run title UAT qoimeks-count; tenant and realm qoimeks-qa only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal coverage needing another role is BLOCKED-by-environment: only actor-qoimeks-qa-admin exists in this realm.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2159 (BA): Qoimeks QA walk, quick count. QA only, SYNTHETIC data, no production.
# Covers: REQ-854 criterion 6 (counted equal to book: document issued with difference 0, no posting, state confirmed), REQ-855 criteria 2 (submit result: number, book, counted, difference)
# and 6 (result state of the screen). Sources: docs/requirements.yaml REQ-854 point (4) and criterion 6; QuickCountPage.tsx (result facts: Document, Book quantity, Counted quantity, Difference, State);
# documentsMessages.ts ("Confirmed" / "Подтверждён" / "Расталды").
# Writes: ONE quick count document with the reason note "UAT qoimeks-count-2". No ledger entry, so no balance changes. A document cannot be deleted; it stays as history on the QA tenant and is
# named by that note. Clean-up: nothing to undo in the balance; the run lists the document number in its report.
# Not UAT-observable: see the group list in qoimeks-count-1 (phone app, voice, count_in_progress, quick_count_stale, four-eyes).
# Plain-key coverage requires a prepared balance without a responsible; seeded responsible rows are not that fixture. Missing fixture is BLOCKED-by-environment.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-count-2-count-equal-to-book-confirms
scope: qoimeks-qa
title: >-
  The Qoimeks QA administrator counts an item and enters exactly the book quantity, and the count is recorded as
  confirmed with difference zero and the balance does not move
version: '1.1'
tags:
- qoimeks
- stock
- quick_count
- confirmed
- desktop
- en
description: >-
  The administrator fills the quick count form for an item and place, types the same quantity the form shows as
  the book quantity, chooses the reason "Recount", types the note "UAT qoimeks-count-2" and submits. The screen
  shows the recorded count: a document number, book quantity B, counted quantity B, difference 0, state Confirmed,
  and no approval is asked (nothing has to be posted). The balance of the key on the Balances screen is still B
  and the Movements screen shows no new movement for it from this count. The document is found in the stock documents
  list as a quick count with the same numbers.
actors:
  admin: actor-qoimeks-qa-admin
preconditions:
- description: >-
    Same tenant, data, permission and browser as qoimeks-count-1 (desktop 1440 px, English).
  check: system_seeded
  detail: >-
    Any missing part is BLOCKED for the whole scenario.
- description: >-
    No formal count (inventory) order is open over the chosen place in the same org unit.
  check: system_seeded
  detail: >-
    UAT assumption, to be confirmed by the process owner (the tenant holds none as far as the task text says). If
    the screen refuses with a message that a count is in progress, report BLOCKED and quote the message and its
    order number.
- description: >-
    Sign in as actor-qoimeks-qa-admin (QOIMEKS_QA_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa.letflow.qa.bizdala.com/?realm=qoimeks-qa.
    Confirm the tenant before any action. The baseline is 666 items, 142 places, 603 posted balances, every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For the existing positive-book-quantity steps, first read the full balance key and confirm it has no responsible,
    no lot and uses the item base unit at QOI-OU-1. The chosen location must be linked to that org unit. Record
    item, place, unit, quantity B and the empty responsible slot before any count.
  check: runner_prepared
  detail: >-
    The synthetic opening rows all have a responsible and cannot supply this plain positive key. If no separate
    prepared plain positive balance exists, mark those steps and dependent outcomes BLOCKED-by-environment before
    submitting; never compare the form book value 0 with a responsible balance B. Source: QuickCountPage.tsx bookRow
    and documents.ex book_quantity. Do not create stock to satisfy this precondition.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator opens Balances, notes a row with a positive quantity B for an item without lots (not one of
    the three negative rows) with its location and org unit, and records the current first page of Movements, its
    operation document numbers, and the chosen plain balance key.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator opens "Quick count", chooses that item, location and org unit, reads the book quantity, types
    the same number in the counted quantity field, chooses the reason "Recount" and types the note "UAT qoimeks-count-2".
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator presses "Submit count" and reads the result.
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator opens the stock documents screen, finds the document by its number and opens it.
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator opens Balances and Movements again and reads the same key.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The count is accepted and shown as confirmed with difference zero, with no approval asked.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows "Count recorded", a document number, Book quantity B, Counted quantity B, Difference 0, State
      "Confirmed", item, location and org unit as chosen, reason "Recount"; no Approve button and no hint to approve
      in My Tasks.
    evidence: >-
      Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A count that confirmed the book is lost, or the user is asked to approve a count that has nothing to post.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The recorded document is found in the stock documents and carries the same numbers.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows the document with the number of step 3, a quick count type, state Confirmed, book B, counted
      B, difference 0.
    evidence: >-
      Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: >-
      There is no record of who counted and when.
    suggested_action: route_to_backend_dev
- id: EO-003
  description: >-
    The balance did not move and no movement was written.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows the key still at B on Balances and no new movement on Movements compared with step 1.
    evidence: >-
      Screenshots of step 5.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A count that agrees with the book would change stock.
    suggested_action: route_to_backend_dev
