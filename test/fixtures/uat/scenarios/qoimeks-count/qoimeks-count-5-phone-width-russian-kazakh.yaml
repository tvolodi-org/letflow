# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-count. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2222, PM 2026-11-19): every step a storekeeper does in real life (open the form, read the book quantity, submit the count, read the difference, input refusals, reading balances and movements, starting a reversal) runs as actor-qoimeks-qa2-storekeeper / STOREKEEPER; actor-qoimeks-qa2-admin / TENANT_ADMIN appears only as the second person who approves a count or completes a reversal task when four-eyes is on (qoimeks-count-3 steps 4 and 6). Both exist in actors.yaml for tenant/realm qoimeks-qa2 (T-2219 PM decision); the live login was not exercised in this writing step (acceptance verifies it; credentials come from the acceptance credential source, never from files); missing credentials block the affected outcomes. Source fact (lib/letflow/modules/stock/stock.ex role_grants, docs/roles.md): STOREKEEPER holds StockRead, StockPost, StockReverse, StockCountOrder, StockCountRecord but NOT StockQuickCount; the Quick count and workbook-import screens need StockQuickCount, so for the storekeeper they are expected to be refused. The walk runs them as the storekeeper anyway and reports a PRODUCT defect; no step is moved to the administrator to make it pass.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places linked to QOI-OU-1, base units, lots, book quantity B, no open formal count and effective quick-count approval rule: listed in scenario preconditions. Every seeded balance carries a responsible employee, so the steps choose the Responsible employee of the Balances row (task 4740); a second approver is an absent baseline fixture and dependent outcomes are BLOCKED-by-environment. Re-read B before each retry; concurrent postings invalidate the environment precondition. Counts of items, places and balances are read at the start of the run (the seed changes them); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the administrator used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-count.
# T-2190: run title UAT qoimeks-count; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2159 (BA): Qoimeks QA walk, quick count on a phone-width browser window (390 px) in Russian and Kazakh. QA only, SYNTHETIC data, no production.
# Covers: REQ-855 criteria 4 (messages in en, ru, kk) and 6 (layout at 390 px, ru and kk, the form, the filled form with balance, the result); REQ-854 criterion 6 (equal to book: confirmed, no posting).
# Sources: quickCountMessages.ts (ru and kk texts quoted below: title, labels, "Пересчёт зафиксирован", "Санақ тіркелді"); web/src/components/ui/LanguageSwitcher.tsx (language menu, as in qoimeks-qa-4);
# documentsMessages.ts (state "Подтверждён" / "Расталды"); navMessages.ts (screen names).
# Writes: two quick count documents that confirm the book (the reasons "Пересчёт" and "Қайта санақ" have no note field, so the run names the two documents by their numbers in its report); no ledger entry, no balance change. They stay as history.
# Clean-up: the language is put back to English in the last step (the browser keeps the choice per account, as in qoimeks-qa-4).
# NOT UAT-observable: the phone app (APK) screens and voice (REQ-856): a handset app cannot be driven from the browser run; this scenario walks only the web screen in a 390 px window and says so. The phone-width check of what is shown is a screen check; touch-specific
# behaviour (camera scanning) is not tested. Group list: see qoimeks-count-1.
# Responsible rule (task 4740): the quick count form has a 'Responsible employee' selector (default 'Unassigned stock'); every step that compares a book quantity chooses the Responsible employee of the Balances row it noted. No stock without a responsible is needed.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-count-5-phone-width-russian-kazakh
scope: qoimeks-qa2
title: >-
  On a 390 px wide window the Qoimeks QA storekeeper makes a quick count that agrees with the book in Russian
  and in Kazakh, and every label, message and result is in that language and fits the screen
version: '1.1'
tags:
- qoimeks
- stock
- quick_count
- phone
- mobile_width
- i18n
- ru
- kk
- en
description: >-
  The storekeeper opens the tenant in a browser window 390 px wide, switches the language to Russian, opens the
  quick count screen ("Быстрый пересчёт") and fills it for an item, place and org unit with the counted quantity
  equal to the book quantity, reason "Пересчёт" (no note field), and submits. The result is in Russian
  ("Пересчёт зафиксирован", state "Подтверждён"). Then the storekeeper switches to Kazakh, opens "Жылдам санақ",
  does the same with the reason "Қайта санақ" (no note field), and reads the result in Kazakh ("Санақ тіркелді", state
  "Расталды"). On both screens nothing is cut off at the right edge, nothing needs sideways scrolling, buttons are
  reachable with the thumb zone of the page (they are on the page, not hidden), and no English word or raw message
  key is left. In each language the storekeeper also types a negative quantity once and reads the refusal in that
  language. Finally the language is put back to English.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    Same tenant, data and permission as qoimeks-count-1; a key with an item without lots and a positive book quantity
    (not one of the three negative balances); no formal count order open over the place.
  check: system_seeded
  detail: >-
    Any missing part is BLOCKED for the whole scenario.
- description: >-
    The run can drive a real browser at a window width of 390 px (height 844 px or taller) and screenshot it.
  check: system_seeded
  detail: >-
    If the width cannot be set, report BLOCKED. Do not use a desktop width instead.
- description: >-
    The storekeeper's language starts as English.
  check: system_seeded
  detail: >-
    If not, switch to English first and carry on.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Read the counts of items, places and posted balances at the start of the run (the seed changes them); every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For the steps that compare a book quantity, first read the full balance key on the Balances screen: a row with a
    positive quantity, no lot, the item base unit, at a place linked to QOI-OU-1. Record item, place, org unit, the
    Responsible employee of that row and its quantity B before any count.
  check: runner_prepared
  detail: >-
    Every seeded balance carries a responsible employee, so the quick count form needs that employee chosen in its
    "Responsible employee" selector (default "Unassigned stock"); with the default the form shows book quantity 0 for a
    seeded row (task 4740, issue 4720). The run chooses the Responsible employee of the Balances row it noted, and B is
    the quantity of that same row. No separate stock without a responsible is needed. Read the counts of items, places
    and balances at the start of the run (the seed changes them). If no such row exists, report BLOCKED-by-environment
    before submitting. Do not create stock to satisfy this precondition.
steps:
- step: 1
  actor: storekeeper
  action: >-
    At 390 px width the storekeeper signs in on https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2, opens
    the stock Balances screen (through the menu button of the narrow layout) and notes one row: item, location,
    org unit, Responsible employee and quantity B.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper opens the language menu, chooses Russian, and opens "Быстрый пересчёт" from the navigation.
    The storekeeper reads the empty form.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper types -1 as the counted quantity and presses "Отправить пересчёт".
  expect_refusal: true
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper chooses the item, location, org unit and Responsible employee ("Ответственный сотрудник") noted in step 1, types B as the counted quantity,
    chooses the reason "Пересчёт" and reads the form, then presses "Отправить
    пересчёт" and reads the result.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper presses "Новый пересчёт" (or opens the screen again), switches the language to Kazakh through
    the language menu, and reads the empty form of "Жылдам санақ".
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The storekeeper types -1 as the counted quantity and presses "Санақты жіберу".
  expect_refusal: true
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The storekeeper chooses the same item, location, org unit and Responsible employee ("Жауапты қызметкер"), types B, chooses the reason "Қайта санақ", presses "Санақты жіберу" and reads the result.
  via: ui
- step: 8
  actor: storekeeper
  action: >-
    The storekeeper opens the language menu, chooses English, and reads the quick count screen title.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The Russian form uses Russian labels and fits the narrow window.
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows the title "Быстрый пересчёт" and the labels "Позиция", "Местонахождение", "Подразделение", "Фактическое
      количество", "Причина" and the button "Отправить пересчёт"; no sideways scroll bar, no text cut at the right
      edge, the button is on the page.
    evidence: >-
      Screenshots of steps 2 and 4 at 390 px.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking storekeepers on a phone cannot use the count form.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The negative quantity is refused in Russian.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows "Количество не может быть отрицательным." at the quantity field and no result panel.
    evidence: >-
      Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The refusal is shown in English or as a raw key to a Russian-speaking user.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The Russian result shows the confirmed count with the book, counted quantity and zero difference.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows "Пересчёт зафиксирован", "Документ" with a number, "Учётное количество" B, "Фактическое количество"
      B, "Расхождение" 0, "Статус" "Подтверждён"; the form before submit showed "Учётное количество" with the value
      B.
    evidence: >-
      Screenshots of step 4 (form and result).
  on_fail:
    severity: MAJOR
    business_impact: >-
      The count result cannot be read in Russian.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    The Kazakh form uses Kazakh labels, fits the narrow window and refuses the negative quantity in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows the title "Жылдам санақ" and the labels "Позиция", "Орналасу жері", "Бөлімше", "Нақты саны",
      "Себеп" and the button "Санақты жіберу", no sideways scroll; step 6 shows "Сан теріс болуы мүмкін емес.".
    evidence: >-
      Screenshots of steps 5 and 6 at 390 px.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Kazakh-speaking storekeepers on a phone cannot use the count form.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    The Kazakh result shows the confirmed count.
  verification:
    method: gui_screen
    detail: >-
      Step 7 shows "Санақ тіркелді", "Құжат" with a number, "Есептік саны" B, "Нақты саны" B, "Айырмашылық" 0, "Күй"
      "Расталды".
    evidence: >-
      Screenshot of step 7.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The count result cannot be read in Kazakh.
    suggested_action: route_to_frontend_dev
- id: EO-006
  description: >-
    Equal-to-book counts changed no balance, and the language is restored.
  verification:
    method: gui_screen
    detail: >-
      Step 8 shows "Quick count" in English; Balances at 390 px shows the key at B (read after step 8).
    evidence: >-
      Screenshot of step 8 and of Balances.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A count that agrees with the book changed stock, or the account stays in the wrong language.
    suggested_action: route_to_backend_dev
