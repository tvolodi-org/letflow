# T-2262 code-reading pass, group qoimeks-count (PM 2026-11-19). Run title: UAT qoimeks-count. QA only, synthetic data, no production.
# 1. Scope: every scenario has scope qoimeks-qa2, the synthetic QA tenant and its realm (qoimeks-qa2, host in the preconditions); the group directory name is not the scope.
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER) counts, reads and starts reversals; actor-qoimeks-qa2-admin (TENANT_ADMIN) is the second person who approves a count or completes a reversal task (the approve and reverse tasks of the stock processes require the permission StockApprove, which the administrator holds and the storekeeper does not hold: that permission, not the address of the task, is what refuses the storekeeper, also after a reassignment; the tasks are also addressed to the role TENANT_ADMIN, which only decides who finds them in My Tasks, and the storekeeper holds no TasksReadAll; decision 0093, stock 0.23.0, T-2329 merged) and the counter in the self-approval step of qoimeks-count-6. Both are in actors.yaml for qoimeks-qa2; live login is verified by acceptance (credentials from the acceptance credential source, never from files). State since stock 0.22.0 (T-2239, issue 4764, merged: lib/letflow/modules/stock/stock.ex STOREKEEPER grants, docs/roles.md): the storekeeper holds StockQuickCount and CodesRead; if the quick count entry is missing for the storekeeper the walk reports a PRODUCT defect, no step is moved to the administrator.
# 3. Host and screens: tenant host https://qoimeks-qa2.letflow.qa.bizdala.com (answered HTTP 200 on 2026-11-19, T-2190; not re-run here). Read on main: web/src/modules/stock/stockRoutes.tsx (route admin/stock/quick-count), stock/index.ts (nav entry), quickCount/QuickCountPage.tsx, quickCountModel.ts, quickCountMessages.ts, documents/documentsModel.ts (actionsFor), register/stockRegisterModel.ts (CAUSES), pages/tasks/taskMessages.ts and TaskDetail.tsx.
# 4. Data: no balance, item or place is named by code. Every walk reads the Balances screen at run time and picks a row with a positive quantity, no lot, an item with no lot tracking, a place of one org unit and not one of the negative balances; it records item, place, org unit, the Responsible employee the row shows (none: the form selector stays at Unassigned stock) and the quantity B. Record the item, place and balance counts at the start of the run (Items total, Locations total, Balances rows) and compare to those, never to a number written here. Tenant state read, not set: all stock process definitions active, quick count approval four-eyes ON, no formal count order open over the place, shared stock access enabled. No generator task is needed.
# 5. Executable: browser steps only for the screens above (real browser script supplied by the runner, no pipeline_test); API steps only in qoimeks-count-6 steps 6 and 9, in qoimeks-count-3 step 4, in qoimeks-count-7 step 6 (a plain HTTP client). A step whose fixture is missing stops before any write as BLOCKED-by-environment.
# 6. Dry run: uat.sh preflight not run in this writing step (needs the acceptance credential source and the run title UAT qoimeks-count); parse and schema checks only; acceptance runs the preflight.
---
id: qoimeks-count-5-phone-width-russian-kazakh
scope: qoimeks-qa2
title: On a 390 px wide window the Qoimeks QA storekeeper makes a quick count that agrees with the book in Russian
  and in Kazakh, and every label, message and result is in that language and fits the screen
version: '2.0'
tags:
- qoimeks
- stock
- quick_count
- phone
- ru
- kk
description: REQ-855 criterion 6 (en, ru, kk at 390 px; the typed count only, the voice count REQ-856 is cancelled
  and not walked). The storekeeper opens the tenant in a 390 px browser window, switches to Russian, opens "Быстрый
  пересчёт", types a negative quantity once and reads the refusal, then fills a count equal to the book with the
  reason "Пересчёт" and reads the result; the same in Kazakh with "Жылдам санақ" and the reason "Қайта санақ". Nothing
  is cut off at the right edge, no sideways scrolling, buttons are on the page, no English word or raw message key
  is left. Finally the language is put back to English. The phone app on a handset is not driven by the browser
  run.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: Sign in as actor-qoimeks-qa2-storekeeper (STOREKEEPER) at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2
    and confirm the tenant before any action. Read the counts of items, places and posted balances at the start
    of the run and compare to those later.
  check: runner_prepared
  detail: Missing login, module, browser or fixture means BLOCKED-by-environment for the affected steps. Do not
    seed, grant roles or change approval rules to satisfy a precondition.
- description: A Balances row exists with a positive quantity B, no lot, an item without lot tracking, a place of
    one org unit, not one of the negative balances, and no OTHER Responsible employee holds non-zero stock of the same item at the same place, org unit and lot (T-2286 rule - after a count the item/place total IS the counted number, so read every Balances row of the item at that place and choose a key whose total T equals B; if none exists, BLOCKED-by-environment, create no stock). Record item, place, org unit, the Responsible employee the row
    shows and B before any count.
  check: runner_prepared
  detail: If the row shows no Responsible employee the form selector stays at "Unassigned stock", otherwise the
    selector is set to that employee (the form books against that exact key). If no such row exists, report BLOCKED-by-environment
    before submitting; do not create stock.
- description: 'Since stock 0.22.0 (T-2239, issue 4764, merged): the storekeeper sees "Quick count" in the stock navigation and
    may open it.'
  check: system_seeded
  detail: If the entry is missing for the storekeeper, report a PRODUCT defect (#4764) and do not type the address;
    the walk is not moved to the administrator. A missing entry is a product defect and the affected outcomes FAIL; they are not weakened.
- description: No formal count order is open over the chosen place for the same org unit, and nobody else posts
    to the key during the walk.
  check: system_seeded
  detail: UAT assumption, to be confirmed by the process owner. If the screen refuses with a message that a count
    is in progress or the place is frozen, quote it and its order number and report BLOCKED-by-environment. If the
    posting is refused because the balance changed, keep the evidence, cancel the unposted document, read a fresh
    B and repeat once.
- description: The run drives a real browser at a window width of 390 px.
  check: runner_prepared
  detail: If no browser can be started, report BLOCKED-by-environment.
steps:
- step: 1
  actor: storekeeper
  action: At 390 px width the storekeeper signs in, opens Balances through the menu button of the narrow layout
    and notes a row as in the preconditions (item, place, org unit, Responsible employee, B).
  via: ui
- step: 2
  actor: storekeeper
  action: The storekeeper opens the language menu, chooses Russian, and opens "Быстрый пересчёт" from the navigation.
    The storekeeper reads the empty form.
  via: ui
- step: 3
  actor: storekeeper
  action: The storekeeper types -1 as counted quantity and presses "Отправить пересчёт".
  expect_refusal: true
  via: ui
- step: 4
  actor: storekeeper
  action: The storekeeper chooses the item, place, org unit and Responsible employee ("Ответственный сотрудник")
    of step 1, types B as counted quantity, chooses the reason "Пересчёт", reads the form, presses "Отправить пересчёт"
    and reads the result.
  via: ui
- step: 5
  actor: storekeeper
  action: The storekeeper presses "Новый пересчёт", switches the language to Kazakh through the language menu, and
    reads the empty form of "Жылдам санақ".
  via: ui
- step: 6
  actor: storekeeper
  action: The storekeeper types -1 as counted quantity and presses "Санақты жіберу".
  expect_refusal: true
  via: ui
- step: 7
  actor: storekeeper
  action: The storekeeper chooses the same item, place, org unit and Responsible employee ("Жауапты қызметкер"),
    types B, chooses the reason "Қайта санақ", presses "Санақты жіберу" and reads the result.
  via: ui
- step: 8
  actor: storekeeper
  action: The storekeeper opens the language menu, chooses English, reads the quick count screen title, then reads
    the key on Balances.
  via: ui
expected_outcomes:
- id: EO-001
  description: The Russian form uses Russian labels and fits the narrow window.
  verification:
    method: gui_screen
    detail: Step 2 shows the title "Быстрый пересчёт", the labels "Позиция", "Местонахождение", "Подразделение",
      "Ответственный сотрудник", "Фактическое количество", "Причина" and the button "Отправить пересчёт"; no sideways
      scroll bar, no text cut at the right edge, the button is on the page.
    evidence: Screenshot of step 2.
  on_fail:
    severity: MAJOR
    business_impact: A Russian-speaking storekeeper on a phone cannot use the screen.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: The negative quantity is refused in Russian.
  verification:
    method: gui_screen
    detail: Step 3 shows "Количество не может быть отрицательным." at the quantity field and no result panel.
    evidence: Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: The refusal would be in the wrong language.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: The Russian result shows the confirmed count with book, counted quantity and zero difference (REQ-854
    criterion 6).
  verification:
    method: gui_screen
    detail: Step 4 shows before submit "Учётное количество" with the value B, and after submit "Пересчёт зафиксирован",
      "Документ" with a number, "Учётное количество" B, "Фактическое количество" B, "Расхождение" 0, "Статус" "Подтверждён".
    evidence: Screenshot of step 4 before and after submit.
  on_fail:
    severity: MAJOR
    business_impact: The counter cannot read the result.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: The Kazakh form uses Kazakh labels, fits the window and refuses the negative quantity in Kazakh.
  verification:
    method: gui_screen
    detail: Step 5 shows the title "Жылдам санақ" and the labels "Орналасу жері", "Бөлімше", "Жауапты қызметкер",
      "Нақты саны", "Себеп" and the button "Санақты жіберу", no sideways scroll; step 6 shows "Сан теріс болуы мүмкін
      емес." at the quantity field.
    evidence: Screenshots of steps 5 and 6.
  on_fail:
    severity: MAJOR
    business_impact: A Kazakh-speaking storekeeper cannot use the screen.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: The Kazakh result shows the confirmed count.
  verification:
    method: gui_screen
    detail: Step 7 shows "Санақ тіркелді", "Құжат" with a number, "Есептік саны" B, "Нақты саны" B, "Айырмашылық"
      0, "Күй" "Расталды".
    evidence: Screenshot of step 7.
  on_fail:
    severity: MAJOR
    business_impact: The counter cannot read the result.
    suggested_action: route_to_frontend_dev
- id: EO-006
  description: The equal-to-book counts changed no balance and the language is restored.
  verification:
    method: gui_screen
    detail: Step 8 shows "Quick count" in English and the key at B on Balances at 390 px.
    evidence: Screenshot of step 8.
  on_fail:
    severity: MAJOR
    business_impact: The language setting is stuck or stock moved.
    suggested_action: route_to_frontend_dev
