# T-2159 (BA): Qoimeks QA walk, quick count on a phone-width browser window (390 px) in Russian and Kazakh. QA only, SYNTHETIC data, no production.
# Covers: REQ-855 criteria 4 (messages in en, ru, kk) and 6 (layout at 390 px, ru and kk, the form, the filled form with balance, the result); REQ-854 criterion 6 (equal to book: confirmed, no posting).
# Sources: quickCountMessages.ts (ru and kk texts quoted below: title, labels, "Пересчёт зафиксирован", "Санақ тіркелді"); web/src/components/ui/LanguageSwitcher.tsx (language menu, as in qoimeks-qa-4);
# documentsMessages.ts (state "Подтверждён" / "Расталды"); navMessages.ts (screen names).
# Writes: two quick count documents that confirm the book (notes "UAT qoimeks-count-5 ru" and "UAT qoimeks-count-5 kk"); no ledger entry, no balance change. They stay as history.
# Clean-up: the language is put back to English in the last step (the browser keeps the choice per account, as in qoimeks-qa-4).
# NOT UAT-observable: the phone app (APK) screens and voice (REQ-856): a handset app cannot be driven from the browser run; this scenario walks only the web screen in a 390 px window and says so. The phone-width check of what is shown is a screen check; touch-specific
# behaviour (camera scanning) is not tested. Group list: see qoimeks-count-1.
---
id: qoimeks-count-5-phone-width-russian-kazakh
scope: qoimeks-count
title: On a 390 px wide window the Qoimeks QA administrator makes a quick count that agrees with the book in Russian and in Kazakh, and every label, message and result is in that language and fits the screen
version: "1.0"
tags: [qoimeks, stock, quick_count, phone, mobile_width, i18n, ru, kk, en]

description: >
  The administrator opens the tenant in a browser window 390 px wide, switches the language to Russian, opens the quick count screen ("Быстрый пересчёт") and fills it for an item, place and org unit with the counted quantity equal to
  the book quantity, reason "Пересчёт", note "UAT qoimeks-count-5 ru", and submits. The result is in Russian ("Пересчёт зафиксирован", state "Подтверждён"). Then the administrator switches to Kazakh, opens "Жылдам санақ", does the same with the note
  "UAT qoimeks-count-5 kk", and reads the result in Kazakh ("Санақ тіркелді", state "Расталды"). On both screens nothing is cut off at the right edge, nothing needs sideways scrolling, buttons are reachable with the thumb zone of the page (they are on the page, not hidden), and no English word or raw message key
  is left. In each language the administrator also types a negative quantity once and reads the refusal in that language. Finally the language is put back to English.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: Same tenant, data and permission as qoimeks-count-1; a key with an item without lots and a positive book quantity (not one of the three negative balances); no formal count order open over the place.
    check: system_seeded
    detail: Any missing part is BLOCKED for the whole scenario.
  - description: The run can drive a real browser at a window width of 390 px (height 844 px or taller) and screenshot it.
    check: system_seeded
    detail: If the width cannot be set, report BLOCKED. Do not use a desktop width instead.
  - description: The administrator's language starts as English.
    check: system_seeded
    detail: If not, switch to English first and carry on.

steps:
  - step: 1
    actor: admin
    action: >
      At 390 px width the administrator signs in on https://qoimeks-qa.letflow.qa.bizdala.com, opens the stock Balances screen (through the menu button of the narrow layout) and notes one row: item, location, org unit and quantity B.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens the language menu, chooses Russian, and opens "Быстрый пересчёт" from the navigation. The administrator reads the empty form.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator types -1 as the counted quantity and presses "Отправить пересчёт".
    expect_refusal: true
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator chooses the item, location and org unit noted in step 1, types B as the counted quantity, chooses the reason "Пересчёт", types the note "UAT qoimeks-count-5 ru" and reads the form, then presses "Отправить пересчёт" and reads the result.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator presses "Новый пересчёт" (or opens the screen again), switches the language to Kazakh through the language menu, and reads the empty form of "Жылдам санақ".
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator types -1 as the counted quantity and presses "Санақты жіберу".
    expect_refusal: true
    via: ui
  - step: 7
    actor: admin
    action: >
      The administrator chooses the same item, location and org unit, types B, chooses the reason "Қайта санақ", types the note "UAT qoimeks-count-5 kk", presses "Санақты жіберу" and reads the result.
    via: ui
  - step: 8
    actor: admin
    action: >
      The administrator opens the language menu, chooses English, and reads the quick count screen title.
    via: ui

expected_outcomes:
  - id: EO-001
    description: The Russian form uses Russian labels and fits the narrow window.
    verification:
      method: gui_screen
      detail: Step 2 shows the title "Быстрый пересчёт" and the labels "Позиция", "Местонахождение", "Подразделение", "Фактическое количество", "Причина" and the button "Отправить пересчёт"; no sideways scroll bar, no text cut at the right edge, the button is on the page.
      evidence: Screenshots of steps 2 and 4 at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: Russian-speaking storekeepers on a phone cannot use the count form.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The negative quantity is refused in Russian.
    verification:
      method: gui_screen
      detail: Step 3 shows "Количество не может быть отрицательным." at the quantity field and no result panel.
      evidence: Screenshot of step 3.
    on_fail:
      severity: MAJOR
      business_impact: The refusal is shown in English or as a raw key to a Russian-speaking user.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: The Russian result shows the confirmed count with the book, counted quantity and zero difference.
    verification:
      method: gui_screen
      detail: Step 4 shows "Пересчёт зафиксирован", "Документ" with a number, "Учётное количество" B, "Фактическое количество" B, "Расхождение" 0, "Статус" "Подтверждён"; the form before submit showed "Учётное количество" with the value B.
      evidence: Screenshots of step 4 (form and result).
    on_fail:
      severity: MAJOR
      business_impact: The count result cannot be read in Russian.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: The Kazakh form uses Kazakh labels, fits the narrow window and refuses the negative quantity in Kazakh.
    verification:
      method: gui_screen
      detail: Step 5 shows the title "Жылдам санақ" and the labels "Позиция", "Орналасу жері", "Бөлімше", "Нақты саны", "Себеп" and the button "Санақты жіберу", no sideways scroll; step 6 shows "Сан теріс болуы мүмкін емес.".
      evidence: Screenshots of steps 5 and 6 at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: Kazakh-speaking storekeepers on a phone cannot use the count form.
      suggested_action: route_to_frontend_dev
  - id: EO-005
    description: The Kazakh result shows the confirmed count.
    verification:
      method: gui_screen
      detail: Step 7 shows "Санақ тіркелді", "Құжат" with a number, "Есептік саны" B, "Нақты саны" B, "Айырмашылық" 0, "Күй" "Расталды".
      evidence: Screenshot of step 7.
    on_fail:
      severity: MAJOR
      business_impact: The count result cannot be read in Kazakh.
      suggested_action: route_to_frontend_dev
  - id: EO-006
    description: Equal-to-book counts changed no balance, and the language is restored.
    verification:
      method: gui_screen
      detail: Step 8 shows "Quick count" in English; Balances at 390 px shows the key at B (read after step 8).
      evidence: Screenshot of step 8 and of Balances.
    on_fail:
      severity: BLOCKER
      business_impact: A count that agrees with the book changed stock, or the account stays in the wrong language.
      suggested_action: route_to_backend_dev
