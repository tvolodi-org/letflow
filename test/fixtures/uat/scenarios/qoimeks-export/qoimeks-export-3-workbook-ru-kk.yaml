# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-export. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2260, PM 2026-11-19): every step is done by actor-qoimeks-qa2-storekeeper / STOREKEEPER, who downloads and exports stock in real life: the Balances, Movements and whole-stock workbook downloads are StockRead (router stock module, docs/roles.md), which STOREKEEPER holds; the administrator is not needed in this scenario (the Excel load and its screen are the administrator's, scenario 6). The refusal step uses a request without any sign-in. actors.yaml maps both qoimeks-qa2 actors to tenant/realm qoimeks-qa2 (T-2219 PM decision); live login was not exercised in this writing step; missing credentials block the affected outcomes. Precondition: the storekeeper is a tenant-wide reader; a reader restricted to one org unit gets the not-found answer for the whole-stock workbook, which is BLOCKED-by-environment, not a product failure.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, responsible-key balances, downloaded workbook bytes, movement operations and legs, document filter and selected balance/page baselines: listed in scenario preconditions. Usual-place-only and no-stock rows are conditional checks, not invented seeded fixtures; missing data blocks only the affected outcomes. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the storekeeper used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-export.
# T-2190: run title UAT qoimeks-export; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2166 (BA): Qoimeks QA walk, Russian and Kazakh texts of the export buttons, and the fixed Russian layout of the file. QA only, synthetic data. No real data, no production.
# Requirements covered: REQ-866 (criterion 3: labels and caption in en, ru, kk; wording is a UAT assumption of that requirement), REQ-865 (criterion 2: the headers are fixed Russian words of the Qoimeks layout whatever the screen language).
# Sources: web/src/modules/stock/stockMessages.ts (keys stock.balances.workbook, workbookHint, export, exportHint and the movements export keys in the three languages); docs/requirements.yaml REQ-865 and REQ-866.
# Texts below are quoted from stockMessages.ts. The wording is a UAT assumption, to be confirmed by the process owner (REQ-866 says so).
# Not UAT-observable, with reasons: (a) the two refusal banners (too many rows, reader of the whole company needed): they appear only with more than 10,000 rows or a scoped reader, and the roster has neither; covered by the component test of REQ-866 criterion 2.
# Cleanup: the browser keeps the language choice for the account, so the last step puts the language back to English.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-export-3-workbook-ru-kk
scope: qoimeks-qa2
title: >-
  The Balances screen of the Qoimeks QA tenant shows the export buttons and the caption in Russian and Kazakh, and
  the downloaded workbook keeps the same Russian Qoimeks headers in both languages
version: '1.1'
tags:
- qoimeks
- export
- xlsx
- i18n
- ru
- kk
- en
description: >-
  The storekeeper opens the Balances screen, switches the language to Russian and reads the two export buttons
  and the caption, downloads the workbook and reads its headers; switches to Kazakh and does the same; then returns
  to English. The screen texts follow the language, while the file is the same in every language: its sheet name
  and its ten headers are the Russian words of the Qoimeks import layout, because the Excel import reads those words.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The Qoimeks QA tenant has the stock module active and its synthetic stock loaded.
  check: system_seeded
  detail: >-
    If the Balances screen is empty, the buttons are still checked; report BLOCKED only for the file rows, not for
    the headers.
- description: >-
    The storekeeper's language choice is English at the start; the run drives a real browser at 1440 px and can
    read a downloaded xlsx file.
  check: system_seeded
  detail: >-
    If the language is not English at the start, switch to English first and carry on.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (username qoimeks-qa2-storekeeper), the roster STOREKEEPER, a tenant-wide reader holding StockRead (not restricted to one org unit), at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For any before/after count comparison, record the same full traversal of the balance or document list, loading
    further pages until exhausted. Do not compare a first-page count with a whole-workbook count, and do not compare
    journal operations with legs.
  check: runner_prepared
  detail: >-
    Retain the traversal/count method and sampled full keys. If another walk posts during the comparison, the equality
    outcome is BLOCKED-by-environment; do not call the first-page count a total.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2),
    opens the Balances screen, opens the language menu (the globe in the top bar) and chooses Russian. The storekeeper
    reads the title, the two export buttons and the caption.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    In Russian, the storekeeper clicks the workbook button and the run reads the sheet name and row 1 of the saved
    file.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper chooses Kazakh in the language menu and reads the title, the two export buttons and the caption.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    In Kazakh, the storekeeper clicks the workbook button and the run reads the sheet name and row 1 of the saved
    file.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper opens the Movements screen in Kazakh and reads the title and the export button.
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The storekeeper chooses English in the language menu and reads the Balances screen.
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The run sends a request for the whole-stock workbook download to the same address the "Stock workbook (Qoimeks layout)" button uses, without any sign-in
    credential, and a second one with a made-up credential that no one was given. Nothing else is sent in this step.
  expect_refusal: true
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    In Russian the Balances screen shows its export texts in Russian.
  verification:
    method: gui_screen
    detail: >-
      Step 1 shows the title "Остатки", the buttons "Выгрузить в Excel" and "Остатки для Excel (как в Qoimeks)",
      and the caption "В файл попадают все текущие остатки, независимо от фильтров и страницы на этом экране.";
      the language code reads RU; no English sentence and no raw message key such as "stock.balances.workbook".
    evidence: >-
      Screenshot of step 1.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking bookkeepers meet a half-English screen at the export.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    In Kazakh the Balances and Movements screens show their export texts in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the title "Қалдықтар", the buttons "Excel-ге жүктеу" and "Excel үшін қалдықтар (Qoimeks сияқты)",
      and the caption "Файлға барлық ағымдағы қалдықтар түседі, бұл экрандағы сүзгілер мен беттің маңызы жоқ.";
      step 5 shows the title "Қозғалыстар" and the button "Экспорт (xlsx)"; the language code reads KK; no raw message
      key.
    evidence: >-
      Screenshots of steps 3 and 5.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Kazakh-speaking users meet a half-English screen at the export.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The file does not change with the screen language.
  verification:
    method: file_content
    detail: >-
      In steps 2 and 4 the sheet name is "Остатки YYYY-MM-DD" and cells A1 to J1 read "Артикул", "Номенклатура",
      "Конечный остаток", "Зона", "Стеллаж", "Полка", "Второе место", "Место", "Ед. изм.", "Коды / Codes", the same
      in both files.
    evidence: >-
      The sheet name and row 1 read from the two saved files.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A file with Kazakh or English headers is not read by the Qoimeks Excel import.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    Switching back to English restores the English texts.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows the title "Balances", the buttons "Export to Excel" and "Stock workbook (Qoimeks layout)"; the
      language code reads EN.
    evidence: >-
      Screenshot of step 6.
  on_fail:
    severity: MINOR
    business_impact: >-
      The account is left in another language than the one the user chose.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    Stock data cannot be downloaded without a valid sign-in.
  verification:
    method: api_response
    detail: >-
      Both requests of step 7 are refused with the answer 401 (no credential, and an invalid credential); the
      answer holds no stock row, no file and no item or place name; the stock shown to the storekeeper on the Balances
      screen is unchanged afterwards.
    evidence: >-
      Status and body of both answers, with trace_id removed before the comparison.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Anyone on the network could read the warehouse stock of the tenant.
    suggested_action: route_to_elixir_dev
