# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-export. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2260, PM 2026-11-19): every step is done by actor-qoimeks-qa2-storekeeper / STOREKEEPER, who downloads and exports stock in real life: the Balances, Movements and whole-stock workbook downloads are StockRead (router stock module, docs/roles.md), which STOREKEEPER holds; the administrator is not needed in this scenario (the Excel load and its screen are the administrator's, scenario 6). The refusal step uses a request without any sign-in. actors.yaml maps both qoimeks-qa2 actors to tenant/realm qoimeks-qa2 (T-2219 PM decision); live login was not exercised in this writing step; missing credentials block the affected outcomes. Precondition: the storekeeper is a tenant-wide reader; a reader restricted to one org unit gets the not-found answer for the whole-stock workbook, which is BLOCKED-by-environment, not a product failure.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, responsible-key balances, downloaded workbook bytes, movement operations and legs, document filter and selected balance/page baselines: listed in scenario preconditions. Usual-place-only and no-stock rows are conditional checks, not invented seeded fixtures; missing data blocks only the affected outcomes. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the storekeeper used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-export.
# T-2190: run title UAT qoimeks-export; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2166 (BA): Qoimeks QA walk, export of the whole stock in the Qoimeks import layout. QA only, synthetic data (item, place and balance counts recorded at the start of the run; some opening balances negative). No real data, no production.
# Requirements covered: REQ-865 (the workbook on the server: one sheet, headers, rows, file name), REQ-866 (the button on the web Balances screen).
# Sources: docs/requirements.yaml REQ-865 and REQ-866 (criteria 1 to 3 of REQ-865, 1 and 3 of REQ-866); web/src/modules/stock/register/BalancesPage.tsx (the button, the caption, the saved file name taken from the answer);
# web/src/modules/stock/stockMessages.ts (en, ru, kk texts); web/src/modules/stock/stockRoutes.tsx (the Balances screen).
# Coverage notes (cases outside this walk and environment requirements):
#   (a) the refusals of REQ-865 criterion 1 (a reader of one org unit gets the not-found answer, a user without stock read gets 403, a query key gets 422): the roster includes actor-qoimeks-qa2-admin and actor-qoimeks-qa2-storekeeper, both holding StockRead (docs/roles.md). Restricted org-unit grants for STOREKEEPER are not confirmed by the roster; a user without StockRead is not rostered for this tenant. A query-key validation check does not require another actor and is outside these existing browser steps; covered by the router tests of the requirement.
#   (b) the cap of 10,000 rows (workbook_too_large): the synthetic stock is far below it and the test seam that lowers the cap is not reachable from the browser.
#   (c) the single cutoff across balance pages and the tenant isolation of the file: code reading and test setup with two tenants; not observable in a browser.
#   (d) the exact row count of the file: it depends on the seeded data (one row per item and place with a non-zero balance, a usual-place row with zero, one row for an item with neither); this scenario checks the count against the screen instead of a fixed number.
# Cleanup: none needed, the download writes nothing in the tenant. The downloaded file is kept only in the run's own folder.
# NOT UAT-observable on the supplied baseline: the lettered article-code variant needs a fixture the seed does not supply (usual places exist after the seed: counted at the start of the run); check preconditions first and report BLOCKED-by-environment, never manufacture them.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-export-1-stock-workbook-desktop
scope: qoimeks-qa2
title: >-
  The Qoimeks QA storekeeper downloads the whole-stock workbook in the Qoimeks import layout from the Balances
  screen, and the file has the agreed sheet name, headers and rows
version: '1.1'
tags:
- qoimeks
- export
- xlsx
- balances
- desktop
- en
description: >-
  The storekeeper opens the stock Balances screen in English at a desktop window (1440 px wide), reads the button
  "Stock workbook (Qoimeks layout)" and the caption under it, clicks it, and receives one Excel file. The file is
  opened and read: its name, its single sheet and its name, the ten column headers of row 1 and the first rows.
  The data is the synthetic stock of the tenant. The download changes nothing in the tenant: the number of stock
  documents and the balances on the screen are the same before and after. Not exercised here: the Russian and Kazakh
  screen (scenario 3), the phone width (scenario 2), the page export and the movements export (scenarios 4 and 5),
  and loading the file back (scenario 6).
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The Qoimeks QA tenant has the stock module active, and its synthetic data is loaded; record the item, place
    and balance counts at the start of the run (Items screen total, Locations total, Balances rows), and some
    opening balances are negative.
  check: system_seeded
  detail: >-
    If the Balances screen is empty, report BLOCKED for the rows outcomes and still check the button, the caption
    and the header row.
- description: >-
    The run can drive a real browser at 1440 px, English language, and can open a downloaded xlsx file and read
    its sheets and cells.
  check: system_seeded
  detail: >-
    If the downloaded file cannot be read, report BLOCKED for EO-002 to EO-004 and keep the screenshots.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (username qoimeks-qa2-storekeeper), the roster STOREKEEPER, a tenant-wide reader holding StockRead (not restricted to one org unit), at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Approval rules (explicit state, owner D-165, set by the operator before the walk and read at the start, never the default): stock_opening / approve OFF and stock_quick_count / approve ON; another state or an unreadable rule is BLOCKED-by-environment.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For the zero-stock row check, identify an existing catalog item without stock by reading its balances and record
    its code before downloading. If a usual-place row is checked, read and record its configured usual place first.
    The seeded data gives usual places to some items (read the number of such items at the start of the run and record it); a lettered article code is not supplied.
  check: runner_prepared
  detail: >-
    No zero-stock article means BLOCKED-by-environment for that outcome. The usual-place case uses an item that
    has a usual place and no stock, read from the Balances and item screens; the lettered-article case is
    BLOCKED-by-environment unless such an article already exists; do not invent or create records. The ordinary
    zero-stock check may use an item with an empty place instead.
- description: >-
    For any before/after count comparison, record the same full traversal of the balance or document list, loading
    further pages until exhausted. Do not compare a first-page count with a whole-workbook count, and do not compare
    journal operations with legs.
  check: runner_prepared
  detail: >-
    Retain the traversal/count method and sampled full keys. If another walk posts during the comparison, the equality
    outcome is BLOCKED-by-environment; do not call the first-page count a total.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2),
    in English, and opens the stock Balances screen. The storekeeper notes how many balance rows the screen shows
    and how many stock documents the Stock documents screen lists (the "before" numbers).
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper reads the two buttons above the list: "Export to Excel" and "Stock workbook (Qoimeks layout)",
    and the caption under the buttons.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper clicks "Stock workbook (Qoimeks layout)" and waits until the file is saved. While it runs
    the button shows that it is working.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The run opens the saved file and reads: the file name, the number of sheets, the name of the sheet, row 1, and
    the first three data rows. Today's date in the tenant's time zone is noted for comparison.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The run looks in the file for the three negative quantities of the synthetic data and for a row of an item that
    has no stock (a quantity of 0 with an empty place, or with only its usual place).
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The storekeeper goes back to the Balances screen and the Stock documents screen and reads the same numbers
    as in step 1 (the "after" numbers).
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The run sends a request for the whole-stock workbook download to the same address the "Stock workbook (Qoimeks layout)" button uses, without any sign-in
    credential, and a second one with a made-up credential that no one was given. Nothing else is sent in this step.
  expect_refusal: true
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    The Balances screen offers the workbook button next to the page export button, and says in a caption that the
    file always holds the whole current stock.
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows the buttons "Export to Excel" and "Stock workbook (Qoimeks layout)"; the caption reads "The workbook
      always holds the whole current stock, whatever the filters and the page on this screen."; during step 3 the
      workbook button shows its working state; no error banner appears.
    evidence: >-
      Screenshots of steps 2 and 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The bookkeepers cannot find or understand the one export they need to correct stock in Excel.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The file is named with today's date and holds exactly one sheet named after the date.
  verification:
    method: file_content
    detail: >-
      The file name is stock-YYYY-MM-DD.xlsx and the sheet name is "Остатки YYYY-MM-DD", both with today's date
      in the tenant's time zone; the workbook has one sheet and no other.
    evidence: >-
      The file name and the sheet list read from the saved file.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The file does not look like the one the Qoimeks bookkeepers know, or hides a second sheet the import does
      not expect.
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    Row 1 holds the ten Qoimeks headers in the Qoimeks order, bold, with the first row frozen.
  verification:
    method: file_content
    detail: >-
      Cells A1 to J1 read exactly "Артикул", "Номенклатура", "Конечный остаток", "Зона", "Стеллаж", "Полка", "Второе
      место", "Место", "Ед. изм.", "Коды / Codes"; the header row is bold; the pane is frozen below row 1.
    evidence: >-
      The cell values and the format read from the saved file.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The Qoimeks Excel import finds no header row starting with "Артикул" and reads nothing from the file.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    The data rows follow the layout rules, sorted by item code, with quantity as a number and negative stock shown
    as it is.
  verification:
    method: file_content
    detail: >-
      Data rows start in row 2 and are sorted by the item code in column A in ascending order; column C holds numbers
      (not text) with the three negative quantities of the synthetic data written as negative numbers; column I
      holds a unit code on every row; a place code made of a letter, an optional second letter and digits (for example RA3, which gives R, A and 3) is split
      over columns D, E and F and written whole in column H; codes that do not fit that pattern (for example A-01 and RAMP) are
      left whole in column H with D, E and F empty; an item with no stock has a row with quantity 0 and no price or value column
      anywhere in the file. The number of rows is not fixed by this scenario (UAT assumption, to be confirmed by
      the process owner), the run records it, and it is at least as large as the number of different items that
      hold stock.
    evidence: >-
      The first rows, the three negative rows and the row count read from the saved file.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Stock corrected in Excel and loaded back would be read wrongly, or a quantity would be hidden from the bookkeepers.
    suggested_action: route_to_elixir_dev
- id: EO-005
  description: >-
    The download changes nothing in the tenant.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows the same number of balance rows on the Balances screen and the same number of stock documents
      as step 1; no new document appears.
    evidence: >-
      Screenshots of steps 1 and 6.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A read-only export that writes data would change stock without anyone's decision.
    suggested_action: route_to_elixir_dev
- id: EO-006
  description: >-
    Stock data cannot be downloaded without a valid sign-in.
  verification:
    method: api_response
    detail: >-
      Both requests of step 7 are refused with the answer 401 (no credential, and an invalid credential); the
      answer holds no stock row, no file and no item or place name; the stock shown to the storekeeper on the Balances
      screen is unchanged afterwards.
    evidence: >-
      Status and body of both answers, with trace_id removed before the comparison.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Anyone on the network could read the warehouse stock of the tenant.
    suggested_action: route_to_elixir_dev
