# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-export. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2260, PM 2026-11-19): every step is done by actor-qoimeks-qa2-storekeeper / STOREKEEPER, who downloads and exports stock in real life: the Balances, Movements and whole-stock workbook downloads are StockRead (router stock module, docs/roles.md), which STOREKEEPER holds; the administrator is not needed in this scenario (the Excel load and its screen are the administrator's, scenario 6). The refusal step uses a request without any sign-in. actors.yaml maps both qoimeks-qa2 actors to tenant/realm qoimeks-qa2 (T-2219 PM decision); live login was not exercised in this writing step; missing credentials block the affected outcomes. Precondition: the storekeeper is a tenant-wide reader; a reader restricted to one org unit gets the not-found answer for the whole-stock workbook, which is BLOCKED-by-environment, not a product failure.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, responsible-key balances, downloaded workbook bytes, movement operations and legs, document filter and selected balance/page baselines: listed in scenario preconditions. Usual-place-only and no-stock rows are conditional checks, not invented seeded fixtures; missing data blocks only the affected outcomes. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the storekeeper used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-export.
# T-2190: run title UAT qoimeks-export; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2166 (BA): Qoimeks QA walk, the whole-stock workbook on a phone width of 390 px, with a filter set on the screen. QA only, synthetic data. No real data, no production.
# Requirements covered: REQ-866 (the button ignores the screen's filters and pages; the screen fits a narrow window), REQ-865 (the workbook is the whole current stock).
# Sources: docs/requirements.yaml REQ-866 (description and criterion 1), REQ-865 (description point (4), "one row per item, place and unit"); web/src/modules/stock/register/BalancesPage.tsx (onWorkbook calls the workbook route with no filter; onExport sends the screen's filters).
# The 390 px width is a browser window setting of the run, not a real phone.
# Not UAT-observable, with reasons: (a) a real phone or the mobile application: the task asks for a window width only; (b) the request sent by the button (that it carries no query key): a network detail; it is observed through its result, the file holding more rows than the filtered screen.
# Cleanup: none, read-only.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-export-2-stock-workbook-phone-filters
scope: qoimeks-qa2
title: >-
  On a phone width of 390 px the whole-stock workbook button is reachable, and with a filter set on the screen the
  file still holds the whole stock while the page export holds only the filtered page
version: '1.1'
tags:
- qoimeks
- export
- xlsx
- balances
- phone
- filters
description: >-
  The browser window is 390 px wide. The storekeeper opens the stock Balances screen, finds the two export buttons
  and the caption without sideways scrolling, narrows the list with one filter (one item), and sees the list shrink.
  Then the storekeeper downloads the workbook with "Stock workbook (Qoimeks layout)": the file must hold the whole
  stock, not the filtered item only. After that the storekeeper downloads "Export to Excel": this file holds the
  filtered rows only. The two files are compared by their row counts. Not exercised here: the headers of the files
  (scenarios 1 and 4).
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The Qoimeks QA tenant has the stock module active and its synthetic stock loaded; at least two different items
    hold stock.
  check: system_seeded
  detail: >-
    If fewer than two items hold stock, report BLOCKED for EO-002.
- description: >-
    The run can drive a real browser at a window width of 390 px, English language, and can open a downloaded xlsx
    file and count its rows.
  check: system_seeded
  detail: >-
    If the width cannot be set or the file cannot be read, report BLOCKED for the steps affected and keep the screenshots.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (username qoimeks-qa2-storekeeper), the roster STOREKEEPER, a tenant-wide reader holding StockRead (not restricted to one org unit), at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Approval rules (explicit state, owner D-165, set by the operator before the walk and read at the start, never the default): stock_opening / approve OFF and stock_quick_count / approve ON; another state or an unreadable rule is BLOCKED-by-environment.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    For any before/after count comparison, record the same full traversal of the balance or document list, loading
    further pages until exhausted. Do not compare a first-page count with a whole-workbook count, and do not compare
    journal operations with legs.
  check: runner_prepared
  detail: >-
    Retain the traversal/count method and sampled full keys. If another walk posts during the comparison, the equality
    outcome is BLOCKED-by-environment; do not call the first-page count a total.
steps:
- step: 1
  actor: storekeeper
  action: >-
    In a window 390 px wide, the storekeeper signs in in English, opens the navigation, chooses Balances and reads
    the screen: the two export buttons, the caption, the list.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper sets the item filter to the item of the first balance row (an item that holds stock) and reads how
    many balance rows remain.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    With the filter still set, the storekeeper clicks "Stock workbook (Qoimeks layout)" and waits until the file
    is saved. The run counts the data rows of the file and notes the item codes in column A.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    With the filter still set, the storekeeper clicks "Export to Excel" and waits until the file is saved. The
    run counts the rows of the sheet that holds the balances and notes the item codes.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper reads the screen again: the filter is still set, the filtered rows are still listed, and no
    error banner is shown.
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The run sends a request for the whole-stock workbook download and the Balances page export to the same address the "Stock workbook (Qoimeks layout)" button uses, without any sign-in
    credential, and a second one with a made-up credential that no one was given. Nothing else is sent in this step.
  expect_refusal: true
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    On a phone width the Balances screen fits the window and both export buttons and the caption can be read and
    pressed.
  verification:
    method: gui_screen
    detail: >-
      At 390 px nothing is cut off at the right edge, no sideways scrolling is needed to reach either button, the
      caption is readable, and no control overlaps another.
    evidence: >-
      Screenshots of steps 1 and 2.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A storekeeper with a phone cannot start the export.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The whole-stock workbook ignores the filter of the screen.
  verification:
    method: file_content
    detail: >-
      The workbook of step 3 holds the rows of more than one item (the item codes of column A are not only the filtered
      item) and has more data rows than the filtered list of step 2 shows; its sheet name and headers are those
      of scenario 1.
    evidence: >-
      The row count and the item codes read from the file of step 3, and the row count of the screen in step 2.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A bookkeeper who corrects the stock in Excel gets a file with one item and, loading it back, would treat every
      other item as missing.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The page export keeps the filter of the screen.
  verification:
    method: file_content
    detail: >-
      The file of step 4 is named stock-balances.xlsx and holds only rows of the filtered item; its row count equals
      the filtered list of step 2 (the list is one page long here).
    evidence: >-
      The row count and the item codes read from the file of step 4.
  on_fail:
    severity: MINOR
    business_impact: >-
      The page export no longer matches what the user sees.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    Both downloads leave the screen as it was.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows the filter still set, the same filtered rows, and no error banner.
    evidence: >-
      Screenshot of step 5.
  on_fail:
    severity: MINOR
    business_impact: >-
      A successful download disturbs the user's work on the screen.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    Stock data cannot be downloaded without a valid sign-in.
  verification:
    method: api_response
    detail: >-
      Both requests of step 6 are refused with the answer 401 (no credential, and an invalid credential); the
      answer holds no stock row, no file and no item or place name; the stock shown to the storekeeper on the Balances
      screen is unchanged afterwards.
    evidence: >-
      Status and body of both answers, with trace_id removed before the comparison.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Anyone on the network could read the warehouse stock of the tenant.
    suggested_action: route_to_elixir_dev
