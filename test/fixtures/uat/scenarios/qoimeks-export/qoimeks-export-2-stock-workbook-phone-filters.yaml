# T-2166 (BA): Qoimeks QA walk, the whole-stock workbook on a phone width of 390 px, with a filter set on the screen. QA only, synthetic data. No real data, no production.
# Requirements covered: REQ-866 (the button ignores the screen's filters and pages; the screen fits a narrow window), REQ-865 (the workbook is the whole current stock).
# Sources: docs/requirements.yaml REQ-866 (description and criterion 1), REQ-865 (description point (4), "one row per item, place and unit"); web/src/modules/stock/register/BalancesPage.tsx (onWorkbook calls the workbook route with no filter; onExport sends the screen's filters).
# The 390 px width is a browser window setting of the run, not a real phone.
# Not UAT-observable, with reasons: (a) a real phone or the mobile application: the task asks for a window width only; (b) the request sent by the button (that it carries no query key): a network detail; it is observed through its result, the file holding more rows than the filtered screen.
# Cleanup: none, read-only.
---
id: qoimeks-export-2-stock-workbook-phone-filters
scope: qoimeks-qa
title: On a phone width of 390 px the whole-stock workbook button is reachable, and with a filter set on the screen the file still holds the whole stock while the page export holds only the filtered page
version: "1.0"
tags: [qoimeks, export, xlsx, balances, phone, filters]

description: >
  The browser window is 390 px wide. The administrator opens the stock Balances screen, finds the two export buttons and the caption without sideways scrolling, narrows the list with one filter
  (one item), and sees the list shrink. Then the administrator downloads the workbook with "Stock workbook (Qoimeks layout)": the file must hold the whole stock, not the filtered item only.
  After that the administrator downloads "Export to Excel": this file holds the filtered rows only. The two files are compared by their row counts.
  Not exercised here: the headers of the files (scenarios 1 and 4).

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant has the stock module active and its synthetic stock loaded; at least two different items hold stock.
    check: system_seeded
    detail: If fewer than two items hold stock, report BLOCKED for EO-002.
  - description: The run can drive a real browser at a window width of 390 px, English language, and can open a downloaded xlsx file and count its rows.
    check: system_seeded
    detail: If the width cannot be set or the file cannot be read, report BLOCKED for the steps affected and keep the screenshots.

steps:
  - step: 1
    actor: admin
    action: >
      In a window 390 px wide, the administrator signs in in English, opens the navigation, chooses Balances and reads the screen: the two export buttons, the caption, the list.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator sets the item filter to one item that holds stock (the first item of the list) and reads how many balance rows remain.
    via: ui
  - step: 3
    actor: admin
    action: >
      With the filter still set, the administrator clicks "Stock workbook (Qoimeks layout)" and waits until the file is saved. The run counts the data rows of the file and notes the item codes in column A.
    via: ui
  - step: 4
    actor: admin
    action: >
      With the filter still set, the administrator clicks "Export to Excel" and waits until the file is saved. The run counts the rows of the sheet that holds the balances and notes the item codes.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator reads the screen again: the filter is still set, the filtered rows are still listed, and no error banner is shown.
    via: ui

expected_outcomes:
  - id: EO-001
    description: On a phone width the Balances screen fits the window and both export buttons and the caption can be read and pressed.
    verification:
      method: gui_screen
      detail: At 390 px nothing is cut off at the right edge, no sideways scrolling is needed to reach either button, the caption is readable, and no control overlaps another.
      evidence: Screenshots of steps 1 and 2.
    on_fail:
      severity: MAJOR
      business_impact: A storekeeper with a phone cannot start the export.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The whole-stock workbook ignores the filter of the screen.
    verification:
      method: file_content
      detail: The workbook of step 3 holds the rows of more than one item (the item codes of column A are not only the filtered item) and has more data rows than the filtered list of step 2 shows; its sheet name and headers are those of scenario 1.
      evidence: The row count and the item codes read from the file of step 3, and the row count of the screen in step 2.
    on_fail:
      severity: MAJOR
      business_impact: A bookkeeper who corrects the stock in Excel gets a file with one item and, loading it back, would treat every other item as missing.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: The page export keeps the filter of the screen.
    verification:
      method: file_content
      detail: The file of step 4 is named stock-balances.xlsx and holds only rows of the filtered item; its row count equals the filtered list of step 2 (the list is one page long here).
      evidence: The row count and the item codes read from the file of step 4.
    on_fail:
      severity: MINOR
      business_impact: The page export no longer matches what the user sees.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: Both downloads leave the screen as it was.
    verification:
      method: gui_screen
      detail: Step 5 shows the filter still set, the same filtered rows, and no error banner.
      evidence: Screenshot of step 5.
    on_fail:
      severity: MINOR
      business_impact: A successful download disturbs the user's work on the screen.
      suggested_action: route_to_frontend_dev
