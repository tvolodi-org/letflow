# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-export. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2260, PM 2026-11-19): actor-qoimeks-qa2-storekeeper / STOREKEEPER downloads the whole-stock workbook (StockRead, which STOREKEEPER holds) and is the actor of the refusal step; actor-qoimeks-qa2-admin / TENANT_ADMIN does the check on the screen "Load balances from Excel", because that screen and the Balances button that opens it need StockQuickCount, which STOREKEEPER does not hold (stock manifest role_grants in lib/letflow/modules/stock/stock.ex, route guard in web/src/modules/stock/stockRoutes.tsx, docs/roles.md). The admin never presses the write control. actors.yaml maps both to tenant/realm qoimeks-qa2 (T-2219 PM decision); live login not exercised in this writing step; missing credentials block the affected outcomes. Precondition: the storekeeper is a tenant-wide reader (a scoped reader gets the not-found answer for the whole-stock workbook: BLOCKED-by-environment).
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, responsible-key balances, downloaded workbook bytes, movement operations and legs, document filter and selected balance/page baselines: listed in scenario preconditions. Usual-place-only and no-stock rows are conditional checks, not invented seeded fixtures; missing data blocks only the affected outcomes. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2, storekeeper and administrator); acceptance must use title UAT qoimeks-export.
# T-2190: run title UAT qoimeks-export; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2166 (BA): Qoimeks QA walk, the downloaded whole-stock workbook is read back by the check of "Load balances from Excel" (check only, nothing is written). QA only, synthetic data. No real data, no production.
# Requirements covered: REQ-865 (the file reads back by the Qoimeks import rules), REQ-884 (the check writes nothing), REQ-887 (the web screen "Загрузка остатков из Excel": check result, remarks in Russian).
# Sources: docs/requirements.yaml REQ-865 criterion 4 (round trip), REQ-884 and REQ-887 (titles: check a Qoimeks-layout workbook, write nothing; screen to check a workbook and show the Russian remarks); web/src/modules/stock/workbook/workbookMessages.ts (en: "Load balances from Excel", button "Check workbook", "Check", "Remarks", "No balance differs from the file.", "Write balances from the file"; ru: title "Загрузка остатков из Excel", "No differences" text "В файле нет отличий от текущих остатков.");
# web/src/modules/stock/stockRoutes.tsx (route admin/stock/workbook-import).
# This scenario NEVER presses "Write balances from the file" (the write creates a stock document, so it would change tenant data); the run stops after the check.
# #4696 / #4784 (T-2260): the unchanged downloaded workbook has R data rows. The first applicable rule wins per article (REQ-884 criterion 3; StockWorkbookImport.process/4 and placed/6): since T-2303 (#4809, #4824) an article with a bad quantity gets that rule first (bad_qty_remark/2: R12 for a negative quantity, R1 for text), and the download keeps the signed quantity of a negative balance (negative rows are counted from the downloaded file, scripts/pilot/qoimeks_gen.py seeds a few), so every negative row gives an R12 remark (no R1) and never an R7 remark for that article (T-2367, #4888). Every other article that is not stopped earlier (unknown article R8, lot/serial/expiry R9, amount without place R5, place without zone R3, unknown place R6) and whose stock is held with a responsible employee gets one R7 remark at its first row. Zero changes. Responsible stock is excluded, so this does not prove plain-key equality. The numbers are derived from the downloaded file at the start of the run, never hard-coded.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-export-6-workbook-check-roundtrip
scope: qoimeks-qa2
title: >-
  The whole-stock workbook downloaded from the Balances screen is accepted by the check of "Load balances from Excel",
  the rows are read, the remarks are in Russian, and nothing is written
version: '1.1'
tags:
- qoimeks
- export
- xlsx
- import
- roundtrip
- ru
- en
description: >-
  The storekeeper downloads the unchanged whole-stock workbook; the administrator checks it against QOI-OU-1. The
  workbook has R data rows (read from the file). The check shows zero changes, one remark of rule R12 for every row
  whose quantity is negative (a negative balance is not loaded and the system balance stays as it is; since the
  bad-quantity rule runs before the responsible-stock rule R7, such an article has no R7 remark), no remark of rule R1,
  and one remark of rule R7 for every other stocked article with a responsible employee that
  no earlier rule stops. The write control stays disabled; no load is made. Record the history before and after and re-read balances. This is an exclusion check
  for responsible stock, not evidence that the import can set those balances. Repeat the required language and viewport
  checks with the same bytes.
actors:
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant has the stock module active with its synthetic stock, the screen "Load balances from Excel"
    is available to the administrator, and at least one org unit exists to choose.
  check: system_seeded
  detail: >-
    If the screen or the org unit choice is not available, report BLOCKED for the whole scenario and name what is
    missing.
- description: >-
    The run can drive a real browser at 1440 px, can upload a file saved by the previous step, and can read the
    screen text.
  check: system_seeded
  detail: >-
    If the file cannot be chosen in the browser, report BLOCKED for steps 3 to 6.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (username qoimeks-qa2-storekeeper), the roster STOREKEEPER, a tenant-wide reader holding StockRead, for the download (step 1), and as actor-qoimeks-qa2-admin (username qoimeks-qa2-admin), the roster TENANT_ADMIN, for the check (steps 2 to 6), at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. The item, place and non-zero balance counts are read at the start of the run (the seed changes them); every seeded
    balance carries a responsible employee, one org unit QOI-OU-1. Approval rules (explicit state, owner D-165, set by the operator before the walk and read at the start, never the default): stock_opening / approve OFF and stock_quick_count / approve ON; another state or an unreadable rule is BLOCKED-by-environment.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    Read the current workbook and balances before checking. This round trip needs the unchanged synthetic
    baseline: R workbook data rows, N data rows with a negative quantity and the stocked articles with their rows, all
    counted from the downloaded file at the start of the run (the seed changes them, so no fixed number is used), with responsible balances in QOI-OU-1.
  check: runner_prepared
  detail: >-
    Record from the downloaded file: R (data rows), the data rows with a negative quantity and their articles (N1 rows, N2 distinct articles), and the stocked articles that hold a responsible employee and are not stopped by an earlier rule (read the place, zone and tracking columns; items tracked by lot, serial or expiry give R9, so read their tracking on the item card). The expected R12 remarks equal N1 and the expected R1 remarks equal 0; the expected R7 remarks equal the number of those articles that have no negative row (one per article). If another run changed the baseline so that the file cannot be classified, BLOCKED-by-environment for the count outcomes. Keep actual counts
    in evidence; do not remove responsible employees or alter stock to make the check clean.
- description: >-
    For any before/after count comparison, record the same full traversal of the balance or document list, loading
    further pages until exhausted. Do not compare a first-page count with a whole-workbook count, and do not compare
    journal operations with legs.
  check: runner_prepared
  detail: >-
    Retain the traversal/count method and sampled full keys. If another walk posts during the comparison, the equality
    outcome is BLOCKED-by-environment; do not call the first-page count a total.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2),
    in English, opens the Balances screen, notes the number of balance rows, and clicks "Stock workbook (Qoimeks
    layout)" to save the file; the file is kept for the administrator's check in step 3. The run reads from the file R, the rows with a negative quantity and the other counts listed in the preconditions.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator signs in to the same tenant and opens "Load balances from Excel" and records the existing load history before selecting a
    file. They read the org-unit selector and file field.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator selects QOI-OU-1, uploads the unchanged downloaded workbook and presses "Check".
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator reads the check summary (rows read, changed, unchanged, remarks), the remarks and the list
    of changes if shown, and counts the remarks that say a negative balance is not loaded (R12), those that name a quantity that is not a quantity (R1) and those that say the
    stock is kept separately by units, responsible employees, lots or units of measure (R7).
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator switches the language to Russian, repeats the check on the same file and reads the summary
    and the remarks again.
  via: ui
- step: 6
  actor: admin
  action: >-
    The administrator compares the previous-load history with the history recorded before Check, re-reads the same
    balance rows on Balances and confirms quantities and responsible employees are unchanged. They do not write
    the workbook, then restore English.
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The storekeeper, signed in, looks at the Balances screen for the button that opens "Load balances from Excel" and
    then types the address of that screen (the path admin/stock/workbook-import) into the browser. No file is chosen and nothing is sent.
  expect_refusal: true
  via: ui
- step: 8
  actor: storekeeper
  action: >-
    The run sends a request for the whole-stock workbook download without any sign-in credential, and a second one with
    a made-up credential that no one was given. Nothing else is sent in this step.
  expect_refusal: true
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    The check accepts the file produced by the export and reads its rows.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows a check result with the sheet that was read (the sheet named "Остатки YYYY-MM-DD") and "Rows
      read" greater than 0, no refusal for a missing "Артикул" header, no message that the file is not a valid workbook,
      and no raw message key.
    evidence: >-
      Screenshot of step 4.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The workbook the system exports cannot be loaded back, so the correct-in-Excel flow the bookkeepers rely on
      is broken.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: >-
    The synthetic workbook produces the expected exclusions without changes, in the order of the rules.
  verification:
    method: gui_screen
    detail: >-
      The check reads R data rows (REQ-884) and finds zero changes. Each negative-quantity row has an R12 remark in Russian
      (as many as N1, read from the file; wording: отрицательный остаток "<value>" не загружается, учётный остаток остаётся как есть. Остатки этого товара в системе не изменяются), there is no R1 remark (0 of them), and its article has no R7 remark (the first applicable rule wins, REQ-884
      criterion 3). Each other article that holds a responsible employee and is not stopped by an earlier rule has exactly one
      R7 remark in Russian (as many as derived from the file in the preconditions). Any other remark (R3, R5, R6, R8, R9) is
      explained by the file or the item card; none is unexplained. The no-change message is shown and writing is
      disabled. Unchanged is recorded as displayed; skipped articles are not a successful equality comparison.
    evidence: >-
      Screenshots of steps 4 and 5.
  on_fail:
    severity: MINOR
    business_impact: >-
      Russian-speaking bookkeepers cannot read why an article was refused, or are told the wrong reason.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The check writes nothing.
  verification:
    method: gui_screen
    detail: >-
      In step 6 the list of earlier loads is the same as before the check (empty, or without a new line), and the
      Balances screen shows the same number of rows as in step 1.
    evidence: >-
      Screenshots of step 6 and step 1.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A check that writes would change stock before anyone has decided to.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    The storekeeper cannot open the Excel load screen and stock data is not downloadable without a sign-in.
  verification:
    method: gui_screen
    detail: >-
      In step 7 the Balances screen shows no button that opens "Load balances from Excel" and the typed address does not
      show the upload form (the access guard answers instead); in step 8 both requests are refused with the answer 401
      and hold no stock row or file. Nothing is changed: the load history and the Balances rows are as recorded in step 1.
    evidence: >-
      Screenshots of step 7, status and body of both answers of step 8 (trace_id removed before comparing).
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A role without the right to load stock could change the stock of the tenant, or stock data could leave the system
      without a sign-in.
    suggested_action: route_to_elixir_dev
