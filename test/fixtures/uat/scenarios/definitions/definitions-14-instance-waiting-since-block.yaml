# T-1725 (BA, batch 11 item 5 of docs/uat/ba-decisions/T-1707.md): the "Waiting since" block on the page of one running instance (T-1705, REQ-812, commit b5f2530ec, PR #4248).
# Sources: docs/requirements.yaml REQ-812 W1 (shown only while the instance is running), W3 and W4 (time of the row = the recorded entry time of the waiting step; elapsed in whole hours and minutes, "under 1 min" below a minute),
# W5 (elapsed text moves at least every 60 seconds with no new request), W6 (states), W8 (en, ru, kk), W9 (a section with a heading, a list, a time element); web/src/components/instances/InstanceWaitingSince.tsx
# (title, "Since <time>", "waiting <elapsed>", "No recorded step is waiting."); web/src/i18n/processDiagramMessages.ts (every text below is quoted from its en, ru, kk entries "processDiagram.waiting.*");
# web/src/router.tsx (the route instances/:id has no route guard: the API read decides) and docs/roles.md (InstancesRead is held by TASK_WORKER, so the least role is a plain worker).
# Instances: the setup-prepared instances I-new (running, "Prepare" completed, "Approve" open) and I-done (finished) of scenario definitions-12 (designer_live of SwiftRoute).
# NOT UAT-OBSERVABLE here: an elapsed time read against a fixed, seeded entry time. The entry time of a step is the clock at the moment the step is entered; the UAT seed has no way to set it, so the exact elapsed value
#   is checked against the reader's own clock and the Replay time of the same step instead (see test/fixtures/uat/scenario-env-limitations/definitions-14-instance-waiting-since-block.yaml, GAP for the fixed-time half);
#   two parallel branches, a join with one arrival, a loop (needs other definitions; web/src/utils/canvas/__tests__/instanceReplay.waiting.test.ts covers them); the loading, read-error, 25-page-cap states (need a failing or huge history);
#   the first-entry-not-Start notice (the instance I-old of definitions-12 covers it only if one exists; not required here); the 60-second move of the elapsed text is observed by waiting, step 6.
# The other company's refusal of the instance page is also checked in definitions-13 (step 3); here it is repeated for the block only.
# The kk texts are machine drafts until the owner's native check.
---
id: definitions-14-instance-waiting-since-block
scope: definitions
title: "A worker opens a running instance and sees which step waits, since when and for how long; a finished instance shows no waiting block; the text is read in three languages"
version: "1.0"
tags: [definitions, process-designer, instance, waiting-since, node-entered, accessibility, ru, kk, en]

description: >
  SwiftRoute's ops manager, an ordinary worker, opens the page of the running instance I-new, which waits at "Approve". Under the line
  "Active tokens" in the definition section she finds a block titled "Waiting since" with one row: "Approve", "Since <date and time>"
  and "waiting <h> h <m> min". The time is the same as the time of the step "Approve" in the Replay of the same instance, and the
  elapsed time agrees with her own clock to within a minute. A minute later the elapsed text has moved on without the page being
  reloaded. On the finished instance I-done the block is absent. The block is read in Russian and Kazakh. The administrator of
  another company gets the application's "not found" page for the instance and sees no block.

actors:
  worker: actor-swiftroute-marco
  other_admin: actor-bilimbaga-admin

preconditions:
  - description: SwiftRoute has the setup-prepared instances I-new (running, waiting at "Approve") and I-done (finished) of scenario definitions-12, both started after the step recording reached QA
    check: system_seeded
    detail: Setup-prepared by the operator; this scenario starts nothing. If I-new is missing, report BLOCKED for the scenario and say so; if only I-done is missing, step 5 is BLOCKED.
  - description: The "Waiting since" block is deployed on QA (commit b5f2530ec, PR #4248)
    check: custom
    detail: If the page of a running instance has no block titled "Waiting since", report BLOCKED, not PASS.
  - description: The worker's own clock (the reader's clock) is correct to within one minute
    check: custom
    detail: Needed for the elapsed comparison in steps 2 and 3. The exact entry time cannot be fixed by the seed; see the GAP sidecar.
  - description: The Bilimbaga administrator can sign in
    check: system_seeded
    detail: If not, report BLOCKED for step 7.

steps:
  - step: 1
    actor: worker
    action: >
      The worker opens the page of the running instance I-new and finds the definition section with the line "Active tokens". She reads what is directly below that line.
    via: ui
  - step: 2
    actor: worker
    action: >
      The worker notes the time and the elapsed text of the row, and the time on her own clock at that moment. Then she opens the Graph tab, presses "Replay", presses "Last step" and reads the time of the step "Approve" in the list "Recorded steps".
    via: ui
  - step: 3
    actor: worker
    action: >
      The worker goes back to the instance page, keeps it open without reloading and without any other action for at least 65 seconds, and then reads the elapsed text of the row again together with her own clock.
    via: ui
  - step: 4
    actor: worker
    action: >
      Using only the keyboard, the worker moves through the page to the block and reads it with the screen reader's heading list and list navigation (or, if none is at hand, reads the page's accessibility tree).
    via: ui
  - step: 5
    actor: worker
    action: >
      The worker opens the page of the finished instance I-done and looks for the block "Waiting since" in the definition section.
    via: ui
  - step: 6
    actor: worker
    action: >
      The worker opens I-new again, sets the interface language to Russian and then to Kazakh and reads the block in each language, then sets the language back to English.
    via: ui
  - step: 7
    actor: other_admin
    action: >
      The Bilimbaga administrator types the address of the SwiftRoute instance I-new into the browser.
    expect_refusal: true
    via: ui

expected_outcomes:
  - id: EO-001
    description: The page of a running instance shows a "Waiting since" block with one row for the step that waits.
    verification:
      method: gui_screen
      detail: >
        Step 1 shows, directly below the line "Active tokens", a section with the heading "Waiting since" and a list of exactly one row: the step name "Approve", the text "Since <date and time with seconds>"
        and the text "waiting <elapsed>". The list holds no row for "Start" or "Prepare" (they are left) and none for the end (not reached). No banner is shown (the steps are recorded).
      evidence: Screenshot of step 1.
    on_fail:
      severity: MAJOR
      business_impact: A worker cannot see on the instance page where the document waits and has to open the Replay.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The time of the row is the recorded entry time of the step, and the elapsed text is the time since then.
    verification:
      method: gui_screen
      detail: >
        Step 2: the "Since" time of the row equals, to the second, the time of the step "Approve" in the Replay list. The elapsed text is in whole hours and minutes ("<h> h <m> min", or "<m> min" below one hour,
        or "under 1 min" below one minute) and equals the difference between the reader's clock at that moment and the "Since" time, within one minute.
      evidence: Screenshots of steps 1 and 2 with the reader's clock noted.
    on_fail:
      severity: MAJOR
      business_impact: The page shows a wrong waiting time, so a delay is missed or invented.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: The elapsed text moves on by itself while the page stays open.
    verification:
      method: gui_screen
      detail: >
        Step 3: after at least 65 seconds the elapsed text is at least one minute longer than in step 2 (still agreeing with the reader's clock within one minute), the "Since" time is unchanged, and the page was not reloaded
        (the browser's network panel, if looked at, shows no new request caused by the change of text).
      evidence: Screenshots of steps 2 and 3 with the reader's clock noted.
    on_fail:
      severity: MINOR
      business_impact: A page left open shows a stale waiting time.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: The block is a headed section with a list and a machine-readable time, and the elapsed text is readable by a screen reader.
    verification:
      method: gui_screen
      detail: >
        Step 4: the accessibility tree shows a region named "Waiting since", a list with one item, and a time element whose datetime value is the same moment as the "Since" time; the elapsed text is not hidden from
        assistive technology and is not a live region. The block can be reached with the Tab and arrow keys without a pointer.
      evidence: Accessibility tree or inspector excerpt.
    on_fail:
      severity: MINOR
      business_impact: A screen-reader user cannot find or read the waiting time.
      suggested_action: route_to_frontend_dev
  - id: EO-005
    description: A finished instance shows no waiting block.
    verification:
      method: gui_screen
      detail: Step 5 shows the page of I-done with no section titled "Waiting since" and no text "No recorded step is waiting." in its place.
      evidence: Screenshot of step 5.
    on_fail:
      severity: MAJOR
      business_impact: A finished document looks as if it still waits.
      suggested_action: route_to_frontend_dev
  - id: EO-006
    description: The block is in Russian and in Kazakh, with no English fallback.
    verification:
      method: gui_screen
      detail: >
        Step 6 shows in Russian "Ожидает с", "С <время>" and "ожидает <n> ч <m> мин" (or "<m> мин", or "меньше 1 мин"); in Kazakh "Күтуде", "<уақыт> бастап" and "күтуде: <n> сағ <m> мин" (or "<m> минут", or "1 минуттан аз").
        No text of the block is English and no message key is shown. A wording remark on the Kazakh text is a MINOR note.
      evidence: Screenshots in the two languages.
    on_fail:
      severity: MINOR
      business_impact: A Russian- or Kazakh-speaking worker sees English or raw keys.
      suggested_action: route_to_frontend_dev
  - id: EO-007
    description: Another company's administrator gets "not found" for the instance and sees nothing of the block.
    verification:
      method: gui_screen
      detail: Step 7 shows the application's "not found" page or a not-found message, with no heading "Waiting since", no step name and no time of SwiftRoute's instance.
      evidence: Screenshot of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: One company can see where another company's documents wait.
      suggested_action: route_to_security_review
