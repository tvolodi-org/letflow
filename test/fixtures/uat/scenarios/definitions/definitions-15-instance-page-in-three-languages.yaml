# T-1773 (BA): the instance page in Russian and Kazakh (ru/kk completeness sweep T-1753, commit d4370dd25, PR #4285).
# Sources: web/src/pages/instances/instanceDetailMessages.ts (every text below is quoted from its en, ru, kk catalogue; the title, the "Last refreshed" line, the Refresh button, the field table rows,
# the "Definition Snapshot" block, "Variables", "Active Tasks", the three tabs and the graph heading); web/src/pages/instances/InstanceDetailPage.tsx (which block shows which text);
# docs/assets/i18n-gaps.md section "ru/kk completeness sweep of screens changed since 2026-11-09 (T-1753)" (the kk table is a machine draft until the owner's native check; the list of panels that are still English).
# Instance: I-new of scenario definitions-12 (running; "Prepare" completed, "Approve" open). Other company: actor-bilimbaga-admin, as in definitions-13.
# KNOWN, NOT A FAILURE HERE (the gaps file lists them as follow-up, not changed since 2026-11-09): the History tab's panel (filter "All types", "Loading event history...", column headers Type, Actor, Time, Payload),
# the Timeline tab's texts ("Loading timeline...", "No timeline entries found."), the loading text of the history slider, the attachments panel texts ("No attachments yet.") and the dependency panel ("No dependencies recorded for this case.").
# Step 6 reads them and records which remain English; it neither passes nor fails the scenario on them.
# NOT UAT-OBSERVABLE (header kept so it survives the merge): the failure texts (cancel failed, timeline failed to load: they need a server fault); the empty states of the field table and "No active tasks."
# (a running instance with no open task cannot be prepared; covered by web/src/pages/instances/__tests__/InstanceDetailPage.locale.test.tsx); the Cancel button (not pressed: cancelling the shared instance would break definitions-12).
# The kk texts are machine drafts: a wording remark is a MINOR finding, an English or missing text in a block listed in the expected outcome is not.
# Sensitive actions in this flow: seeing another company's data (step 7 refusal); the others (approve, pay, change users) do not occur in a read-only page.
---
id: definitions-15-instance-page-in-three-languages
scope: definitions
title: "The administrator reads an instance page in English, Russian and Kazakh and finds the headings, table, tabs and buttons translated; another company cannot open it"
version: "1.0"
tags: [definitions, instance, i18n, ru, kk, en, refusal, cross-tenant, inv-5]

description: >
  SwiftRoute's administrator opens a running instance and reads its page in English: the title, the "Last refreshed" line,
  the Refresh button, the table of fields (definition, status, active nodes, started, last updated), the block with the
  definition snapshot, the variables, the list of active tasks and the three tabs Graph, History and Timeline. She switches the
  interface language to Russian and to Kazakh and finds the same texts in each language, none shown as a raw key, none cut off
  and none left in English (except the panels that the sweep records as still English). She presses Refresh and sees the busy
  text in the chosen language. The Bilimbaga administrator opens the SwiftRoute instance's address and gets the application's
  "not found" page.

actors:
  admin: actor-swiftroute-alice
  other_admin: actor-bilimbaga-admin

preconditions:
  - description: The instance I-new of scenario definitions-12 exists (running, with an open task "Approve")
    check: system_seeded
    detail: If it does not, report BLOCKED for the scenario. Do not start an instance to prepare it.
  - description: The ru/kk sweep of the instance page is deployed on QA (commit d4370dd25, PR #4285)
    check: custom
    detail: If the title of the page in Russian is still "Instance", report BLOCKED (build not on QA), not FAIL.
  - description: The Bilimbaga administrator can sign in
    check: system_seeded
    detail: If not, report BLOCKED for step 7.

steps:
  - step: 1
    actor: admin
    action: >
      With the interface language set to English, the administrator opens the instance I-new from the Instances list and reads
      the page from the top: the title, the refresh line and button, the table, the snapshot block, the variables, the active tasks
      and the three tabs. She notes the address of the page.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator sets the interface language to Russian and reads the same page again.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator sets the interface language to Kazakh and reads the same page again.
    via: ui
  - step: 4
    actor: admin
    action: >
      In Kazakh, the administrator presses the refresh button once and reads the button while the page refreshes and the refresh line afterwards.
    via: ui
  - step: 5
    actor: admin
    action: >
      In Russian, the administrator presses each of the three tabs in turn (Graph, History, Timeline) and reads the heading of each.
    via: ui
  - step: 6
    actor: admin
    action: >
      In Russian and then in Kazakh, the administrator reads the panels below the tabs on the History and Timeline tabs, and notes every text that is still English.
    via: ui
  - step: 7
    actor: other_admin
    action: >
      The Bilimbaga administrator types the address from step 1 into the browser (in English) and reads what the page shows.
    expect_refusal: true
    via: ui
  - step: 8
    actor: admin
    action: >
      The SwiftRoute administrator sets the interface language back to English and reads the page of I-new again.
    via: ui

expected_outcomes:
  - id: EO-001
    description: The English page shows the headings, the table and the three tabs.
    verification:
      method: gui_screen
      detail: >
        Step 1: the title "Instance"; the line "Last refreshed: <time>" (or "Not yet refreshed") and the button "Refresh"; a table with the columns "Field" and "Value" and rows
        "Definition", "Status", "Active nodes", "Started at", "Last updated"; the block "Definition Snapshot" with "Definition ID", "Source" and "Active tokens"; the heading "Variables";
        the heading "Active Tasks" with the columns "Task ID", "Node", "Name", "Assignee", "Created" and a row for "Approve"; the tabs "Graph", "History" and "Timeline".
      evidence: Screens of step 1.
    on_fail:
      severity: MAJOR
      business_impact: The baseline the translations are checked against is broken, or the page lost content.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The Russian page has every one of those texts in Russian.
    verification:
      method: gui_screen
      detail: >
        Step 2: the title "Экземпляр"; "Обновлено: <время>" (or "Ещё не обновлялось") and the button "Обновить"; the table columns "Поле" and "Значение" and the rows "Определение", "Статус",
        "Активные узлы", "Запущен", "Обновлён"; the block "Снимок определения" with "ID определения", "Источник" and "Активные токены"; "Переменные"; "Активные задачи" with the columns
        "ID задачи", "Узел", "Название", "Исполнитель", "Создана"; the tabs "Граф", "История", "Хронология". No text of this list is English, shown as a key or cut off.
        The values that come from the process itself (the task name "Approve", the definition's own names) stay as the designer wrote them and are not a finding.
      evidence: Screens of step 2.
    on_fail:
      severity: MAJOR
      business_impact: A Russian-speaking administrator sees English or broken text on the instance page.
      suggested_action: route_to_wf03
  - id: EO-003
    description: The Kazakh page has every one of those texts in Kazakh, and not a copy of the Russian.
    verification:
      method: gui_screen
      detail: >
        Step 3: the title "Дана"; "Соңғы жаңарту: <уақыт>" (or "Әлі жаңартылған жоқ") and the button "Жаңарту"; the table columns "Өріс" and "Мәні" and the rows "Анықтама", "Күйі",
        "Белсенді түйіндер", "Іске қосылды", "Соңғы жаңартылуы"; the block "Анықтама көшірмесі" with "Анықтама ID", "Дереккөз" and "Белсенді токендер"; "Айнымалылар"; "Белсенді тапсырмалар" with the columns
        "Тапсырма ID", "Түйін", "Атауы", "Орындаушы", "Құрылды"; the tabs "Сызба", "Тарих", "Уақыт шкаласы". No text of this list is English or Russian, shown as a key or cut off.
        The Kazakh texts are machine drafts until the owner's native check; a wording remark is a MINOR finding.
      evidence: Screens of step 3.
    on_fail:
      severity: MINOR
      business_impact: A Kazakh-speaking administrator sees English, Russian or broken text on the instance page.
      suggested_action: route_to_wf03
  - id: EO-004
    description: The busy text and the headings of the tabs follow the language.
    verification:
      method: gui_screen
      detail: >
        Step 4, Kazakh: while refreshing the button reads "Жаңартылуда..." and afterwards "Жаңарту"; the refresh line shows a time ("Соңғы жаңарту: ...").
        Step 5, Russian: the Graph tab shows the heading "Граф процесса с токенами", the History tab "История событий" and the Timeline tab "Хронология".
        A refresh that is too fast to see the busy text is not a failure; the run notes it.
      evidence: Screens of steps 4 and 5.
    on_fail:
      severity: MINOR
      business_impact: Part of the page changes language and part does not.
      suggested_action: route_to_wf03
  - id: EO-005
    description: The panels that the sweep records as still English are listed honestly, and nothing else is English.
    verification:
      method: gui_screen
      detail: >
        Step 6 lists the texts that are still English in the History and Timeline panels. The run compares the list with the known list in the header
        ("All types", "Loading event history...", the column headers Type, Actor, Time, Payload, "Loading timeline...", "No timeline entries found.", "Loading…", "No attachments yet.", "No dependencies recorded for this case.").
        A text on the list is reported as a known gap (INFO). An English text that is NOT on the list is a MINOR finding with its place named.
      evidence: The list of step 6 and the screens.
    on_fail:
      severity: MINOR
      business_impact: Mixed-language panels on a page that is otherwise translated.
      suggested_action: route_to_wf03
  - id: EO-006
    description: Another company cannot open the instance.
    verification:
      method: gui_screen
      detail: >
        Step 7 shows the application's "not found" page, not the instance, and no field, variable, task name or tab of the SwiftRoute instance appears.
        The page does not say that the instance exists in another company.
      evidence: Screen of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: One company could see another company's running process.
      suggested_action: route_to_security_review
  - id: EO-007
    description: Reading in other languages and the refused read changed nothing.
    verification:
      method: gui_screen
      detail: Step 8 shows the same table values as step 1 (status, active nodes, started, active task "Approve"); only the last-refreshed time may differ.
      evidence: Screens of steps 1 and 8, compared.
    on_fail:
      severity: MAJOR
      business_impact: A language change or a refused read changed the instance.
      suggested_action: route_to_wf03
