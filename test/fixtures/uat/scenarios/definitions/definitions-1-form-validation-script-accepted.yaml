# T-0669 (BA): DEFINITIONS group, scenario 1: a check script for a form (kind "form validation") can be created, published, named by a human task, and the process activated.
# Covers REQ-569 slice F-1 criterion 1 (kind accepted with the flag on; any other kind still refused), criterion 3 (valid pair passes; another node type carrying the key is not read as a binding),
# criterion 4 (activation succeeds), criterion 6 (the same version on two human tasks is accepted).
# Sources: docs/requirements.yaml REQ-569 criteria 1, 3, 4, 6; lib/letflow/scripts.ex (@hook_kinds, form_validation_enabled?/0); lib/letflow/definitions/graph.ex
# (check_human_task_validation_reference/1: key ^[a-z][a-z0-9_]{0,63}$, version an integer >= 1, both or neither); lib/letflow/routers/script_rules.ex (moduledoc: ScriptsWrite creates and saves,
# ScriptsPublish publishes; invalid_hook_kind is the 422 reason of a missing or unknown kind); lib/letflow/routers/definitions.ex (create answers 201, invalid graph 422 with "errors"; activate);
# docs/roles.md (DefinitionsWrite, ScriptsWrite, ScriptsPublish: tenant administrator yes); test/fixtures/uat/actors.yaml.
# The feature is behind a switch that is OFF by default (REQ-569 criterion 2). This scenario needs the switch ON in the test environment. The switch is an application setting, not an API: no step can turn it on.
# Not observable through an API on QA, so not checked here (the reason is given, they are covered by the product's own tests): criteria 7 and 8 (the frozen script reference in the pins of a started instance
#   is stored inside the instance; no read route shows it, and starting an instance needs an operator role this group does not use); criterion 5 and 6 at function level (the internal check names);
#   criterion 9 second and third sentences (the internal pin lookup, completing another company's task); criterion 10 and 11 (review gate and diff scope are properties of the change, not of the running product).
# Waiting: running the check when a task is completed (REQ-569 slice F-2, T-0640 / GH #3298) is not part of this release. No step completes a task and none expects a task completion to be refused.
# The four sensitive actions (approve, pay or release, see sensitive data, change users) are not in this flow.
---
id: definitions-1-form-validation-script-accepted
scope: definitions
title: A check script for a form can be published and named by a human task, and the process is activated
version: "1.0"
tags: [definitions, scripts, form-validation, activation, accept]

description: >
  The administrator of SwiftRoute creates and publishes a check script of kind "form validation" (key check_total) and sees that the registry keeps the kind. Creating a script of the kind
  "entity write" with the same body is still refused, as is a script with no kind. The administrator then uploads a process with a human task "review_total" that names check_total version 1 as
  its check script, and activates it. A second process has two human tasks that both name check_total version 1 and is also activated. A third process has a start event that carries a check-script
  name, and a human task with none; it is accepted and activated, because only human tasks are read as check-script bindings. Nothing is run: in this release the check script does not run
  when a task is completed.

actors:
  tenant_admin_a: actor-swiftroute-alice

preconditions:
  - description: The switch for form validation scripts is ON in the test environment.
    check: system_seeded
    detail: Setup-prepared (application setting form_validation_hook_enabled, default off). If step 1 is refused with the reason "invalid_hook_kind", the switch is off; report BLOCKED for the whole scenario and run scenario definitions-5 instead. This is not a product failure.
  - description: SwiftRoute has no script with the key check_total, and no process definition named fv_accept_one, fv_accept_two or fv_accept_three.
    check: system_seeded
    detail: Setup-prepared. If they exist, use the next free names and note that in the report.
  - description: The test setup supplies the body of a valid form validation script, noted as FV-BODY - source, manifest and test cases that pass the product's own script checks.
    check: system_seeded
    detail: Script source is a test fixture. FV-BODY is the same body in steps 1, 3 and 4; only the kind differs.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator creates a new draft version of the script check_total, with the kind "form validation" and the body FV-BODY, then reads it back. The answer (status and kind) is noted.
    via: api
  - step: 2
    actor: tenant_admin_a
    action: >
      The administrator publishes check_total version 1 and reads the list of scripts.
    via: api
  - step: 3
    actor: tenant_admin_a
    action: >
      The administrator tries to create a new draft version of the script check_other with the kind "entity write" and the body FV-BODY, and a second try with the kind "stock movement", a kind the product does not know.
      Both tries are made in this one step; both must be refused.
    expect_refusal: true
    via: api
  - step: 4
    actor: tenant_admin_a
    action: >
      The administrator tries to create a new draft version of the script check_nokind with the body FV-BODY and no kind at all.
    expect_refusal: true
    via: api
  - step: 5
    actor: tenant_admin_a
    action: >
      The administrator uploads the process fv_accept_one, version "1": start, one human task with the id "review_total" that names the check script check_total, version 1 (attributes "validation_script_key"
      and "validation_script_version"), and an end. The answer is noted.
    via: api
  - step: 6
    actor: tenant_admin_a
    action: >
      The administrator activates fv_accept_one and reads its status.
    via: api
  - step: 7
    actor: tenant_admin_a
    action: >
      The administrator uploads the process fv_accept_two, version "1": start, two human tasks with the ids "review_total" and "second_review", both naming check_total version 1, and an end. Then activates it.
    via: api
  - step: 8
    actor: tenant_admin_a
    action: >
      The administrator uploads the process fv_accept_three, version "1": a start event that carries the attribute "validation_script_key" with the value "no_such_script" and "validation_script_version" 1,
      one human task "review_total" with no check script, and an end. Then activates it.
    via: api

expected_outcomes:
  - id: EO-001
    description: A script of kind "form validation" is created and published, and the registry keeps the kind.
    verification:
      method: http_status
      detail: Step 1 answers 201 and the version read back shows the kind "form_validation" and the status draft. Step 2 answers 200 and the list shows check_total version 1 as published.
      evidence: The answers of steps 1 and 2.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot prepare a check script for forms, so the form check cannot be offered later.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Any other kind, and a missing kind, are still refused.
    verification:
      method: http_status
      detail: Both tries of step 3 answer 422 with the reason "invalid_hook_kind". Step 4 answers 422 with the reason "invalid_hook_kind". The list of scripts read afterwards has no check_other and no check_nokind.
      evidence: The answers of steps 3 and 4 and the list read after step 4.
    on_fail:
      severity: MAJOR
      business_impact: A script of an unknown kind could be stored and later be taken for a check script.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A human task that names a published check script of the right kind passes the upload check and the process is activated.
    verification:
      method: http_status
      detail: Step 5 answers 201. Step 6 activation answers 200 and the status read afterwards is active.
      evidence: The answers of steps 5 and 6.
    on_fail:
      severity: BLOCKER
      business_impact: A correct process with a form check script cannot be put into use.
      suggested_action: route_to_wf03
  - id: EO-004
    description: Two human tasks may name the same script at the same version.
    verification:
      method: http_status
      detail: Step 7 upload answers 201 and the activation answers 200.
      evidence: The answers of step 7.
    on_fail:
      severity: MAJOR
      business_impact: A process cannot use one check script on two forms, so the administrator must copy the script.
      suggested_action: route_to_wf03
  - id: EO-005
    description: Only a human task is read as a check-script binding.
    verification:
      method: http_status
      detail: Step 8 upload answers 201 and the activation answers 200, although "no_such_script" exists nowhere.
      evidence: The answers of step 8.
    on_fail:
      severity: MAJOR
      business_impact: A leftover attribute on another node blocks a process, or is taken for a binding.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: Deprecate the processes fv_accept_one, fv_accept_two and fv_accept_three if the environment keeps them. Keep the published script check_total; scenario definitions-3 uses it.
