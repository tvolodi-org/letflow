# T-0626 (BA): demo-tenant journey, scenario 5 of 5 (order: see provisioning-1-create-and-replay.yaml). Can run after scenario 1.
# QA ONLY (portfolio decision D-019). Sources: REQ-572 criteria 1 to 3, 10, 11, 13; decision 0072 D6 (the credential is one
# opaque secret outside the role system, bound to no customer; invariants P1 to P5), contract rules 2, 4, 5, 6.
# DO NOT probe a write: refusals below are requests the product must refuse, sent with a deliberately wrong or unfit
# credential. The credential's real value is never written in this file, in a report or in a message.
# NOT COVERED HERE (kept to the product's own tests): "the interface is off when no credential is configured" (404
# for every call) needs a QA without the credential, which contradicts the other four scenarios; the 61st request
# in a minute (429 with a wait time) needs a flood against QA, which this team does not run; a platform administrator of a
# customer tenant (decision 0046 D4 says no such person exists, and the roster has no such actor; see foundation-4c).
---
id: provisioning-5-credential-boundaries
scope: platform
title: The front door credential does only the six provisioning calls and reaches no customer data
version: "1.0"
tags: [provisioning, credential, security, refusal, qa-only]

description: >
  The front door's credential can create, read, suspend, resume, expire and delete demo customers and nothing else.
  A request with no credential, a wrong one, or a platform operator's own sign-in is turned away with the same
  answer. The credential does not open any ordinary part of the platform (the customer list, the people of a
  customer, the settings), and nothing the provisioning calls answer contains a customer's data, people, tokens or
  e-mail addresses. A customer's own administrator cannot use the provisioning calls.

actors:
  front_door: actor-system-front-door
  platform_operator: actor-platform-admin
  owner_a: actor-any

preconditions:
  - description: Scenario 1 passed in this run (customers A and B exist); scenario 4 has not yet run, or the record of A and B is still readable
    check: custom
    detail: If A and B do not exist, report BLOCKED, not PASS.
  - description: The front door credential is held by the run only through the front door's own secret store; it is not copied into the report
    check: custom
    detail: A report that contains the credential value fails this precondition.

steps:
  - step: 1
    actor: front_door
    action: The front door reads customer A's record with its credential. This works (control).
    via: api
  - step: 2
    actor: front_door
    action: The front door sends the read of customer A with no credential at all.
    expect_refusal: true
    via: api
  - step: 3
    actor: front_door
    action: The front door sends the read of customer A with a wrong credential (a random text of the same length).
    expect_refusal: true
    via: api
  - step: 4
    actor: front_door
    action: The front door sends the read of customer A with a credential in the wrong form (no "Bearer" word).
    expect_refusal: true
    via: api
  - step: 5
    actor: platform_operator
    action: The platform operator sends the read of customer A with their own platform administrator sign-in instead of the credential.
    expect_refusal: true
    via: api
  - step: 6
    actor: owner_a
    action: The administrator of customer A sends the read of customer A with their own sign-in instead of the credential.
    expect_refusal: true
    via: api
  - step: 7
    actor: front_door
    action: The front door tries to list the platform's customers with its credential.
    expect_refusal: true
    via: api
  - step: 8
    actor: front_door
    action: The front door tries to open the list of people of customer A with its credential.
    expect_refusal: true
    via: api
  - step: 9
    actor: front_door
    action: The front door tries to set up a customer through the platform operator's ordinary setup call with its credential.
    expect_refusal: true
    via: api
  - step: 10
    actor: front_door
    action: The front door tries to issue an access token for customer A with its credential.
    expect_refusal: true
    via: api
  - step: 11
    actor: front_door
    action: The front door tries to list its own or another credential through the provisioning interface.
    expect_refusal: true
    via: api
  - step: 12
    actor: front_door
    action: >
      The front door reads customer A's record and customer B's record, and then reads the record of an identifier that
      does not exist.
    via: api
  - step: 13
    actor: front_door
    action: The front door sends the read of a customer identifier that is not in UUID form.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: A missing, wrong or badly formed credential, a platform operator's sign-in and a customer administrator's sign-in are all turned away with the same answer.
    verification:
      method: api_response
      detail: >
        Steps 2 to 6 are refused as unauthorised (401) with the same body, {"error": "unauthorized", "message": ...},
        for the missing and the wrong value alike; nothing is changed or revealed. The control in step 1 works.
      evidence: Status and body of steps 1 to 6.
    on_fail:
      severity: BLOCKER
      business_impact: A platform operator's sign-in or a guess could be used to create or switch off customers, or the answer would help guess the credential.
      suggested_action: route_to_security_review
  - id: EO-002
    description: The credential opens nothing outside the six provisioning calls.
    verification:
      method: http_status
      detail: >
        Steps 7 to 10 are refused (unauthorised or not found, never a success) and return no customer, no person and
        no token; step 11 is refused as not found, because the provisioning interface has no call to list, create or
        revoke a credential or a token or to list customers.
      evidence: The status and a statement that no data of a customer came back, for steps 7 to 11.
    on_fail:
      severity: BLOCKER
      business_impact: A leaked front-door credential could read or change customer data, mint tokens, or enumerate customers.
      suggested_action: route_to_security_review
  - id: EO-003
    description: What the provisioning calls answer holds no customer data and the same shape for every customer.
    verification:
      method: api_response
      detail: >
        Step 12: the records of A and B have exactly the same keys (identifier, state, tier, creation time, expiry
        date); neither contains an address, a realm, an e-mail address, a count or a person; the record of the
        missing identifier answers "not found" with a body equal to the body of the refusal for the hand-made
        customer identifier suspended in scenario 3 step 22 (so existence is not revealed). Step 13 answers "not found".
      evidence: The keys and values of step 12 and the "not found" bodies of steps 12 and 13.
    on_fail:
      severity: BLOCKER
      business_impact: The credential would show a customer's data, or would let a caller learn which customers exist.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Nothing is created and nothing is changed by this scenario.
