# T-0626 (BA): demo-tenant journey through the provisioner, scenario 1 of 5 (order: 1 create and replay, 2 first
# administrator and the demo address, 3 suspend / resume / expire, 4 delete, retention and purge, 5 credential boundaries).
# QA ONLY (portfolio decision D-019). Production is not approved; nothing here touches a production tenant.
# Sources: REQ-572 and its amendment (criteria 4 to 7, 17, 19), decision 0072 (D3 order of calls and the namespace
# rule for the realm name, D5 identity and hostname, D6 the credential, P13 and P14), ai-dala-portfolio
# contracts/provisioning.md v0.1 (the contract and the decision record win over journeys/demo-account.md, which is
# partly outdated).
# Written against the contract and the decision record; to be adjusted when the routes exist (T-0613).
#
# TEST-TOOLING STEP: the realm of each demo customer is made by infra's realm provisioner (actor-system-realm-provisioner),
# one realm per customer, named "t-" plus the first 20 hex digits of the customer id; the first administrator is created
# inside the realm by it. The product has no part in it; the step asserts only that the provisioner answered.
# NOT COVERED HERE: the demo cap (30) and its alarm (25) need 30 live demo customers on QA; they are settings and are
# covered by the product's own tests, not by this run (REQ-572 criterion 19, "a test changes each one").
---
id: provisioning-1-create-and-replay
scope: platform
title: The front door creates a demo customer, repeats the call safely, and bad requests are turned away
version: "1.0"
tags: [provisioning, demo, tenant, idempotence, refusal, qa-only]

description: >
  The portfolio's front door asks Letflow, server to server, to create two demo customers (A and B), each with
  an identifier the front door made, a name, a language, the tier "demo", the owner's e-mail address, an expiry
  date and an address under the QA domain. The realm for each customer was made first by the realm provisioner and
  its name is passed along. Letflow answers with the customer's state and the sign-in address. Sending the same
  request again changes nothing and gives the same answer, even when the repeated request carries other
  details. Requests that are wrong, that name a realm that is not the customer's own, that ask for a production
  customer, or that use an address outside the QA domain are all turned away and create nothing.

actors:
  front_door: actor-system-front-door
  realm_provisioner: actor-system-realm-provisioner
  platform_operator: actor-platform-admin

preconditions:
  - description: The provisioner credential is configured on QA (the provisioner routes answer) and the front door holds it
    check: custom
    detail: If the routes are switched off, every request answers "not found" and the scenario is BLOCKED, not PASS.
  - description: The allowed address suffix on QA names the QA demo domain (letflow.qa.bizdala.com)
    check: custom
    detail: If the suffix is not configured, every address is refused; report BLOCKED, not PASS.
  - description: Each run makes two fresh customer identifiers (A and B, standard UUID form) and two fresh owner e-mail addresses on a mailbox-less test domain
    check: custom
    detail: An identifier from an earlier run must not be reused; the call would then be a replay, not a creation.

steps:
  - step: 1
    actor: realm_provisioner
    action: >
      TEST-TOOLING STEP (outside the product): for customers A and B the realm provisioner makes one realm each, named
      "t-" followed by the first 20 hex digits of the customer's identifier, with the owner as first administrator.
      The answer for each carries the realm name and its issuer, and the first password once.
    via: api
  - step: 2
    actor: front_door
    action: >
      The front door creates customer A: name "UAT demo A", language English, tier demo, the owner's e-mail address,
      an expiry date 13 days ahead, the address "t-<32 hex digits of the identifier>.letflow.qa.bizdala.com" and
      the realm name from step 1.
    via: api
  - step: 3
    actor: front_door
    action: The front door sends exactly the same creation request for customer A again.
    via: api
  - step: 4
    actor: front_door
    action: >
      The front door sends the creation request for customer A a third time with another name ("UAT demo A renamed"),
      another language (Russian) and another e-mail address for the owner.
    via: api
  - step: 5
    actor: front_door
    action: The front door reads customer A's record.
    via: api
  - step: 6
    actor: front_door
    action: >
      The front door creates customer B in the same way as A: name "UAT demo B", language English, tier demo, its own
      owner e-mail address, an expiry date 13 days ahead, its own address under the QA domain and its own realm.
    via: api
  - step: 7
    actor: platform_operator
    action: >
      The platform operator looks at the pending invitations of customer A and of customer B (who is invited, how
      many, how old).
    via: api
  - step: 8
    actor: front_door
    action: The front door tries to create a customer with the tier "production".
    expect_refusal: true
    via: api
  - step: 9
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier, the address of customer A and a valid
      realm name for the fresh identifier.
    expect_refusal: true
    via: api
  - step: 10
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier and the realm name of customer A.
    expect_refusal: true
    via: api
  - step: 11
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier and the name of the platform's own default
      realm ("bpm-default") as the realm.
    expect_refusal: true
    via: api
  - step: 12
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier whose address is
      "t-<32 hex digits>.example.com", outside the QA domain.
    expect_refusal: true
    via: api
  - step: 13
    actor: front_door
    action: The front door tries to create a customer whose identifier is not in UUID form (the text "not-a-uuid").
    expect_refusal: true
    via: api
  - step: 14
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier, language "de" (not Russian, Kazakh or English)
      and otherwise valid details.
    expect_refusal: true
    via: api
  - step: 15
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier, valid details and an expiry date that is
      already in the past.
    expect_refusal: true
    via: api
  - step: 16
    actor: front_door
    action: >
      The front door tries to create a customer with a fresh identifier, valid details and one extra field the
      contract does not know (for example "plan_x").
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: Customer A is created at once and the answer is exactly the contract's four items.
    verification:
      method: api_response
      detail: >
        Step 2 answers "created" (201) with exactly: the customer's identifier as sent, the state "active", the
        deployment's public address, and a hand-over holding the sign-in address. The answer holds no e-mail
        address, no realm name and no password.
      evidence: The answer of step 2 (status and the list of keys).
    on_fail:
      severity: BLOCKER
      business_impact: The front door cannot give a visitor a working demo.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Repeating the request gives the same answer and changes nothing, whatever else the repeat carries.
    verification:
      method: api_response
      detail: >
        Steps 3 and 4 answer "ok" (200) with a body equal to the body of step 2. After step 4 the record read in
        step 5 still shows the first name's customer in state "active", tier "demo" and the first expiry date; the
        platform operator's view in step 7 shows exactly one pending invitation for customer A, addressed to the
        first owner, not the e-mail of step 4.
      evidence: The three bodies and the invitation list of customer A in step 7.
    on_fail:
      severity: BLOCKER
      business_impact: A network retry at the front door could create a second customer, a second invitation or overwrite a customer's details.
      suggested_action: route_to_wf03
  - id: EO-003
    description: The record the front door can read has only the contract's items.
    verification:
      method: api_response
      detail: >
        Step 5 answers 200 with exactly: customer identifier, state "active", tier "demo", creation time, expiry
        date. It carries no address, no realm, no e-mail, no counts and no settings.
      evidence: The answer of step 5 (status and keys).
    on_fail:
      severity: MAJOR
      business_impact: The front door credential would show more about a customer than the contract allows.
      suggested_action: route_to_security_review
  - id: EO-004
    description: Each customer has exactly one open invitation for its first administrator and nobody is administrator yet.
    verification:
      method: system_state
      detail: >
        Step 7 shows one pending invitation for A and one for B, for the owner's address (normalised to lower case),
        with its age, and no user or role entry for either address. The invitation of B does not appear in A's
        view and the reverse. (Read through the operator call used in foundation-2.)
      evidence: The answer of step 7 for each customer.
    on_fail:
      severity: BLOCKER
      business_impact: The first administrator could not be bound, or the grant could be seen across customers.
      suggested_action: route_to_wf03
  - id: EO-005
    description: A production customer cannot be created through the front door credential.
    verification:
      method: api_response
      detail: Step 8 is refused as an invalid request (400) and no customer exists afterwards under that identifier.
      evidence: The refusal and a read of the identifier answering "not found".
    on_fail:
      severity: BLOCKER
      business_impact: A leaked front-door credential could create production customers.
      suggested_action: route_to_security_review
  - id: EO-006
    description: Requests with another customer's address or realm, a foreign realm, an address outside the QA domain, or malformed fields create nothing.
    verification:
      method: api_response
      detail: >
        Step 9 is refused as a conflict (409) because the address is taken; steps 10 and 11 are refused as invalid requests (400) because the
        realm is not "t-" plus the first 20 hex digits of this customer's own identifier; steps 12 to 16 are refused as
        invalid requests (400) naming the field and not repeating the value. After each refusal a read of the
        fresh identifier answers "not found", and customer A's record is unchanged.
      evidence: Status and error code of steps 9 to 16, and the reads of the fresh identifiers.
    on_fail:
      severity: BLOCKER
      business_impact: A customer could be bound to a realm that is not its own (for example the platform's), or to an address outside the demo domain.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: >
    Customers A and B are used by scenarios 2 to 5 and are retired by scenario 4 (delete and purge). Nothing
    is deleted here.
