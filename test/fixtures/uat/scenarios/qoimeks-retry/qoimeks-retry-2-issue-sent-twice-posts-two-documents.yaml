# T-2205 readiness fixes: (1) scope qoimeks-qa2 exists; (2) actors admin (TENANT_ADMIN) and storekeeper (STOREKEEPER) in the roster; (3) screens and routes read at main; (4) data: counts (items, places, balances) are read at the start of the run, not hard-coded; (5) every step is executable with a browser or an HTTP client; (6) preflight not run here (no acceptance environment in this step).
# T-2161 (BA), rework T-2191 (issues #4703, #4704, #4707): qoimeks-retry group, scenario 2. QA only, no real data.
# Covers REQ-859 (old-app address reads, build #4664) and REQ-860 (old-app address writes, build #4666).
# Decision 0091 section 9 notes that retry deduplication by client id on the old-app address
# is deferred to T-2029; the client `id` field in the POST body is currently accepted and ignored,
# so a retry posts a second document. This scenario documents that current behavior in Kazakh.
#
# Fix of #4703 (the blocker of the group's audit): no seed, variable or preflight check provides the
# shared stock token value; the value is shown only once, at creation (decision 0091 section 4.3).
# The walk now creates the tenant's shared access itself through the admin API at the start, keeps the
# one-time value in the run's own environment only (never in a file, a screenshot or the report), and
# revokes it at the end, so the tenant is left with none, exactly as it began. If a shared access
# already exists when the walk starts, the walk does not replace or revoke it (it may belong to a
# concurrent run) and reports BLOCKED-by-environment instead.
# Ordering rule (decision 0091 section 4.3; the sibling group qoimeks-token manages the same credential):
# this group and the qoimeks-token group must not run at the same time; either order is fine, because
# both restore the tenant to "no shared access". qoimeks-token-1 requires the tenant to start with none,
# which this walk's cleanup guarantees.
#
# Fix of #4704: step 6 of version 1 asked for a document-list filter by operator, which the list does
# not have (web/src/modules/stock/documents/DocumentList.tsx filters by kind, state and org unit only).
# The step now filters the list by kind and state and opens each new document to read its "Posted by" row
# (label stock.doc.field.postedBy: en "Posted by", ru "Кем проведён", kk "Өткізген").
#
# Fix of #4707: the precondition that the tenant's scope enforcement is off, now stated in all four
# scenarios of the group (while it is "on" or "shadow", every old-app request is answered 403
# scope_enforcement_active: SharedStockAccess.accept/2, decision 0091 sections 9 and 11b).
#
# NOT UAT-observable (stated, not invented):
# - The actual Qoimeks mobile application (APK) on a physical Android phone.
# - Concurrent sends from two phones: this scenario covers a sequential retry.
# - The token value: created by the walk at step 2, kept in the run's environment only, never recorded.
# Role-based refusal (T-2191 rework, gate finding): the lower-role actor-qoimeks-qa2-storekeeper (STOREKEEPER, realm qoimeks-qa2) is refused the admin API of the shared stock access
# (step 14): the three routes need the permission TokensManage (lib/letflow/routers/identity.ex, authz_get/authz_post/authz_delete "/shared-stock-access"), which only TENANT_ADMIN and
# PLATFORM_ADMIN hold (docs/roles.md, matrix row TokensManage; STOREKEEPER: no), and the handler answers 403 "insufficient permissions" otherwise (shared_access_guarded). The refusal is walked on the
# READ route (the status), so the walk never probes a write route; the create and revoke routes share the permission.
---
id: qoimeks-retry-2-issue-sent-twice-posts-two-documents
scope: qoimeks-qa2
title: An issue posted twice from the old-app address with the same client id currently posts two documents (retry deduplication pending T-2029), verified in Kazakh
version: "2.0"
tags: [qoimeks, retry, idempotency-gap, old-app, issue, balance, kk]

description: >
  Decision 0091 section 9 notes that retry deduplication by client id at the old-app address is a
  future feature deferred to T-2029. Currently the client `id` field in the POST /movements body is
  accepted and ignored (Letflow.Routers.SharedStockAccess, REQ-860 build #4666); a second send with
  the same client id creates a second stock document. This scenario documents that current behavior
  for an issue in Kazakh. The walk first creates the tenant's shared stock access through the admin
  API and keeps the one-time value in the run's own environment only. The test runner then sends an
  issue for 3 units twice with the same client id I-RETRY-2, from the place where the balance was
  recorded. The expected current behavior: both sends are accepted (201 each with different movement
  ids), the balance decreases by 6 (not by 3), and the document list shows two posted issues, each
  reading "Posted by" the test operator. When T-2029 is delivered and A2 returns the same movement id
  as A1, this scenario should be retired.
  Cleanup: both posted issues are reversed and the shared access created at the start is revoked, so
  the tenant is left as it began.
  Not exercised, with reasons: (a) the actual phone screen and APK; (b) concurrent sends.

actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The tenant's scope enforcement is off.
    check: system_seeded
    detail: >
      While the scope enforcement is "on" or "shadow", every old-app request is answered 403
      scope_enforcement_active (decision 0091 sections 9 and 11b) and no step of this walk can run.
      If it is not off, report BLOCKED for the whole scenario; switching it is the platform
      operator's act, not the walk's.
  - description: >
      The qoimeks-qa2 tenant is listed in LETFLOW_SHARED_STOCK_ACCESS_TENANTS (REQ-857 build #4658,
      REQ-858 build #4662), and the old-app address (decision 0091 section 6, REQ-859 build #4664)
      answers for the tenant slug qoimeks-qa2.
    check: system_seeded
    detail: >
      The walk creates the shared access itself at step 2, so none needs to exist. If the old-app
      address is not reachable or the deployment setting does not list the tenant, report BLOCKED
      for the whole scenario and name which precondition is missing.
  - description: >
      The tenant has at least one item, ITEM-RETRY-I2, with a posted balance of at least 10 units
      in one place so that issuing 3 units twice does not go below zero (or the tenant allows
      negative balances).
    check: system_seeded
    detail: >
      If no item with a sufficient positive balance exists, choose the nearest item with a balance
      above 6 and note the actual quantity. If no item with a sufficient balance exists and the
      tenant does not allow negative balances, report BLOCKED.
  - description: No movement with client id I-RETRY-2 has been posted in this tenant yet.
    check: test_setup
    detail: If a movement with client id I-RETRY-2 already exists, use a different client id.
  - description: The run can drive a real browser.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the balance and document steps.
  - description: The storekeeper account of this tenant (actor-qoimeks-qa2-storekeeper, role STOREKEEPER) can sign in.
    check: system_seeded
    detail: >
      Needed only for the last step. If the sign-in of this account fails, report that step as BLOCKED-by-environment
      and name the account; every other step still runs.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator, signed in on the tenant's own address
      (https://qoimeks-qa2.letflow.qa.bizdala.com), reads the status of the tenant's shared stock
      access through the admin API. The answer is noted as S0.
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator creates the shared stock access with an empty request (the system generates
      the value). The answer is noted as C1; the value in it is noted as V1 and is kept only in the
      run's own environment, never in a file, a screenshot or the report. The status is read again
      and noted as S1.
    via: api
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper opens the stock balance screen. The balance of ITEM-RETRY-I2 is noted as B0,
      together with the place of that balance.
    via: ui
  - step: 4
    actor: admin
    action: >
      Before the first send the test runner maps the item and the place to the integer ids the old-app address needs: it reads the catalog call (GET /catalog) and the balances call (GET /balances) of the old-app address with Authorization: Bearer V1 and takes the integer sku_id of the item and the integer location_id of the place from them. The old-app post puts the stock under the place's first linked org unit and under the first active employee of the tenant as responsible, while every seeded balance carries its own responsible; so the runner picks an item and a place whose balance row has that first active employee as responsible, and the place must be linked to the org unit QOI-OU-1 (otherwise the post is refused 422 location_not_linked: then pick another place). If no such row exists, the runner compares totals per item and place (all responsible rows of that item at that place added together) before and after, never a single row.  Every balance named B0, B1 or BFINAL in this walk is the total per item and place (all responsible rows added), read the same way each time. The test runner sends an issue to the old-app address for ITEM-RETRY-I2, quantity 3,
      from the noted place, operator name "Тест-повтор", client id I-RETRY-2 (the `id` field in the
      JSON body), presenting V1 as the bearer credential (the word Bearer followed by the value).
      The answer is noted as A1.
    via: api
  - step: 5
    actor: admin
    action: >
      The test runner sends the same issue a second time: same item, same quantity 3, same place,
      same operator name, same client id I-RETRY-2. The answer is noted as A2.
    via: api
  - step: 6
    actor: admin
    action: >
      The test runner reads the balance of ITEM-RETRY-I2 from the old-app address balances call.
      The answer is noted as B1-api.
    via: api
  - step: 7
    actor: storekeeper
    action: >
      The storekeeper switches the browser language to Kazakh and opens the balance screen at
      1440 px. The balance row of ITEM-RETRY-I2 is noted as B1-ui.
    via: ui
  - step: 8
    actor: storekeeper
    action: >
      The storekeeper opens the stock document list in Kazakh, filters it to the kind Issue and
      the state Posted, finds the two new issues of this walk and opens each one, reading the row
      "Өткізген". The operator names read are noted as D1.
    via: ui
  - step: 9
    actor: storekeeper
    action: >
      The storekeeper reads the balance screen at 390 px in Kazakh. The balance of ITEM-RETRY-I2
      is noted as B1-phone.
    via: ui
  - step: 10
    actor: admin
    action: >
      The test runner reverses the first issue (movement id from A1) at the old-app address with
      operator name "Тест-откат". The answer is noted as REV1.
    via: api
  - step: 11
    actor: admin
    action: >
      The test runner reverses the second issue (movement id from A2) at the old-app address with
      operator name "Тест-откат". The answer is noted as REV2 and the balance is noted as BFINAL.
    via: api
  - step: 12
    actor: admin
    action: >
      The administrator revokes the shared stock access created in step 2 (the answer is noted as
      D3) and reads the status again (noted as S3), so that the tenant ends with none.
    via: api
  - step: 13
    actor: storekeeper
    action: >
      The storekeeper switches the browser language back to English.
    via: ui
  - step: 14
    actor: storekeeper
    action: >
      The storekeeper, signed in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com), asks the admin API for the status of the tenant's shared stock access
      (the read; nothing is created or changed). The answer is noted as R-SK.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: Both sends answer 201 with different movement ids (current non-idempotent behavior).
    verification:
      method: api_response
      detail: >
        A1 has HTTP status 201 and contains a movement id M1. A2 has HTTP status 201 and contains
        a movement id M2 where M2 differs from M1: each send was treated as a new document. This
        is the current behavior when retry deduplication is not yet built. Note: if A2 returns M1
        (the same movement id), retry deduplication from decision 0091 section 9 / T-2029 has been
        delivered; retire this scenario.
      evidence: "HTTP status and movement ids of A1 (M1) and A2 (M2) compared."
    on_fail:
      severity: BLOCKER
      business_impact: >
        If either send returns a non-201 status, the old-app write path is broken and the Qoimeks
        application cannot post movements.
      suggested_action: route_to_wf03

  - id: EO-002
    description: The balance decreased by 6 (B0 minus 3 minus 3), reflecting two posted documents.
    verification:
      method: api_response
      detail: >
        B1-api equals B0 minus 6. This is the current behavior: the second send was treated as a
        new issue. Note: if B1-api equals B0 minus 3, deduplication may already be working.
      evidence: "B0 and B1-api values from the balances call."
    on_fail:
      severity: MAJOR
      business_impact: >
        If B1-api equals B0 minus 3, deduplication may be working and T-2029 may have been
        delivered. If B1-api differs otherwise, the write path produced an incorrect balance.
      suggested_action: route_to_wf03

  - id: EO-003
    description: The stock balance screen in Kazakh shows the decreased balance and no untranslated text.
    verification:
      method: gui_screen
      detail: >
        B1-ui equals B0 minus 6. The balance screen column headings and navigation are in Kazakh.
        No raw message key (for example a text like "stock.balance.quantity") appears on the screen.
      evidence: "Screenshot of the balance screen in Kazakh at 1440 px."
    on_fail:
      severity: MAJOR
      business_impact: Kazakh-speaking warehouse workers see English or missing text.
      suggested_action: route_to_frontend_dev

  - id: EO-004
    description: The document list shows two posted issues of this walk, each "Posted by" the test operator.
    verification:
      method: gui_screen
      detail: >
        Step 8 shows exactly two new issues of this walk in the list filtered to the kind Issue and
        the state Posted, and opening each one shows the row "Өткізген" reading "Тест-повтор". This
        confirms two separate documents were created by the two sends. (The list has no operator
        filter; the operator is read inside each document.)
      evidence: "Screenshots of the two opened documents with the Өткізген row."
    on_fail:
      severity: MAJOR
      business_impact: >
        If only one new issue is found, deduplication may be working. If none is found,
        neither send was recorded correctly.
      suggested_action: route_to_wf03

  - id: EO-005
    description: The balance screen at 390 px shows the same decreased balance in Kazakh.
    verification:
      method: gui_screen
      detail: B1-phone equals B1-ui. No horizontal clipping at 390 px.
      evidence: "Screenshot of the balance screen at 390 px in Kazakh."
    on_fail:
      severity: MINOR
      business_impact: Phone users see a different or clipped balance.
      suggested_action: route_to_frontend_dev

  - id: EO-006
    description: Both reversals are accepted and the balance returns to B0.
    verification:
      method: api_response
      detail: >
        REV1 has HTTP status 201. REV2 has HTTP status 201. BFINAL equals B0. The synthetic data
        is restored.
      evidence: "HTTP status of REV1 and REV2; BFINAL equals B0."
    on_fail:
      severity: MINOR
      business_impact: >
        The synthetic balance is left in a changed state; subsequent runs may start from a wrong
        balance.
      suggested_action: route_to_wf03

  - id: EO-007
    description: The shared access created at the start is revoked, leaving the tenant as it began.
    verification:
      method: api_response
      detail: >
        S0 said exists is false before the walk. D3 has HTTP status 204 (no content). S3 is 200
        with exists is false: the tenant holds no shared stock access after the walk, so the
        sibling group qoimeks-token can run its own create-revoke walk on the same tenant.
      evidence: "The exists flags of S0 and S3 and the status of D3."
    on_fail:
      severity: MAJOR
      business_impact: >
        A live shared credential is left on the QA tenant after the run, with a value that sat in
        the run's environment; the old-app address stays open until the operator revokes it.
      suggested_action: route_to_wf03

  - id: EO-008
    description: A storekeeper, who holds no right to manage tokens, is refused the shared stock access routes of the admin API.
    verification:
      method: api_response
      detail: >
        R-SK has HTTP status 403, and its body carries no "exists", "created_at" or other status field of the shared access (only the refusal). The permission is TokensManage, held by the
        tenant administrator only among the tenant roles.
      evidence: "HTTP status and body of R-SK."
    on_fail:
      severity: BLOCKER
      business_impact: >
        A warehouse clerk could learn about, replace or revoke the credential the old app uses to post stock, and so cut off the warehouse or open the tenant's stock to others.
      suggested_action: route_to_elixir_dev
