# T-2283: decision 0091 section 9, Retry by client id (including T-2282 amendment),
# REQ-860 criteria 1-3 and 7; docs/runbooks/pilot-rollout.md shared-access item 3.
# Unknown numeric map ids cannot be proved unused through the old-address reads alone; scenario 4
# tests non-integer references instead (ref/int and entry_of in OldAppWrites). Authentication
# refusals retain the identical old-address 401 contract.
# Contract verified against lib/letflow/modules/stock/old_app_writes.ex (client_key,
# post_movement, reverse_movement, movement_hash, stored), routers/shared_stock_access.ex
# (authenticate before write, created/replayed response), and I-1..I-6 in
# test/letflow/routers/shared_stock_access_writes_test.exs on origin/main.
# Protocol for the runner: base https://qa.bizdala.com/qoimeks/qoimeks-qa2;
# catalog, balances and movements reads; movement creation POST /qoimeks/:slug/movements;
# reverse POST /qoimeks/:slug/movements/:id/reverse (path id = returned integer movement id).
# Both write bodies require id = a fresh UUID per operation, unchanged on retries, plus operator.
# Movement body also has kind, sku_id, location_id, qty; transfer has to_location_id.
# Returned JSON is the movement itself: id, kind, sku_id, location_id, quantity, operator,
# created_at (not a wrapper and not an echo of the client's UUID). Compare the whole decoded row.
# Admin shared-access status/create/revoke: interactive tenant sign-in, not an API token.
# 1. Scope: actors.yaml declares the existing QA tenant qoimeks-qa2 (T-2219); realm qoimeks-qa2 verified by preflight. Tenant lookup is UNKNOWN without an authenticated token.
# 2. Actors: actor-qoimeks-qa2-admin / TENANT_ADMIN manages shared access; actor-qoimeks-qa2-storekeeper / STOREKEEPER reads stock screens. Both are in actors.yaml. QA login is an acceptance precondition, not proven by static checks; no login verified in this writing step.
# 3. Host and screens: stockRoutes.tsx guards balances/documents with StockRead under the module guard; docs/roles.md and stock role_grants grant it to STOREKEEPER. BalancesPage.tsx supports item/place filters; DocumentList.tsx supports kind/state, not operator. Tenant host GET returned 200 during writing; preflight health and deployed SHA passed. Enabled old-address access remains an authenticated acceptance precondition.
# 4. Data: scripts/pilot/qoimeks_gen.py gen_items/gen_locations/gen_balances supplies candidate items, places and positive opening quantities, not live posting proof. Before acceptance verify imported openings, active masters/base unit, linked active org unit, active employee, active stock definitions, no freeze, scope enforcement off, tenant allow-listed, and no existing shared access. Missing prerequisites are BLOCKED-by-environment; never change production settings. Record item/place/balance counts at the start of the run. UUIDs and all mapped integer ids come from this run; no seed counts or invented item codes.
# 5. Executable: browser and HTTP client suffice, including concurrent sends; runner creates one shared credential per scenario and keeps it only in memory. Run serially with the token group; never replace an existing credential. OldAppReads.movements is a capped list, with no client pagination: use limit 500 (movement_limit), identical filters and require every snapshot to contain fewer than 500 rows; otherwise BLOCKED-by-environment for movement-count evidence. Snapshot comparisons use all returned ids and values, never only the newest row. No physical APK/phone UI is UAT-observable here; browser phone width is covered.
# 6. Dry run: preflight with title UAT qoimeks-retry returned ENV_NOT_READY: QA health and deployed SHA OK, realm OK; both actors NO_PASSWORD, tenant/app roles UNKNOWN without tokens. Acceptance is BLOCKED-by-environment until credentials are supplied; no live login verified. No acceptance scenarios run in this writing step.
# T-2343: the step that used the shared value at ANOTHER tenant (the old tenant qoimeks-qa) is rewritten to a made-up slug on the same address (same 401); no request goes to the old tenant. Earlier correction list follows. EXPECTATION CORRECTIONS: 11 — receipt replay; issue replay; changed-data conflict; one balance/document; reversal replay; second/reversal-of-reversal refusals; required UUIDs on both writes; concurrent duplicates; stored-row comparison; runtime-derived quantities and malformed references; capped movement-read evidence.
---
id: qoimeks-retry-4-no-token-and-wrong-token-refused-valid-posts
scope: qoimeks-qa2
title: >-
  The old-app address refuses requests without a token and with a wrong token; a valid token posts and
  reads; the shared token is refused on the standard admin API
version: '3.0'
tags:
- qoimeks
- old-app
- refusal
- access
- token
- idempotency
- ru
- kk
description: >-
  The old-app address is the only place where the shared stock token is accepted. This scenario confirms
  the boundary: a request without a token and a request with a wrong token are each refused with the same
  401 (no information about whether a valid credential exists). The walk then creates the tenant's shared
  stock access through the admin API, keeps the one-time value in the run's own environment only, records
  the balance of the test item, and posts a small receipt with the valid value. The storekeeper verifies
  the balance via the browser. The shared token cannot be used on the standard admin API (/api/v1) for
  a catalog read. Cleanup: the receipt posted with the valid token is reversed and the shared access is
  revoked, so the tenant is left as it began. Not exercised, with reasons: (a) rate-limit lockout (needs
  many rapid wrong requests): covered by REQ-859 unit tests; (b) a request where the tenant is not listed
  in LETFLOW_SHARED_STOCK_ACCESS_TENANTS: not reproducible on this tenant during normal UAT because the
  tenant must be listed for any test to run.
actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: The tenant's scope enforcement is off.
  check: system_seeded
  detail: >-
    While the scope enforcement is "on" or "shadow", every old-app request is answered 403 scope_enforcement_active
    (decision 0091 sections 9 and 11b) and no step of this walk can run. If it is not off, report BLOCKED
    for the whole scenario; switching it is the platform operator's act, not the walk's.
- description: >-
    The qoimeks-qa2 tenant is listed in LETFLOW_SHARED_STOCK_ACCESS_TENANTS (REQ-857 build #4658, REQ-858
    build #4662), and the old-app address (decision 0091 section 6, REQ-859 build #4664) answers at https://qa.bizdala.com/qoimeks/qoimeks-qa2
    (the slug is qoimeks-qa2).
  check: system_seeded
  detail: >-
    The walk creates the shared access itself at step 3, so none needs to exist; the refusal checks of
    steps 1 and 2 even assume none exists yet. If the old-app address is not reachable or the deployment
    setting does not list the tenant, report BLOCKED for the whole scenario and name which precondition
    is missing.
- description: The tenant has an eligible seeded item with a positive posted balance at one place.
  check: system_seeded
  detail: >-
    Read the item and place names and their positive balance at run time. Choose receipt quantity Q equal
    to a positive quantity read from that balance. Verify active masters, base unit, linked active org
    unit and an active employee before posting. Missing imported openings or posting masters is BLOCKED-by-environment;
    request environment preparation first.
- description: No shared stock access exists on the tenant when the walk starts.
  check: system_seeded
  detail: >-
    Step 3 reads the status first (S0). If a shared access already exists, report BLOCKED (a shared access
    already exists, so BLOCKED-by-environment): the walk neither replaces nor revokes it, as the header
    says.
- description: The runner generates fresh UUIDs U and R for the valid receipt and its reversal.
  check: test_setup
  detail: >-
    Send U in the receipt body id and R in the reversal body id. Keep UUIDs in memory; the returned movement
    id is a different integer. Authentication refusals use the same valid body with U.
- description: The run can drive a real browser.
  check: system_seeded
  detail: If no browser can be started, report BLOCKED for the balance steps.
- description: >-
    The storekeeper account of this tenant (actor-qoimeks-qa2-storekeeper, role STOREKEEPER) can sign
    in.
  check: system_seeded
  detail: >-
    Needed for all storekeeper screen and refusal steps. If its sign-in fails, report those steps as BLOCKED-by-environment
    and name the account; every other step still runs.
- description: Movement snapshots can prove unchanged stock history.
  check: system_seeded
  detail: >-
    The old-app movements read has no client pagination. Use limit 500 and the same mapped item/place
    filters for all snapshots. Verify each read has fewer than 500 rows, including after the planned posts
    and reversals; otherwise mark movement-count evidence BLOCKED-by-environment and choose an isolated
    item/place before writing. Source: OldAppReads.movement_limit and movements in lib/letflow/modules/stock/old_app_reads.ex.
steps:
- step: 1
  actor: admin
  action: >-
    The runner requests the old-app catalog without any Authorization header. The answer is noted as R1.
  expect_refusal: true
  via: api
- step: 2
  actor: admin
  action: >-
    The runner requests the old-app catalog with the Authorization header value "Bearer WRONG-TOKEN-VALUE"
    (the word Bearer, a space, then a value that was never issued). The answer is noted as R2.
  expect_refusal: true
  via: api
- step: 3
  actor: admin
  action: >-
    The administrator, signed in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com),
    reads the status of the tenant's shared stock access through the admin API (noted as S0) and then
    creates it with an empty request (the system generates the value). The create answer is noted as C1;
    the value in it is noted as V1 and is kept only in the run's own environment, never in a file, a screenshot
    or the report. The status is read again and noted as S1.
  via: api
- step: 4
  actor: admin
  action: >-
    With V1 the runner reads the old-app catalog and balances, matches the chosen item/place by name or
    article and records their mapped integer ids. Record the summed item/place balance as B0 and choose
    Q from a positive balance row. Read the matching movements at the maximum supported limit and record
    the complete set as L0, including ids and values. Later balance comparisons use the same sum across
    responsible, lot and unit rows. Generate operation UUID U once now; every receipt attempt in this
    walk uses that same U. Generate another UUID Z, distinct from U and R, to use as a deliberately non-integer
    item, place or movement reference. Z has UUID hyphens and cannot be an integer mapping id.
  via: api
- step: 5
  actor: admin
  action: >-
    The runner submits a movement of the old-app address with a valid body: kind receipt, the mapped sku_id
    and location_id, qty Q, operator "Тест-доступ", fresh operation UUID U in the body field id, and with
    NO Authorization header. The answer is noted as R4.
  expect_refusal: true
  via: api
- step: 6
  actor: admin
  action: >-
    The runner submits the same movement with the header Authorization: Bearer WRONG-TOKEN-VALUE. The
    answer is noted as R5.
  expect_refusal: true
  via: api
- step: 7
  actor: admin
  action: >-
    The runner submits the same movement with V1 presented at the old-app address under a made-up tenant slug that does not exist (https://qa.bizdala.com/qoimeks/uat-no-such-tenant), that is, the shared access value of this tenant used where it does not belong. A real other tenant, in particular the old tenant qoimeks-qa, is never used for this step (rule: no request goes to the old tenant). The answer is noted as R6 and must be the same 401 as the other refusals.
  expect_refusal: true
  via: api
- step: 8
  actor: admin
  action: >-
    The runner submits the same movement at the old-app address of this tenant with the administrator's
    own interactive sign-in token as the bearer credential (a person's credential, not the shared access
    value). The answer is noted as R7.
  expect_refusal: true
  via: api
- step: 9
  actor: admin
  action: >-
    Send the valid receipt body with V1 and U but put Z, the generated non-integer reference, in place
    of the mapped item number. Record R8.
  expect_refusal: true
  via: api
- step: 10
  actor: admin
  action: >-
    Send the valid receipt body with V1 and U and the mapped item, but put Z in place of the mapped place
    number. Record R9.
  expect_refusal: true
  via: api
- step: 11
  actor: admin
  action: >-
    Try reversing movement Z at the old-app address with V1, the operator and a fresh UUID in the body
    field id. Record R10.
  expect_refusal: true
  via: api
- step: 12
  actor: admin
  action: >-
    With V1 the runner reads the same summed balance as B0b and the matching movements at the maximum
    supported limit as the complete set L1.
  via: api
- step: 13
  actor: admin
  action: >-
    The test runner sends a receipt to the old-app address for the selected item at the chosen place with
    a valid body: kind receipt, the mapped sku_id and location_id, qty Q, operator "Тест-доступ", fresh
    operation UUID U in the body field id, using V1 as the bearer credential. The answer is noted as A1.
  via: api
- step: 14
  actor: admin
  action: >-
    The runner requests the standard tenant stock balances service on the tenant host with V1 as bearer
    credential and tenant slug qoimeks-qa2, rather than an interactive sign-in. Record R3.
  expect_refusal: true
  via: api
- step: 15
  actor: storekeeper
  action: >-
    The storekeeper opens the balance screen in Russian at 1440 px. The balance of the selected item at
    the chosen place (the sum of its rows there) is noted as B1-ui.
  via: ui
- step: 16
  actor: storekeeper
  action: >-
    The storekeeper opens the balance screen at 390 px in Russian. The balance of the selected item at
    the chosen place is noted as B1-phone.
  via: ui
- step: 17
  actor: admin
  action: >-
    The runner reverses the receipt from A1 at the old-app address using V1, the operator from the receipt
    and its own fresh UUID R in the body field id. Record REV1; read the summed item/place balance as
    BFINAL.
  via: api
- step: 18
  actor: admin
  action: >-
    The administrator revokes the shared stock access created in step 3 (the answer is noted as D3) and
    reads the status again (noted as S3), so that the tenant ends with none.
  via: api
- step: 19
  actor: storekeeper
  action: >-
    The storekeeper, signed in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com),
    asks the admin API for the status of the tenant's shared stock access (the read; nothing is created
    or changed). The answer is noted as R-SK.
  expect_refusal: true
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    A request without a token and a request with a wrong token each answer 401 with the same body; no
    information about the tenant's credential is revealed.
  verification:
    method: api_response
    detail: >-
      R1 has HTTP status 401. R2 has HTTP status 401. After the trace_id field is removed from both bodies
      (it differs on every request), R1's body is byte-identical to R2's body (same error shape as the
      other 401 cases of REQ-859 criterion 2). Neither body mentions whether a credential exists for this
      tenant.
    evidence: HTTP status and body of R1 and R2 side by side.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A different 401 body for "no credential" vs "wrong value" tells an attacker whether a credential
      exists and whether it is worth brute-forcing.
    suggested_action: route_to_wf03
- id: EO-009
  description: >-
    An unauthorized stock movement (a receipt) with no token, a wrong token, the shared value used under a made-up tenant slug at the same address, or a personal sign-in token is refused 401 with identical answers, and nothing
    changes.
  verification:
    method: api_response
    detail: >-
      R4, R5, R6 and R7 each have HTTP status 401. After the trace_id field is removed from each body
      (it differs on every request), the four bodies are byte-identical to each other and to the bodies
      of R1 and R2: no answer tells which of the four causes it was, or whether this tenant has a credential.
      B0b equals B0 and L1 equals L0 (the same complete movement set, ids and values): none of the four
      requests posted anything. If the address answers 429 to a refusal, the failure budget of the caller
      is spent: wait for the retry-after and repeat once; a 429 is not the expected answer.
    evidence: >-
      Refusal statuses and bodies with trace_id removed; B0, B0b and complete movement sets L0 and L1.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A release that is accepted without the tenant's own credential moves stock for anyone; an answer
      that differs by cause lets an attacker learn which credentials exist.
    suggested_action: route_to_elixir_dev
- id: EO-010
  description: >-
    Malformed item/place references and an unknown non-integer movement reference are refused without
    posting.
  verification:
    method: api_response
    detail: >-
      R8 is 400 with exactly {"error":"invalid sku_id"}; R9 is 400 with exactly {"error":"invalid location_id"};
      R10 is 404 with exactly {"error":"unknown movement"}. Each request carries a valid operation UUID
      and operator, so earlier checks do not mask the reference check. B0b equals B0 and L1 equals L0.
      Z is a generated UUID, not a guessed unused integer mapping id.
    evidence: >-
      Reference refusal statuses and bodies; unchanged summed balance and matching movement snapshot.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A guessed number that reaches another item, place or tenant's movement would post or reverse stock
      that nobody chose.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: The valid token posts the receipt and answers 201.
  verification:
    method: api_response
    detail: >-
      A1 (step 13) has HTTP status 201 and contains a movement id. The posted quantity equals Q, and the
      balance of step 15 is B0b plus Q.
    evidence: HTTP status 201 and movement id from A1.
  on_fail:
    severity: BLOCKER
    business_impact: The old Qoimeks app cannot post any movement; stock operations are stopped.
    suggested_action: route_to_wf03
- id: EO-003
  description: The shared token is refused on the standard admin API.
  verification:
    method: api_response
    detail: >-
      R3 has HTTP status 401. The shared token does not grant access to any /api/v1 route (REQ-860 criterion
      5 and decision 0091 section 6).
    evidence: HTTP status 401 from R3.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A credential that works on the admin API can read all tenant data, not just balances and movements;
      tenant isolation is broken.
    suggested_action: route_to_wf03
- id: EO-004
  description: The balance screen in Russian at 1440 px shows the increase from the valid posting.
  verification:
    method: gui_screen
    detail: >-
      B1-ui shows the balance of the selected item increased by Q compared to B0, the balance recorded
      in step 4 before the posting (the sum of the item's rows at the chosen place). Navigation and field
      labels are Russian; item names retain their source text.
    evidence: Screenshot of the balance screen at 1440 px in Russian, with B0 and B1-ui noted.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The warehouse team cannot see the result of a movement posted by the old app; stock is unreconcilable.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: The balance screen at 390 px shows the same increased balance.
  verification:
    method: gui_screen
    detail: B1-phone equals B1-ui. No clipping at 390 px.
    evidence: Screenshot at 390 px in Russian.
  on_fail:
    severity: MINOR
    business_impact: Phone users see a different or clipped balance.
    suggested_action: route_to_frontend_dev
- id: EO-006
  description: The reversal restores the balance recorded before the posting.
  verification:
    method: api_response
    detail: >-
      REV1 is 201 with kind reversal. BFINAL equals B0, the balance recorded before the valid posting.
      The reversal used R, distinct from U.
    evidence: BFINAL equals B0.
  on_fail:
    severity: MINOR
    business_impact: The synthetic balance is left changed; later runs may start from a wrong value.
    suggested_action: route_to_wf03
- id: EO-007
  description: The shared access created at the start is revoked, leaving the tenant as it began.
  verification:
    method: api_response
    detail: >-
      S0 said exists is false before the walk. D3 has HTTP status 204 (no content). S3 is 200 with exists
      is false: the tenant holds no shared stock access after the walk, so the sibling group qoimeks-token
      can run its own create-revoke walk on the same tenant.
    evidence: The exists flags of S0 and S3 and the status of D3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A live shared credential is left on the QA tenant after the run, with a value that sat in the run's
      environment; the old-app address stays open until the operator revokes it.
    suggested_action: route_to_wf03
- id: EO-008
  description: >-
    A storekeeper, who holds no right to manage tokens, is refused the shared stock access routes of the
    admin API.
  verification:
    method: api_response
    detail: >-
      R-SK has HTTP status 403, and its body carries no "exists", "created_at" or other status field of
      the shared access (only the refusal). The permission is TokensManage, held by the tenant administrator
      only among the tenant roles.
    evidence: HTTP status and body of R-SK.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A warehouse clerk could learn about, replace or revoke the credential the old app uses to post stock,
      and so cut off the warehouse or open the tenant's stock to others.
    suggested_action: route_to_elixir_dev
