# T-2205 readiness fixes: (1) scope qoimeks-qa2 exists; (2) actors admin (TENANT_ADMIN) and storekeeper (STOREKEEPER) in the roster; (3) screens and routes read at main; (4) data: counts (items, places, balances) are read at the start of the run, not hard-coded; (5) every step is executable with a browser or an HTTP client; (6) preflight not run here (no acceptance environment in this step).
# T-2161 (BA), rework T-2191 (issues #4703, #4704, #4707): qoimeks-retry group, scenario 1. QA only, no real data.
# Covers REQ-859 (old-app address reads, build #4664) and REQ-860 (old-app address writes, build #4666).
# Decision 0091 section 9 notes that retry deduplication by client id on the old-app address
# is deferred to T-2029; the client `id` field in the POST body is currently accepted and ignored
# (Letflow.Routers.SharedStockAccess, REQ-860 build #4666), so a retry posts a second document.
# This scenario documents that current behavior so QA can surface the gap.
#
# Fix of #4703 (the blocker of the group's audit): no seed, variable or preflight check provides the
# shared stock token value; the value is shown only once, at creation (decision 0091 section 4.3).
# The walk now creates the tenant's shared access itself through the admin API at the start, keeps the
# one-time value in the run's own environment only (never in a file, a screenshot or the report), and
# revokes it at the end, so the tenant is left with none, exactly as it began. If a shared access
# already exists when the walk starts, the walk does not replace or revoke it (it may belong to a
# concurrent run) and reports BLOCKED-by-environment instead.
# Ordering rule (decision 0091 section 4.3; the sibling group qoimeks-token manages the same credential):
# this group and the qoimeks-token group must not run at the same time; either order is fine, because
# both restore the tenant to "no shared access". qoimeks-token-1 requires the tenant to start with none,
# which this walk's cleanup guarantees.
#
# Fix of #4704: step 6 of version 1 asked for a document-list filter by operator, which the list does
# not have (web/src/modules/stock/documents/DocumentList.tsx filters by kind, state and org unit only).
# The step now filters the list by kind and state and opens each new document to read its "Posted by" row
# (label stock.doc.field.postedBy: en "Posted by", ru "Кем проведён", kk "Өткізген").
#
# Fix of #4707: the precondition that the tenant's scope enforcement is off, now stated in all four
# scenarios of the group (while it is "on" or "shadow", every old-app request is answered 403
# scope_enforcement_active: SharedStockAccess.accept/2, decision 0091 sections 9 and 11b).
#
# NOT UAT-observable (stated, not invented):
# - The actual Qoimeks mobile application (APK) on a physical Android phone: the runner sends the
#   same requests the app would send, but the phone screen and notification are not visible.
# - The race condition where two copies of the app send the same client id simultaneously:
#   this scenario covers a sequential retry, not a concurrent one.
# - The token value: created by the walk at step 2, kept in the run's environment only, never recorded.
# Role-based refusal (T-2191 rework, gate finding): the lower-role actor-qoimeks-qa2-storekeeper (STOREKEEPER, realm qoimeks-qa2) is refused the admin API of the shared stock access
# (step 13): the three routes need the permission TokensManage (lib/letflow/routers/identity.ex, authz_get/authz_post/authz_delete "/shared-stock-access"), which only TENANT_ADMIN and
# PLATFORM_ADMIN hold (docs/roles.md, matrix row TokensManage; STOREKEEPER: no), and the handler answers 403 "insufficient permissions" otherwise (shared_access_guarded). The refusal is walked on the
# READ route (the status), so the walk never probes a write route; the create and revoke routes share the permission.
# 1. Scope: qoimeks-qa2 — the tenant and its realm exist (scope checked against the tenant facts).
# 2. Actors (T-2222, PM 2026-11-19): the old-address post, retry and reversal are done by the test runner with the shared token, which the administrator (actor-qoimeks-qa2-admin / TENANT_ADMIN) creates and revokes (an admin function); every screen reading (balances, document list, phone width) is done by actor-qoimeks-qa2-storekeeper / STOREKEEPER. Both exist in actors.yaml for tenant/realm qoimeks-qa2 (T-2219 PM decision); the live login was not exercised in this writing step (acceptance verifies it; credentials come from the acceptance credential source, never from files); missing credentials block the affected outcomes.
# 3. Host and screens: the tenant host answers; the stock balance screen and the stock document list exist at main (read at main; the list filters by kind and state, not by operator, see step 8); the old-app address https://qa.bizdala.com/qoimeks/qoimeks-qa2 is a deployment precondition (precondition 2), its five routes read in lib/letflow/routers/shared_stock_access.ex; the labels Posted by, Receipt, Posted exist in ru and kk in web/src/modules/stock/documents/documentsMessages.ts.
# 4. Data: one item with a posted balance greater than 0 at one place (seeded; item, place and balance counts are read at the start of the run, not hard-coded); the item and place ids come from the run's own catalog and balances reads; the client id is not stored, so none is checked for earlier use; the tenant's scope enforcement is off; no shared access exists at the start (read in step 1).
# 5. Executable: every step runs with a browser or an HTTP client; the shared access value is created by the walk itself at step 2 and kept only in the run's environment.
# 6. Dry run: uat.sh preflight not run by the writer (no acceptance environment in this step).
# T-2265 code-reading pass (PM 2026-11-19), read against origin/main: (a) old-app address stated in full (https://qa.bizdala.com/qoimeks/qoimeks-qa2, routes catalog, balances, movements, post, reverse in lib/letflow/routers/shared_stock_access.ex); (b) the old-address balances read sums responsible, lot and unit rows per item and place (OldAppReads.balances), so the 'first active employee' item-picking rule was removed and all balances are sums; (c) the client id in the post body is not stored and no read shows it, so the 'no earlier movement with this client id' precondition was removed; (d) the shared access admin API needs an interactive sign-in, an API token is refused (shared_access_guarded); (e) ids are assigned from 1 in the order of the first catalog read of this run, never the old Qoimeks ids; (f) retry deduplication at this address is NOT built on main (OldAppWrites moduledoc: the client id is accepted and ignored), so the scenarios keep the documented current behaviour, as the PM task allows only #4764 and #4771 as target-behaviour defects. The 'for another server' refusal of a queued entry is the OLD Qoimeks app (checked by the Qoimeks team) and is not UAT-observable here.
---
id: qoimeks-retry-1-receipt-sent-twice-posts-two-documents
scope: qoimeks-qa2
title: A receipt posted twice from the old-app address with the same client id currently posts two documents (retry deduplication pending T-2029)
version: "2.0"
tags: [qoimeks, retry, idempotency-gap, old-app, receipt, balance, ru]

description: >
  Decision 0091 section 9 notes that retry deduplication by client id at the old-app address is a
  future feature deferred to T-2029. Currently the client `id` field in the POST /movements body is
  accepted and ignored (Letflow.Routers.SharedStockAccess, REQ-860 build #4666); a second send with
  the same client id creates a second stock document. This scenario documents that current behavior as
  a known gap. The walk first creates the tenant's shared stock access through the admin API and keeps
  the one-time value in the run's own environment only. The test runner then sends a receipt for 5
  units twice with the same client id R-RETRY-1. The expected current behavior: both sends are accepted
  (201 each with different movement ids), the balance increases by 10 (not by 5), and the document
  list shows two posted receipts, each reading "Posted by" the test operator. When T-2029 is delivered
  and A2 returns the same movement id as A1, this scenario should be retired.
  Cleanup: both posted receipts are reversed and the shared access created at the start is revoked, so
  the tenant is left as it began.
  Not exercised, with reasons: (a) the actual phone screen and APK; (b) concurrent sends.

actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The tenant's scope enforcement is off.
    check: system_seeded
    detail: >
      While the scope enforcement is "on" or "shadow", every old-app request is answered 403
      scope_enforcement_active (decision 0091 sections 9 and 11b) and no step of this walk can run.
      If it is not off, report BLOCKED for the whole scenario; switching it is the platform
      operator's act, not the walk's.
  - description: >
      The qoimeks-qa2 tenant is listed in LETFLOW_SHARED_STOCK_ACCESS_TENANTS (REQ-857 build #4658,
      REQ-858 build #4662), and the old-app address (decision 0091 section 6, REQ-859 build #4664)
      answers at https://qa.bizdala.com/qoimeks/qoimeks-qa2 (the slug is qoimeks-qa2).
    check: system_seeded
    detail: >
      The walk creates the shared access itself at step 2, so none needs to exist. If the old-app
      address is not reachable or the deployment setting does not list the tenant, report BLOCKED
      for the whole scenario and name which precondition is missing.
  - description: >
      The tenant has at least one catalog item with a posted opening balance greater than 0 in
      at least one place (from the synthetic data: the item and balance counts are read at the start of the run, not hard-coded). The
      item used in this run is called ITEM-RETRY-R1 for naming purposes.
    check: system_seeded
    detail: If no item with a positive balance can be identified, report BLOCKED.
  - description: >
      The client id the walk sends in the body field id is its own value; it is not stored and no read shows it (the movement rows carry id, kind, sku_id, location_id, quantity, operator, created_at), so the walk cannot and need not check that it was unused.
    check: test_setup
    detail: >
      Nothing to prepare. The two sends are told apart by the movement ids and the balance, never by the client id.
  - description: The run can drive a real browser.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the balance and document steps.
  - description: The storekeeper account of this tenant (actor-qoimeks-qa2-storekeeper, role STOREKEEPER) can sign in.
    check: system_seeded
    detail: >
      Needed only for the last step. If the sign-in of this account fails, report that step as BLOCKED-by-environment
      and name the account; every other step still runs.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator, signed in on the tenant's own address
      (https://qoimeks-qa2.letflow.qa.bizdala.com), reads the status of the tenant's shared stock
      access through the admin API. The answer is noted as S0.
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator creates the shared stock access with an empty request (the system generates
      the value). The answer is noted as C1; the value in it is noted as V1 and is kept only in the
      run's own environment, never in a file, a screenshot or the report. The status is read again
      and noted as S1.
    via: api
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper opens the stock balance screen in Russian at 1440 px and picks an item with a posted balance above 0 at one place (named ITEM-RETRY-R1 and its place). The balance of
      ITEM-RETRY-R1 at that place (the sum of its rows there) is noted as B0.
    via: ui
  - step: 4
    actor: admin
    action: >
      Before the first send the test runner maps the item and the place to the integer ids the old-app address needs, from the run's own reads only: it reads GET /catalog and GET /balances at the old-app address (https://qa.bizdala.com/qoimeks/qoimeks-qa2) with Authorization: Bearer V1, finds the item by its name or article and the place by its name, and takes the integer sku_id and location_id from those answers (the integers are assigned from 1 in the order of the first catalog read of this tenant; they are never the ids of the old Qoimeks installation, and none is taken from a file or from memory). The old-address balances read adds up every responsible, lot and unit row of one item at one place, so every balance named B0, B1-api, B1-ui, B1-phone or BFINAL in this walk is that sum: on the Balances screen it is the sum of the item's rows at that place (filter by item and place). If the post is refused 422 location_not_linked (the place is linked to no org unit), pick another place that holds the item. The test runner sends a receipt to the old-app address for ITEM-RETRY-R1, quantity 5,
      operator name "Тест-повтор", client id R-RETRY-1 (the `id` field in the JSON body), presenting
      V1 as the bearer credential (the word Bearer followed by the value). The answer is noted as A1.
    via: api
  - step: 5
    actor: admin
    action: >
      The test runner sends the same receipt a second time: same item, same quantity 5, same
      operator name, same client id R-RETRY-1. The answer is noted as A2.
    via: api
  - step: 6
    actor: admin
    action: >
      The test runner reads the balance of ITEM-RETRY-R1 from the old-app address balances call.
      The answer is noted as B1-api.
    via: api
  - step: 7
    actor: storekeeper
    action: >
      The storekeeper refreshes the stock balance screen in Russian at 1440 px and reads the
      balance of ITEM-RETRY-R1. The result is noted as B1-ui.
    via: ui
  - step: 8
    actor: storekeeper
    action: >
      The storekeeper opens the stock document list, filters it to the kind Receipt and the state
      Posted, finds the two new receipts of this walk and opens each one, reading the row
      "Posted by" ("Кем проведён" in Russian). The operator names read are noted as D1.
    via: ui
  - step: 9
    actor: storekeeper
    action: >
      The storekeeper opens the balance screen at 390 px. The balance of ITEM-RETRY-R1 is
      noted as B1-phone.
    via: ui
  - step: 10
    actor: admin
    action: >
      The test runner reverses the first receipt (movement id from A1) at the old-app address
      with operator name "Тест-откат". The answer is noted as REV1.
    via: api
  - step: 11
    actor: admin
    action: >
      The test runner reverses the second receipt (movement id from A2) at the old-app address
      with operator name "Тест-откат". The answer is noted as REV2 and the balance is noted as
      BFINAL.
    via: api
  - step: 12
    actor: admin
    action: >
      The administrator revokes the shared stock access created in step 2 (the answer is noted as
      D3) and reads the status again (noted as S3), so that the tenant ends with none.
    via: api
  - step: 13
    actor: storekeeper
    action: >
      The storekeeper, signed in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com), asks the admin API for the status of the tenant's shared stock access
      (the read; nothing is created or changed). The answer is noted as R-SK.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: Both sends answer 201 with different movement ids (current non-idempotent behavior).
    verification:
      method: api_response
      detail: >
        A1 has HTTP status 201 and contains a movement id M1. A2 has HTTP status 201 and contains
        a movement id M2 where M2 differs from M1: each send was treated as a new document. This
        is the current behavior when retry deduplication is not yet built. Note: if A2 returns M1
        (the same movement id), retry deduplication from decision 0091 section 9 / T-2029 has been
        delivered; retire this scenario.
      evidence: "HTTP status and movement ids of A1 (M1) and A2 (M2) compared."
    on_fail:
      severity: BLOCKER
      business_impact: >
        If either send returns a non-201 status, the old-app write path is broken and the Qoimeks
        application cannot post movements.
      suggested_action: route_to_wf03

  - id: EO-002
    description: The balance increased by 10 (B0 plus 5 plus 5), reflecting two posted documents.
    verification:
      method: api_response
      detail: >
        B1-api equals B0 plus 10. This is the current behavior: the second send was treated as a
        new receipt. Note: if B1-api equals B0 plus 5, deduplication may already be working.
      evidence: "B0 and B1-api values from the balances call."
    on_fail:
      severity: MAJOR
      business_impact: >
        If B1-api equals B0 plus 5, deduplication may be working and T-2029 may have been
        delivered. If B1-api is not B0 plus 10 or B0 plus 5, the write path produced an incorrect
        balance.
      suggested_action: route_to_wf03

  - id: EO-003
    description: The stock balance screen in Russian shows the balance increased by 10.
    verification:
      method: gui_screen
      detail: >
        B1-ui equals B0 plus 10. All text on the balance screen is in Russian (column headings,
        item names, unit label). No raw message key appears.
      evidence: "Screenshot of the balance screen in Russian at 1440 px."
    on_fail:
      severity: MAJOR
      business_impact: The warehouse team reads balances in Russian; a wrong or untranslated balance harms stock decisions.
      suggested_action: route_to_frontend_dev

  - id: EO-004
    description: The document list shows two posted receipts of this walk, each "Posted by" the test operator.
    verification:
      method: gui_screen
      detail: >
        Step 8 shows exactly two new receipts of this walk in the list filtered to the kind Receipt
        and the state Posted, and opening each one shows the row "Posted by" ("Кем проведён") reading
        "Тест-повтор". This confirms two separate documents were created by the two sends. (The list
        has no operator filter; the operator is read inside each document.)
      evidence: "Screenshots of the two opened documents with the Posted by row."
    on_fail:
      severity: MAJOR
      business_impact: >
        If only one new receipt is found, deduplication may be working. If none is found,
        neither send was recorded correctly.
      suggested_action: route_to_wf03

  - id: EO-005
    description: The balance screen at 390 px shows the same increased balance.
    verification:
      method: gui_screen
      detail: B1-phone equals B1-ui (B0 plus 10). No horizontal clipping at 390 px.
      evidence: "Screenshot of the balance screen at 390 px."
    on_fail:
      severity: MINOR
      business_impact: Phone users see a different or clipped balance.
      suggested_action: route_to_frontend_dev

  - id: EO-006
    description: Both reversals are accepted and the balance returns to B0.
    verification:
      method: api_response
      detail: >
        REV1 has HTTP status 201. REV2 has HTTP status 201. BFINAL equals B0. The synthetic
        balance is restored.
      evidence: "HTTP status of REV1 and REV2; BFINAL equals B0."
    on_fail:
      severity: MINOR
      business_impact: >
        The synthetic balance is left in a changed state; subsequent runs of this scenario may
        start from a wrong balance.
      suggested_action: route_to_wf03

  - id: EO-007
    description: The shared access created at the start is revoked, leaving the tenant as it began.
    verification:
      method: api_response
      detail: >
        S0 said exists is false before the walk. D3 has HTTP status 204 (no content). S3 is 200
        with exists is false: the tenant holds no shared stock access after the walk, so the
        sibling group qoimeks-token can run its own create-revoke walk on the same tenant.
      evidence: "The exists flags of S0 and S3 and the status of D3."
    on_fail:
      severity: MAJOR
      business_impact: >
        A live shared credential is left on the QA tenant after the run, with a value that sat in
        the run's environment; the old-app address stays open until the operator revokes it.
      suggested_action: route_to_wf03

  - id: EO-008
    description: A storekeeper, who holds no right to manage tokens, is refused the shared stock access routes of the admin API.
    verification:
      method: api_response
      detail: >
        R-SK has HTTP status 403, and its body carries no "exists", "created_at" or other status field of the shared access (only the refusal). The permission is TokensManage, held by the
        tenant administrator only among the tenant roles.
      evidence: "HTTP status and body of R-SK."
    on_fail:
      severity: BLOCKER
      business_impact: >
        A warehouse clerk could learn about, replace or revoke the credential the old app uses to post stock, and so cut off the warehouse or open the tenant's stock to others.
      suggested_action: route_to_elixir_dev
