# T-2283: decision 0091 section 9, Retry by client id (including T-2282 amendment),
# REQ-860 criteria 1-3 and 7; docs/runbooks/pilot-rollout.md shared-access item 3.
# Unknown numeric map ids cannot be proved unused through the old-address reads alone; scenario 4
# tests non-integer references instead (ref/int and entry_of in OldAppWrites). Authentication
# refusals retain the identical old-address 401 contract.
# Contract verified against lib/letflow/modules/stock/old_app_writes.ex (client_key,
# post_movement, reverse_movement, movement_hash, stored), routers/shared_stock_access.ex
# (authenticate before write, created/replayed response), and I-1..I-6 in
# test/letflow/routers/shared_stock_access_writes_test.exs on origin/main.
# Protocol for the runner: base https://qa.bizdala.com/qoimeks/qoimeks-qa2;
# T-2385 (K15, old-client compatibility batch, decision 0091 section 11c, REQ-907..909): every call is made the way the old app makes it, at the old address WITH the /api prefix:
# GET <base>/api/catalog (an object {skus: [{id, code, name, unit, location_id}], locations: [{id, code, name}]}), GET <base>/api/balances?sku_id=<id> (a list of {sku_id, location_id, location_code, qty}),
# GET <base>/api/movements?limit=500, POST <base>/api/movements, POST <base>/api/movements/<id>/reverse (the path id = the TEXT id of the movement row, which is the movement number written as text).
# Refusals follow the OLD server: the retry of a changed body stays 409 (decision 0091 section 9), the reversal and quantity refusals are 400 with the old texts; the 401 body is unchanged (the app reads only the status).
# Both write bodies require id = a fresh UUID per operation, unchanged on retries, plus operator.
# Movement body also has kind, sku_id, location_id, qty; transfer has to_location_id.
# Returned JSON is the movement itself (REQ-909): id (text), kind (receipt, issue, transfer), sku_id, sku_code, sku_name, unit,
# location_id, location_code, qty, operator, created_at, balances (not a wrapper and not an echo of the client's UUID). Compare the whole decoded row.
# Admin shared-access status/create/revoke: interactive tenant sign-in, not an API token.
# 1. Scope: actors.yaml declares the existing QA tenant qoimeks-qa2 (T-2219); realm qoimeks-qa2 verified by preflight. Tenant lookup is UNKNOWN without an authenticated token.
# 2. Actors: actor-qoimeks-qa2-admin / TENANT_ADMIN manages shared access; actor-qoimeks-qa2-storekeeper / STOREKEEPER reads stock screens. Both are in actors.yaml. QA login is an acceptance precondition, not proven by static checks; no login verified in this writing step.
# 3. Host and screens: stockRoutes.tsx guards balances/documents with StockRead under the module guard; docs/roles.md and stock role_grants grant it to STOREKEEPER. BalancesPage.tsx supports item/place filters; DocumentList.tsx supports kind/state, not operator. Tenant host GET returned 200 during writing; preflight health and deployed SHA passed. Enabled old-address access remains an authenticated acceptance precondition.
# 4. Data: scripts/pilot/qoimeks_gen.py gen_items/gen_locations/gen_balances supplies candidate items, places and positive opening quantities, not live posting proof. Before acceptance verify imported openings, active masters/base unit, linked active org unit, active employee, active stock definitions, no freeze, scope enforcement off, tenant allow-listed, and no existing shared access. Missing prerequisites are BLOCKED-by-environment; never change production settings. Record item/place/balance counts at the start of the run. UUIDs and all mapped integer ids come from this run; no seed counts or invented item codes.
# 5. Executable: browser and HTTP client suffice, including concurrent sends; runner creates one shared credential per scenario and keeps it only in memory. Run serially with the token group; never replace an existing credential. OldAppReads.movements is a capped list, with no client pagination: use limit 500 (movement_limit), identical filters and require every snapshot to contain fewer than 500 rows; otherwise BLOCKED-by-environment for movement-count evidence. Snapshot comparisons use all returned ids and values, never only the newest row. No physical APK/phone UI is UAT-observable here; browser phone width is covered.
# 6. Dry run: preflight with title UAT qoimeks-retry returned ENV_NOT_READY: QA health and deployed SHA OK, realm OK; both actors NO_PASSWORD, tenant/app roles UNKNOWN without tokens. Acceptance is BLOCKED-by-environment until credentials are supplied; no live login verified. No acceptance scenarios run in this writing step.
# EXPECTATION CORRECTIONS: 14 — /api prefix on every call; catalog and balances read in the old shape (code, location_code, qty); reverse path id is the text id; receipt replay; issue replay; changed-data conflict; one balance/document; reversal replay; second/reversal-of-reversal refusals; required UUIDs on both writes; concurrent duplicates; stored-row comparison; runtime-derived quantities and malformed references; capped movement-read evidence.
---
id: qoimeks-retry-3-changed-data-refused-concurrent-duplicates-post-once
scope: qoimeks-qa2
title: Changed data is refused and concurrent duplicate receipts post once
version: '3.0'
tags:
- qoimeks
- retry
- old-app
- conflict
- balance
- ru
- idempotency
description: >-
  Decision 0091 section 9 (Retry by client id, T-2282 amendment) and REQ-860 govern this walk. First success
  returns 201; the same client operation and equal stock data returns the stored movement with 200 and
  no second posting. Changed stock data is refused with 409. Each reversal has its own operation UUID.
  The walk restores stock and revokes only the credential it created. The shared credential authorizes
  runner requests; the administrator manages it and the storekeeper reads screens.
actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: Acceptance environment is ready for the old-app address and stock posting.
  check: system_seeded
  detail: >-
    Verify every Data and Host and screens prerequisite in the header against the tenant before writing.
    Stock is installed and the deployed build includes retry support. The tenant host is https://qoimeks-qa2.letflow.qa.bizdala.com
    and the old-app base is https://qa.bizdala.com/qoimeks/qoimeks-qa2. Missing deployment, seed data,
    settings or logins is BLOCKED-by-environment; request environment preparation first.
- description: Both roster accounts can sign in and a browser and HTTP client are available.
  check: system_seeded
  detail: >-
    Acceptance verifies the administrator and storekeeper in realm qoimeks-qa2; no live login was verified
    by the writer. No simultaneous stock activity or token-group walk may affect this item/place during
    measurements.
- description: No shared stock credential exists at the start.
  check: system_seeded
  detail: >-
    Read status first; if one exists, stop BLOCKED-by-environment without creating, replacing or revoking
    it.
- description: Choose a seeded item/place with a positive posted balance and valid posting masters.
  check: system_seeded
  detail: >-
    Read the item and place at run time; use their actual names and mapped integers, never placeholder
    item codes. Choose quantity Q equal to half the smallest positive responsible/unit balance row for
    this item/place, rounded down to its supported quantity precision; Q must remain positive. Confirm
    the row selected by the old-address active employee/base unit has at least Q for an issue. If no eligible
    row exists, stop BLOCKED-by-environment.
- description: Generate fresh operation UUIDs in memory for this scenario.
  check: test_setup
  detail: >-
    Generate U for the movement and R for its reversal, plus fresh UUIDs for independent attempts. Keep
    each unchanged on retries. The response movement id (the movement number written as text) is distinct from these UUIDs; do not expect
    a client UUID field in reads.
- description: Movement snapshots can prove unchanged stock history.
  check: system_seeded
  detail: >-
    The old-app movements read has no client pagination. Use limit 500 and the same mapped item/place
    filters for all snapshots. Verify each read has fewer than 500 rows, including after the planned posts
    and reversals; otherwise mark movement-count evidence BLOCKED-by-environment and choose an isolated
    item/place before writing. For unknown movement refusal in the access scenario, require the unfiltered
    list to be below this limit too. Source: OldAppReads.movement_limit and movements in lib/letflow/modules/stock/old_app_reads.ex.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in on the tenant host and reads shared stock access status as S0. Continue
    only if no access exists. Create access with an empty request, keep its one-time value V only in memory,
    then read status as S1.
  via: api
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper opens the balance screen in Russian at 1440 px, selects the eligible item and place
    and records B0, the sum of all its responsible, lot and unit rows there. Record the item/place/balance
    counts and the existing stock document list for comparison.
  via: ui
- step: 3
  actor: admin
  action: >-
    With V the runner reads the old-app catalog and balances, matches the chosen item by its code and name (skus) and the chosen place by its code and name (locations) and records their mapped integer ids. Confirm the summed balance equals B0. Read all
    matching movements with the maximum supported limit as L0. Record Q from the eligible balance row.
    Keep every measured value for later comparisons.
  via: api
- step: 4
  actor: admin
  action: >-
    The runner sends a receipt at the old-app address with V, the mapped item/place, quantity Q, the signed-in
    storekeeper’s display name as operator, and operation UUID U in the body field id. Record the answer
    as A1.
  via: api
- step: 5
  actor: admin
  action: >-
    The runner resends the receipt with the same U, mapped item/place and operator but quantity equal
    to Q plus Q. Record C1.
  via: api
  expect_refusal: true
- step: 6
  actor: admin
  action: >-
    The runner reads the summed balance as BC and all matching movements as LC, before any further posting.
  via: api
- step: 7
  actor: admin
  action: The runner sends the valid receipt data without an operation id. Record M1.
  via: api
  expect_refusal: true
- step: 8
  actor: admin
  action: >-
    The runner sends the valid receipt data with the body id set to the text not-a-uuid. Record M2.
  via: api
  expect_refusal: true
- step: 9
  actor: admin
  action: >-
    The runner attempts reversal of the movement from A1 with V and the operator, omitting its operation
    id. Record M3.
  via: api
  expect_refusal: true
- step: 10
  actor: admin
  action: >-
    The runner attempts reversal of the same movement with V and the operator, setting body id to the
    text not-a-uuid. Record M4.
  via: api
  expect_refusal: true
- step: 11
  actor: admin
  action: >-
    The runner reads the summed balance and all matching movements as BM and LM. Generate a fresh operation
    UUID C. Send two identical receipts concurrently with V, C, the same mapped item/place, operator and
    Q; dispatch both before awaiting either response. Record P1 and P2. Read summed balance BP and all
    matching movements LP.
  via: api
- step: 12
  actor: admin
  action: >-
    The runner reverses the original receipt returned in A1 using fresh reversal UUID R and records REV1.
    Reverse the receipt returned by the concurrent pair using another fresh reversal UUID, recording REV-C.
    Read summed balance BFINAL and all matching movements LFINAL.
  via: api
- step: 13
  actor: admin
  action: >-
    The runner resends the valid receipt using R, the operation id already used for a reversal. Record
    MIX.
  via: api
  expect_refusal: true
- step: 14
  actor: admin
  action: >-
    The runner reads the summed balance and all matching movements as BAFTER and LAFTER. The administrator
    revokes only this walk’s shared access, records D3 and reads status as S3.
  via: api
- step: 15
  actor: storekeeper
  action: >-
    The storekeeper reads the restored balance at 1440 px and 390 px in Russian and compares each summed
    balance with B0.
  via: ui
- step: 16
  actor: admin
  action: The runner requests the old-app catalog without a credential and records N1.
  via: api
  expect_refusal: true
- step: 17
  actor: admin
  action: The runner requests the same catalog with an unissued credential and records N2.
  via: api
  expect_refusal: true
expected_outcomes:
- id: EO-001
  description: Changed data is refused without changing stock.
  verification:
    method: api_response
    detail: >-
      A1 is 201. C1 is 409 with exactly {"error":"this operation was already posted with different data"}.
      BC equals B0 plus Q; LC differs from L0 only by the movement in A1.
    evidence: >-
      A1 is 201. C1 is 409 with exactly {"error":"this operation was already posted with different data"}.
      BC equals B0 plus Q; LC differs from L0 only by the movement in A1.
  on_fail:
    severity: BLOCKER
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
- id: EO-002
  description: Both writes require an operation UUID.
  verification:
    method: api_response
    detail: >-
      M1, M2, M3 and M4 are each 400 with exactly {"error":"id is required"}. BM equals BC and LM equals
      LC; none posts or reverses anything.
    evidence: >-
      M1, M2, M3 and M4 are each 400 with exactly {"error":"id is required"}. BM equals BC and LM equals
      LC; none posts or reverses anything.
  on_fail:
    severity: BLOCKER
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
- id: EO-003
  description: Concurrent duplicates post only one movement.
  verification:
    method: api_response
    detail: >-
      Exactly one of P1/P2 is 201 and the other is 200. Their entire decoded movement rows are equal.
      BP equals BM plus Q. LP differs from LM by exactly that one movement.
    evidence: >-
      Exactly one of P1/P2 is 201 and the other is 200. Their entire decoded movement rows are equal.
      BP equals BM plus Q. LP differs from LM by exactly that one movement.
  on_fail:
    severity: BLOCKER
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
- id: EO-004
  description: Cleanup restores stock and mixed operation ids are refused.
  verification:
    method: api_response
    detail: >-
      REV1 and REV-C are 201 with distinct reversal movement ids. BFINAL equals B0. MIX is 409 with exactly
      {"error":"this operation was already posted with different data"}; BAFTER equals BFINAL and LAFTER
      equals LFINAL. D3 is 204; S0 and S3 say exists is false and S1 says exists is true.
    evidence: >-
      REV1 and REV-C are 201 with distinct reversal movement ids. BFINAL equals B0. MIX is 409 with exactly
      {"error":"this operation was already posted with different data"}; BAFTER equals BFINAL and LAFTER
      equals LFINAL. D3 is 204; S0 and S3 say exists is false and S1 says exists is true.
  on_fail:
    severity: BLOCKER
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
- id: EO-005
  description: Restored stock is visible on both widths.
  verification:
    method: gui_screen
    detail: >-
      The summed balance on each refreshed screen equals B0. Navigation and field labels are Russian;
      no horizontal clipping at 390 px.
    evidence: >-
      The summed balance on each refreshed screen equals B0. Navigation and field labels are Russian;
      no horizontal clipping at 390 px.
  on_fail:
    severity: MAJOR
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
- id: EO-006
  description: Unauthorized reads give identical refusals.
  verification:
    method: api_response
    detail: >-
      N1 and N2 are 401. Remove trace_id before comparing their bodies; they are byte-identical and contain
      no stock or credential details. These reads change nothing.
    evidence: >-
      N1 and N2 are 401. Remove trace_id before comparing their bodies; they are byte-identical and contain
      no stock or credential details. These reads change nothing.
  on_fail:
    severity: BLOCKER
    business_impact: Stock may be duplicated, lost or reported incorrectly; retry safety cannot be accepted.
    suggested_action: route_to_wf03
