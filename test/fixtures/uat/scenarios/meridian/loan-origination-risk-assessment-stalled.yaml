# Authored by BA-MERIDIAN (GH #2330, process-audit PA-MERIDIAN-004, checklist D2).
# Written against test/fixtures/qa/meridian_loan_origination_process_definition.json on main.
# Covers the human task risk-assessment-escalation-review (role-cro); first level risk-assessment (P2D).
# Timers are forced with POST /api/v1/instances/{instance_id}/advance-timer (ISS-0389): the step input
# advance_timer_node names the node whose timer UAT-RUNNER advances. If the timer is not armed on that node the
# scenario is BLOCKED there, not passed.
---
id: meridian-loan-origination-risk-assessment-stalled
company_id: meridian
process_id: proc-meridian-loan-origination
title: A risk assessment nobody completes, even after escalation to the CRO, leaves no rating and the application is declined
version: "1.0"
tags: [escalation, timeout, fail_closed]

description: >
  A EUR 50,000 loan application starts the parallel assessments. The credit manager passes the
  credit memo and KYC screening clears, but the risk manager does not complete the risk
  assessment. The risk timer fires and the assessment is escalated to the Chief Risk Officer, who
  does not act either. With no risk rating recorded the eligibility gate cannot pass the
  application and declines it; it is never approved by default.

actors:
  analyst: actor-meridian-sophie
  credit_manager: actor-meridian-ben
  risk_manager: actor-meridian-miriam
  cro: actor-meridian-thomas

preconditions:
  - description: Loan origination process definition is active
    check: process_definition_active
  - description: No pending loan origination instances for Meridian
    check: no_pending_instances

steps:
  - step: 1
    actor: analyst
    action: >
      Submits a loan application for EUR 50,000 (below the 500,000 committee threshold)
      for a corporate borrower, term loan with 36-month tenor
    via: api
    input:
      application_id: sim-meridian-loan-esc-006
      applicant_id: borrower-corp-esc-006
      requested_amount_eur: 50000
      product_type: term_loan
      tenor_months: 36
      analyst_actor_id: actor-meridian-sophie
      purpose: "Equipment financing"
    produces:
      instance_id: "the process instance ID for this loan application"

  - step: 2
    actor: credit_manager
    action: Reviews the credit memo and passes it
    via: api
    input:
      credit_decision: pass
      recommended_rate_bps: 450
      credit_notes: "Adequate collateral."

  - step: 3
    actor: risk_manager
    action: >
      Does not complete the risk assessment. The task stays open until its time limit is reached.
    via: api
    note: >
      No action is taken on purpose. UAT-RUNNER advances the risk-assessment timer with
      advance-timer rather than waiting 2 days.
    input:
      advance_timer_node: risk-assessment

  - step: 4
    actor: cro
    action: >
      Receives the escalated risk assessment but does not act. The task stays open until its time
      limit is reached.
    via: api
    note: >
      UAT-RUNNER advances the risk-assessment-escalation-review timer with advance-timer.
    input:
      advance_timer_node: risk-assessment-escalation-review

expected_outcomes:
  - id: EO-001
    description: >
      When the risk manager does not assess in time, the assessment is escalated to the CRO and
      the risk manager's task is no longer open
    verification:
      method: task_assigned
      detail: >
        after advancing risk-assessment: task 'risk-assessment-escalation-review' assigned to
        role-cro (actor-meridian-thomas); 'risk-assessment' no longer open
    on_fail:
      severity: BLOCKER
      business_impact: >
        An unassessed application stalls and no senior risk officer is asked to rate it.
      suggested_action: route_to_wf03

  - id: EO-002
    description: >
      When the CRO does not rate the risk either, no risk rating exists and the application is
      declined, never approved by default
    verification:
      method: instance_state
      detail: >
        after advancing risk-assessment-escalation-review: instance status == COMPLETED, end node
        is 'end-declined', decline-application executed, risk_rating null/unset, no
        'l1-approval' task created, disburse-loan not executed
    on_fail:
      severity: BLOCKER
      business_impact: >
        A stalled risk assessment could let an application through without any risk rating.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: true
  description: Cancel instance sim-meridian-loan-esc-006 if not already completed
