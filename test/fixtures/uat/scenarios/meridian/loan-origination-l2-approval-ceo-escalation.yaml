# Authored by BA-MERIDIAN (GH #2330, process-audit PA-MERIDIAN-004, checklist D2).
# Written against test/fixtures/qa/meridian_loan_origination_process_definition.json on main.
# Covers the human task escalate-l2-approval-to-ceo (role-ceo); first level l2-approval (P2D).
# Timers are forced with POST /api/v1/instances/{instance_id}/advance-timer (ISS-0389): the step input
# advance_timer_node names the node whose timer UAT-RUNNER advances. If the timer is not armed on that node the
# scenario is BLOCKED there, not passed.
---
id: meridian-loan-origination-l2-approval-ceo-escalation
company_id: meridian
process_id: proc-meridian-loan-origination
title: An unanswered L2 credit decision is escalated to the CEO, and when the CEO also stays silent the application is declined
version: "1.0"
tags: [escalation, timeout, fail_closed]

description: >
  A EUR 50,000 loan passes both assessments and the L1 approver approves it. The credit director
  does not make the L2 decision, so the L2 timer fires and the decision is escalated to the CEO,
  who does not act either. The CEO's escalation timer fires and, with no L2 decision recorded,
  the application is declined (fail-closed) and no facility is created.

actors:
  analyst: actor-meridian-sophie
  credit_manager: actor-meridian-ben
  risk_manager: actor-meridian-miriam
  l1_approver: actor-meridian-lars
  credit_director: actor-meridian-julia
  ceo: actor-meridian-eva

preconditions:
  - description: Loan origination process definition is active
    check: process_definition_active
  - description: No pending loan origination instances for Meridian
    check: no_pending_instances

steps:
  - step: 1
    actor: analyst
    action: >
      Submits a loan application for EUR 50,000 (below the 500,000 committee threshold)
      for a corporate borrower, term loan with 36-month tenor
    via: api
    input:
      application_id: sim-meridian-loan-esc-003
      applicant_id: borrower-corp-esc-003
      requested_amount_eur: 50000
      product_type: term_loan
      tenor_months: 36
      analyst_actor_id: actor-meridian-sophie
      purpose: "Equipment financing"
    produces:
      instance_id: "the process instance ID for this loan application"

  - step: 2
    actor: credit_manager
    action: Reviews the credit memo and passes it
    via: api
    input:
      credit_decision: pass
      recommended_rate_bps: 425
      credit_notes: "Strong collateral."

  - step: 3
    actor: risk_manager
    action: Completes the risk assessment and rates the borrower low risk
    via: api
    input:
      risk_rating: low
      pd_percent: 1.2
      risk_notes: "Acceptable risk."

  - step: 4
    actor: l1_approver
    action: Approves the application at L1
    via: api
    input:
      l1_decision: approve

  - step: 5
    actor: credit_director
    action: >
      Does not make the L2 decision. The task stays open until its time limit is reached.
    via: api
    note: >
      No action is taken on purpose. UAT-RUNNER advances the l2-approval timer with
      advance-timer rather than waiting 2 days.
    input:
      advance_timer_node: l2-approval

  - step: 6
    actor: ceo
    action: >
      Receives the escalated L2 decision and does not act. The task stays open until its
      escalation time limit is reached.
    via: api
    note: >
      No action is taken on purpose. UAT-RUNNER advances the escalation timer of
      escalate-l2-approval-to-ceo with advance-timer rather than waiting a further 2 days.
    input:
      advance_timer_node: escalate-l2-approval-to-ceo

expected_outcomes:
  - id: EO-001
    description: >
      When the credit director does not decide at L2, the decision is escalated to the CEO and
      the L2 task is no longer open
    verification:
      method: task_assigned
      detail: >
        after advancing l2-approval: task 'escalate-l2-approval-to-ceo' assigned to role-ceo
        (actor-meridian-eva); 'l2-approval' no longer open
    on_fail:
      severity: BLOCKER
      business_impact: >
        An L2 decision nobody makes stalls the loan and the CEO is never asked.
      suggested_action: route_to_wf03

  - id: EO-002
    description: >
      When the CEO does not decide either, the application is declined and no facility is created
    verification:
      method: instance_state
      detail: >
        after advancing escalate-l2-approval-to-ceo: instance status == COMPLETED, end node is
        'end-declined', decline-application executed, create-facility and disburse-loan not executed
    on_fail:
      severity: BLOCKER
      business_impact: >
        A stalled L2 decision could end in a facility being created without any L2 approval.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: true
  description: Cancel instance sim-meridian-loan-esc-003 if not already completed
