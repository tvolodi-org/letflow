# T-1583 (BA batch 3, item 1): the side menu of the platform operator. The operator signs in to the platform company and sees the extra group Platform that no company
# user sees.
# Sources: AppShell.tsx (NAV_ITEMS: the six entries with platformOnly: true, group platform), navVisibility.ts (platformOnly entries also need the platform company),
# navMessages.ts, router.tsx (platformPage guards), test/fixtures/uat/actors.yaml (actor-platform-admin, tenant platform, PLATFORM_ADMIN), docs/roles.md.
# Companion: tenant-admin-76 (a company administrator sees no Platform group) and tenant-admin-77 (a worker is refused platform addresses).
# Completeness (EO-002): the full expected menu is the group Platform (six), Work (three), Tenant administration (ten core entries) plus the conditional Import data and
# Module lifecycle and module entries from the closed list; which modules the platform company has installed is not fixed by the roster, so module entries are checked
# against the closed list, not counted. This is a view check on the operator's own sign-in; no other company's data is requested.
# UAT assumption, to be confirmed by the process owner: the English names of the entries are those of navMessages.ts and the browser language is English.
# STOREKEEPER GAP: see tenant-admin-77; the roster has no storekeeper actor.
---
id: platform-role-sidebar-platform-operator
scope: platform
title: The platform operator's side menu has the group Platform with six entries, and each opens its page
version: "1.0"
tags: [platform, sidebar, role-visibility, gui]

description: >
  The platform operator signs in to the platform company and reads the side menu. Besides Work and Tenant administration it has a group Platform with Health, Register
  Tenant, Tenants, Services, Platform Migrations and Event Retention. Each of the six entries opens its page, not a refusal.

actors:
  operator: actor-platform-admin

preconditions:
  - description: The platform operator account is seeded and can sign in; the browser language is English.
    check: system_seeded
    detail: If the operator cannot sign in, report BLOCKED for the whole scenario, not FAIL.
  - description: The tester has the list of modules installed for the company (from the QA seeding record) and knows whether the company has an importable list type and whether the Module lifecycle feature switch is on.
    check: system_seeded
    detail: If the list of installed modules is not available, report BLOCKED for outcome EO-002 (UAT assumption, to be confirmed by the process owner; the roster does not fix the installed modules). The module table is in the outcome.

steps:
  - step: 1
    actor: operator
    action: >
      Signs in and reads the side menu: the names of its groups and of the entries under each group.
    via: gui
    produces:
      menu_screen: the groups and entries of the side menu
  - step: 2
    actor: operator
    action: >
      Opens, one after the other from the side menu, the entries Health, Register Tenant, Tenants, Services, Platform Migrations and Event Retention, and notes for each whether
      a page or the refusal text opens.
    via: gui
    produces:
      platform_screens: the six screens, one per entry

expected_outcomes:
  - id: EO-001
    description: The menu has a group called Platform with exactly the six platform entries.
    verification:
      method: gui_screen
      detail: The menu screen shows the group Platform with Health, Register Tenant, Tenants, Services, Platform Migrations and Event Retention and no other entry in that group.
      evidence: menu_screen.
    on_fail:
      severity: MAJOR
      business_impact: The operator cannot reach the tools that run the platform, or sees tools that do not belong to the group.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The groups Work and Tenant administration are present for the operator too.
    verification:
      method: gui_screen
      detail: >
        The menu screen shows the group Work with Instances, My Tasks and Definitions, and the group Tenant administration with all ten core entries Promotion Reviews,
        DLQ, Webhooks, Users, Groups, Tokens, Audit, Print Templates, Metrics and Solution Packs (with Import data only when the platform company has an importable
        list type, and Module lifecycle absent while its feature switch is off). Any other entry is a module entry of a module installed in the platform company, from this closed
        list: Items, Lots, Codes, Locations, Location links, Legal companies, Sites, Org units, Positions, Employees, Stock documents, Balances, Movements, Counts, Asset cards, Asset documents, Asset balances, Asset movements, Exams, Question Bank, Grading and Exam builder, and sits under the group Work. Positive presence: for every module on the recorded installed list, all entries of that module are present under the group Work (module table: Catalog items = Items, Lots; Codes = Codes; Locations = Locations, Location links; Org = Legal companies, Sites, Org units, Positions, Employees; Stock = Stock documents, Balances, Movements, Counts; Assets = Asset cards, Asset documents, Asset balances, Asset movements; Exam = Exams, Question Bank, Grading, Exam builder); Import data is present when the company has an importable list type and absent otherwise; Module lifecycle is present when its switch is on. An entry outside these fails the outcome.
      evidence: menu_screen.
    on_fail:
      severity: MINOR
      business_impact: The operator loses the pages of the platform company's own work.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: Each platform entry opens its page.
    verification:
      method: gui_screen
      detail: None of the six screens shows the refusal text, the access-error text or a not-found page; each shows its own title.
      evidence: platform_screens.
    on_fail:
      severity: MAJOR
      business_impact: The menu shows an entry the operator cannot use.
      suggested_action: route_to_frontend_dev
