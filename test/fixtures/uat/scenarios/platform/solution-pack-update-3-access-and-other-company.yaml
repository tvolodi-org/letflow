# T-0986 (BA-PLATFORM): REQ-617 slice S4, who may apply a pack update that would run over a company's deliberate change, and that one company never sees another's.
# Criteria covered, by REQ-617 number:
#   6 (the permission half: the update that holds an override_conflict needs the right to manage stored changes as well; a user with only the right to create
#     definitions is refused with the 403 of a route-level refusal, whether or not a decision is supplied, and nothing is written; the same user applying an update with no
#     override_conflict succeeds; the company administrator succeeds),
#   7 (company B installed the same pack without a stored change: its review and apply answer as today with no override key and never mention company A's
#     stored change; a company id in the body, query or header is ignored; the platform operator receives its own company's plan only).
# Sources: docs/requirements.yaml REQ-617 criteria 6, 7 and section (6) PERMISSION; docs/roles.md row SolutionOverridesManage (TENANT_ADMIN yes, PLATFORM_ADMIN yes, every other role no)
#   and the sentence that update-apply also requires it when the plan holds an override_conflict entry.
# Sensitive actions: change process definitions (the apply) is refused for a worker and an operator in steps 2 and 3; see another company's data: steps 6 to 8; approve, pay or release and change users: not in this flow.
# GAP (see sidecar test/fixtures/uat/scenario-env-limitations/platform-solution-pack-update-3-access-and-other-company.yaml, written because the task asked for it):
#   the roster has NO PROCESS_DESIGNER account in any company, and no actor may be invented, so the refusal of a user who holds DefinitionsCreate but not SolutionOverridesManage
#   (REQ-617 criterion 6: 403 "whether or not a resolution is supplied", and success of the same user on an update with no override_conflict) is NOT run in this scenario.
#   The task worker (step 2) and the process operator (step 3) below hold neither right: their refusal is the route-level refusal for the missing right to create definitions,
#   which is a different cause and does not replace the designer case. It is recorded as a GAP, not a pass.
# NOT UAT-OBSERVABLE: source scans for a missing company prefix, the global pack tables (criterion 7, 6); criteria 9 and 10 are build and review gates.
# The platform operator (actor-platform-admin) is on routes that take the company from the sign-in: it gets its own company's data, so step 8 is a no-data-leak check, not a refusal.
# Steps 2 and 3 are expected to be REFUSED (each step holds two requests, both must be refused). Every other step is an accepted case.
---
id: platform-solution-pack-update-3-access-and-other-company
scope: platform
title: Only a user who may manage stored pack changes can apply an update that overrides one, and one company never sees another's stored changes in an update
version: "1.0"
tags: [solution-pack, override, update, access, refusal, cross-tenant, isolation]

description: >
  SwiftRoute installed pack P at 2.0.0 and stored a change for process D1 (first-step label "Zq987654 access probe"); version 2.1.0 changes that label, so applying 2.1.0
  would run over the stored change. A SwiftRoute task worker and a process operator cannot apply the update at all and are refused, before and independent of any stored change.
  SwiftRoute's administrator applies it, with the decision to keep the company's own, and succeeds. Bilimbaga installed the same pack P without any stored change: its administrator reviews
  and applies 2.1.0, naming SwiftRoute's company id in the body, the query and a header, and gets the plain answers of today, with no override key and nothing of SwiftRoute's stored change.
  The platform operator asks for a review with lists of its own and gets a plan built only from those lists, with nothing of the two companies.

actors:
  tenant_admin_a: actor-swiftroute-alice
  worker_a: actor-swiftroute-marco
  operator_a: actor-swiftroute-lena
  tenant_admin_b: actor-bilimbaga-admin
  platform_operator: actor-platform-admin

preconditions:
  - description: SwiftRoute has an active installation of pack P at 2.0.0 with process D1 and an active stored change for D1 whose first-step label is "Zq987654 access probe"
    check: custom
    detail: Setup-prepared as in scenario solution-pack-update-2. If it cannot be prepared, the scenario is BLOCKED.
  - description: Bilimbaga has an active installation of the same pack P at 2.0.0 and NO stored change for it; the platform company has not installed P
    check: custom
    detail: Setup-prepared through the install route by the Bilimbaga administrator. If Bilimbaga cannot install P, steps 5 to 7 are BLOCKED, as the answer would then be that the pack is not installed. The Bilimbaga administrator needs an approved test token (roster note of actor-bilimbaga-admin); otherwise those steps are BLOCKED.
  - description: Version 2.1.0 of P changes the first-step label of D1 (for both companies), so that for SwiftRoute the update holds an override_conflict entry and for Bilimbaga it holds a plain clean update
    check: custom
    detail: The incoming list is prepared in setup for both companies.

steps:
  - step: 1
    actor: tenant_admin_a
    action: Asks for a review of what version 2.1.0 of pack P would change and notes the plan as RA1 (D1 is an override_conflict) and the number of versions of D1's stored change from the list route as NA.
    via: api
    input:
      target_version: "2.1.0"
    produces:
      update_review: the plan with D1 as override_conflict, not decided
    sla_context:
      expected_within_hours: null
  - step: 2
    actor: worker_a
    action: Asks to apply version 2.1.0 of pack P with the decision "keep the company's own" for D1, and asks to apply it a second time with no decision. Neither request is accepted.
    via: api
    input:
      target_version: "2.1.0"
    expect_refusal: true
    sla_context:
      expected_within_hours: null
  - step: 3
    actor: operator_a
    action: Asks to apply version 2.1.0 of pack P with the decision "keep the company's own" for D1, and asks to apply it a second time with no decision. Neither request is accepted.
    via: api
    input:
      target_version: "2.1.0"
    expect_refusal: true
    sla_context:
      expected_within_hours: null
  - step: 4
    actor: tenant_admin_a
    action: Reads the list of stored changes of pack P and compares the versions of D1 with NA (a read, accepted; the refusals of steps 2 and 3 must have left it as it was).
    via: api
    produces:
      override_list_after_refusals: the same versions as before
    sla_context:
      expected_within_hours: null
  - step: 5
    actor: tenant_admin_a
    action: Applies version 2.1.0 of pack P with the decision "keep the company's own" for D1.
    via: api
    input:
      target_version: "2.1.0"
    produces:
      update_result: the update is applied; D1's stored change is advanced
    sla_context:
      expected_within_hours: null
  - step: 6
    actor: tenant_admin_b
    action: >
      The Bilimbaga administrator asks for a review of what version 2.1.0 of pack P would change, with a request that also carries SwiftRoute's company id three times:
      as the body member "tenant_id", as the query parameter tenant_id, and as a header named "x-tenant-id". The answer is noted as RB1.
    via: api
    input:
      target_version: "2.1.0"
    produces:
      update_review: the plan for Bilimbaga's own installation
    sla_context:
      expected_within_hours: null
  - step: 7
    actor: tenant_admin_b
    action: The Bilimbaga administrator applies version 2.1.0 of pack P with the same three carriers of SwiftRoute's company id. The answer is noted as RB2.
    via: api
    input:
      target_version: "2.1.0"
    produces:
      update_result: the update is applied as it was before this feature
    sla_context:
      expected_within_hours: null
  - step: 8
    actor: platform_operator
    action: >
      The platform operator asks for a review of what version 2.1.0 of pack P would change, sending two artefact lists of its own: the platform company's current list with one process
      "Platform probe Q" and the incoming list with the same process id and a different label. The platform company has not installed P; the product does not refuse this, it builds the plan from
      the two lists the operator sent. Nothing of SwiftRoute's or Bilimbaga's installation or stored change is in the answer. This is a no-data-leak check, not a refusal test.
    via: api
    input:
      target_version: "2.1.0"
      theirs_artefacts: "the platform operator's own list: one process_definition with its own id and label Platform probe Q"
      incoming_artefacts: "the same id with label Platform probe Q2"
    produces:
      update_review: the platform company's own answer
    sla_context:
      expected_within_hours: null

expected_outcomes:
  - id: EO-001
    description: >
      Every request of steps 2 and 3 is refused with status 403, the same answer as for any user who lacks the right to create definitions; the four answers are identical in status and body (apart from the per-request trace id),
      and nothing is written: the versions of D1's stored change in step 4 equal NA, no decision record, no base change, no audit entry of an update.
    verification:
      method: http_status
      detail: Four answers, status 403, same decoded body; counts read before step 2 and after step 3 equal. (Note, this is the route-level refusal; the DefinitionsCreate-without-SolutionOverridesManage case is the GAP in the header.)
      evidence: The four answers and the two readings.
    on_fail:
      severity: BLOCKER
      business_impact: A user with no right to change processes could apply a pack update and overwrite a company's deliberate change.
      suggested_action: route_to_wf03
  - id: EO-002
    description: >
      The administrator's apply in step 5 succeeds; D1's stored change gets exactly one more version, active and made against 2.1.0, with the audit entry "pack update to 2.1.0: advanced". The review in step 1 showed D1 as override_conflict, not decided. (REQ-617 criterion 6: "A TENANT_ADMIN succeeds".)
    verification:
      method: api_response
      detail: Step 1 plan; step 5 answer with override_action advanced for D1; list of stored changes and audit entry.
      evidence: The answers, the list and the audit entry.
    on_fail:
      severity: BLOCKER
      business_impact: The company administrator could not complete an update that keeps its own change.
      suggested_action: route_to_wf03
  - id: EO-003
    description: >
      Bilimbaga's answers RB1 and RB2 are those of today: no key named override or override_action in any entry, no stored-change number, no outcome of SwiftRoute's stored change, and no text Zq987654; the plan is the clean update for Bilimbaga's own installation, and step 7 applies it.
      The company id in the body, the query and the header is ignored. (REQ-617 criterion 7: "tenant B's update-review and update-apply answer as in criterion 1 (override nil) and never mention tenant A's override_id or outcome".)
    verification:
      method: api_response
      detail: RB1 and RB2 searched for the key names override and override_action, for SwiftRoute's stored-change number and for the text Zq987654; no hit; step 7 status success.
      evidence: RB1 and RB2.
    on_fail:
      severity: BLOCKER
      business_impact: One company would learn that another company changed a pack process on purpose, and what it changed.
      suggested_action: route_to_wf03
  - id: EO-004
    description: >
      After step 7, SwiftRoute's stored change of D1 has no version written by Bilimbaga's request (the number of versions equals NA plus the one of step 5), and Bilimbaga has no stored change.
    verification:
      method: system_state
      detail: List of SwiftRoute's stored changes read by the SwiftRoute administrator after step 7; Bilimbaga's list read by its administrator is empty.
      evidence: The two lists.
    on_fail:
      severity: BLOCKER
      business_impact: A company's update could write into another company's stored changes.
      suggested_action: route_to_wf03
  - id: EO-005
    description: >
      The platform operator's answer in step 8 is the answer for its own company only (the pack is not installed there; the answer is 200 with a plan built only from the lists the operator sent, every entry classified conflict because there is no base record), with no override or override_action key on any entry and nothing of SwiftRoute's or Bilimbaga's plan, pack content or stored change. (REQ-617 criterion 7: "a PLATFORM_ADMIN token receives its own tenant's plan only".)
    verification:
      method: api_response
      detail: Answer of step 8 has status 200 and lists only the operator's own artefact id; searched for Zq987654, SwiftRoute's and Bilimbaga's override ids and any override or override_action key; no hit.
      evidence: The answer.
    on_fail:
      severity: BLOCKER
      business_impact: The platform operator would see companies' private process changes through an own-company route.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: true
  description: The platform team removes or deactivates the installation, base, stored-change and conflict-decision records created in SwiftRoute and Bilimbaga for the scenario, directly (no route uninstalls a pack); otherwise later runs use fresh pack ids.
