# Ported verbatim from R-Co tests/simulation/scenarios/platform/platform-renderer-permission-denied-surface.yaml
# (https://github.com/tvolodi/R-Co, commit d19bfec4a9ec492345346bfccd8e389bd9cd92db).
# Byte-identical below this header except for this comment block itself and the
# pipeline_test annotation noted below, if present. Read by UAT-RUNNER as a narrative
# scenario script (prose action/detail/evidence fields) -- NOT consumed by
# Letflow.Simulation.Runner.run/1, which requires the differently-shaped, disclosed-
# synthetic fixtures under test/fixtures/simulation/<company>/scenarios/ instead. Do
# not edit the ported content below except to keep it byte-identical to a re-pull of
# the same commit.
---
id: platform-renderer-permission-denied-surface
company_id: platform
platform_workflow: PW-13
process_id: sys-renderer-state-contract
title: A user without access is told plainly, and shown nothing about what lies behind it
version: "1.0"
tags: [regression]

description: >
  Every screen that loads information must end up in one clearly recognisable
  condition: still loading, showing the information, unable to reach the service,
  not permitted, out of date, or asked to slow down. This scenario proves the "not
  permitted" case. A user who loses access mid-session is told plainly that he does
  not have access and is offered a way back to his own work, and is shown nothing
  at all about what exists behind the area he was refused - no internal wording, no
  references, and no fragment of the information itself.

pipeline_test: web/tests/e2e/pipelines/renderer-states.pipeline.e2e.spec.ts
# NOTE (refreshed 2026-10-12; replaces the ISS-0526/ISS-0527 wording that said
# this spec file does not exist): the pipeline_test named above exists on main
# (checked 2026-10-12). Whether this scenario can run is decided per run by the
# UAT preflight and UAT-RUNNER, not by this note.
# UAT-RUNNER drives this Playwright pipeline test for all steps. If this file does
# not exist or the test cannot run, that is a BLOCKER (missing UI) and must be
# routed to FRONTEND-DEV before UAT can proceed.

actors:
  tenant_admin:  actor-swiftroute-alice
  business_user: actor-swiftroute-marco

preconditions:
  - description: SwiftRoute is set up with an administrator and an operations manager
    check: system_seeded
  - description: The operations manager currently has access to the shipment administration area
    check: custom
    detail: >
      The scenario removes this access part way through, so he must have it at the
      start for the change to be observable.

steps:
  - step: 1
    actor: business_user
    action: >
      Signs in and opens the shipment administration area, which he is currently
      permitted to see. He watches the screen from the first moment it appears until
      the information has finished loading.
    via: gui
    input:
      area: shipment administration
    produces:
      loading_screen: what the screen showed while the information was still loading
    sla_context:
      expected_within_hours: null

  - step: 2
    actor: tenant_admin
    action: >
      Removes the operations manager's access to the shipment administration area
      while he is still signed in and working.
    via: gui
    input:
      user: Marco Stein
      area: shipment administration
    sla_context:
      expected_within_hours: null

  - step: 3
    actor: business_user
    action: >
      Without signing out or reloading the browser, returns to the shipment
      administration area and reads carefully everything the screen now tells him.
    via: gui
    input:
      area: shipment administration
    produces:
      refusal_screen: what the screen showed after access was removed
    sla_context:
      expected_within_hours: null

  - step: 4
    actor: business_user
    action: >
      Tries a second route into the same area by typing its address directly into
      the browser rather than following a link, and compares what he is shown.
    via: gui
    input:
      area: shipment administration
    produces:
      direct_route_screen: what the screen showed when the area was reached directly
    sla_context:
      expected_within_hours: null

  - step: 5
    actor: business_user
    action: >
      Follows the link the message offers back to his own task list, and carries on
      with the work he is still permitted to do.
    via: gui
    sla_context:
      expected_within_hours: null

expected_outcomes:
  - id: EO-001
    description: >
      The screen says only that he does not have access to this area and who to
      contact about it. It shows nothing about what is behind it: no part of the
      information, no count of what is there, no references, and no internal wording
      that would hint at what exists.
    verification:
      method: gui_screen
      detail: >
        The screen at step 3 carries a plain access message and a contact
        instruction, and nothing else. No fragment of the shipment administration
        information appears anywhere on it.
      evidence: >
        Screenshot taken at step 3, reviewed line by line for anything beyond the
        access message.
    on_fail:
      severity: BLOCKER
      business_impact: >
        A person whose access was deliberately removed would still learn something
        about the area he was removed from. Revoking somebody's access would stop
        being a reliable control, which matters most in exactly the cases where it
        was revoked for cause.
      suggested_action: route_to_wf03

  - id: EO-002
    description: >
      He sees the same plain message whether he arrives through the application's
      own navigation or by typing the address directly. There is no back way in that
      behaves differently.
    verification:
      method: gui_screen
      detail: >
        The screens captured at steps 3 and 4 carry the same message and the same
        content.
      evidence: >
        Screenshots from steps 3 and 4, compared directly.
    on_fail:
      severity: MAJOR
      business_impact: >
        Access would depend on how somebody navigates rather than on what they are
        permitted to do. Anyone who kept an old address in their browser history
        could keep using it.
      suggested_action: route_to_wf03

  - id: EO-003
    description: >
      The screen never shows part of the information beside a refusal or an error.
      At any moment it is in exactly one condition, and the user is never left
      guessing whether what he can see is complete.
    verification:
      method: gui_screen
      detail: >
        Across steps 1, 3 and 4 no screen shows information and a refusal at the
        same time, and no screen shows a partly filled area next to a message.
      evidence: >
        Screenshots from steps 1, 3 and 4, each reviewed for a single clear
        condition.
    on_fail:
      severity: MAJOR
      business_impact: >
        Staff would act on partial information believing it complete. An operations
        manager could approve against a list that was quietly missing entries he was
        no longer allowed to see.
      suggested_action: route_to_wf03

  - id: EO-004
    description: >
      While information is still loading, the screen shows a placeholder in the
      shape of the finished layout, and the page does not jump or move when the real
      information arrives.
    verification:
      method: gui_screen
      detail: >
        The screen captured at step 1 shows a placeholder in the shape of the final
        layout from the first moment, and the layout does not shift when the
        information appears.
      evidence: >
        Screenshots taken at the first frame and after loading completes at step 1.
    on_fail:
      severity: MINOR
      business_impact: >
        Staff see a blank or jumping screen and click the wrong thing because it
        moved under them. Irritating and occasionally costly, but nothing is lost or
        exposed.
      suggested_action: none

  - id: EO-005
    description: >
      The refusal message offers a way back to work he can still do, and following
      it takes him to his own task list rather than leaving him stranded.
    verification:
      method: gui_screen
      detail: >
        The message at step 3 includes a route back, and following it at step 5
        opens his task list.
      evidence: >
        Screenshot of the task list after the link is followed at step 5.
    on_fail:
      severity: MINOR
      business_impact: >
        Staff get stuck on a dead end and contact support to ask how to get back to
        their own work. No business process is blocked, but every occurrence costs
        somebody's time.
      suggested_action: none

cleanup:
  cancel_open_instances: false
  description: >
    Restore the operations manager's access to the shipment administration area so
    later scenarios find him with his normal permissions. No process instances are
    created by this scenario.
