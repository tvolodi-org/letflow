# T-2310 (BA, PM 2026-11-19), group qoimeks-numbering: GO GATE 3 of 4 (decisions 0056 D2 and 0075). QA only, no real data.
# Source: docs/migration/decisions/0056-versioned-documents.md D2 (number <prefix>-<year>-<n>, n from 1; allocated at issue, not at draft; rollback releases it; a cancelled document keeps its number and it is not reused; a discarded draft carries no number so discarding creates no gap),
# docs/migration/decisions/0075-versioned-documents-render-after-numbering-commit.md (the number is allocated and committed first; a later failure does not release it),
# lib/letflow/modules/stock/stock.ex (document types stock_receipt prefix RCP and stock_issue prefix ISS, numbering_scope year, pad 6), lib/letflow/modules/stock/document_numbers.ex (the label RCP-2026-000001 shown to the user), lib/letflow/modules/stock/documents.ex moduledoc ("a refused check takes no number").
# 1. Scope: qoimeks-qa2 (exists, host https://qoimeks-qa2.letflow.qa.bizdala.com).
# 2. Actors: actor-qoimeks-qa2-storekeeper (STOREKEEPER: posts, reverses and cancels, docs/roles.md line 189); actor-qoimeks-qa2-admin (TENANT_ADMIN) only for the second-session part of the sibling group, not used here. Live login is a precondition for acceptance.
# 3. Host and screens: stock Documents screen (admin/stock/documents, kind filter, Number column 'stock.doc.col.number' = Номер / Нөмірі), Document screen (actions Issue, Discard, Reverse, Cancel document: 'stock.doc.action.*' in web/src/modules/stock/documents/documentsMessages.ts), Movements screen (stock.col.document). Routes in web/src/modules/stock/stockRoutes.tsx.
# 4. Data: an item with at least 10 on hand at one place linked to an org unit; the highest receipt number and issue number, and the item balance, are read at the start of the run. No count or number is fixed here.
# 5. Executable: a runner with a browser; the unauthorized refusal uses an HTTP client. One session, no loops.
# 6. Dry run: not run in this step (no acceptance environment; preflight title "UAT qoimeks-numbering").
# EXPECTATION CORRECTIONS: 3 (a) the year is the year shown in the Issued at field of the run's own document (the period is read from the server clock in the tenant's zone, 0056 D2; open point 11 left the zone open, so no calendar date is hard-coded); (b) a reversal does not allocate a new number of the receipt series in this scenario (not asserted either way: only the numbers of documents the runner issues are counted); (c) the quantity check of a refused issue is not used as the "refused issue takes no number" case because no reliably refused issue is known on this tenant (Documents moduledoc states the rule; it is covered by unit tests, not walked here).
# Purge of a posted document (decision 0074): not on main, not walked (see group qoimeks-signin header).
---
id: qoimeks-numbering-1-receipts-and-issues-number-without-gap-or-repeat
scope: qoimeks-qa2
title: >-
  Receipts and issues take consecutive numbers of the current year; a cancelled number is kept and not reused; a discarded draft takes none
version: "1.0"
tags: [qoimeks, numbering, documents, ledger, ru, kk, go-gate]

description: >-
  Decision 0056 D2 gives every issued document a number "prefix-year-n" with n counting up from 1 in its own
  series (here Receipt and Issue), allocated when the document is issued, never at draft. The storekeeper
  reads the highest receipt number and the highest issue number, issues and posts three receipts and two issues,
  discards one draft, and cancels one posted-and-reversed receipt. The numbers run N+1, N+2, N+3 without a gap or a
  repeat; the cancelled document keeps its number, the next receipt does not take it; the discarded draft
  took no number. Cleanup: every document of the walk is reversed so the balance returns.

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: An item with at least 10 on hand at one place linked to an org unit; the stock process definitions are ACTIVE.
    check: system_seeded
    detail: Read the Balances screen at the start; if none, BLOCKED-by-environment (name the missing data).
  - description: The tenant's receipt and issue are not four-eyes documents (four-eyes applies only to the opening and the quick count).
    check: system_seeded
    detail: If an issue is waiting for an approval, report BLOCKED-by-environment.
  - description: The storekeeper account can sign in.
    check: system_seeded
    detail: Name the account that cannot.

steps:
  - step: 1
    actor: storekeeper
    action: >-
      The storekeeper opens the Documents screen at 1440 px in Russian, filters the kind Receipt and notes the
      highest number shown as NR0 (the number of the newest receipt; none yet means the series starts at 1);
      then the kind Issue, highest number NI0. The storekeeper opens the Balances screen and notes the balance
      of one item at one place (the sum of its rows there) as B0, with ITEM-N and PLACE-N the item and place.
    via: ui
  - step: 2
    actor: storekeeper
    action: >-
      The storekeeper issues three receipts of ITEM-N to PLACE-N, quantity 1 each (New document, fill, Issue),
      one after the other, each until it shows Posted. The numbers are noted as R1, R2 and R3 in the order of issue.
    via: ui
  - step: 3
    actor: storekeeper
    action: >-
      The storekeeper issues two issues of ITEM-N from PLACE-N, quantity 1 each, one after the other, each until
      Posted. The numbers are noted as I1 and I2.
    via: ui
  - step: 4
    actor: storekeeper
    action: >-
      The storekeeper creates a draft receipt and discards it (action Discard). The Documents screen is read:
      the draft never showed a number (a draft shows the Draft mark instead of a number).
    via: ui
  - step: 5
    actor: storekeeper
    action: >-
      The storekeeper reverses the receipt R2 (action Reverse, a reason offered by the dialog) and, once it is
      Reversed, cancels it (action Cancel document, a reason offered by the dialog). The document R2 shows the
      state Cancelled and still shows its number.
    via: ui
  - step: 6
    actor: storekeeper
    action: >-
      The storekeeper issues one more receipt of ITEM-N to PLACE-N, quantity 1, until Posted. Its number is noted as R4.
    via: ui
  - step: 7
    actor: storekeeper
    action: >-
      The storekeeper reads the date of issue ('Issued at') of the document R4 and the year of the numbers; opens
      the same Documents screen at 390 px in Kazakh and finds R4 by its number: the number is the same and nothing is clipped.
    via: ui
  - step: 8
    actor: storekeeper
    action: >-
      The test runner sends a request to list the stock documents with no credential, and another with a wrong
      credential (the word Bearer and a value never issued).
    expect_refusal: true
    via: api
  - step: 9
    actor: storekeeper
    action: >-
      Cleanup: the storekeeper reverses the receipts R1, R3 and R4 and the two issues I1 and I2 (R2 is already
      cancelled). The balance is read as BFINAL.
    via: ui

expected_outcomes:
  - id: EO-001
    description: Numbers of one series run without gap or repeat (decision 0056 D2, acceptance criterion 1).
    verification:
      method: gui_screen
      detail: >-
        R1, R2 and R3 are NR0 plus 1, plus 2, plus 3 (same prefix, same year, the width of the number is the
        same); I1 and I2 are NI0 plus 1 and plus 2 in the Issue series; the prefix of the Receipt series differs
        from the prefix of the Issue series. All of R1, R2, R3, R4, I1, I2 are different from each other and from every number already on the screen.
      evidence: "NR0, NI0, R1..R4, I1, I2 read from the Documents screen."
    on_fail:
      severity: BLOCKER
      business_impact: A repeated or skipped number is a defect of the legal register of stock documents.
      suggested_action: route_to_elixir_dev

  - id: EO-002
    description: A cancelled number is kept and not reused (decision 0056 D2).
    verification:
      method: gui_screen
      detail: After step 5 the document R2 shows the state Cancelled and its number; R4 equals R3 plus 1, so the number R2 and no earlier number was taken again.
      evidence: "The state and number of R2, and R4."
    on_fail:
      severity: BLOCKER
      business_impact: A reused number would make two different documents carry the same legal number.
      suggested_action: route_to_elixir_dev

  - id: EO-003
    description: A discarded draft takes no number (decision 0056 D2, status machine "a draft carries no number, so discarding creates no gap").
    verification:
      method: gui_screen
      detail: In step 4 the draft shows no number before it is discarded; the next numbers issued (R4) are unaffected, as EO-001 and EO-002 show.
      evidence: "Screenshot of the draft with the Draft mark and no number."
    on_fail:
      severity: MAJOR
      business_impact: Draft work would leave holes in the numbering.
      suggested_action: route_to_elixir_dev

  - id: EO-004
    description: The year in the numbers is the current year of the run.
    verification:
      method: gui_screen
      detail: The year part of R4 equals the year of the 'Issued at' date of R4 as the screen shows it (the date of the run, in the tenant's zone, 0056 D2).
      evidence: "R4 and the Issued at value."
    on_fail:
      severity: MAJOR
      business_impact: A wrong year in the number breaks the yearly register.
      suggested_action: route_to_elixir_dev

  - id: EO-005
    description: The listing without a credential or with a wrong credential is refused (401), nothing changes.
    verification:
      method: api_response
      detail: >-
        Step 8: both answers have status 401, each a plain refusal whose text for a missing credential and for a wrong one may differ (PM 2026-11-19/20: on /api/v1 with bearer tokens identical bodies are not required), and contain no number or document; the highest receipt number read again is R4.
      evidence: "Status and body of both requests."
    on_fail:
      severity: BLOCKER
      business_impact: The numbers and the content of the documents would be readable by anyone.
      suggested_action: route_to_elixir_dev

  - id: EO-006
    description: The cleanup restores the balance, and the screen layout holds at 390 px in Kazakh.
    verification:
      method: gui_screen
      detail: >-
        BFINAL equals B0. Step 7: R4 is found at 390 px in Kazakh with the same number and no horizontal clipping.
      evidence: "B0, BFINAL and the 390 px screenshot."
    on_fail:
      severity: MINOR
      business_impact: Synthetic data stays changed; phone users cannot read the number.
      suggested_action: route_to_frontend_dev
