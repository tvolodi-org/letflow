# T-2162. Covers REQ-843 AC1/2/3 and REQ-841 single optional place read-back.
# Sources opened: docs/requirements.yaml REQ-841..845; merged a38927e09 (#4621);
# web/src/modules/catalog_items/items/ItemsPage.tsx (selection, keyed ItemDetails),
# ItemDetails.tsx (Overview default and Related balance locations are separate),
# catalogItemsItemsMessages.ts; web/src/router.tsx platformPage + admin/tenants;
# docs/roles.md TENANT_ADMIN; test/fixtures/uat/actors.yaml actor-qoimeks-qa2-admin.
# NOT UAT-observable here: import writes/refusals, converter report/counts (REQ-842),
# cross-tenant stock API negatives (only this tenant's admin supplied). Import outputs,
# converter report.txt/expected_counts.txt and comparison files are their observable evidence.
# No claim of coverage for those checks. REQ-844/845 cancelled: no second place,
# document-header prefill, native phone or voice behaviour is a pass condition.
# Sensitive actions: only other-company visibility is attempted below, as a refusal.
# No approving, paying/releasing or user changes in these read-only synthetic-data walks.
# T-2192 rework (issues 4708, 4709, 4710): checks before this group is merged:
# 1. Scope: scope is qoimeks-qa2 (tenant and realm exist); the directory name is only the group name.
# 2. Actors: actor-qoimeks-qa2-admin (TENANT_ADMIN) and actor-qoimeks-qa2-storekeeper (STOREKEEPER, realm qoimeks-qa2,
#   login UAT_QA_ACTOR_QOIMEKS_QA2_STOREKEEPER_USER_*, added to actors.yaml by this task).
# 3. Host and screens: Items screen and card sections exist (web/src/modules/catalog_items/items/ItemDetails.tsx); section
#   titles follow catalogItemsItemsMessages.ts: sec.overview Обзор / Шолу, sec.related Остатки по местам хранения /
#   Сақтау орындары бойынша қалдық. The English words "Overview" and "Related" are not shown in ru/kk (issue 4710).
# 4. Data: needs an item WITH a usual place (216 have one after the seed; read the count at the start of the run) and one without; if none is found: BLOCKED-by-environment.
# 5. Executable: browser steps only; the refusal step now runs as the storekeeper (least role).
# 6. Dry run: uat.sh preflight not run by the writer (no QA credentials in the writer session).
---
id: qoimeks-defloc-3-selection-and-stock
scope: qoimeks-qa2
title: Changing the selected item keeps its usual place separate from actual stock locations
version: "1.0"
tags: [qoimeks, default_location, selection, stock, desktop, phone_390, ru, kk, refusal]
description: >
  Compare the usual place with the same item's actual stock locations, then switch between
  an item with a usual place and one without it. Repeat in a real browser at 1440 px and
  390 px, in Russian and Kazakh, light and dark. Capture both selected cards and the
  stock-by-location section in each combination. No business records are written and no document is
  posted. Cleanup returns to Items, clears search and selection, and restores the original
  language and appearance. The storekeeper also attempts to open the platform's company
  list; the whole request must be refused.
actors:
  admin: actor-qoimeks-qa2-admin
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
  - description: The synthetic QA tenant and its administrator are available in a real browser.
    check: system_seeded
    detail: >
      Use only https://qoimeks-qa2.letflow.qa.bizdala.com, realm qoimeks-qa2, account
      QOIMEKS_QA2_ADMIN via UAT_QA_ACTOR_QOIMEKS_QA2_ADMIN_USER_*. Record original language
      and appearance. Missing browser, account or tenant means BLOCKED; never use real data.
  - description: Two existing synthetic items have independently recorded place assignments.
    check: system_seeded
    detail: >
      Use the actual codes/names of one item with a usual place and one without it, identified
      from synthetic import evidence or this administrator's read-only item query. Record the
      populated item's place code/name and its actual stock rows from the read-only stock
      query, following any pages. Choose a populated item with stock at a different place
      when one exists. Pick an item that has a usual place (216 did at the last seed; the count is read at the start of the run); use another item for the empty case. If no item has a usual place, this scenario is BLOCKED-by-environment. If none exists, still compare the actual rows but mark the different-place
      contrast BLOCKED, not PASS. Missing either item blocks the selection comparison. Do not
      move stock, edit a place or create records to force this case.
steps:
  - step: 1
    actor: admin
    action: >
      Sign in to QA, set the current display combination, open Items and select the recorded
      item with a usual place. Read the section «Обзор» (Russian) or «Шолу» (Kazakh), then the section «Остатки по местам хранения» (Russian) or «Сақтау орындары бойынша қалдық» (Kazakh), and capture the usual place and
      actual stock locations and quantities.
    via: ui
  - step: 2
    actor: admin
    action: >
      Select the recorded item without a usual place, searching by its own article code.
      At 390 px first return to the list with the card's back control. Capture the new
      item's code and usual-place field together.
    via: ui
  - step: 3
    actor: admin
    action: >
      Return to the list and reopen the first item by its article code. Read its usual
      place and the stock-by-location rows again, then reload and capture the selected card.
    via: ui
  - step: 4
    actor: storekeeper
    action: >
      Sign in as the storekeeper and attempt to open the platform operator's company list by typing the address of the
      tenants page under the admin section of this same QA host.
    via: ui
    expect_refusal: true
  - step: 5
    actor: admin
    action: >
      Sign back in as the administrator if needed and return to Items. After all display combinations, clear the search, close the card
      and restore the initial language and appearance.
    via: ui
expected_outcomes:
  - id: EO-001
    description: The usual place belongs to the selected item and does not bleed into the next card.
    verification:
      method: gui_screen
      detail: >
        The first item shows its recorded place code - name; the second shows an em dash,
        with its own article code visible. Reopening and reloading the first restores its
        assigned place. Labels are Обычное место in Russian and Әдеттегі орын in Kazakh.
        All values remain readable at phone width and in light and dark appearance.
      evidence: First, second and reopened first card screenshots for every width/language/appearance combination.
    on_fail:
      severity: MAJOR
      business_impact: Switching articles gives the warehouse user another item's storage instruction.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: Actual stock remains distinct from the item's usual place.
    verification:
      method: gui_screen
      detail: >
        The stock-by-location section shows actual stock rows matching the recorded locations and quantities;
        a row at a different location remains at that location and is not relabelled as
        the usual place. The usual-place value stays the recorded assignment. Compare the
        visible rows with the same rows of the recorded stock results; if the screen
        indicates more rows, do not claim that the screenshot proves the whole balance list.
        Reading and switching cards does not change any of the compared quantities.
      evidence: Before/after stock-by-location and card screenshots and stock comparison evidence; explicitly record an unavailable different-place contrast as BLOCKED.
    on_fail:
      severity: MAJOR
      business_impact: A storage recommendation is mistaken for where stock actually exists.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: An ordinary warehouse user cannot inspect the platform's other companies.
    verification:
      method: gui_screen
      detail: >
        The attempted company-list page shows access denied or not found, with no company
        list or other-company names. This is only the screen boundary check; it does not
        prove cross-company stock isolation. Never try a write or change users for this check.
      evidence: Refused-page screenshot in each display combination.
    on_fail:
      severity: BLOCKER
      business_impact: A customer account can inspect companies outside its own business.
      suggested_action: route_to_security_review
