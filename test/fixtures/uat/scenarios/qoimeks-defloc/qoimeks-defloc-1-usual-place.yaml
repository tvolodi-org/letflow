# T-2162. QA only; synthetic data, never the real Qoimeks tenant.
# Covers REQ-843 AC1 (populated card), AC2 (ru/kk), AC3 (browser sizes);
# REQ-841 AC2 only the read-back/display of an already imported place, not import execution.
# Sources opened: docs/requirements.yaml REQ-841..845; merged build a38927e09 (#4621),
# superseding the two-place build 6e7c4bbaa; web/src/modules/catalog_items/items/ItemDetails.tsx
# (reference labels and Related balances), ItemsPage.tsx (selection and narrow layout),
# catalogItemsItemsMessages.ts (ru/kk labels), catalogItemsRoutes.tsx and index.ts
# (Items screen under StockRead); web/src/components/ui/registry/RegistryDetails.tsx.
# NOT UAT-observable in this browser walk: import reference rejection/atomicity and clearing
# (REQ-841 AC3/4), converter/rehearsal counts (REQ-842), definition/manifest/hash pins.
# Observable evidence for those belongs to admin import result files and converter report.txt,
# expected_counts.txt and comparison output; this card walk does not claim those checks passed.
# REQ-844/845 are cancelled: no document/phone prefill, second-place hint or voice use is expected.
# Phone below means the web screen at 390 px, not an APK or a Flutter screen.
# Sensitive actions: no approve, pay/release or user changes; all stock here is synthetic.
# The other-company data refusal is in qoimeks-defloc-3. No other-tenant stock actor is supplied.
# T-2192 rework (issues 4708, 4709, 4710): checks before this group is merged:
# 1. Scope: scope is qoimeks-qa2 (tenant and realm exist); the directory name is only the group name.
# 2. Actors (T-2222, PM 2026-11-19): actor-qoimeks-qa2-storekeeper / STOREKEEPER reads the item card and its usual place and cannot change it; actor-qoimeks-qa2-admin / TENANT_ADMIN appears only as the cross-check reader in qoimeks-defloc-1 step 5. Both exist in actors.yaml for tenant/realm qoimeks-qa2 (T-2219 PM decision); the live login was not exercised in this writing step (acceptance verifies it; credentials come from the acceptance credential source, never from files); missing credentials block the affected outcomes.
# 3. Host and screens: the Items screen and card sections exist in web/src/modules/catalog_items/items/ItemDetails.tsx;
#   section titles follow catalogItemsItemsMessages.ts (sec.overview: Обзор / Шолу; sec.related: Остатки по местам
#   хранения / Сақтау орындары бойынша қалдық; field.defaultLocation: Обычное место / Әдеттегі орын). The English
#   word "Related" is not shown on the screen in ru/kk and is no longer used in the steps.
# 4. Data: after the seed a few hundred items have a usual place (never hard-coded; the Items screen shows no such count: open cards, starting with the demo items, until one with a place is found); if none is found the scenario is BLOCKED-by-environment, not PASS.
#   T-2206 (P13): the storekeeper cannot read the Locations admin screen (it needs the locations write permission), so the place
#   is compared with the card's own stock-by-place table, not with Locations.
# 5. Executable: every step is a browser step; the data check is read-only.
# 6. Dry run: uat.sh preflight was not run by the writer (no QA credentials in the writer session).
# T-2263 code-reading pass. EXPECTATION CORRECTIONS: 13. defloc-1: (1) the fixed count of items with a usual place is gone (read at the run; the Items
#   screen shows no such count, so the run picks items by opening cards); (2) description, step 3 and EO-001 no longer compare with the Locations screen (the
#   storekeeper cannot open it; the card's stock-by-place table and the administrator's card are the cross-checks); (3) the "recorded assignment from import
#   evidence or a read-only item query" source is gone (no such screen for the storekeeper); (4) step 6 is an absence check, no longer expect_refusal (the group's
#   one refusal step is defloc-3 step 4); (5) a sign-in-return step is added (the card address typed while signed out shows the same card after sign-in, T-2241 merged);
#   (6) the English section name is Stock by location, not Related. defloc-2: (7) the seed counts are gone from the header; (8) the "storekeeper's read-only item
#   query" precondition is replaced by browsing cards; (9) the view-only line and import link are named with their exact ru/kk text. defloc-3: (10) the fixed count is
#   gone; (11) the "read-only stock query" source is replaced by the card's own stock-by-place rows read before and after; (12) the refusal outcome names the
#   permission-denied screen and the guard (platform tenant and tenants-manage permission); (13) step 5 no longer re-signs in an actor that never signed out.
---
id: qoimeks-defloc-1-usual-place
scope: qoimeks-qa2
title: An imported item's usual place is readable on its card in Russian and Kazakh
version: "1.0"
tags: [qoimeks, default_location, desktop, phone_390, ru, kk, read_only]
description: >
  Read the usual place on an existing synthetic item's card and compare it with the card's own
  stock-by-place table and with the administrator's view of the same card. Run the entire walk in each combination of 1440 px and
  390 px width, Russian and Kazakh, light and dark appearance. Save labelled screenshots
  of the card in every combination. This walk creates and
  changes no business records; cleanup restores the starting language and appearance,
  clears the search and closes the card. Do not replace browser evidence with a query result.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
  - description: The run uses only the synthetic Qoimeks QA tenant and its storekeeper.
    check: system_seeded
    detail: >
      Open https://qoimeks-qa2.letflow.qa.bizdala.com, realm qoimeks-qa2, using
      QOIMEKS_QA2_STOREKEEPER credentials from UAT_QA_ACTOR_QOIMEKS_QA2_STOREKEEPER_USER_*.
      If this address cannot reach this tenant, report BLOCKED; do not substitute a real tenant.
      Step 5 signs in as actor-qoimeks-qa2-admin (UAT_QA_ACTOR_QOIMEKS_QA2_ADMIN_USER_*) for the cross-check only.
      The seed has items, places and non-zero balances (three of them negative) and opening
      four-eyes off. The counts are read at the start of the run and noted; they are not fixed
      numbers. Do not reset data or change that setting.
  - description: An existing active synthetic item has an assigned usual place.
    check: system_seeded
    detail: >
      Before the walk, open item cards on the Items screen (the search matches code or title) until one shows a
      place in the usual-place field; record that item's code, name and the place shown, as read at the start
      of the run, in the run evidence. Do not invent an article or infer its usual place from a stock balance.
      Use another item for the empty case in the sibling scenarios. If no item with a usual place is found
      after looking through the list, report BLOCKED-by-environment, not PASS.
  - description: A real browser can show every required width, language and appearance.
    check: system_seeded
    detail: >
      Record the initial language and appearance. Missing browser or credentials blocks the walk;
      an unavailable display variant is recorded as BLOCKED, never replaced by a desktop shot.
steps:
  - step: 1
    actor: storekeeper
    action: >
      Sign in to the QA tenant, set the current display combination, and open Items from
      the navigation. Search for the recorded article code and open that exact item's card.
    via: ui
  - step: 2
    actor: storekeeper
    action: >
      Read the usual place in the section «Обзор» (Russian) or «Шолу» (Kazakh). Capture the item code, the field label and its value
      together. At phone width, scroll the card to show the full field without zooming out.
    via: ui
  - step: 3
    actor: storekeeper
    action: >
      On the card, open the section «Остатки по местам хранения» (Russian) or «Сақтау орындары бойынша қалдық»
      (Kazakh) and compare it with the usual place: where the table has a row for the same place, its code and name
      must be written the same way as the usual place; if the item has no stock there, there is nothing to compare here and step 5 is the cross-check.
      Do not open Locations (the storekeeper cannot). Close the card, search for the same article and open it again.
    via: ui
  - step: 4
    actor: storekeeper
    action: >
      Reload the browser on the selected card and read its usual place again. Capture the
      reopened card. After all display combinations, clear the search, close the card and
      restore the starting language and appearance.
    via: ui
  - step: 5
    actor: admin
    action: >
      Sign out, sign in as the administrator at the same QA tenant, open Items, search for the same
      article code and open its card. Read the usual place in the same section and compare it with what the storekeeper read
      in steps 2 to 4, without changing anything. Repeat in Russian and Kazakh at 1440 px.
    via: ui
  - step: 6
    actor: storekeeper
    action: >
      Sign out and sign in again as the storekeeper. Open the same item's card and look through the card (Russian, 1440 px)
      for any control that changes the usual place: an edit button, a place selector, a save button. The card of an item has no edit route
      for anyone (web/src/modules/catalog_items/items/ItemDetails.tsx, header comment: create, edit and retire have no server route yet), and the storekeeper holds no catalog write right, so no such control may be there.
    via: ui
  - step: 7
    actor: storekeeper
    action: >
      Sign out. In the same browser type the address of the same item's card (the Items address with the item chosen in it, copied from the
      address bar before sign-out) and sign in again as the storekeeper. After sign-in, read which screen is shown.
    via: ui
expected_outcomes:
  - id: EO-001
    description: The usual place is the assigned location's code and name.
    verification:
      method: gui_screen
      detail: >
        The card shows the place as code - name, written the same way as in the card's stock-by-place table
        (where it lists that place) and as the administrator's card shows it (REQ-843 AC1). The card section «Обзор» / «Шолу» has one usual-place field and no second-place field.
        No internal identifier, raw message key or loading placeholder
        remains after loading finishes. It is the same place after navigation and reload.
      evidence: Screenshots of the card and the reloaded card for all eight display combinations; the item code and place noted at the start.
    on_fail:
      severity: MAJOR
      business_impact: The warehouse user cannot identify where the item normally belongs.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: An ordinary warehouse user reads the same usual place as the administrator.
    verification:
      method: gui_screen
      detail: >
        The administrator's card shows the same place code and name as the storekeeper's card
        (Обычное место in Russian, Әдеттегі орын in Kazakh), with no access-denied page.
      evidence: Storekeeper card screenshots in Russian and Kazakh (steps 2 to 4) and the administrator's in step 5.
    on_fail:
      severity: MAJOR
      business_impact: Warehouse staff cannot read where an item normally belongs.
      suggested_action: route_to_frontend_dev
  - id: EO-005
    description: After sign-in the page that was open is shown again.
    verification:
      method: gui_screen
      detail: >
        Step 7: after sign-in the browser shows the same item's card (the item selected in the address), not the home screen
        (behaviour of the merged sign-in return fix, T-2241). The place is the same as before.
      evidence: Screenshot after sign-in in Russian at 1440 px.
    on_fail:
      severity: MINOR
      business_impact: A user who reloads or follows a saved address loses the item they were reading.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: The storekeeper reads the usual place and cannot change it.
    verification:
      method: gui_screen
      detail: >
        Step 6 shows the card with the usual place as plain text: no edit button, no place selector, no save button, in Russian at 1440 px.
        The head carries only the view-only line and the link to Import data. The card changes nothing and the field value is the same after the storekeeper reloads it.
      evidence: Screenshot of the card in step 6.
    on_fail:
      severity: MAJOR
      business_impact: A warehouse clerk could move the item's usual place for everybody, or the card promises an action that does not exist.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: Both languages and both widths keep the usual-place information readable.
    verification:
      method: gui_screen
      detail: >
        Russian labels the field Обычное место; Kazakh labels it Әдеттегі орын. The stored
        place code and name stay the same when language changes; master names need not be
        translated. At 390 px the card opens in the narrow layout and the whole label and
        value can be read without horizontal page scrolling. Light and dark remain legible.
      evidence: Labelled 1440/390 px, ru/kk, light/dark card screenshots; note any missing variant as BLOCKED.
    on_fail:
      severity: MAJOR
      business_impact: Phone users or Kazakh-speaking users cannot read the item's usual place.
      suggested_action: route_to_frontend_dev
