# T-0598 (BA): TENANT ADMIN group, scenario 15: the administrator's own invalid message wordings are refused and nothing is stored or audited.
# Covers REQ-563 criteria 2 (unknown message is not found), 3 (placeholders outside the allowed five and malformed braces), 4 (no secret
# reference, no secret placeholder), 5 (over-long, empty, control characters, bad language tag) and 8 (a refused write leaves no audit record).
# Sources: docs/requirements.yaml REQ-563 criteria 2, 3, 4, 5, 8 and description (placeholder form {name} with name matching lowercase
# letters and underscore; ICU plural/select forms refused; secret reference form sec://tenant/<a>/<b>/<c>); test/fixtures/uat/actors.yaml (alice).
# Boundary-accepted cases are in scenario 14, so every request below is refused. The refused-write answers carry no echo of the submitted text.
# Not covered here: criterion 4's source-reading checks (unit tests); criteria 9 and 12 (code change, review and CI).
# The four sensitive actions are not in this flow; access refusals are scenario 16.
---
id: tenant-administration-15-notification-templates-validation-refusals
scope: tenant-administration
title: Message wordings with a forbidden placeholder, a secret reference, bad braces, wrong length or an unknown message are refused and leave no trace
version: "1.0"
tags: [tenant-admin, notification-templates, validation, refusal, secrets]

description: >
  The administrator of SwiftRoute tries to store wordings that break the rules: a message that is not registered, placeholders outside the
  allowed five (password, api key, secret reference, tenant id), a secret reference written into the text, unbalanced or empty braces, a
  placeholder name with a capital letter or a digit, a plural or select form, an empty or blank subject or body, a subject one character
  too long, a body one character too long, a line break in the subject, a control character in the body, and a language tag that is not a
  language tag. Each is refused, the stored list is unchanged and no audit record is written. The same invalid texts are also refused when
  the administrator previews them.

actors:
  tenant_admin: actor-swiftroute-alice

preconditions:
  - description: SwiftRoute is set up with its administrator, and no wording is stored for "task assigned"
    check: system_seeded
    detail: If a wording from an earlier run is stored, step 1 notes it and EO-002 compares the list before and after, not against empty.

steps:
  - step: 1
    actor: tenant_admin
    action: >
      The administrator lists the stored wordings and the audit record, and notes both so that later steps can be compared with them.
    via: api
  - step: 2
    actor: tenant_admin
    action: >
      The administrator tries to store a wording for a message called "invoice_overdue" (not registered), language ru, subject "Hello" and
      body "Hello". The answer is noted.
    expect_refusal: true
    via: api
    input:
      template_key: invoice_overdue
  - step: 3
    actor: tenant_admin
    action: >
      For "task assigned", language ru, subject "Hello", the administrator tries four bodies, each in its own request: "Hello {password}",
      "Hello {api_key}", "Hello {secret_ref}" and "Hello {tenant_id}". Each answer is noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
      locale: ru
      subject: Hello
  - step: 4
    actor: tenant_admin
    action: >
      For "task assigned", language ru, subject "Hello", the administrator tries the body "sec://tenant/swiftroute/vault/key", then the body
      "Token {sec://tenant/swiftroute/vault/key#1}", each in its own request. The answers are noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
      locale: ru
      subject: Hello
  - step: 5
    actor: tenant_admin
    action: >
      For "task assigned", language ru, subject "Hello", the administrator tries six bodies, each in its own request: an opening brace only
      ("Hello {"), a closing brace only ("Hello }"), empty braces ("Hello {}"), a placeholder with a capital letter ("{Task_name}"), one
      with a digit ("{task_name2}"), and a plural form ("{count, plural, one {a} other {b}}"). The answers are noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
      locale: ru
      subject: Hello
  - step: 6
    actor: tenant_admin
    action: >
      For "task assigned", language ru, the administrator tries six requests. With the body "Hello": a subject of 201 characters (the
      letter a), an empty subject, and a blank subject of three spaces. With the subject "Hello": a body of 5001 characters (the letter b),
      an empty body, and a blank body of three spaces. The answers are noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
      locale: ru
  - step: 7
    actor: tenant_admin
    action: >
      The administrator tries three requests for "task assigned". First, language ru, body "Hello" and the subject "Line one", a line break,
      "Line two" (the line break is in the middle). Second, language ru, subject "Hello" and the body "Hello", a tab character, "world"
      (the tab is in the middle). Third, the language tag "not a locale!" with subject "Hello" and body "Hello". The answers are noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
  - step: 8
    actor: tenant_admin
    action: >
      The administrator previews "task assigned" for ru with a body in the request "Hello {password}", then with the body "Hello {", each
      in its own request. The answers are noted.
    expect_refusal: true
    via: api
    input:
      template_key: task_assigned
      locale: ru
  - step: 9
    actor: tenant_admin
    action: >
      The administrator lists the stored wordings and reads the company's audit record again, and compares them with step 1.
    via: api

expected_outcomes:
  - id: EO-001
    description: A message that is not registered is answered as not found and nothing is stored.
    verification:
      method: http_status
      detail: Step 2 answers 404 with the standard not-found body; the list of step 9 has no wording for "invoice_overdue".
      evidence: The answer of step 2 and the list of step 9.
    on_fail:
      severity: MAJOR
      business_impact: Wordings could be stored for messages the platform never sends, or the administrator is told nothing useful.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Every refused request stores nothing and writes no audit record.
    verification:
      method: system_state
      detail: The list of stored wordings and the audit record read in step 9 equal those of step 1 (no new entry, no changed text).
      evidence: The two lists of steps 1 and 9, and the two audit records.
    on_fail:
      severity: BLOCKER
      business_impact: Invalid or dangerous wording is partly saved, or refusals clutter the audit trail.
      suggested_action: route_to_wf03
  - id: EO-003
    description: Placeholders outside the allowed five, including names that suggest a secret, are refused.
    verification:
      method: http_status
      detail: Each of the four requests of step 3 answers 422 with the message "body uses a placeholder this template does not allow", and the answer does not repeat the submitted text. The preview with {password} in step 8 answers 422 with the same message.
      evidence: The four answers of step 3.
    on_fail:
      severity: BLOCKER
      business_impact: A message to staff could carry a password, key or other company identifier.
      suggested_action: route_to_security_review
  - id: EO-004
    description: A reference to a stored secret cannot be written into a wording.
    verification:
      method: http_status
      detail: Both requests of step 4 answer 422 with the message "body must not contain a secret reference" (the reference check runs before the brace check, so the second body gets this message too), and the answers do not repeat the reference.
      evidence: The two answers of step 4.
    on_fail:
      severity: BLOCKER
      business_impact: A message could expose or resolve a secret of the company.
      suggested_action: route_to_security_review
  - id: EO-005
    description: Malformed braces, wrong placeholder names and plural forms are refused.
    verification:
      method: http_status
      detail: Five requests of step 5 ("Hello {", "Hello }", "Hello {}", "{Task_name}", "{task_name2}") answer 422 with the message "body must be plain text with {name} placeholders only"; the plural form answers 422 with "body uses a placeholder this template does not allow". The preview with "Hello {" in step 8 answers 422 with "body must be plain text with {name} placeholders only", nothing rendered.
      evidence: The six answers of step 5 and the preview of step 8 with "Hello {".
    on_fail:
      severity: MAJOR
      business_impact: A broken wording would show raw braces to staff or fail when it is first used.
      suggested_action: route_to_wf03
  - id: EO-006
    description: Over-long, empty and blank texts, forbidden control characters and a bad language tag are refused.
    verification:
      method: http_status
      detail: All six requests of step 6 and all three of step 7 answer 422, each with the message of its own rule. For step 6, "subject must be at most 200 characters" (201 characters), "body must be at most 5000 characters" (5001 characters), "subject must not be empty" (empty and blank subject), "body must not be empty" (empty and blank body). For step 7, "subject must not contain control characters" (line break), "body must not contain control characters" (tab), "locale is invalid" (bad language tag).
      evidence: The nine answers of steps 6 and 7.
    on_fail:
      severity: MAJOR
      business_impact: Messages of unbounded size or with hidden control characters could be stored and sent.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: Nothing was stored, so nothing is removed; if a wording from an earlier run was noted in step 1 it is left as it was.
