# T-0902 (BA): TENANT ADMIN group, scenario 50: saved graph views, the administrator saves, reads, changes and deletes a graph view (a chart
# definition), and the stored definition replayed as an ordinary aggregate query gives the same answer as the same query typed by hand.
# Covers REQ-613 criteria 1 (success side: a graph body with filter, one grouping, aggregates and a chart type is accepted and returned under
# those names, with the chart type; the list route returns graph, pivot and list views together, each with its kind), 2 (accepted cases: one
# grouping, one aggregate, bar; one grouping, three aggregates, line; one aggregate, pie), 3 (the list shows all three kinds), 4 (a graph view
# is shown to another administrator-level reader), 6 (replay through the aggregate query with a non-empty filter equals the hand-built request;
# the chart type is not sent; no view answer carries an aggregate result or a record value) and 8 (create, change and delete each leave an
# audit entry).
# Sources: docs/requirements.yaml REQ-613 (criteria 1, 2, 3, 4, 6, 8); docs/migration/decisions/0066-generic-saved-views-over-records.md (D1,
# D3); lib/letflow/entities/views/clauses.ex (graph rules: one grouping, one to three aggregates, chart type bar, line or pie, a pie one
# aggregate); docs/roles.md (EntitiesViewsManage, EntitiesQuery, EntitiesAggregate rows); test/fixtures/uat/actors.yaml (alice, lena of SwiftRoute);
# the pattern of scenario 33 (pivot).
# Not UAT-observable by an outside user, so not covered by any scenario (listed once here for scenarios 50 to 52): the migration, its two
# database constraints and the move of the pins of the pivot migration tests (REQ-613 criterion 1, first part); that existing list and pivot rows
# are unchanged by the migration and that a graph view is absent from another company's tenant schema as a table row (the visible effect, no
# view in the other company's list, is checked in scenario 52); the registration of the migration in the tenant provisioning manifest; the audit
# event being written in the same transaction as the change (this scenario only checks that the entries exist); the unchanged permission matrix
# golden, the absence of a new permission and the route-count and route-scope pins (criteria 5 in part and 8 in part); the reviewer verdicts and
# build commands (criterion 9). The web graph screen and the drawing of a chart are out of scope of REQ-613 and have no scenario here.
# The four sensitive actions (approve, pay or release, see sensitive data, change users) are not in this flow; the refusals are in scenarios
# 51 and 52.
---
id: tenant-administration-50-saved-graph-views-create-read-update-delete-and-replay
scope: tenant-administration
title: The administrator saves, reads, changes and deletes a graph view over one record type, and replaying it as an aggregate query gives the hand-typed answer
version: "1.0"
tags: [tenant-admin, saved-views, graph, crud, replay, audit]

description: >
  The administrator of SwiftRoute creates the record type "UAT graph ticket" with the fields title (text, required), status (text), region
  (text) and amount (whole number), and four records: (A, open, north, 10), (B, open, north, 20), (C, open, south, 5), (D, closed, north, 100).
  The administrator saves the graph view "UAT open by region chart" over that type with the filter "status equals open", the grouping by
  region, the one aggregate "sum of amount" and the chart type bar. The view is read by id and by list, then changed (the name "UAT open by
  region chart v2", a second aggregate "count of records", and the chart type line). A task worker, who may read lists, sees the view. The
  stored filter, grouping and aggregates (not the chart type) are then sent as an ordinary aggregate query, which is how a chart screen gets its
  figures; the answer is compared with the same query typed by hand and with the expected numbers (north: sum 30, 2 records; south: sum 5, 1
  record; closed record D is not counted). The administrator also saves a graph view with three aggregates and the chart type line, a graph
  view with one aggregate and the chart type pie, and a pivot view and a list view over the same type, and the list of the type shows all of
  them, each with its kind. Finally the administrator deletes the graph views; reading and deleting one again give the same not-found answer.
  No answer of the view routes contains an aggregate result or a record value, and create, change and delete each leave an audit entry.

actors:
  tenant_admin: actor-swiftroute-alice
  worker: actor-swiftroute-lena

preconditions:
  - description: SwiftRoute is set up with its administrator and a task worker; no record type "UAT graph ticket" and no saved view named "UAT open by region chart", "UAT open by region chart v2", "UAT three figures chart", "UAT share pie", "UAT mixed pivot" or "UAT mixed list" exist
    check: system_seeded
    detail: If views exist from an earlier run, delete them first and note it in the report; the record type and its four records may stay if they are as described in the description (otherwise the numbers of EO-005 cannot be judged, report BLOCKED for EO-005).
  - description: The audit trail of the company can be read by the administrator
    check: system_seeded
    detail: If the test environment cannot show the audit trail, report BLOCKED for the audit part of EO-007 and run the rest.

steps:
  - step: 1
    actor: tenant_admin
    action: >
      The administrator creates the record type "UAT graph ticket" with the fields title (text, required), status (text), region (text) and
      amount (whole number), makes it active, and creates the four records (A, open, north, 10), (B, open, north, 20), (C, open, south, 5)
      and (D, closed, north, 100).
    via: api
  - step: 2
    actor: tenant_admin
    action: >
      The administrator saves the graph view "UAT open by region chart" over "UAT graph ticket" with the filter "status equals open", the
      grouping by region, the one aggregate "sum of amount" and the chart type bar. The administrator notes the id, the name, the kind, the
      type, the filter, the grouping, the aggregates, the chart type, the creating person and the time of the answer.
    via: api
    input:
      name: UAT open by region chart
      kind: graph
      entity_type: UAT graph ticket
      filter: status equals open
      group_by: [region]
      aggregates: [sum of amount]
      chart_type: bar
  - step: 3
    actor: tenant_admin
    action: >
      The administrator lists all views, lists the views of the type "UAT graph ticket" only, and reads the view of step 2 by its id. The
      administrator compares the three answers with step 2.
    via: api
  - step: 4
    actor: tenant_admin
    action: >
      The administrator changes the view of step 2: the name becomes "UAT open by region chart v2", the aggregates become sum of amount and
      count of records, in this order, and the chart type becomes line. The kind stays graph, the filter stays "status equals open", the grouping
      stays region, the record type is not part of the change. The administrator reads the view again and notes the name, kind, grouping,
      aggregates, chart type, creating person, changing person and the two times.
    via: api
    input:
      name: UAT open by region chart v2
      kind: graph
      filter: status equals open
      group_by: [region]
      aggregates: [sum of amount, count]
      chart_type: line
  - step: 5
    actor: worker
    action: >
      The task worker lists the views and reads the view of step 4 by its id, and notes whether the view is shown and what the answer
      contains.
    via: api
  - step: 6
    actor: tenant_admin
    action: >
      The administrator sends the aggregate query over "UAT graph ticket" built by hand: filter "status equals open", grouping by region,
      aggregates sum of amount and count of records. Then the administrator sends the aggregate query made from the view of step 4: the stored
      filter as the filter of the query, the stored grouping and the stored aggregates, with nothing added or left out and without the chart
      type. The two answers are noted and compared with the expected numbers (north: sum 30, 2 records; south: sum 5, 1 record; no row for the
      closed record D).
    via: api
  - step: 7
    actor: tenant_admin
    action: >
      The administrator saves, as accepted cases, the graph view "UAT three figures chart" (grouping by status, the three aggregates count of
      records, sum of amount and largest amount, chart type line, no filter) and the graph view "UAT share pie" (grouping by region, the one
      aggregate count of records, chart type pie, filter "status equals open"), and notes each answer. The administrator also saves the pivot
      view "UAT mixed pivot" (grouping by region, aggregate count of records) and the list view "UAT mixed list" (column title) over the same
      type, then lists the views of the type and notes the kind and, for graph views, the chart type of each entry.
    via: api
  - step: 8
    actor: tenant_admin
    action: >
      The administrator replays the view "UAT share pie" as an aggregate query (stored filter, grouping and aggregate, no chart type) and notes
      the answer.
    via: api
  - step: 9
    actor: tenant_admin
    action: >
      The administrator deletes the view of step 4, then reads it by its id, then lists the views of the type, then deletes it a second time.
      The answers are noted. The administrator then deletes the views "UAT three figures chart", "UAT share pie", "UAT mixed pivot" and "UAT
      mixed list".
    via: api
  - step: 10
    actor: tenant_admin
    action: >
      The administrator reads the audit trail of the company for the entries of the graph view of steps 2, 4 and 9, and notes the kind of each
      entry, the acting person and the time.
    via: api

expected_outcomes:
  - id: EO-001
    description: A created graph view is stored as given and the answer names its kind, its chart type, who created it and when; the company is not named.
    verification:
      method: api_response
      detail: The answer of step 2 is a creation (201) with an id, the name "UAT open by region chart", the kind graph, the type "UAT graph ticket", the filter as given, the grouping by region, the aggregate sum of amount, the chart type bar, the creating person alice, and times; it holds no company identifier.
      evidence: The answer of step 2.
    on_fail:
      severity: MAJOR
      business_impact: A saved chart does not keep what the administrator set, so every user who opens it sees a different chart.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The graph view is found by list, by type and by id, with the same content each time, and names exactly one record type.
    verification:
      method: api_response
      detail: In step 3 the list of all views and the list of the type each contain the view once; the answer by id equals the answer of step 2 in every field, including the chart type; the view names one record type and no second one.
      evidence: The three answers of step 3 compared with step 2.
    on_fail:
      severity: MAJOR
      business_impact: Users cannot find the saved chart they need, or see two versions of it.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A change replaces the name, the aggregates and the chart type, keeps the kind, the type, the filter, the grouping and the creating person, and records who changed it and when.
    verification:
      method: api_response
      detail: After step 4 the view has the new name, the two aggregates in the stated order and the chart type line; the kind is graph, the type is "UAT graph ticket", the filter and grouping are those of step 2; the creating person is alice and the first time is unchanged; the changing person is alice and the second time is later than in step 2.
      evidence: The reading of the view in step 4 compared with step 2.
    on_fail:
      severity: MAJOR
      business_impact: A change to a shared chart is lost, or nobody can tell who changed it.
      suggested_action: route_to_wf03
  - id: EO-004
    description: A user with the query permission only (the task worker) sees the graph view, and the answer is the same as the administrator's.
    verification:
      method: api_response
      detail: In step 5 both answers are 200 and the view is shown with the content of step 4. The record type "UAT graph ticket" is created in step 1 without any restriction, so an empty list or a 404 for the task worker is a failure of this outcome.
      evidence: The two answers of step 5.
    on_fail:
      severity: MAJOR
      business_impact: Staff cannot use the charts their administrator has prepared.
      suggested_action: route_to_wf03
  - id: EO-005
    description: Replaying the stored definition as an aggregate query gives exactly the answer of the same query typed by hand, the filter is applied, and the chart type is not part of the query.
    verification:
      method: api_response
      detail: In step 6 the two answers are equal in every row and number, and show north with sum 30 and 2 records, and south with sum 5 and 1 record; the closed record D is in no row (a replay that dropped the filter would show north with 3 records and sum 130). In step 8 the replay of the pie view gives north 2 and south 1.
      evidence: The two answers of step 6 and the answer of step 8.
    on_fail:
      severity: BLOCKER
      business_impact: A saved chart shows different numbers from the same question asked directly, so decisions are taken on wrong figures.
      suggested_action: route_to_wf03
  - id: EO-006
    description: A graph view with one grouping and one aggregate (bar), one grouping and three aggregates (line) and one aggregate (pie) is accepted, and the list of the type shows graph, pivot and list views together, each with its kind.
    verification:
      method: api_response
      detail: In step 7 both graph creations are 201 with the chart types line and pie and the aggregates as given; the pivot and the list creations are 201; the list of the type holds the four views of step 7 and the view of step 4, five in all, each once, with kind graph, pivot or list, and a chart type for graph views only (a pivot or list entry carries no chart type value).
      evidence: The four creations of step 7 and the list of step 7.
    on_fail:
      severity: MAJOR
      business_impact: Administrators cannot save the charts they need, or a chart is mixed up with a table or a plain list.
      suggested_action: route_to_wf03
  - id: EO-007
    description: No answer of the view routes contains an aggregate result or a record value; deleting removes the graph view, a second reading or deletion gives the same not-found answer; create, change and delete each leave an audit entry naming the administrator.
    verification:
      method: audit_event
      detail: The answers of steps 2 to 5, 7 and 9 hold only the view fields (id, kind, type, name, filter, grouping, aggregates, chart type, persons, times; the list view also its columns and sort) and no number computed from records and no value of any record. In step 9 the first deletion succeeds (204), the reading and the second deletion give the same not-found status and body, and the list of the type does not show the view. In step 10 there are three entries (create, update, delete) for the view, each with alice as the acting person, and no entry for the failed second deletion.
      evidence: The answers of steps 2 to 5, 7 and 9 and the audit entries of step 10.
    on_fail:
      severity: BLOCKER
      business_impact: A view could become a second way to read records or totals that bypasses the rules which hide fields from a user, or changes to shared charts cannot be traced to a person.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Delete the views "UAT open by region chart", "UAT open by region chart v2", "UAT three figures chart", "UAT share pie", "UAT mixed pivot" and "UAT mixed list" if they still exist. The record type "UAT graph ticket" and its four records stay for scenarios 51 and 52 and are retired with the test customer.
