# T-1585 (BA batch 3 item 3, covers merged B2#7, #4098): the Metrics screen opens with a support summary a non-developer can read.
# Sources: web/src/pages/admin/MetricsPage.tsx (MetricsRead gate: a user without it is sent to the instances screen), web/src/pages/admin/MetricsSummaryPanel.tsx (heading "Support summary", figures requests per minute, errors per minute, routes with errors, slow database work, event-store write speed, background refresh;
# four cards "Not measured yet": database connection use, queue and background jobs, module versions per tenant, last upgrade result; one plain sentence per warn or red card; ru and kk texts), web/src/api/metricsSummary.ts (errors red from 5 percent error share; "thresholds are settings, not rules"),
# priv/permission_matrix/effective.golden (MetricsRead: TENANT_ADMIN, TENANT_AUDITOR, PROCESS_OPERATOR, PLATFORM_ADMIN; TASK_WORKER no).
# UAT assumption, to be confirmed by the process owner: the 5 percent red threshold is the shipped value (T-1551 item 7); the scenario does not assert a red state because the test environment cannot be made to fail on purpose (no failure injection through the roster).
# NOT UAT-observable: the Health page (platform operator only, in scope platform): its sentence is covered by the product's own test; the four not-measured figures are not built yet, so the scenario asserts that they say "Not measured yet" and not a number.
---
id: tenant-administration-b3-4-metrics-support-summary
scope: tenant-administration
title: The administrator reads the support summary on the Metrics screen in three languages; a task worker cannot open it
version: "1.0"
tags: [tenant-admin, metrics, support, ru, kk, en, refusal]

description: >
  The SwiftRoute administrator opens the Metrics screen. Above the raw figures a "Support summary" shows requests per minute, errors per minute, routes with errors, slow database work, event-store write speed and background refresh, each with a status word (OK, Check, Problem or No data) and, when not OK, one plain sentence saying what to do.
  Four figures that are not measured yet say so instead of a number. The text is read in English, Russian and Kazakh. The task worker Marco types the address of the screen and is sent away.

actors:
  admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco

preconditions:
  - description: SwiftRoute has been used for a few minutes (the scenarios before this one count), so the request figures are not empty.
    check: system_seeded
    detail: If the screen stays on "Measuring…" or "No data" for every figure after two minutes of use, report BLOCKED for EO-001 only.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator opens the Metrics screen from the menu and reads the Support summary.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator reads the four cards "Database connection use", "Queue and background jobs", "Module versions per tenant" and "Last upgrade result".
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator switches the language to Russian and then to Kazakh and reads the heading, the status words and the sentences again.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator opens the section "All figures (for developers)" and checks that the raw figures are still there.
    via: ui
  - step: 5
    actor: worker
    action: >
      The task worker types the address of the Metrics screen by hand in the browser.
    expect_refusal: true
    via: ui

expected_outcomes:
  - id: EO-001
    description: The summary is readable without a developer.
    verification:
      method: gui_screen
      detail: Step 1 shows the heading "Support summary" and the six figures, each with a status word. Any figure that is Check or Problem carries one sentence that tells the reader what to do (for example to note the time and report the routes listed). No figure shows a metric family name or a raw label.
      evidence: Screenshot.
    on_fail:
      severity: MAJOR
      business_impact: The first incident is diagnosed from logs by a developer.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: Unmeasured figures say so.
    verification:
      method: gui_screen
      detail: Step 2 shows "Not measured yet" on all four cards with a sentence saying to ask the platform operator; none shows a number or an OK status.
      evidence: Screenshot.
    on_fail:
      severity: MAJOR
      business_impact: A green or numeric card with no measurement behind it misleads the reader.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: The texts exist in three languages and the raw figures remain.
    verification:
      method: gui_screen
      detail: Step 3 shows the heading in Russian ("Сводка для поддержки") and in Kazakh, with status words and sentences in the chosen language, none left in English. Step 4 lists the raw figures.
      evidence: Screenshots in three languages.
    on_fail:
      severity: MINOR
      business_impact: Support staff who read only Russian or Kazakh cannot use the screen.
      suggested_action: route_to_frontend_dev
  - id: EO-004
    description: A task worker cannot open the Metrics screen.
    verification:
      method: gui_screen
      detail: Step 5 ends on the instances screen and no figure was shown.
      evidence: Screenshot.
    on_fail:
      severity: MAJOR
      business_impact: Operational figures reach people who should not see them.
      suggested_action: route_to_frontend_dev
