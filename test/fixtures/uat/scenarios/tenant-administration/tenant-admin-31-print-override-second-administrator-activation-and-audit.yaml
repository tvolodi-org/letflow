# T-0795 (BA): TENANT ADMIN group, scenario 31: a second administrator puts a print-layout draft into force; protection added after the save stops it; audit.
# Covers REQ-579 criterion 4 first sentence (a protection added after a draft was saved stops its activation: 422, rule and path only, no value or
# layout text in the body, the logs or the audit trail; the draft stays a draft), criterion 6 success half (the second administrator activates:
# 200, activated by them, status active, the previous active version of the same type and language retired in the same transaction; the creator
# retires an override: 200; activating an active or a retired override and retiring a retired one: 409 "override is not in a status that allows
# this action", nothing changes) and criterion 7 activation and retirement parts (one audit entry each, the exact payload keys, no layout text).
# Sources: docs/requirements.yaml REQ-579 criteria 4, 6, 7; docs/migration/decisions/0068-per-tenant-print-template-overrides.md (D5, D7, Q3);
# lib/letflow/documents/print_overrides.ex (do_activate: status check, then second-administrator check, then layout validation; fixed texts from
# conflict_reason/1); docs/roles.md (DocumentPrintTemplatesManage); test/fixtures/uat/actors.yaml.
# NOT RUNNABLE TODAY: the roster has one TENANT_ADMIN per company (actor-swiftroute-alice) and this flow needs a second administrator of the same
# company. The second actor is written as actor-any with a precondition and is NOT added to the roster (not invented); a GAP sidecar in
# test/fixtures/uat/scenario-env-limitations/ records the limitation. The scenario becomes runnable when the owner approves a second SwiftRoute
# TENANT_ADMIN test account and it is added to the roster. Until then the same outcomes are verified by the backend tests of REQ-579
# (S2-sod, D5-redact, S2-audit).
# UAT assumption, to be confirmed by the process owner: Q3 of decision 0068 as built is two-person activation (REQ-579 open_questions).
# Hidden values: layout literal "SENTINEL-print-9f3a" and the protected field's sample value "SECRET-cost-4471" must not appear in any 422 body,
# the logs or any audit entry. Approve (the activation is the approval of a company-official layout), pay or release, see-sensitive-data and
# change-users: the activation refusals of scenarios 29 (creator) and this one (status rule) cover the approve action.
---
id: tenant-administration-31-print-override-second-administrator-activation-and-audit
scope: tenant-administration
title: A second administrator activates a print-layout draft, a protection added after the save stops it, and every change is audited without layout text
version: "1.0"
tags: [tenant-admin, documents, print-override, activation, separation-of-duties, audit, restricted-field]

description: >
  The SwiftRoute administrator (A) saves two drafts of one layout for "purchase_order" (ru), each with a different sample text. A second
  SwiftRoute administrator (A2) activates the first: it becomes the active version, activated by A2. A2 activates the second: it becomes active
  and the first is retired at the same moment. The company then protects the field internal_cost; a third draft saved earlier that names
  internal_cost cannot be activated (422, no value or text shown) and stays a draft. A activates nothing of their own (409, scenario 29) but
  retires the active version (200). Activating an active or retired version, or retiring a retired one, is refused (409). Each save, activation
  and retirement writes exactly one audit entry whose payload holds the identifiers, type, language, version, fingerprint, the person and the
  reason code, and never layout text.

actors:
  creator: actor-swiftroute-alice
  second_admin: actor-any
  module: actor-system-documents-service

preconditions:
  - description: A second person holds TENANT_ADMIN in SwiftRoute (not the creator), signed in as second_admin
    check: system_seeded
    detail: The roster has no such actor today; without an approved second SwiftRoute administrator account the whole scenario is BLOCKED, not PASS (see the sidecar). Using the same person for both roles makes steps 6 and 7 fail.
  - description: SwiftRoute has the document type "purchase_order" with fields supplier_name and internal_cost, the field internal_cost is NOT protected at the start, and no print override exists
    check: system_seeded
    detail: Registered through the service-level harness (module). The harness can read the stored overrides and the SwiftRoute audit trail, and can add a protection on a field and read the service log.
  - description: The layouts used
    check: custom
    detail: >
      L1, L2 and L3 each have layout_schema_version 1 and blocks: page (size A4, margin_mm 15, font dejavu-sans), text, field (entity_type
      purchase_order, field_name supplier_name, label "Supplier"). The text of L1 is "test sample one", of L2 "test sample two", of L3 "SENTINEL-print-9f3a";
      L3 has one more field block naming internal_cost.

steps:
  - step: 1
    actor: creator
    action: A saves L1, L2 and L3 for purchase_order, ru, each in its own request, and notes the three identifiers (drafts 1, 2, 3, versions 1, 2, 3).
    via: api
    input:
      type_key: purchase_order
      locale: ru
  - step: 2
    actor: module
    action: Reads and notes the SwiftRoute audit entries of the print-override actions (three saves) and the stored rows.
    via: system
  - step: 3
    actor: second_admin
    action: A2 activates draft 1 with the reason code "go_live". The answer is noted.
    via: api
    input:
      reason_code: go_live
  - step: 4
    actor: second_admin
    action: A2 activates draft 2 with the reason code "go_live_2". The answer is noted, then the list of overrides.
    via: api
    input:
      reason_code: go_live_2
  - step: 5
    actor: second_admin
    action: A2 tries to activate draft 2 again (now active), and to activate draft 1 (now retired). Each is its own request. The answers are noted.
    expect_refusal: true
    via: api
    input:
      reason_code: go_live
  - step: 6
    actor: module
    action: Adds the company protection on the field internal_cost of purchase_order, then notes the stored rows and the audit entries.
    via: system
  - step: 7
    actor: second_admin
    action: A2 tries to activate draft 3 (saved before the protection) with the reason code "go_live_3". The answer is noted.
    expect_refusal: true
    via: api
    input:
      reason_code: go_live_3
  - step: 8
    actor: module
    action: >
      Searches the answer of step 7, the service log written during step 7 and every audit entry for "SENTINEL-print-9f3a" and "SECRET-cost-4471",
      and notes the stored status of draft 3 and the audit entries.
    via: system
  - step: 9
    actor: creator
    action: A retires the active version (draft 2) with the reason code "withdrawn". The answer is noted.
    via: api
    input:
      reason_code: withdrawn
  - step: 10
    actor: creator
    action: A tries to retire draft 2 again and to retire draft 1 (retired by step 4), each in its own request. The answers are noted.
    expect_refusal: true
    via: api
    input:
      reason_code: withdrawn
  - step: 11
    actor: module
    action: Reads the stored rows and the audit entries after step 10 and compares them with step 8.
    via: system

expected_outcomes:
  - id: EO-001
    description: A second administrator activates a draft; the activator is recorded and the previous active version is retired in the same step.
    verification:
      method: api_response
      detail: >
        Step 3 answers 200 with status active and activated_by equal to A2. Step 4 answers 200 with draft 2 active, activated_by A2; in the list of
        step 4 draft 1 is retired and draft 2 is the only active override for purchase_order, ru.
      evidence: The answers of steps 3 and 4.
    on_fail:
      severity: BLOCKER
      business_impact: A company's official print layout cannot be put into force by a second person, or two layouts are in force at once.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Activating an active or retired version, or retiring a retired one, is refused and changes nothing.
    verification:
      method: http_status
      detail: >
        Both requests of step 5 and both of step 10 answer 409 with the reason "override is not in a status that allows this action"; the stored
        rows in step 11 equal those after step 9 for drafts 1 and 2.
      evidence: The four refusals and the rows of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A layout could be re-activated or re-retired out of order, confusing which layout is in force.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A protection added after the save stops the activation, and nothing of the protected field or the layout text is shown anywhere.
    verification:
      method: api_response
      detail: >
        Step 7 answers 422 with detail "layout failed validation" and errors holding the rule field_restricted and a path of block positions only.
        In step 8 neither "SENTINEL-print-9f3a" nor "SECRET-cost-4471" appears in the answer, the service log or any audit entry, and draft 3 is
        still draft.
      evidence: The answer of step 7 and the searches of step 8.
    on_fail:
      severity: BLOCKER
      business_impact: A layout could put protected data into official documents, or the refusal could leak protected data.
      suggested_action: route_to_security_review
  - id: EO-004
    description: The creator may retire an active version.
    verification:
      method: http_status
      detail: Step 9 answers 200 with status retired for draft 2, and the list afterwards has no active override for purchase_order, ru.
      evidence: The answer of step 9 and the stored rows of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A wrong official layout cannot be withdrawn by the person who noticed.
      suggested_action: route_to_wf03
  - id: EO-005
    description: Each save, activation and retirement writes exactly one audit entry with the fixed payload and no layout text; refusals write none.
    verification:
      method: audit_event
      detail: >
        After step 2 there are three entries document.print_override_saved. After step 4 two more, document.print_override_activated (drafts 1 and
        2). After step 11 exactly one more, document.print_override_retired (draft 2). Each payload has exactly the keys override id, type_key,
        locale, version_no, layout_hash, actor id and reason_code (go_live, go_live_2, withdrawn for the activations and the retirement); no payload
        holds "test sample one", "test sample two" or "SENTINEL-print-9f3a". The refusals of steps 5, 7 and 10 added no entry (total six at the end).
      evidence: The audit entries read in steps 2, 6, 8 and 11.
    on_fail:
      severity: MAJOR
      business_impact: Changes to company print layouts are not traceable, or the audit trail carries layout wording.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: The stored rows cannot be deleted (they are permanent); they remain unused. Re-running needs a fresh test company or a different type_key.
