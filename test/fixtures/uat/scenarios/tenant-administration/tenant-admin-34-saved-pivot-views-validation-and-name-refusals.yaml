# T-0822 (BA): TENANT ADMIN group, scenario 34: saved pivot views, what the administrator is refused when the pivot is not valid, and the
# one-name-per-type rule across both kinds.
# Covers REQ-598 criteria 1 (the body rules: a pivot body with columns or sort, a list body with grouping or aggregates, refused as an unknown
# key; the view answer names kind, grouping and aggregates), 2 (field not on the type, unknown operator, unknown aggregate function, missing or
# empty aggregates, malformed grouping, a join key: refused with a short reason code, nothing stored; an absent or empty grouping accepted)
# and 3 (a pivot cannot reuse the name of a list view of the same type: 409).
# Sources: docs/requirements.yaml REQ-598 (criteria 1, 2, 3); lib/letflow/entities/views/clauses.ex (reason codes: unknown_key,
# field_not_allowed, unknown_operator, aggregates_invalid, group_by_invalid, kind_invalid, kind_immutable) and lib/letflow/routers/entity_views.ex
# (409 name_taken). Reason codes are quoted from those files, not from the requirement text alone.
# Depends on the record type "UAT pivot ticket" of scenario 33 (fields title, status, region, amount); this scenario creates it if missing.
# The four sensitive actions are not in this flow; the access refusals are in scenario 35.
---
id: tenant-administration-34-saved-pivot-views-validation-and-name-refusals
scope: tenant-administration
title: A saved pivot with an unknown field, operator, aggregate function, missing aggregates, bad grouping, a join, a mixed-up kind or a repeated name is refused and nothing is stored
version: "1.0"
tags: [tenant-admin, saved-views, pivot, validation, refusal, conflict]

description: >
  The administrator of SwiftRoute tries to save pivot views over the record type "UAT pivot ticket" that break one rule each: a filter on a
  field the type does not have, an unknown filter operator, a grouping on a field the type does not have, an aggregate on a field the type does
  not have, an unknown aggregate function, an aggregate that needs a field but has none (sum without a field), a sum over a text field, a
  missing list of aggregates, an empty list of aggregates, a grouping that is not a list, a grouping element without a field, a body that
  carries a join, a pivot that carries columns, a pivot that carries a sort, a list view that carries a grouping, a list view that carries
  aggregates, and a kind that is neither list nor pivot. In every attempt of steps 2 to 6, apart from the one broken item named in the step,
  the attempted view is the valid pivot of step 1: over "UAT pivot ticket", kind pivot, with the filter "status equals open", the grouping by
  region, the aggregate "count of records", and the name "UAT valid pivot" unless the step gives another name, so each refusal can only come
  from the item the step names. A pivot with the name of an existing list view over the same type, and a list view with the name of an
  existing pivot, are refused as duplicates (409). A change that turns the pivot into a list view is refused. After all attempts the list
  holds only the valid pivot of step 1 and the list view of step 7, unchanged.

actors:
  tenant_admin: actor-swiftroute-alice

preconditions:
  - description: SwiftRoute is set up with its administrator; the record type "UAT pivot ticket" with the fields title (text), status (text), region (text) and amount (whole number) is active; no saved view over it exists
    check: system_seeded
    detail: If the type is missing, create it as in scenario 33 step 1 (the records are not needed here) and say so in the report; if views exist from an earlier run, delete them first and note it.

steps:
  - step: 1
    actor: tenant_admin
    action: >
      The administrator saves the valid pivot "UAT valid pivot" over "UAT pivot ticket" with the filter "status equals open", the grouping by
      region and the aggregate "count of records", and notes its id. This is the baseline for the checks below.
    via: api
    input:
      name: UAT valid pivot
      kind: pivot
      entity_type: UAT pivot ticket
      filter: status equals open
      group_by: [region]
      aggregates: [count]
  - step: 2
    actor: tenant_admin
    action: >
      The administrator tries to save the pivot "UAT pivot bad filter field" with the filter "colour equals red" (the type has no field
      colour), then the pivot "UAT pivot bad operator" with the filter "status resembles open" (an operator that does not exist), then the
      pivot "UAT pivot bad group field" with the grouping by colour, then the pivot "UAT pivot bad aggregate field" with the aggregate "sum of
      colour". Each answer is noted.
    expect_refusal: true
    via: api
  - step: 3
    actor: tenant_admin
    action: >
      The administrator tries to save the pivot "UAT pivot bad function" with the aggregate function "median of amount" (not in the list count,
      sum, average, smallest, largest), then the pivot "UAT pivot sum no field" with the aggregate "sum" and no field, then the pivot "UAT pivot
      sum text" with the aggregate "sum of title" (title is text). Each answer is noted.
    expect_refusal: true
    via: api
  - step: 4
    actor: tenant_admin
    action: >
      The administrator tries to save the pivot "UAT pivot no aggregates" with no list of aggregates at all, then the pivot "UAT pivot empty
      aggregates" with an empty list of aggregates. Each answer is noted.
    expect_refusal: true
    via: api
  - step: 5
    actor: tenant_admin
    action: >
      The administrator tries to save the pivot "UAT pivot group text" with the grouping given as the single word "region" instead of a list,
      then the pivot "UAT pivot group no field" with a grouping list holding one element that has no field. Each answer is noted.
    expect_refusal: true
    via: api
  - step: 6
    actor: tenant_admin
    action: >
      The administrator tries to save the pivot "UAT pivot join" with a join to another record type added to the body, then the pivot "UAT
      pivot columns" with the columns title and status added, then the pivot "UAT pivot sort" with the sort "title ascending" added, then the
      list view "UAT list grouping" (kind list, column title) with the grouping by region added, then the list view "UAT list aggregates" (kind
      list, column title) with the aggregate "count of records" added, then the pivot "UAT pivot bad kind" with the kind "table". Each answer is
      noted.
    expect_refusal: true
    via: api
  - step: 7
    actor: tenant_admin
    action: >
      The administrator saves, as accepted cases, the pivot "UAT pivot empty grouping" with an empty grouping, and the pivot "UAT pivot absent
      grouping" with no grouping, each with the filter "status equals open" and the aggregate "count of records"; and saves the list view "UAT
      shared name" over "UAT pivot ticket" with the column title. Each answer is noted.
    via: api
  - step: 8
    actor: tenant_admin
    action: >
      The administrator tries to save a pivot named "UAT shared name" over "UAT pivot ticket" (valid filter, grouping and aggregate), and notes
      the answer.
    expect_refusal: true
    via: api
  - step: 9
    actor: tenant_admin
    action: >
      The administrator tries to save a list view named "UAT valid pivot" over "UAT pivot ticket" with the column title, and notes the answer.
    expect_refusal: true
    via: api
  - step: 10
    actor: tenant_admin
    action: >
      The administrator tries to change the pivot of step 1 so that it keeps the name "UAT valid pivot" and is a list view (kind list, column
      title), and notes the answer.
    expect_refusal: true
    via: api
  - step: 11
    actor: tenant_admin
    action: >
      The administrator lists the views of the type "UAT pivot ticket", reads the pivot of step 1 by its id, and then deletes the views "UAT
      valid pivot", "UAT pivot empty grouping", "UAT pivot absent grouping" and "UAT shared name".
    via: api

expected_outcomes:
  - id: EO-001
    description: A filter, grouping or aggregate on a field the type does not have, and an unknown filter operator, are each refused with a named reason and store nothing.
    verification:
      method: http_status
      detail: Every answer of step 2 is 422 with a fixed reason code and does not repeat the submitted text; the filter field, the grouping field and the aggregate field cases give the code for a field not allowed, and the operator case gives the code for an unknown operator.
      evidence: The four answers of step 2 and the list of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A broken saved pivot is stored and every user who opens it gets an error or a wrong table.
      suggested_action: route_to_wf03
  - id: EO-002
    description: An unknown aggregate function, an aggregate that lacks its field, a sum over a text field, a missing and an empty list of aggregates are each refused with the aggregates reason and store nothing.
    verification:
      method: http_status
      detail: Every answer of steps 3 and 4 is 422 with the reason code for invalid aggregates, the same code in all five cases; the list of step 11 shows no pivot with these names.
      evidence: The five answers of steps 3 and 4 and the list of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A pivot with no usable figures reaches the screens of the company.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A grouping that is not a list and a grouping element without a field are refused with the grouping reason and store nothing.
    verification:
      method: http_status
      detail: Both answers of step 5 are 422 with the reason code for invalid grouping, the same in both cases; the list of step 11 shows no pivot with these names.
      evidence: The two answers of step 5 and the list of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A pivot that cannot be grouped is stored and fails when a user opens it.
      suggested_action: route_to_wf03
  - id: EO-004
    description: A join, columns or a sort on a pivot, and a grouping or aggregates on a list view, are refused as an unknown key, and a kind that is neither list nor pivot is refused with its own reason.
    verification:
      method: http_status
      detail: The first five answers of step 6 are 422 with the same fixed reason code for an unknown key; the sixth (kind "table") is 422 with the reason code for an invalid kind; none of the six views exists in the list of step 11.
      evidence: The six answers of step 6 and the list of step 11.
    on_fail:
      severity: MAJOR
      business_impact: A pivot could be saved over two record types or mixed with list settings, which the screens cannot show.
      suggested_action: route_to_wf03
  - id: EO-005
    description: A pivot with an empty or an absent grouping is accepted, as the aggregate query accepts it.
    verification:
      method: http_status
      detail: Both creations of step 7 are 201 and the answers show the kind pivot and an empty grouping; the list view of step 7 is 201 with the kind list.
      evidence: The three answers of step 7.
    on_fail:
      severity: MINOR
      business_impact: Administrators cannot save a pivot of grand totals that the aggregate query itself allows.
      suggested_action: route_to_wf03
  - id: EO-006
    description: The name is unique per record type across both kinds; a repeated name is refused with the conflict answer in both directions.
    verification:
      method: http_status
      detail: The answers of steps 8 and 9 are 409 with the same fixed reason code; the list of step 11 holds each of those names once.
      evidence: The answers of steps 8 and 9 and the list of step 11.
    on_fail:
      severity: MAJOR
      business_impact: Two saved lists with the same name cannot be told apart by the people who choose between them.
      suggested_action: route_to_wf03
  - id: EO-007
    description: A saved pivot cannot be turned into a list view; the pivot is unchanged.
    verification:
      method: http_status
      detail: The answer of step 10 is 422 with the reason code for a kind that cannot change; the reading of step 11 shows the pivot of step 1 with its kind, filter, grouping and aggregates unchanged.
      evidence: The answer of step 10 and the reading of step 11.
    on_fail:
      severity: MINOR
      business_impact: A pivot that turns into a list loses its figures without notice.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: Delete the views "UAT valid pivot", "UAT pivot empty grouping", "UAT pivot absent grouping" and "UAT shared name" if they still exist. The record type "UAT pivot ticket" stays for scenarios 33 and 35.
