# T-1663 (BA, batch 6 item 7): the "Send password reset instructions" button on the user page (REQ-789, built by T-1657, commit d63a63120). Replaces the GAP record of the same id (deleted in this change).
# Sources: docs/requirements.yaml REQ-789 criteria 2 (button only for a user-management administrator and an active identity-provider user with an e-mail address), 3 (confirmation names the e-mail; cancel calls nothing),
# 4 (202 message; the 409 texts), 5 (en, ru, kk); web/src/pages/admin/passwordResetMessages.ts (the texts quoted below are copied from it; passwordResetBlock: order inactive, then no identity-provider login, then no e-mail);
# web/src/pages/admin/UserDetailPage.tsx (hint shown instead of the button; success message after confirm); web/src/router.tsx (the user page sits under the user-management permission); docs/roles.md (UsersManage: company administrator and platform administrator only).
# Route behaviour and its audit and mail rows: scenarios password-reset-1 and password-reset-2 (same folder). This scenario checks the screen.
# NOT UAT-OBSERVABLE (kept here so it survives the merge): the hint "no e-mail address" (a user cannot be created without an address, so no such user can be prepared); the three 409 texts after a press (the button is hidden for exactly the users the route refuses,
# so a 409 can only follow a race between two administrators; covered by the vitest tests of REQ-789 criterion 4).
# Precondition note for the owner: a user made on the Users screen or by the xlsx import is an internal user without a password. The page tells the administrator so in plain words (step 4) but offers no other way for such a user to sign in; see docs/uat/ba-decisions/T-1651.md item 1.
# Cleanup: the user uat-pw3-<run>-1 cannot be deleted through the product; step 6 switches it off.
---
id: tenant-administration-password-reset-3-user-page-button
scope: tenant-administration
title: "The user page offers 'Send password reset instructions' only for an active identity-provider user with an e-mail address, asks for confirmation, and says in plain words why it is missing for other users"
version: "1.0"
tags: [users, password-reset, user-page, confirmation, i18n, access_control, cross-tenant, tenant-admin]

description: >
  SwiftRoute's administrator opens the page of Hans, an active identity-provider user with an e-mail address, and finds the button "Send password reset instructions". Pressing it opens a confirmation that names Hans's e-mail address;
  cancelling sends nothing; confirming shows a message that instructions were requested for that address, and the audit log and the mail log each gain one row. The administrator creates a user on the Users screen: that user's page has no button and says
  the user does not sign in through the company's sign-in page; after the user is switched off the page says the user is inactive. The texts show in English, Russian and Kazakh. The task worker and the auditor cannot open a user page,
  and the Bilimbaga administrator who opens Hans's page address sees no user and no button.

actors:
  admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco
  auditor: actor-swiftroute-auditor
  other_admin: actor-bilimbaga-admin
  colleague: actor-swiftroute-hans

preconditions:
  - description: Scenario tenant-administration-password-reset-1 has run in this run, so Hans is an active identity-provider user of SwiftRoute with an e-mail address
    check: system_seeded
    detail: If Hans is missing or inactive, report BLOCKED for steps 1, 2, 5 and 7 only. Do not prepare him by another route.
  - description: The run has a fresh run tag; no SwiftRoute user is named uat-pw3-<run>-1
    check: custom
    detail: A user name from an earlier run would make the creation in step 3 fail.
  - description: The screen offers English, Russian and Kazakh in the language switcher
    check: system_seeded
    detail: Shipped with the web application.

steps:
  - step: 1
    actor: admin
    action: >
      On the audit log filtered to the action "user.password_reset_requested" and on the mail delivery log filtered to the template "password_reset_hint", the administrator notes how many entries SwiftRoute holds for Hans (A and D).
      The administrator then opens Hans's page from the Users list in English, reads the button, presses it, and reads the confirmation. The administrator presses "Cancel", and reads both logs again.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator presses the button again and presses "Send". The administrator reads the message on the page and reads both logs again.
    via: ui
  - step: 3
    actor: admin
    action: >
      On the Users screen the administrator creates a user with the user name "uat-pw3-<run>-1", the display name "UAT Password Reset Page" and the e-mail address "uat-pw3-<run>-1@example.test", then opens that user's page and reads the area where the button would be.
    via: ui
  - step: 4
    actor: admin
    action: >
      On the page of the new user and on Hans's page, the administrator switches the screen language to Russian, then to Kazakh, and each time reads the hint of the new user's page, then Hans's button and, after pressing it, the confirmation's title, text and two buttons (cancelling each time).
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator sets the screen language back to English, switches the new user to inactive on its page, saves, and reads the area where the button would be.
    via: ui
  - step: 6
    actor: worker
    action: >
      SwiftRoute's task worker opens the page of Hans by its address.
    expect_refusal: true
    via: ui
  - step: 7
    actor: auditor
    action: >
      SwiftRoute's read-only auditor opens the page of Hans by its address.
    expect_refusal: true
    via: ui
  - step: 8
    actor: other_admin
    action: >
      The Bilimbaga administrator opens the address of Hans's user page (the address with Hans's identifier) and reads what the page shows.
    expect_refusal: true
    via: ui

expected_outcomes:
  - id: EO-001
    description: The button and its confirmation work, and cancelling sends nothing.
    verification:
      method: gui_screen
      detail: >
        Step 1: Hans's page shows the button "Send password reset instructions"; pressing it opens a confirmation whose text is: An e-mail will be sent to <Hans's e-mail address> telling the user to choose "Forgot password" on the sign-in page. No password is sent or changed.
        with the buttons "Send" and "Cancel". After "Cancel" both logs still hold A and D rows for Hans. The confirmation holds no password field.
      evidence: Screens of step 1 and the two log counts.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot help a colleague who forgot the password, or a mis-click sends mail.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Confirming requests the instructions once and says so.
    verification:
      method: gui_screen
      detail: >
        Step 2: the page shows the message "Password reset instructions were requested for <Hans's e-mail address>." and the audit log holds A+1 entries and the mail log D+1 rows for Hans (action "user.password_reset_requested"; template "password_reset_hint").
      evidence: Screen of step 2 and the log counts.
    on_fail:
      severity: MAJOR
      business_impact: The administrator is not told whether the request was taken, or it is taken twice.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A user who cannot sign in through the company's sign-in page gets no button and a plain-words reason.
    verification:
      method: gui_screen
      detail: >
        Step 3: the new user's page shows no button "Send password reset instructions" and shows the hint "This user does not sign in through the company's sign-in page, so there is no password to reset here." Step 5 (after the user is switched off):
        no button and the hint "This user is inactive, so no reset message can be sent."
      evidence: Screens of steps 3 and 5.
    on_fail:
      severity: MAJOR
      business_impact: The administrator presses a button that is refused, or has no explanation why the help is missing.
      suggested_action: route_to_wf03
  - id: EO-004
    description: The button, confirmation and hint are shown in Russian and Kazakh.
    verification:
      method: gui_screen
      detail: >
        Step 4, Russian: the hint is "Этот пользователь входит не через общую страницу входа компании, поэтому сбрасывать здесь нечего."; the button is "Отправить инструкцию по сбросу пароля"; the confirmation text starts "На <e-mail> будет отправлено письмо"; the buttons are "Отправить" and "Отмена".
        Kazakh: the hint starts "Бұл пайдаланушы компанияның ортақ кіру бетінен кірмейді"; the button is "Құпиясөзді қалпына келтіру нұсқауын жіберу"; the buttons are "Жіберу" and "Бас тарту". No text is shown as a key or cut off.
        The Kazakh texts are machine drafts until the owner's native check; a wording remark is a MINOR finding, a missing text is not.
      evidence: Screens of step 4 in both languages.
    on_fail:
      severity: MINOR
      business_impact: A Russian or Kazakh speaking administrator sees English or broken text on this page.
      suggested_action: route_to_wf03
  - id: EO-005
    description: Only a user-management administrator reaches the page, and one company cannot open another company's user.
    verification:
      method: gui_screen
      detail: >
        Steps 6 and 7: the task worker and the auditor are each turned away from the user page (no user details, no button). Step 8: the Bilimbaga administrator sees no user and no button on Hans's address (a "not found" or error state, the same as for an unused identifier);
        no details of Hans appear.
      evidence: Screens of steps 6 to 8.
    on_fail:
      severity: BLOCKER
      business_impact: A person without user-management rights could ask for password resets, or one company could see another company's users.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: The user uat-pw3-<run>-1 cannot be deleted through the product; step 5 leaves it switched off. Hans is not changed.
