# T-0765 (BA): TENANT ADMIN group, scenario 26: attaching an after-save script to a record type and event is refused when the script or the type is not fit, and nothing changes.
# Covers REQ-570 criterion 5 (one refusal step per case: draft, retired and revoked version; script of another kind; fingerprint mismatch; unknown script key; unknown script version;
# unknown record type; managed record type; also an already attached pair, an event outside created/updated/deleted and a missing fingerprint).
# Sources: docs/requirements.yaml REQ-570 criterion 5; lib/letflow/routers/record_trigger_bindings.ex (moduledoc "Refusal statuses": 403 entity_type_managed; 404 not found;
# 422 invalid_input, script_not_found, hook_kind_mismatch; 409 script_not_published, sha_mismatch, already_bound); lib/letflow/record_triggers.ex (check order: sign-in kind, request shape and event,
# type exists, type not managed, script found, published, kind, fingerprint, pair free; managed authority is Letflow.Entities.ManagedTypes; a retired, draft or revoked version is "not published",
# a discarded or absent one is "not found"); test/fixtures/uat/scenarios/bilimbaga/exam-authoring-refusal-general-record-route-on-managed-types.yaml (the exam module manages Bilimbaga's exam record types).
# Not in this scenario: the write-line and restriction refusals of REQ-570 criterion 5 (a declared write line to a missing or managed type, a forbidden field, a field that would end with fewer
# restrictions). They need after-save scripts that declare write lines and restricted fields, which the UAT test data does not provide; they stay with the backend tests (REQ-570 criterion 5 tests).
# The status numbers are the router's own choice: decision 0067 leaves them open, so a status other than the one named here is a finding to report, not a business failure; the reason texts and
# the fact of refusal are the checks.
# Each refusal step holds exactly one request. The accepted cases (steps 1 and 15) are their own steps.
# Environment: needs the record-trigger feature SWITCHED ON; if step 1 answers 404, report BLOCKED. The script never runs in this release; no step saves a record.
# The four sensitive actions (approve, pay or release, see sensitive data, change users) are not in this flow.
---
id: tenant-administration-26-record-trigger-bind-refusals
scope: tenant-administration
title: An after-save script that is not fit, or a record type that is not fit, cannot be attached, and a refusal changes nothing
version: "1.0"
tags: [tenant-admin, record-triggers, bind, refusal]

description: >
  The administrator of SwiftRoute tries to attach after-save scripts to record types and events in every way the product must refuse: a draft, a retired and a revoked script version;
  a script of the wrong kind (a service step script); a fingerprint that does not match; a script key or version that does not exist; a record type that does not exist; a pair of record
  type and event that already has an attachment (when the request does not say it is a replacement); an event that is not created, updated or deleted; and a request with the fingerprint
  missing. The administrator of Bilimbaga tries to attach a script to a record type that the exam module manages. Every try is refused with its own reason and the list of attachments is
  the same afterwards.

actors:
  tenant_admin_a: actor-swiftroute-alice
  tenant_admin_b: actor-bilimbaga-admin

preconditions:
  - description: The record-trigger feature is switched on in the test environment.
    check: system_seeded
    detail: If step 1 answers 404, report BLOCKED for the whole scenario.
  - description: SwiftRoute has record types of its own named "trig_plain" and "trig_taken", unmanaged, written by no process, with no attachment.
    check: system_seeded
    detail: Setup-prepared. If an attachment exists, remove it first and note that in the report.
  - description: SwiftRoute has these scripts, each version noted with its fingerprint - trigger_check version 1 (published, kind "record event", FP-C1); trigger_draft version 1 (draft, kind "record event"); trigger_old version 1 (retired, kind "record event"); trigger_bad version 1 (revoked, kind "record event"); svc_check version 1 (published, kind "service step"). The key "no_such_key" and the version 99 of trigger_check do not exist.
    check: system_seeded
    detail: Setup-prepared. A fingerprint of a draft, retired or revoked version is read by the administrator from the script registry.
  - description: Bilimbaga has the exam module installed, one record type managed by the exam module (noted as MT, for example the question type), and a published after-save script of kind "record event" - bilim_trigger version 1 with fingerprint FP-B1.
    check: system_seeded
    detail: If the Bilimbaga administrator cannot sign in (no approved test token, see the roster note of actor-bilimbaga-admin), report BLOCKED for step 10 and EO-004; the other steps run.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator attaches trigger_check version 1 (fingerprint FP-C1) to "trig_taken" for the event "created". Then asks for the list of attachments and notes it as list L0.
    via: api
  - step: 2
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_draft version 1, a draft version (with its fingerprint), to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 3
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_old version 1, a retired version (with its fingerprint), to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 4
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_bad version 1, a revoked version (with its fingerprint), to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 5
    actor: tenant_admin_a
    action: >
      The administrator tries to attach svc_check version 1, a published script of kind "service step" (with its fingerprint), to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 6
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 1 to "trig_plain" for the event "created" with a fingerprint of 64 hexadecimal zeros that is not the fingerprint of that version.
    expect_refusal: true
    via: api
  - step: 7
    actor: tenant_admin_a
    action: >
      The administrator tries to attach the key "no_such_key", version 1 (with 64 hexadecimal zeros as fingerprint) to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 8
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 99 (with 64 hexadecimal zeros as fingerprint) to "trig_plain" for the event "created".
    expect_refusal: true
    via: api
  - step: 9
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 1 (fingerprint FP-C1) to "trig_nowhere", a record type that SwiftRoute has not defined, for the event "created".
    expect_refusal: true
    via: api
  - step: 10
    actor: tenant_admin_b
    action: >
      The Bilimbaga administrator tries to attach bilim_trigger version 1 (fingerprint FP-B1) to the record type MT that the exam module manages, for the event "created".
    expect_refusal: true
    via: api
  - step: 11
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 1 (fingerprint FP-C1) to "trig_taken" for the event "created", which already has an attachment, as a first-time attaching
      (the request does not say that it is a replacement).
    expect_refusal: true
    via: api
  - step: 12
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 1 (fingerprint FP-C1) to "trig_plain" for the event "archived", which is not one of created, updated or deleted.
    expect_refusal: true
    via: api
  - step: 13
    actor: tenant_admin_a
    action: >
      The administrator tries to attach trigger_check version 1 to "trig_plain" for the event "created" with the fingerprint left out of the request.
    expect_refusal: true
    via: api
  - step: 14
    actor: tenant_admin_a
    action: >
      The administrator asks for the list of attachments and compares it with list L0.
    via: api
  - step: 15
    actor: tenant_admin_a
    action: >
      The administrator attaches trigger_check version 1 (fingerprint FP-C1) to "trig_taken" for the event "updated" - the same record type with a different event, which is allowed - then asks for the list.
    via: api
  - step: 16
    actor: tenant_admin_a
    action: >
      Clean-up: the administrator removes the attachments of "trig_taken" "created" and "trig_taken" "updated" and asks for the list.
    via: api

expected_outcomes:
  - id: EO-001
    description: A draft, a retired and a revoked script version are each refused as "not published".
    verification:
      method: http_status
      detail: Steps 2, 3 and 4 each answer 409 with the reason "script_not_published".
      evidence: The answers of steps 2 to 4.
    on_fail:
      severity: BLOCKER
      business_impact: A script that nobody reviewed, or that was withdrawn, could be chosen to run after a record is saved.
      suggested_action: route_to_security_review
  - id: EO-002
    description: A script of the wrong kind, a wrong fingerprint, an unknown key or version, an event outside the list and a missing fingerprint are each refused with their own reason.
    verification:
      method: http_status
      detail: Step 5 answers 422 with the reason "hook_kind_mismatch". Step 6 answers 409 with "sha_mismatch". Steps 7 and 8 each answer 422 with "script_not_found". Steps 12 and 13 each answer 422 with "invalid_input".
      evidence: The answers of steps 5 to 8, 12 and 13.
    on_fail:
      severity: BLOCKER
      business_impact: A script that is not the one the administrator reviewed could be attached, or the administrator is given a wrong reason and cannot correct the request.
      suggested_action: route_to_security_review
  - id: EO-003
    description: A record type that does not exist, and a pair that already has an attachment, are refused.
    verification:
      method: http_status
      detail: Step 9 answers 404. Step 11 answers 409 with the reason "already_bound" and the entry of "trig_taken" "created" in step 14 is still version 1 of trigger_check.
      evidence: The answers of steps 9 and 11 and the list of step 14.
    on_fail:
      severity: MAJOR
      business_impact: An existing attachment could be replaced by mistake without saying so, or an attachment is stored for a type that is not there.
      suggested_action: route_to_wf03
  - id: EO-004
    description: A record type managed by a module is refused.
    verification:
      method: http_status
      detail: Step 10 answers 403 with the code "entity_type_managed". The list of Bilimbaga has no entry for MT.
      evidence: The answer of step 10 and a list of attachments of Bilimbaga read afterwards.
    on_fail:
      severity: BLOCKER
      business_impact: A company could attach its own script to a record type the module owns and so change the module's behaviour.
      suggested_action: route_to_security_review
  - id: EO-005
    description: The same record type may carry a second attachment for a different event.
    verification:
      method: api_response
      detail: Step 15 answers 201 and its list shows "trig_taken" "created" and "trig_taken" "updated", both trigger_check version 1.
      evidence: The answer and list of step 15.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot attach scripts to more than one event of a record type.
      suggested_action: route_to_wf03
  - id: EO-006
    description: Refused tries change nothing.
    verification:
      method: system_state
      detail: In step 14 the list is identical to list L0 (only "trig_taken" "created" with trigger_check version 1). The audit trail of SwiftRoute has an entry for step 1 and for step 15 only (plus the two removals of step 16), none for steps 2 to 13, and the audit trail of Bilimbaga has none for step 10. The audit trail is read from the database.
      evidence: The list of step 14 and the audit entries between step 1 and step 16.
    on_fail:
      severity: MAJOR
      business_impact: A refused request left a half-made attachment or a false record in the audit trail.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: Remove the attachments of "trig_taken" and "trig_plain" in SwiftRoute if left. Nothing was changed in Bilimbaga.
