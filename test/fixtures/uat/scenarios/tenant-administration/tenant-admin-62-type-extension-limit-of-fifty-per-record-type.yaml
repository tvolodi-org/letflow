# T-0967 (BA): TENANT ADMIN group, scenario 62: at most fifty extra fields per record type, and the limit is per record type and per company.
# Covers REQ-609 criterion 4 (50 can be created, the 51st is refused with extension_limit_reached, the other record type of the same company and the same record type of another company are unaffected).
# Sources: docs/requirements.yaml REQ-609 description "THE CAP" and criterion 4; docs/migration/decisions/0067-tenant-x-extension-layer-over-module-entity-types.md D3/D4 ("for example 50").
# UAT assumption, to be confirmed by the process owner: whether RETIRED entries count toward the 50. REQ-609 states that they count (and its open_questions list this as an assumption), but decision 0067 says only "for
# example 50" and does not say so. This scenario therefore does NOT assert it as behaviour: step 3 records what the system answers after one retirement as an observation (EO-003), and the sign-off
# is the process owner's. The number 50 itself is the requirement's; the UAT environment is assumed not to change it.
# NOT COVERED: two simultaneous creates at 49 (criterion 4, last sentence) need two database connections and a controlled race; it is a test-environment case, not a UAT step.
# The other company's administrator is the Bilimbaga administrator; if no approved test token exists for them (roster note of actor-bilimbaga-admin), step 5 is BLOCKED.
# The four sensitive actions (approve, pay or release, see sensitive data, change users) are not in this flow; the refusals are the limit refusals.
---
id: tenant-administration-62-type-extension-limit-of-fifty-per-record-type
scope: tenant-administration
title: The fiftieth extra field of a record type is accepted, the fifty-first is refused, and the limit does not spill over to another record type or another company
version: "1.0"
tags: [tenant-admin, type-extension, limit, refusal, cross-tenant]

description: >
  SwiftRoute's administrator adds fifty extra fields to the module record type "ext_module_item" (named "x_cap_01" to "x_cap_50"). All fifty are accepted, with place numbers 1 to 50. The fifty-first
  ("x_cap_51") is refused with the reason "extension_limit_reached" and the list still has fifty entries. The administrator retires one entry and tries again: what the system answers is recorded (UAT
  assumption, to be confirmed by the process owner, on whether retired entries count). A second module record type of SwiftRoute, "ext_module_other", still accepts a field, and so does the same record
  type name in Bilimbaga, whose administrator adds "x_cap_01" independently.

actors:
  tenant_admin_a: actor-swiftroute-alice
  tenant_admin_b: actor-bilimbaga-admin

preconditions:
  - description: SwiftRoute has the module-installed record types "ext_module_item" and "ext_module_other" (both visible to the administrator, not append-only), each with no extra fields.
    check: system_seeded
    detail: Setup-prepared. If extra fields exist, use a record type with none, or report BLOCKED.
  - description: Bilimbaga has a module-installed record type named "ext_module_item" (visible to its administrator, not append-only) with no extra fields.
    check: system_seeded
    detail: If the Bilimbaga administrator cannot sign in, report BLOCKED for step 5 and the Bilimbaga part of EO-004; the other steps run.
  - description: The limit is the product's own number (fifty) and has not been changed in the environment.
    check: system_seeded
    detail: If a different limit is configured, report BLOCKED and the number found.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator adds the text fields "x_cap_01", "x_cap_02" and so on up to "x_cap_50" to "ext_module_item", one request each, in that order. The answer of each is noted (status and place number), and the list is asked for and noted as list L50.
    via: api
  - step: 2
    actor: tenant_admin_a
    action: >
      The administrator tries to add "x_cap_51" (text) to "ext_module_item". The answer is noted as C51, and the list is asked for again and noted as list L50b.
    expect_refusal: true
    via: api
  - step: 3
    actor: tenant_admin_a
    action: >
      The administrator retires "x_cap_50", then tries to add "x_cap_52" (text) to "ext_module_item". The answer is noted as C52 and the list is asked for and noted as list L50c. This step is an observation for the open question in the header; it is not asserted as behaviour.
    via: api
  - step: 4
    actor: tenant_admin_a
    action: >
      The administrator adds "x_cap_01" (text) to the other record type "ext_module_other". The answer is noted.
    via: api
  - step: 5
    actor: tenant_admin_b
    action: >
      The Bilimbaga administrator adds "x_cap_01" (text) to their own "ext_module_item", and then asks for the list. The answer and the list are noted.
    via: api
  - step: 6
    actor: tenant_admin_a
    action: >
      The SwiftRoute administrator asks again for the list of "ext_module_item" and notes it as list L50d.
    via: api

expected_outcomes:
  - id: EO-001
    description: Fifty extra fields can be added to one record type.
    verification:
      method: api_response
      detail: Each of the fifty requests of step 1 answers 201 with place numbers 1 to 50 in order and status "active". List L50 has exactly fifty items, in order x_cap_01 to x_cap_50.
      evidence: The fifty answers and list L50.
    on_fail:
      severity: MAJOR
      business_impact: A company cannot reach the documented number of extra fields.
      suggested_action: route_to_developer
  - id: EO-002
    description: The fifty-first extra field is refused with the reason "extension_limit_reached" and nothing is stored.
    verification:
      method: http_status
      detail: Step 2 answers 422 with the reason "extension_limit_reached"; the answer does not repeat the submitted name. List L50b equals list L50.
      evidence: Answer C51 and lists L50 and L50b.
    on_fail:
      severity: MAJOR
      business_impact: The number of extra fields per record type is unbounded, which burdens every read of that record type.
      suggested_action: route_to_developer
  - id: EO-003
    description: Whether a retired entry still counts toward the limit is recorded as observed. Not settled by the source beyond the requirement's own statement; the process owner confirms.
    verification:
      method: api_response
      detail: Step 3's retirement answers 200 with "x_cap_50" retired. Record C52 and list L50c. The requirement REQ-609 says retired entries count, so the expected answer is 422 "extension_limit_reached" and a list of fifty entries (one retired); any other answer is reported to the BA as a difference from the requirement, with severity MINOR, not as a failure of the platform, until the process owner decides.
      evidence: Answer C52 and list L50c.
    on_fail:
      severity: MINOR
      business_impact: Create-and-retire cycles could grow the stored entries without bound, or the limit is stricter than documented.
      suggested_action: ask_process_owner
  - id: EO-004
    description: The limit is per record type and per company.
    verification:
      method: api_response
      detail: Step 4 answers 201 with place number 1 for "ext_module_other" although "ext_module_item" is full. Step 5 answers 201 with place number 1 for Bilimbaga's "ext_module_item", and Bilimbaga's list holds only that one entry. List L50d (step 6) is unchanged from list L50c.
      evidence: The answers of steps 4 and 5, Bilimbaga's list and list L50d.
    on_fail:
      severity: MAJOR
      business_impact: One company's or one record type's extra fields use up another's allowance.
      suggested_action: route_to_developer

cleanup:
  cancel_open_instances: false
  description: Extra fields cannot be deleted. Retire the fields created here if the environment is to be reused and note that their names stay reserved (use new names on the next run).
