# T-1648 (BA, batch 5 item 10): PHASE 3 of 5 of the demo-module sequence (order and release switch: see the header of tenant-administration-runtime-demo-1-install-at-first-release). QA runs demo release 0.2.0.
# Sources: docs/runbooks/runtime-demo-module.md step 2 ("POST .../rollback with target_version 0.1.0 succeeds. Upgrade again"); lib/letflow/module_upgrade/rollback.ex (body exactly rationale, target_version, dry_run; request checks in the order
# rationale, target version, dry run, then the module must be installed and active; the gate answers no_previous_version first when no finished upgrade exists; a refusal is 409 and, inside the 200 body of a dry run, rollback_possible false with the code in "refusal");
# lib/letflow/routers/tenant_modules.ex (upgrade plan, upgrade with plan_hash and rationale, rollback); decision 0055 D9; priv/permission_matrix/effective.golden (ModulesManage: TENANT_ADMIN yes, TASK_WORKER no, TENANT_AUDITOR no).
# State needed: SwiftRoute's demo module was upgraded 0.1.0 -> 0.2.0 by the fleet rollout of phase 2, which leaves a finished upgrade entry, so a rollback to 0.1.0 is possible. Bilimbaga was upgraded in phase 2 too and is NOT rolled back here (the cross-company check).
# After this scenario SwiftRoute is back at 0.2.0 (the administrator upgrades again), which phase 4 needs.
# The exact refusal code for a target version that was never applied (step 5) is whatever the rollback gate answers first; the run records it. The scenario only requires a refusal that leaves the module at 0.2.0.
---
id: tenant-administration-runtime-demo-3-rollback-succeeds-and-upgrade-again
scope: tenant-administration
title: "A company administrator tries a rollback of the demo module as a dry run, rolls it back to the first version for real, sees the module still work, and upgrades it again; other roles and the other company are unaffected"
version: "1.0"
tags: [runtime-updates, rollback, upgrade, demo-module, refusal, access_control, cross-tenant, tenant-admin]

description: >
  SwiftRoute's demo module stands at 0.2.0 after the platform rollout, with a finished upgrade behind it. The administrator asks for a trial run of the rollback to 0.1.0 and is told it is possible, with nothing changed. A rollback to a
  version the module never had is refused. A task worker and the auditor are refused a real rollback. The administrator then rolls back to 0.1.0 for real: the Modules screen shows 0.1.0 and the ping still answers. The administrator asks for the upgrade plan and
  applies it, and the module is at 0.2.0 again. Bilimbaga's demo module stays at 0.2.0 throughout.

actors:
  admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco
  auditor: actor-swiftroute-auditor
  other_admin: actor-bilimbaga-admin

preconditions:
  - description: Phase 2 has run to the end (SwiftRoute and Bilimbaga hold the demo module at 0.2.0) and the QA build still runs demo release 0.2.0
    check: custom
    detail: If SwiftRoute's version is not 0.2.0 or the module is not installed, report BLOCKED and name what was seen. Do not upgrade to prepare it.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator opens the Modules screen and reads the demo module's version, then asks for a trial run (dry run) of the rollback to the target version "0.1.0" with the reason "UAT trial".
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator asks for the real rollback to the target version "0.0.1" (a version the module never had) with the reason "UAT wrong target".
    expect_refusal: true
    via: api
  - step: 3
    actor: worker
    action: >
      SwiftRoute's task worker asks for the real rollback to "0.1.0" with the reason "UAT worker".
    expect_refusal: true
    via: api
  - step: 4
    actor: auditor
    action: >
      SwiftRoute's read-only auditor asks for the real rollback to "0.1.0" with the reason "UAT auditor".
    expect_refusal: true
    via: api
  - step: 5
    actor: admin
    action: >
      The administrator reloads the Modules screen and reads the demo module's version.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator asks for the real rollback to "0.1.0" with the reason "UAT rollback", reloads the Modules screen, reads the version, and calls the demo module's ping.
    via: ui
  - step: 7
    actor: admin
    action: >
      The administrator asks for the upgrade plan of the demo module, reads it, and applies it with its plan fingerprint and the reason "UAT upgrade again"; then reloads the Modules screen and calls the ping.
    via: ui
  - step: 8
    actor: other_admin
    action: >
      The Bilimbaga administrator opens the Modules screen and reads the demo module's version, and calls the ping.
    via: ui

expected_outcomes:
  - id: EO-001
    description: A trial run says the rollback is possible and changes nothing.
    verification:
      method: api_response
      detail: Step 1 answers 200 with rollback_possible true for the target 0.1.0 and no refusal code; the Modules screen still shows 0.2.0 afterwards (step 5).
      evidence: Answer of step 1 and the version of step 5.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot preview a rollback, or the preview already rolls back.
      suggested_action: route_to_wf03
  - id: EO-002
    description: A rollback to a version the module never had is refused and the module stays at 0.2.0.
    verification:
      method: http_status
      detail: Step 2 is refused with a 409 and a named reason (the run records the code; it is one of the rollback gate's codes, not a generic error). The version stays 0.2.0 (step 5).
      evidence: Status and code of step 2; version of step 5.
    on_fail:
      severity: MAJOR
      business_impact: A wrong target could move the module to a version it never ran.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A worker and the auditor cannot roll a module back.
    verification:
      method: http_status
      detail: Steps 3 and 4 are answered 403; the version is still 0.2.0 in step 5.
      evidence: Statuses of steps 3 and 4.
    on_fail:
      severity: BLOCKER
      business_impact: A person without module rights changes the version a company runs.
      suggested_action: route_to_security_review
  - id: EO-004
    description: The real rollback succeeds and the module keeps working.
    verification:
      method: gui_screen
      detail: Step 6 answers success; the Modules screen shows the demo module at 0.1.0; the ping answers 200.
      evidence: Screenshot of step 6 and status of the ping.
    on_fail:
      severity: MAJOR
      business_impact: A company cannot go back to the previous version after a bad update.
      suggested_action: route_to_wf03
  - id: EO-005
    description: The module can be upgraded again, and the other company was not moved by either change.
    verification:
      method: gui_screen
      detail: Step 7 shows a plan from 0.1.0 to 0.2.0, then the module at 0.2.0 and a 200 ping. Step 8 shows Bilimbaga at 0.2.0 with a 200 ping (never at 0.1.0 during this scenario).
      evidence: Screenshots of steps 7 and 8.
    on_fail:
      severity: BLOCKER
      business_impact: One company's rollback or upgrade changes another company's module.
      suggested_action: route_to_security_review
