# T-0923 (BA): TENANT ADMIN group, scenario 58: who sees the Print templates screen: the administrator yes; a worker and an auditor see no menu entry and get the no-access page; another company's administrator sees only their own company's overrides.
# Covers REQ-614 criterion 2 (quoted): "Route 'admin/print-templates' in web/src/router.tsx renders PrintTemplatesPage inside RequirePermission with
# DocumentPrintTemplatesManage, and AppShell shows its nav entry only to a user holding that permission. A component test with the access fixtures
# picks them by key, never by role name...: it shows the entry and the screen for the fixtures tenantAdmin and platformAdmin, and shows neither for
# designer and auditor." and the description sentence "a user without it does not see the entry and the route shows the existing no-access outcome of
# RequirePermission". Also the criterion 9 part "that no request carries a tenant identifier (INV-10)" as seen by a person: the list of a second
# company's administrator holds that company's rows only (step 6).
# Roster mapping: "designer" has no roster account; the roster refusals are actor-swiftroute-marco (TASK_WORKER) and actor-swiftroute-auditor
# (TENANT_AUDITOR), both without the permission per the role matrix (docs/roles.md: DocumentPrintTemplatesManage is yes for PLATFORM_ADMIN and
# TENANT_ADMIN only). The platform operator is not in a step: actor-platform-admin signs in to the platform company and would see that company's
# (empty) list, which shows nothing about SwiftRoute; its permission is checked by the web unit test of criterion 2 (fixture platformAdmin).
# Not covered here: the fixtures-by-key rule and "the fixtures add the permission to those two roles only" (unit test and the no-role-literals guard);
# the second administrator's success is scenario 59; the screen's behaviour is scenarios 56 and 57.
# Sources: docs/requirements.yaml REQ-614; web/src/router.tsx (route admin/print-templates under RequirePermission), web/src/components/layout/AppShell.tsx
# (entry "Print Templates", group "Tenant administration"), web/src/auth/access/RequirePermission.tsx and web/src/components/ui/PermissionDenied.tsx
# (text "You do not have access to this area. Contact your tenant administrator."); docs/roles.md; test/fixtures/uat/actors.yaml.
# Platform operator on an own-tenant route: step 6 is a no-data-leak check, not a refusal.
# Sensitive actions: see-sensitive-data and change-users are the refusals of steps 3 to 6 (a company's print layouts are not for these roles); approve and
# pay or release do not occur here (activation is scenarios 56 and 59).
---
id: tenant-administration-58-print-templates-screen-access-and-other-company
scope: tenant-administration
title: Only holders of the print-template permission see the Print templates entry and screen; a worker and an auditor get the no-access page; another company sees its own rows only
version: "1.0"
tags: [tenant-admin, documents, print-override, gui, access, refusal, tenant-isolation]

description: >
  A print-layout draft for "purchase_order" exists in SwiftRoute. The SwiftRoute administrator sees the entry "Print Templates" in the menu group
  "Tenant administration" and the draft in the table. A SwiftRoute worker and the SwiftRoute auditor do not see the entry; when each opens the
  address of the screen directly, the page shows only "You do not have access to this area. Contact your tenant administrator." with no table, no
  editor and no layout. The administrator of Bilimbaga opens the same screen and sees only Bilimbaga's own overrides (none), not the SwiftRoute draft.

actors:
  tenant_admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco
  auditor: actor-swiftroute-auditor
  other_company_admin: actor-bilimbaga-admin
  module: actor-system-documents-service

preconditions:
  - description: SwiftRoute has one print override, type "purchase_order", language ru, version 1, draft, with a layout whose text block says "test sample header"; Bilimbaga has no print override
    check: system_seeded
    detail: Seeded through the service-level harness before step 1 (the module actor), including the document type "purchase_order" in SwiftRoute. If the harness cannot do it, the whole scenario is BLOCKED, not PASS.
  - description: The four accounts can sign in to the web application of their company
    check: system_seeded
    detail: Roster notes of actor-bilimbaga-admin and actor-swiftroute-auditor say a test token mapping may not be approved yet. A step whose actor cannot sign in is BLOCKED, not FAIL.

steps:
  - step: 1
    actor: tenant_admin
    action: Signs in, notes whether the menu group "Tenant administration" has an entry "Print Templates", opens it and notes the table.
    via: gui
    produces:
      admin_screen: the menu entry and the table with its one row
  - step: 2
    actor: worker
    action: Signs in and notes every entry of the menu, in particular whether any entry is named "Print Templates".
    via: gui
    produces:
      worker_menu: the menu entries
  - step: 3
    actor: worker
    action: Opens the address of the Print templates screen (the path /admin/print-templates of the web application) directly. Notes what the page shows.
    expect_refusal: true
    via: gui
  - step: 4
    actor: auditor
    action: Signs in and notes every entry of the menu, in particular whether any entry is named "Print Templates".
    via: gui
    produces:
      auditor_menu: the menu entries
  - step: 5
    actor: auditor
    action: Opens the address of the Print templates screen (the path /admin/print-templates) directly. Notes what the page shows.
    expect_refusal: true
    via: gui
  - step: 6
    actor: other_company_admin
    action: Signs in to Bilimbaga, opens the entry "Print Templates" and notes the table.
    via: gui
    produces:
      other_company_table: the table of the second company
  - step: 7
    actor: module
    action: Reads the stored overrides of both companies and the audit entries of the print-override actions of both, and compares them with the preconditions.
    via: system

expected_outcomes:
  - id: EO-001
    description: The administrator sees the menu entry and the company's draft.
    verification:
      method: gui_screen
      detail: >
        Step 1 shows the entry "Print Templates" in the group "Tenant administration" and, after opening it, the page title "Print templates" and one row
        purchase_order, ru, version 1, draft, with no layout text in the table.
      evidence: The screens noted in step 1.
    on_fail:
      severity: MAJOR
      business_impact: The company administrator cannot manage print layouts.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: A worker and an auditor see no menu entry and, opening the address directly, get the no-access page and nothing of the screen.
    verification:
      method: gui_screen
      detail: >
        Steps 2 and 4 show a menu with no entry named "Print Templates". Steps 3 and 5 show the sentence "You do not have access to this area. Contact your
        tenant administrator." and no page title "Print templates", no table, no filters, no editor and no preview.
      evidence: The menus of steps 2 and 4 and the pages of steps 3 and 5.
    on_fail:
      severity: BLOCKER
      business_impact: Staff without the permission could read or prepare the company's official print layouts.
      suggested_action: route_to_security_review
  - id: EO-003
    description: The second company's administrator sees only their own company's overrides and nothing changed anywhere.
    verification:
      method: gui_screen
      detail: >
        Step 6 shows the page title "Print templates" and a table with no row; the SwiftRoute draft (purchase_order, ru, version 1) is not shown. In step 7
        the stored rows equal the preconditions (one SwiftRoute draft, none in Bilimbaga) and no audit entry of the print-override actions was written
        by steps 1 to 6.
      evidence: The table of step 6 and the rows and entries of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: One company could see another company's print layouts.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Nothing was written by the steps; the seeded draft stays. Re-running needs the same seeded state.
