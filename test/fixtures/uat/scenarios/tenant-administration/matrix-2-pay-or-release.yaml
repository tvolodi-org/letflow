# T-0224 (BA): ROLE MATRIX, sensitive action 2 of 4: PAY OR RELEASE (the "release payment" task, or stopping a request
# before it is paid). Seven tenant roles; PLATFORM_ADMIN is in matrix-5. Sources: docs/roles.md roles matrix
# (TasksComplete, InstancesCancel) and per-role "Does / Must not"; routing-role rule as in matrix-1.
#   PROCESS_DESIGNER  allowed: none                          refused: complete the release
#   PROCESS_OPERATOR  allowed: stop (cancel) a request       refused: complete the release (not in the releasers group)
#   TASK_WORKER       allowed: complete the release (releasers group)   refused: stop (cancel) a request (InstancesCancel = no)
#   AGENT_RUNNER      allowed: none                          refused: complete the release
#   CANDIDATE         allowed: none                          refused: complete the release
#   TENANT_ADMIN      allowed: stop (cancel) a request       refused: complete the release without being in the releasers group
#   TENANT_AUDITOR    allowed: none (reads only)             refused: complete the release
# Test-tooling steps: none. Continues from matrix-1 (R1 and R2 approved and waiting, R3 waiting for approval).
---
id: tenant-administration-matrix-2-pay-or-release
scope: tenant-administration
title: Role matrix, paying and releasing - who may release a payment or stop one, and who is turned away
version: "1.0"
tags: [matrix, release, payment, roles, refusal, access]

description: >
  The releaser (a task worker in the releasers group) releases the payment of one request. The
  process operator stops a second request before it is paid, and the administrator stops a third.
  A fourth request is approved and waits for release. Every other role, and the two who hold a
  general role but are not the releaser, then try to release it or to stop it and are turned away.
  The fourth request is still waiting at the end.

actors:
  tenant_admin: actor-any
  designer: actor-any
  operator: actor-any
  worker_a: actor-any
  worker_b: actor-any
  agent_runner: actor-any
  candidate: actor-any
  auditor: actor-any

preconditions:
  - description: matrix-1 passed in this run (R1 and R2 are approved and wait for release; R3 waits for approval)
    check: custom

steps:
  - step: 1
    actor: operator
    action: The process operator starts a fourth request R4. worker_a approves it. It now waits for release.
    via: api
  - step: 2
    actor: worker_b
    action: worker_b (task worker in the releasers group) releases the payment of R1.
    via: api
  - step: 3
    actor: operator
    action: The process operator stops R2 before it is paid.
    via: api
  - step: 4
    actor: tenant_admin
    action: The administrator stops R3 before it is paid.
    via: api
  - step: 5
    actor: designer
    action: The process designer tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 6
    actor: operator
    action: The process operator (not in the releasers group) tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 7
    actor: worker_b
    action: worker_b tries to stop R4 before it is paid.
    expect_refusal: true
    via: api
  - step: 8
    actor: agent_runner
    action: The agent runner tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 9
    actor: candidate
    action: The candidate tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 10
    actor: tenant_admin
    action: The administrator (not in the releasers group) tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 11
    actor: auditor
    action: The tenant auditor tries to release the payment of R4.
    expect_refusal: true
    via: api
  - step: 12
    actor: tenant_admin
    action: The administrator checks the four requests - R1 released, R2 and R3 stopped, R4 still waiting for release.
    via: api

expected_outcomes:
  - id: EO-001
    description: Those who may release or stop, can - R1 is released by the releaser, R2 is stopped by the operator, R3 by the administrator.
    verification:
      method: system_state
      detail: R1 is finished, R2 and R3 are cancelled, each with the acting person recorded.
      evidence: The state and the acting person of R1, R2, R3.
    on_fail:
      severity: MAJOR
      business_impact: A payment cannot be released, or a wrong one cannot be stopped.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The designer, auditor, agent runner and candidate cannot release, and a task worker cannot stop a request.
    verification:
      method: system_state
      detail: Steps 5, 7, 8, 9 and 11 are refused; R4 is unchanged after each.
      evidence: The five refusals and the state of R4.
    on_fail:
      severity: BLOCKER
      business_impact: Money can be released, or a payment halted, by a person with no such authority.
      suggested_action: route_to_security_review
  - id: EO-003
    description: The operator and the administrator hold broad rights but are not the releaser, and are turned away from releasing.
    verification:
      method: system_state
      detail: Steps 6 and 10 are refused; R4 still waits for the releasers group.
      evidence: The two refusals and the state of R4.
    on_fail:
      severity: BLOCKER
      business_impact: Payment release is not separated from general administration, so one broad account can release money alone.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: true
  description: Cancel R4 (as the administrator), and any other request left open, so that the test customer holds no running instance.
