# T-1623 (BA): notification bell, scenario 6. Rewritten by T-1659 to the one surviving kind, "count assigned".
# History: the PM order listed three kinds (document returned, count assigned, failed import). On 2026-11-11 (T-1651.md item 3) the kinds "document returned" and
# "failed import" were dropped (no real event); "count assigned" got its producer: Counts.issue/3 (lib/letflow/modules/stock/counts.ex, bell_count_assigned/2) raises one
# bell entry after the commit for the chair and each member whose employee record is linked to a user. The scenario id and file name keep the old three-kind name on purpose.
# The gap record that blocked the scenario was deleted with the producer. A draft count does not notify; only the Issue action does.
# Sensitive actions: the entry tells a person a count was given to them; step 2 is a no-leak check on another worker's bell. Refusal checks on the read route are in scenario 2.
---
id: tenant-administration-notification-bell-6-document-returned-count-assigned-failed-import
scope: tenant-administration
title: An issued stock count gives its chair and members one bell entry that opens the count
version: "1.1"
tags: [tenant-admin, notification-bell, count-assigned]

description: >
  When a stock count order is issued, the chair and each member whose employee record is linked to a user see one new unread entry on the bell, with a text that says
  a stock count was assigned to them, and a click on the entry opens the count. Nobody else in the company and nobody in another company gets an entry.

actors:
  tenant_admin_a: actor-swiftroute-alice
  assignee: actor-swiftroute-lena
  other_worker: actor-swiftroute-marco

preconditions:
  - description: The stock module is installed and Lena's employee record carries Lena's user (the employee's user_id); Marco's employee, if any, is not in the count
    check: system_seeded
    detail: The employee-to-user link is set in the Organisation screen; without it the person gets no entry.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator creates a count order with Lena's employee as chair or member and issues it (the Issue action; a draft does not notify).
      Lena opens the bell, reads the newest entry and clicks it.
    via: gui
  - step: 2
    actor: other_worker
    action: >
      Marco opens his bell and reads the list. He notes whether any entry concerns Lena's count.
    via: gui

expected_outcomes:
  - id: EO-001
    description: Lena gets one unread entry for the assigned count and it opens that count.
    verification:
      method: gui_screen
      detail: The newest entry on Lena's bell says a stock count was assigned to her, shows the document number, carries the unread mark, and opens /admin/stock/counts/<id>.
      evidence: Screens of step 1.
    on_fail:
      severity: MAJOR
      business_impact: A person does not learn that a count is waiting for her.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Other people see nothing of this event.
    verification:
      method: gui_screen
      detail: Marco's bell holds no entry about Lena's count.
      evidence: Screen of step 2.
    on_fail:
      severity: BLOCKER
      business_impact: People see events that concern others, or notifications leak between users.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Cancel the count order created in step 1.
