# T-0224 (BA): ROLE MATRIX, sensitive action 4 of 4: CHANGE USERS (people, groups, group members, role bindings).
# Seven tenant roles; PLATFORM_ADMIN is in matrix-5. Sources: docs/roles.md roles matrix (UsersGroupsRolesManage,
# RolesManage, TokensManage) and per-role "Does / Must not": PROCESS_DESIGNER may create a role binding (POST /roles)
# but "must not manage users"; PROCESS_OPERATOR "must not manage users, tokens or roles"; TASK_WORKER, AGENT_RUNNER,
# CANDIDATE and TENANT_AUDITOR hold none of these permissions.
#   PROCESS_DESIGNER  allowed: create a role binding            refused: add a person to a group
#   PROCESS_OPERATOR  allowed: none                              refused: add themself to the administrators' group
#   TASK_WORKER       allowed: none                              refused: create a new person's account
#   AGENT_RUNNER      allowed: none                              refused: add a person to a group
#   CANDIDATE         allowed: none                              refused: add a person to a group
#   TENANT_ADMIN      allowed: add a person to a group and remove them   refused: give a group the platform administrator role
#   TENANT_AUDITOR    allowed: none (reads only)                 refused: add a person to a group
# Test-tooling steps: none.
---
id: tenant-administration-matrix-4-change-users
scope: tenant-administration
title: Role matrix, changing people - who may change users, groups and roles, and who is turned away
version: "1.0"
tags: [matrix, users, roles, refusal, access]

description: >
  The administrator changes who is in a group and the process designer creates a role binding;
  those are the only two kinds of change allowed. The operator, the task worker, the agent runner,
  the candidate and the auditor each try a change to people and are turned away. The most
  dangerous attempt, a person adding themself to the administrators' group, is made by the
  operator. The administrator tries to give a group the platform's own top role and is also
  turned away. No person's authority is different at the end.

actors:
  tenant_admin: actor-any
  designer: actor-any
  operator: actor-any
  worker_a: actor-any
  agent_runner: actor-any
  candidate: actor-any
  auditor: actor-any

preconditions:
  - description: tenant-administration-1 passed in this run; scope enforcement is off for the test customer
    check: custom

steps:
  - step: 1
    actor: tenant_admin
    action: The administrator adds the candidate to the group "uat-approvers", then removes the candidate again, and sees both changes in the audit trail.
    via: gui
  - step: 2
    actor: designer
    action: The process designer creates a new process routing role "uat-matrix-extra" on the task worker group. This is allowed.
    via: api
  - step: 3
    actor: designer
    action: The process designer tries to add worker_a to the process operator group.
    expect_refusal: true
    via: api
  - step: 4
    actor: operator
    action: The process operator tries to add themself to the administrators' group.
    expect_refusal: true
    via: api
  - step: 5
    actor: worker_a
    action: The task worker tries to create the account of a new person.
    expect_refusal: true
    via: api
  - step: 6
    actor: agent_runner
    action: The agent runner tries to add worker_a to the administrators' group.
    expect_refusal: true
    via: api
  - step: 7
    actor: candidate
    action: The candidate tries to add themself to the administrators' group.
    expect_refusal: true
    via: api
  - step: 8
    actor: auditor
    action: The tenant auditor tries to add worker_a to the process operator group.
    expect_refusal: true
    via: api
  - step: 9
    actor: tenant_admin
    action: The administrator tries to give the process designer group the platform administrator role.
    expect_refusal: true
    via: api
  - step: 10
    actor: tenant_admin
    action: The administrator lists every group with its members and roles, and checks nobody's authority changed since tenant-administration-1, apart from the new "uat-matrix-extra" binding.
    via: gui

expected_outcomes:
  - id: EO-001
    description: The administrator's change and the designer's role binding are accepted and are in the audit trail.
    verification:
      method: system_state
      detail: Step 1 shows two entries (added, removed); step 2 shows the new binding.
      evidence: The audit entry kinds and the binding name.
    on_fail:
      severity: MAJOR
      business_impact: The people of the company cannot be maintained.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The designer, operator, task worker, agent runner, candidate and auditor cannot change who is in which group or create people, and the platform administrator role cannot be handed to a group.
    verification:
      method: system_state
      detail: Steps 3 to 9 are all refused; the group list at step 10 equals the list of tenant-administration-1 plus the one binding.
      evidence: The seven refusals and the group list (names, roles, member names).
    on_fail:
      severity: BLOCKER
      business_impact: A person can raise their own or somebody's authority without the administrator, which defeats every other access rule.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Nothing to clean; the extra binding stays until the test customer is retired by foundation-4a.
