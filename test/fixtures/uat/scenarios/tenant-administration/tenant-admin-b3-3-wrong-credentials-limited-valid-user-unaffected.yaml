# T-1585 (BA batch 3 item 3, covers merged B2#6 part 1, #4096): repeated wrong credentials are answered with a wait message; a valid user is never held back.
# Sources: docs/runbooks/auth-rate-limits.md (only a presented-but-wrong credential is counted; default 10 per minute per address, setting LETFLOW_AUTH_FAILURES_PER_MIN; after the allowance the 401 becomes 429 with a retry-after header of at least 1 second and a constant body that never says whether a token or company exists;
# valid credentials are handled normally even when the allowance is spent); lib/letflow/plugs/auth_attempt_limit.ex.
# UAT assumption, to be confirmed by the process owner: 10 failed credentials per minute per address is the shipped value (T-1551 item 6); the scenario uses the shipped value and the process owner configures production.
# NOT built on main (checked in commit 2bab36c46, which holds part 1 only): the "your session has ended" screen without a lost draft, idle and absolute session time, and server-side logout. No scenario step is written for them; they need a follow-up scenario when their tasks merge.
# Precondition about the address: all steps come from one address and no other wrong credential from it was presented in the last minute.
---
id: tenant-administration-b3-3-wrong-credentials-limited-valid-user-unaffected
scope: tenant-administration
title: After ten wrong credentials in a minute the eleventh gets a wait message; a valid user from the same address still works
version: "1.0"
tags: [security, rate-limit, sign-in, tenant-admin, refusal]

description: >
  Someone presents a wrong access token to the company's API eleven times within one minute. The first ten are answered "not signed in"; the eleventh is answered "too many attempts, wait N seconds", and the answer is the same whether or not the token exists.
  The SwiftRoute administrator, signing in from the same address, still opens the Users list normally. After the wait time, a wrong token is again answered "not signed in".

actors:
  stranger: actor-any
  admin: actor-swiftroute-alice

preconditions:
  - description: The test runs from one address, with no other wrong credential from it in the last minute, and the limit is the shipped value (10 failed credentials per minute).
    check: system_seeded
    detail: If the limit was changed by the environment setting, report BLOCKED and give the value in use. If the address is shared with other running scenarios, report BLOCKED for steps 2 and 3.

steps:
  - step: 1
    actor: stranger
    action: >
      The tester asks for the list of users of the company ten times in a row, each time with the access token "lf_tok_wrong-token-01" (the text of a token that does not exist), and notes each answer.
    expect_refusal: true
    via: api
  - step: 2
    actor: stranger
    action: >
      The tester asks for the list of users an eleventh time with the same wrong token and notes the answer, its "retry-after" header, and the body.
    expect_refusal: true
    via: api
  - step: 3
    actor: admin
    action: >
      The administrator, signed in properly from the same address, opens the Users list and reads it.
    via: ui
  - step: 4
    actor: stranger
    action: >
      After waiting the number of seconds from the retry-after header of step 2, the tester asks for the list of users once with a wrong token and notes the answer.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: The first ten wrong credentials are answered "not signed in".
    verification:
      method: http_status
      detail: Each of the ten answers of step 1 is 401 with no user data.
      evidence: The ten statuses.
    on_fail:
      severity: MAJOR
      business_impact: The refusal is wrong or leaks data.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: The eleventh is a wait message, not a lockout of valid users.
    verification:
      method: http_status
      detail: Step 2 is 429 with a header "retry-after" of at least 1 second and a body that does not say whether the token or the company exists; step 3 shows the user list normally.
      evidence: Status, header and body of step 2; screenshot of step 3.
    on_fail:
      severity: BLOCKER
      business_impact: Guessing credentials is not slowed, or a busy office is locked out by a stranger.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: The wait ends.
    verification:
      method: http_status
      detail: Step 4 is 401 again, not 429.
      evidence: Status of step 4.
    on_fail:
      severity: MINOR
      business_impact: A wait that does not end blocks the address for longer than promised.
      suggested_action: route_to_elixir_dev
