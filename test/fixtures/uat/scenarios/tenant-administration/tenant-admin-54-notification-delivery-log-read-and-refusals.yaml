# T-0919 (BA): TENANT ADMIN group, scenario 54: reading the delivery log (newest first, status filter) and the refusals of the read.
# Covers REQ-584 criterion 8 (200 newest-first, at most 100 rows; status=failed returns only failed rows; an unknown status answers 422;
# a caller without the permission gets one uniform 403 for a company with rows and one without).
# Sources: docs/requirements.yaml REQ-584 criterion 8 (quoted, origin/main); lib/letflow/routers/notification_deliveries.ex (answer
# {"deliveries": [...]}, 422 text "status is invalid", statuses sent|failed|skipped); docs/roles.md (NotificationTemplatesManage:
# PLATFORM_ADMIN and TENANT_ADMIN only); test/fixtures/uat/actors.yaml (alice: SwiftRoute TENANT_ADMIN; lena: SwiftRoute task worker;
# auditor: SwiftRoute TENANT_AUDITOR; ben: Meridian task worker).
# Precondition: scenario 53 has run, so SwiftRoute holds at least two rows. Meridian holds no row unless a task was assigned there.
# NOT COVERED HERE: the cap of 100 rows (needs more than 100 rows, which QA cannot make through the product); a "failed" row (a QA
# user cannot make the mail system fail), so the failed filter is expected to return an empty list on QA and the filter is checked
# for "only failed rows" in the sense that no sent or skipped row is in it; the Keycloak-versus-Letflow mail question (T5c) is undecided.
# A PLATFORM_ADMIN on this tenant-from-token route would get its own tenant's rows, not a refusal, so it is not used for a refusal.
# Sensitive actions: this flow only reads a log; no approval, payment or user change is in it.
---
id: tenant-administration-54-notification-delivery-log-read-and-refusals
scope: tenant-administration
title: The delivery log is listed newest first, filtered by status, refuses an unknown status, and is closed to people without the wording permission
version: "1.0"
tags: [tenant-admin, notification-delivery, delivery-log, access, refusal, inv-5]

description: >
  The administrator of SwiftRoute lists the delivery log: the newest row comes first. Filtering by "sent" or "skipped" returns only
  rows of that status and filtering by "failed" returns no sent or skipped row. A status that does not exist is refused with 422. A
  task worker and the read-only auditor of SwiftRoute, and a task worker of Meridian, are refused with the same 403 whether their
  company has log rows or not. A request with no sign-in is refused.

actors:
  tenant_admin_a: actor-swiftroute-alice
  worker_a: actor-swiftroute-lena
  auditor_a: actor-swiftroute-auditor
  worker_b: actor-meridian-ben

preconditions:
  - description: SwiftRoute holds at least two delivery rows (scenario 53 ran, including the reassignment)
    check: system_seeded
    detail: If SwiftRoute holds fewer than two rows, report BLOCKED for steps 1 and 2 and run the refusal steps.
  - description: Meridian has no delivery rows, so the refusal for a company without rows can be compared with SwiftRoute's
    check: system_seeded
    detail: If Meridian does hold rows, note it; the 403 comparison of EO-004 then proves only the case with rows, and that is reported.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator lists the delivery log without a filter and notes the order of the rows by their time and identifier.
    via: api
  - step: 2
    actor: tenant_admin_a
    action: >
      The administrator lists the log filtered to "sent", then to "skipped", then to "failed", each in its own request, and notes the
      status of every row returned.
    via: api
    input:
      status: sent, skipped, failed (one request each)
  - step: 3
    actor: tenant_admin_a
    action: >
      The administrator tries to list the log with the status "archived", then with the status "SENT" (capital letters), then with an
      empty status, each in its own request. The answers are noted.
    expect_refusal: true
    via: api
    input:
      status: archived, SENT, empty
  - step: 4
    actor: worker_a
    action: >
      The SwiftRoute task worker tries to list the delivery log, and to list it filtered to "failed", each in its own request. The
      answers are noted.
    expect_refusal: true
    via: api
  - step: 5
    actor: auditor_a
    action: >
      The SwiftRoute read-only auditor tries to list the delivery log, and to list it filtered to "failed", each in its own request.
      The answers are noted.
    expect_refusal: true
    via: api
  - step: 6
    actor: worker_b
    action: >
      The Meridian task worker, whose company has no log rows, tries to list the delivery log, and to list it filtered to "failed",
      each in its own request. The answers are noted.
    expect_refusal: true
    via: api
  - step: 7
    actor: worker_a
    action: >
      The request to list the delivery log is sent with no sign-in at all (no token is attached). The answer is noted.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: The log is listed newest first.
    verification:
      method: api_response
      detail: The answer of step 1 is 200; the rows are ordered by time from newest to oldest (rows with the same time by identifier from higher to lower); the row from the reassignment of scenario 53 comes before the row from the first assignment.
      evidence: The list of step 1.
    on_fail:
      severity: MAJOR
      business_impact: Administrators reading the log see the oldest attempts first and may miss the latest failure.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The status filter returns only rows of the asked status.
    verification:
      method: api_response
      detail: Every answer of step 2 is 200. Every row of the "sent" list has status "sent" and a null reason; every row of the "skipped" list has status "skipped"; the "failed" list has no row with another status (it is empty on QA unless a delivery failed). The "sent" and "skipped" lists together hold the rows of step 1 that have those statuses.
      evidence: The three filtered lists of step 2.
    on_fail:
      severity: MAJOR
      business_impact: The filter shows messages under the wrong status, so a failed message may be missed.
      suggested_action: route_to_wf03
  - id: EO-003
    description: A status that does not exist is refused with 422 and no list.
    verification:
      method: http_status
      detail: The three requests of step 3 answer 422 with the text "status is invalid" and no rows. "SENT" and the empty status are refused too, because the allowed values are exactly sent, failed and skipped.
      evidence: The three answers of step 3.
    on_fail:
      severity: MINOR
      business_impact: A mistyped filter silently shows everything or nothing and misleads the reader.
      suggested_action: route_to_wf03
  - id: EO-004
    description: A caller without the wording permission gets one 403, the same for a company with rows and one without.
    verification:
      method: http_status
      detail: All requests of steps 4, 5 and 6 answer 403. The 403 of the SwiftRoute worker (company with rows) and of the Meridian worker (company without rows) have the same status, the same body byte for byte, the same content type and the same headers apart from per-request ones (date, request id). The request of step 7, sent with no sign-in, answers 401.
      evidence: The six refusals of steps 4 to 6 compared, and the answer of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: Outsiders could learn whether another company has sent messages, or read the log.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Nothing is changed by this scenario; nothing to clean up.
