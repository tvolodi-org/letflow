# T-0224 (BA): ROLE MATRIX, sensitive action 3 of 4: SEE SENSITIVE DATA (the protected "bank account" field of a payee
# record unmasked, and the audit trail). Seven tenant roles; PLATFORM_ADMIN is in matrix-5. Sources: docs/roles.md roles
# matrix (EntitiesQuery, EntitiesRecordsExportUnredacted, AuditRead) and per-role "Does / Must not".
#   PROCESS_DESIGNER  allowed: read payee records, field masked (EntitiesQuery)     refused: read the audit trail (AuditRead = no)
#   PROCESS_OPERATOR  allowed: read the audit trail                                  refused: read the bank account unmasked (export unredacted = no)
#   TASK_WORKER       allowed: read payee records, field masked                      refused: read the audit trail
#   AGENT_RUNNER      allowed: none                                                  refused: read payee records
#   CANDIDATE         allowed: none ("cannot query entities")                        refused: read payee records
#   TENANT_ADMIN      allowed: read the bank account unmasked                        refused: read another customer's audit trail (the platform's own workspace)
#   TENANT_AUDITOR    allowed: read the audit trail and records, field masked        refused: read the bank account unmasked (export = no)
# Test-tooling steps: none.
# The masked-field behaviour for each reader is stated by the roles matrix only through the unredacted-export row; that
# EntitiesQuery returns the field masked to a non-administrator is a UAT assumption, to be confirmed by the process owner.
# If a reader sees the value unmasked at their allowed step, that is a finding, not a pass.
---
id: tenant-administration-matrix-3-see-sensitive-data
scope: tenant-administration
title: Role matrix, sensitive data - who sees the protected field and the audit trail, and who is turned away
version: "1.0"
tags: [matrix, sensitive-data, roles, refusal, access]

description: >
  The payee records hold a protected bank account number. The designer, the task worker and the
  auditor can look at the records but see the number masked; only the administrator sees it in
  full. The operator and the auditor can read the audit trail, the designer and the task worker
  cannot. The agent runner and the candidate see no records at all. The administrator also
  cannot read the audit trail of another customer.

actors:
  tenant_admin: actor-any
  designer: actor-any
  operator: actor-any
  worker_a: actor-any
  agent_runner: actor-any
  candidate: actor-any
  auditor: actor-any

preconditions:
  - description: matrix-0 passed in this run (two payee records, bank account protected)
    check: custom

steps:
  - step: 1
    actor: designer
    action: The process designer opens the payee records and sees the bank account masked.
    via: api
  - step: 2
    actor: designer
    action: The process designer tries to open the company's audit trail.
    expect_refusal: true
    via: api
  - step: 3
    actor: operator
    action: The process operator opens the audit trail and sees the entries of this run.
    via: api
  - step: 4
    actor: operator
    action: The process operator tries to export the payee records with the bank account in full.
    expect_refusal: true
    via: api
  - step: 5
    actor: worker_a
    action: The task worker opens the payee records and sees the bank account masked.
    via: api
  - step: 6
    actor: worker_a
    action: The task worker tries to open the company's audit trail.
    expect_refusal: true
    via: api
  - step: 7
    actor: agent_runner
    action: The agent runner tries to open the payee records.
    expect_refusal: true
    via: api
  - step: 8
    actor: candidate
    action: The candidate tries to open the payee records.
    expect_refusal: true
    via: api
  - step: 9
    actor: tenant_admin
    action: The administrator exports the payee records with the bank account in full and sees both invented values.
    via: api
  - step: 10
    actor: tenant_admin
    action: The administrator tries to open the audit trail of the platform's own workspace (another customer's trail).
    expect_refusal: true
    via: api
  - step: 11
    actor: auditor
    action: The tenant auditor opens the audit trail and the payee records (masked) and sees them.
    via: api
  - step: 12
    actor: auditor
    action: The tenant auditor tries to export the payee records with the bank account in full.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: Only the administrator ever sees the bank account in full; the designer, task worker and auditor see it masked.
    verification:
      method: system_state
      detail: The values returned at steps 1, 5 and 11 do not contain "UAT-ACCT-0001" or "UAT-ACCT-0002"; the values at step 9 contain both.
      evidence: Whether the invented values appear in each answer (yes or no only; the values themselves are not kept).
    on_fail:
      severity: BLOCKER
      business_impact: A protected number is visible to people who should not see it.
      suggested_action: route_to_security_review
  - id: EO-002
    description: Unmasked export is refused to the operator and the auditor, the audit trail to the designer and the task worker, records to the agent runner and the candidate.
    verification:
      method: system_state
      detail: Steps 2, 4, 6, 7, 8 and 12 are refused, and the refusal wording does not describe what lies behind it.
      evidence: The six refusals (status and wording only).
    on_fail:
      severity: BLOCKER
      business_impact: Sensitive data or the record of who did what is open to the wrong people.
      suggested_action: route_to_security_review
  - id: EO-003
    description: The administrator of one customer cannot read another customer's audit trail.
    verification:
      method: system_state
      detail: Step 10 is refused or answers as if there were no such trail; no entry of another workspace is shown.
      evidence: The answer to step 10 (status and entry count).
    on_fail:
      severity: BLOCKER
      business_impact: Data of one customer is visible to another.
      suggested_action: route_to_security_review

cleanup:
  cancel_open_instances: false
  description: Reads and refusals only.
