# T-1648 (BA, batch 5 item 1): the password-reset chain, server part (T-1632, REQ-788, merged in commit 36a360027, PR #4163).
# Sources: docs/requirements.yaml REQ-788 criteria 2 (202 with the body {"status": "requested"}; one audit entry "user.password_reset_requested"
# with actor = the caller and no before/after state; one delivery row with the template key "password_reset_hint" for that user, trigger = the audit entry),
# 8 (default subject "Set a new password"; the text asks the person to choose "Forgot password" on the sign-in page) and 9 (the mail has no password, token or link;
# the answer is 202 whatever the mail system does; with the mail adapter off the row is "skipped" / "adapter_noop"); lib/letflow/routers/identity.ex
# (handle_reset_password, request_password_reset, start_reset_delivery); lib/letflow/routers/notification_deliveries.ex (row keys template_key,
# recipient_user_id, status, reason, trigger_ref); lib/letflow/routers/audit.ex (GET audit, filter resource_type and resource_id).
# The button on the user page (REQ-789) is built; it is checked in password-reset-3-user-page-button (this folder). This scenario drives the route.
# NOT UAT-OBSERVABLE (header kept so it survives the merge): the text of the mail itself (a UAT run cannot read a mailbox: provisioning-8 sidecar, owner questions Q3, Q7);
# a failing mail adapter (a QA user cannot make the mail system fail); the audit-write failure (criterion 10); the user with no e-mail address (criterion 7 third reason;
# a user cannot be created without an address, so it needs a hand-edited database). Covered by test/letflow/routers/identity_reset_password_test.exs, not UAT.
# T-1773 amendment: REQ-814 (build 5ff7409ae, PR #4280) limits a person to one accepted request per window (setting, default 5 minutes); a repeat inside the window answers 202 "requested" like the first but writes no entry and no mail row. Source: docs/requirements.yaml REQ-814 criteria 1, 2 and 7; lib/letflow/routers/identity.ex (reset_password_window_minutes).
# UAT assumption, to be confirmed by the process owner: QA keeps the default window of 5 minutes (no QA setting is known); if the first request of this scenario is not the first for Hans in the last 5 minutes, step 1 is NOT OBSERVABLE, not FAIL.
# Criterion 4 of REQ-814, the other-action case (an entry of another action, for example "user.update_status", 1 minute old for the same user does not throttle): NOT UAT-OBSERVABLE, it needs a second kind of audit entry for Hans made by a write that this scenario does not make (a status change of a colleague is a user change and is not probed here); covered by test/letflow/routers/identity_reset_password_test.exs. The per-user case is step 6.
# Sensitive action in this flow: change of users / credentials. Refusal steps are in scenario password-reset-2.
---
id: tenant-administration-password-reset-1-request-sends-instruction-mail
scope: tenant-administration
title: "A company administrator asks the system to tell a colleague to reset the password; the system answers at once, records who asked and queues an instruction mail that carries no password"
version: "1.0"
tags: [users, password-reset, notification, audit, tenant-admin, no-password]

description: >
  A SwiftRoute colleague (the accountant Hans) forgot the password. The company administrator asks the system to send him
  password reset instructions. The system answers "requested" at once. The audit log then holds one new entry that says the
  administrator asked for a password reset for Hans (no password and no old or new value in it), and the mail delivery log
  holds one new row for the "password reset instructions" message addressed to Hans. The row is "sent" when the QA mail
  system is on and "skipped" when it is off; either way the administrator's answer was the same. The administrator asks a
  second time at once and gets the same answer "requested" but no second entry and no second row (one accepted request per person per window of 5 minutes); after the window the same request is accepted again. The system never shows, sets or sends a password: the person resets
  it on the sign-in page ("Forgot password") of the SwiftRoute workspace.

actors:
  admin: actor-swiftroute-alice
  colleague: actor-swiftroute-hans
  colleague2: actor-swiftroute-tobias

preconditions:
  - description: The password reset route is deployed on the QA instance (commit 36a360027, PR #4163)
    check: custom
    detail: If the request in step 1 answers "not found" for a user that the Users screen lists, report BLOCKED, not PASS.
  - description: Hans has signed in through the identity provider at least once, so his user is listed as active with an e-mail address on the Users screen
    check: system_seeded
    detail: >
      If the administrator's request answers 409, read the reason in the answer. "user_inactive" or "no_email" means the account is not
      prepared: report BLOCKED for the whole scenario and name the reason. Do not edit the account to prepare it.
  - description: The notification wording of SwiftRoute has not been replaced, or if it has, the run notes it
    check: custom
    detail: The default subject is "Set a new password"; a stored company wording changes only the text, not the outcomes below.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator opens the Users screen, finds Hans, notes his user identifier, and reads the audit log (filter: object type "user" and Hans's
      identifier) and the delivery log, noting how many entries of "user.password_reset_requested" and how many "password_reset_hint" rows for Hans exist and the time now
      (counts before). Then the administrator asks the system to send him password reset instructions (empty request, no password in it); this is the first request and
      the time of its answer starts the 5-minute window. The administrator notes the status, the body and the header names of the answer.
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator opens the audit log, filters it to the object type "user" and Hans's identifier, and reads the newest entry.
    via: api
  - step: 3
    actor: admin
    action: >
      The administrator opens the mail delivery log and reads the newest row.
    via: api
  - step: 4
    actor: admin
    action: >
      The administrator at once asks the system a second time to send Hans password reset instructions, then reads the audit log (same
      filter) and the delivery log again.
    via: api
  - step: 5
    actor: admin
    action: >
      The administrator waits until 6 minutes have passed since the first request of step 1, asks a third time to send Hans password reset instructions, then reads the audit log (same
      filter) and the delivery log again.
    via: api
  - step: 6
    actor: admin
    action: >
      The administrator finds another SwiftRoute colleague, Tobias, on the Users screen, notes his user identifier, reads the audit log and the delivery log
      for him (counts before), and then, inside the 5-minute window that Hans's accepted request of step 5 opened, asks the system to send Tobias password reset
      instructions. Then the administrator reads the audit log (filter: object type "user" and Tobias's identifier) and the delivery log again.
    via: api

expected_outcomes:
  - id: EO-001
    description: The system accepts the request and answers the same short message whatever the mail system does.
    verification:
      method: api_response
      detail: >
        Step 1 answers 202 with exactly one field, status, whose value is "requested". The answer holds no password, no link and no
        token.
      evidence: Status and body of step 1.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot tell whether the request was taken, or the answer leaks a secret.
      suggested_action: route_to_wf03
  - id: EO-002
    description: The request is recorded with the administrator as the one who asked, and nothing else.
    verification:
      method: api_response
      detail: >
        Step 2 shows one new entry with the action "user.password_reset_requested", object type "user", the object Hans's identifier, and
        the administrator's identifier as the actor (the log shows the administrator by name). The entry has no before value and no after
        value, and no text that looks like a password.
      evidence: The entry of step 2.
    on_fail:
      severity: MAJOR
      business_impact: A reset request cannot be traced to the person who made it.
      suggested_action: route_to_wf03
  - id: EO-003
    description: One instruction mail is queued for Hans, linked to the audit entry.
    verification:
      method: api_response
      detail: >
        Step 3 shows one new newest row with the template key "password_reset_hint", the recipient Hans's identifier, the trigger
        equal to the identifier of the entry of step 2, and a status "sent" (mail system on) or "skipped" with reason "adapter_noop"
        (mail system off). A status "failed" is reported as a finding with its reason; the answer of step 1 stays 202.
      evidence: The row of step 3 and the entry identifier of step 2.
    on_fail:
      severity: MAJOR
      business_impact: Hans gets no instruction and the administrator is not told.
      suggested_action: route_to_wf03
  - id: EO-004
    description: A second request inside the window is answered exactly like the first but changes nothing; after the window it is accepted again.
    verification:
      method: api_response
      detail: >
        Step 4 (the repeat request) answers with the same status 202, the same body (status "requested") and the same set of header names as the answer to the
        request of step 1; nothing in the answer says it was held back. Counted from the counts before in step 1, the audit log still holds exactly one new entry of
        this action for Hans and the delivery log exactly one new row of "password_reset_hint" for him after step 4. Step 5 answers 202 "requested" with the same
        body and header names, and then the audit log holds two new entries and the delivery log two new rows for Hans compared with before step 1. The window is
        measured from the answer of the first request (step 1): if step 4 happens more than 5 minutes after it, or step 1 was not the first accepted request
        for Hans in the last 5 minutes, the outcome is NOT OBSERVABLE, not PASS.
      evidence: Counts before step 1 and after steps 1, 4 and 5; status, body and header names of the answers of steps 1, 4 and 5; the times of steps 1 and 4.
    on_fail:
      severity: MAJOR
      business_impact: Repeated requests flood the colleague's mailbox, a request after the window is lost, or the answer tells a caller whether another request was held back.
      suggested_action: route_to_wf03
  - id: EO-005
    description: "The limit is per person, so Hans recent request does not hold back a request for a different colleague."
    verification:
      method: api_response
      detail: >
        Step 6 answers 202 "requested" (same status, body and header names as step 1), and compared with the counts before in step 6 the audit log holds one new entry
        "user.password_reset_requested" for Tobias and the delivery log one new "password_reset_hint" row for him. If Tobias is not an active user with an e-mail address
        (the request answers 409 with reason "user_inactive" or "no_email") or Hans's request of step 5 is more than 5 minutes old, the outcome is NOT OBSERVABLE, not PASS.
      evidence: Counts before and after step 6 for Tobias; the time of step 5 and of step 6.
    on_fail:
      severity: MAJOR
      business_impact: One person's request blocks reset instructions for every other colleague of the company.
      suggested_action: route_to_wf03
