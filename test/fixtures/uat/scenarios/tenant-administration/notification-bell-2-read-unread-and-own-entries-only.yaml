# T-1623 (BA): notification bell, scenario 2: read and unread, "mark all as read", and the bell touches only the caller's own entries.
# Source: lib/letflow/routers/me.ex (POST /me/notifications/read takes {"ids": [1..100 ids]} or {"all": true}; anything else is 422 with the fixed text
# 'Send {"ids": [up to 100 notification ids]} or {"all": true}.'; the answer carries "marked" and "unread_count"), lib/letflow/user_notifications.ex
# (mark_read and mark_all_read change only the caller's own unread rows; an id of someone else's row or an unknown id counts 0, the two cannot be told apart, INV-5),
# web/src/components/layout/NotificationBell.tsx (button "Mark all as read", unread dot, "99+" cap).
# Not UAT-observable: a list of more than 100 ids (needs 101 real ids; covered by the backend tests of T-1561), the cap of 200 stored rows.
# Sensitive actions: the flow changes only the caller's own read marks; "change users", approve, pay and sensitive data are not in it. The refusals are step 5 (malformed read request, 422).
---
id: tenant-administration-notification-bell-2-read-unread-and-own-entries-only
scope: tenant-administration
title: Reading an entry lowers the badge, "Mark all as read" clears it, the state survives a reload, and no one can mark or read another person's entries
version: "1.0"
tags: [tenant-admin, notification-bell, read-unread, in-app]

description: >
  The dispatcher Lena has at least two unread entries on her bell (two tasks assigned to her by the administrator in this scenario). She opens one
  entry, the badge drops by one. She reloads the page and the read mark is still there. She presses "Mark all as read" and the badge disappears while
  the entries stay listed. A malformed read request is refused. A second dispatcher (Marco) sends Lena's entry id to the read route: nothing changes
  for Lena and Marco's answer does not show whether the id exists.

actors:
  tenant_admin_a: actor-swiftroute-alice
  assignee: actor-swiftroute-lena
  other_worker: actor-swiftroute-marco

preconditions:
  - description: SwiftRoute has two open tasks that nobody has taken yet
    check: system_seeded
    detail: If fewer than two exist, report BLOCKED.

steps:
  - step: 1
    actor: tenant_admin_a
    action: >
      The administrator assigns the first open task and then the second open task to the dispatcher (Lena).
    via: api
    input:
      assignee: the dispatcher (Lena), for both tasks
  - step: 2
    actor: assignee
    action: >
      The dispatcher reads her list of notifications and notes the unread number U, the identifiers and read marks of the two newest entries (A for the older, B for the newer).
    via: api
  - step: 3
    actor: assignee
    action: >
      The dispatcher opens the bell on the screen, presses the entry B (it opens its task) and reads the badge, then reloads the page and reads the badge and the entries again.
    via: gui
  - step: 4
    actor: other_worker
    action: >
      Marco sends Lena's entry A (its identifier) to the read route as one id. He notes the answer. He then sends a made-up valid identifier that belongs to nobody and notes the answer.
    via: api
    input:
      ids: Lena's entry A; then a random valid identifier
  - step: 5
    actor: other_worker
    action: >
      Marco sends a read request with an empty list of ids. The request is refused.
    via: api
    expect_refusal: true
    input:
      ids: an empty list
  - step: 6
    actor: assignee
    action: >
      The dispatcher reads her notifications again (entry A must still be unread), then opens the bell and presses "Mark all as read".
    via: gui
  - step: 7
    actor: assignee
    action: >
      The dispatcher reloads the page, reads the badge and the list, then reads her notifications through the list route.
    via: api

expected_outcomes:
  - id: EO-001
    description: The list shows both new entries as unread and counts them.
    verification:
      method: api_response
      detail: In step 2 entries A and B have read = false; the unread count is U and is at least 2; B is newer than A.
      evidence: The answer of step 2.
    on_fail:
      severity: MAJOR
      business_impact: The assigned tasks are not announced.
      suggested_action: route_to_wf03
  - id: EO-002
    description: Opening an entry lowers the badge by one and the read mark survives a reload.
    verification:
      method: gui_screen
      detail: In step 3 after the click the badge shows U-1 (no badge when U-1 is 0) and entry B has no unread mark; after the reload the badge still shows U-1 and entry B is still read, entry A still unread.
      evidence: Screens of step 3 before and after the reload.
    on_fail:
      severity: MAJOR
      business_impact: Workers see the same entries as new again and again, or lose count of what they have not seen.
      suggested_action: route_to_wf03
  - id: EO-003
    description: Another worker cannot mark Lena's entry as read, and cannot learn whether an identifier exists.
    verification:
      method: api_response
      detail: >
        Both answers of step 4 are 200 with "marked" equal to 0 and the same shape; Marco's own unread count is unchanged by the call. This is a
        no-effect check, not a refusal: the route accepts well-formed ids and counts only the caller's own rows. Lena's entry A is still read = false
        in step 6.
      evidence: The two answers of step 4 and the list of step 6.
    on_fail:
      severity: BLOCKER
      business_impact: A person could clear a colleague's notifications, or probe which notification identifiers exist.
      suggested_action: route_to_security_review
  - id: EO-004
    description: A malformed read request is refused with the fixed text.
    verification:
      method: api_response
      detail: >
        The answer of step 5 is 422 with the text 'Send {"ids": [up to 100 notification ids]} or {"all": true}.'; nothing is marked.
      evidence: The answer of step 5.
    on_fail:
      severity: MINOR
      business_impact: A broken client could silently change read marks.
      suggested_action: route_to_wf03
  - id: EO-005
    description: The button Mark all as read clears the badge and keeps the entries.
    verification:
      method: gui_screen
      detail: After step 6 the badge is gone; after the reload of step 7 no entry carries the unread mark and the entries A and B are still listed; the list route shows unread_count 0 and every entry read = true.
      evidence: Screens of step 6 and 7, the answer of step 7.
    on_fail:
      severity: MAJOR
      business_impact: Workers cannot clear their bell, or the history is lost.
      suggested_action: route_to_wf03

cleanup:
  cancel_open_instances: false
  description: The bell entries stay as test evidence.
