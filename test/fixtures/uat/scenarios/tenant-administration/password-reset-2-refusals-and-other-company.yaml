# T-1648 (BA, batch 5 item 1): refusals of the password reset request (T-1632, REQ-788, PR #4163).
# Sources: docs/requirements.yaml REQ-788 criteria 3 (any role except company administrator and platform administrator gets 403, nothing written),
# 4 (a user of another company answers the same plain 404 as an unused identifier, also for an identifier that is not a UUID; nothing written in either company),
# 6 (a body with any key is 422 "body_not_accepted" before any state check), 7 (409 with the fixed details, order user_inactive, then no_identity_provider_login, then no_email);
# lib/letflow/routers/identity.ex (handle_reset_password: not found first, platform-administrator guard, then do_reset_password: body, status, auth source, e-mail);
# lib/letflow/identity/user.ex (create_changeset: a user made on the Users screen or by the xlsx import has auth_source :internal and no password);
# docs/roles.md (UsersManage held by TENANT_ADMIN and PLATFORM_ADMIN only); test/fixtures/uat/actors.yaml (marco: task worker; auditor: read-only; bilimbaga-admin).
# BUSINESS FINDING FOR THE OWNER (not a defect of the route): a user created on the Users screen or by the xlsx import is an "internal" user with no password, and the
# reset route refuses exactly such users with 409 "no_identity_provider_login". The two ways to add users therefore give people the system cannot yet help to sign in;
# batch 5 item 1 said the reset chain would fix this, but it only serves people who sign in through the identity provider. Step 6 records the observed answer.
# NOT UAT-OBSERVABLE (kept here so it survives the merge): the guard for a member of the platform administrator group (needs a platform administrator inside a customer
# company, which the product refuses to create; test/letflow/routers/identity_reset_password_test.exs covers it); the 409 "no_email" (a user cannot be created without an address);
# the unauthenticated request (covered by the authorization pins). A PLATFORM_ADMIN is not used for a refusal: on this own-company route it would get its own tenant's data, not 403.
# Cleanup: the user uat-pw-<run>-1 cannot be deleted through the product; step 7 switches it off.
---
id: tenant-administration-password-reset-2-refusals-and-other-company
scope: tenant-administration
title: "Only a company administrator can ask for a password reset; a worker and the auditor are refused, the reason is named for inactive and password-only users, and one company cannot reach another's users"
version: "1.0"
tags: [users, password-reset, refusal, access_control, cross-tenant, inv-5, tenant-admin]

description: >
  SwiftRoute's task worker and read-only auditor ask for a password reset for a colleague and are refused. The administrator who
  sends a request with a password in it is refused with "body_not_accepted": the system never takes a password. A user the
  administrator created on the Users screen has no identity-provider login, so the request is refused with the reason
  "no_identity_provider_login"; after the user is switched off the reason is "user_inactive". The SwiftRoute administrator asks
  for a Bilimbaga user, for an unused identifier and for text that is not an identifier, and gets the same plain "not found"
  each time; the Bilimbaga administrator asks for a SwiftRoute user and gets the same. None of the refused requests writes an
  audit entry or a mail row in either company.

actors:
  admin: actor-swiftroute-alice
  worker: actor-swiftroute-marco
  auditor: actor-swiftroute-auditor
  other_admin: actor-bilimbaga-admin
  colleague: actor-swiftroute-hans

preconditions:
  - description: Scenario tenant-administration-password-reset-1 has run in this run, so Hans is an active identity-provider user of SwiftRoute with an e-mail address
    check: system_seeded
    detail: If Hans is missing or inactive, report BLOCKED for steps 2, 3, 4, 10 and 11 only. Do not prepare him by another route.
  - description: The run has a fresh run tag; no SwiftRoute user is named uat-pw-<run>-1
    check: custom
    detail: A user name from an earlier run would make the creation in step 5 fail.
  - description: The Bilimbaga administrator can sign in and sees a Users list with at least himself
    check: system_seeded
    detail: If not, report BLOCKED for steps 9, 10 and 11.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator opens the audit log filtered to the action "user.password_reset_requested" and the mail delivery log
      filtered to nothing, and notes how many entries and how many "password_reset_hint" rows SwiftRoute holds (call them A and D).
    via: api
  - step: 2
    actor: worker
    action: >
      SwiftRoute's task worker asks the system to send Hans password reset instructions.
    expect_refusal: true
    via: api
  - step: 3
    actor: auditor
    action: >
      SwiftRoute's read-only auditor asks the system to send Hans password reset instructions.
    expect_refusal: true
    via: api
  - step: 4
    actor: admin
    action: >
      The administrator asks the system to send Hans password reset instructions, with the field "password" set to "Secret123" in the request.
    expect_refusal: true
    via: api
  - step: 5
    actor: admin
    action: >
      On the Users screen the administrator creates a new user with the user name "uat-pw-<run>-1", the display name "UAT Password
      Reset" and the e-mail address "uat-pw-<run>-1@example.test", and notes the new user's identifier.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator asks the system to send the new user password reset instructions (empty request).
    expect_refusal: true
    via: api
  - step: 7
    actor: admin
    action: >
      On the Users screen the administrator switches the new user off.
    via: ui
  - step: 8
    actor: admin
    action: >
      The administrator asks the system to send the new user (now switched off) password reset instructions (empty request).
    expect_refusal: true
    via: api
  - step: 9
    actor: other_admin
    action: >
      The Bilimbaga administrator opens the Users screen and notes his own user identifier (call it B1).
    via: ui
  - step: 10
    actor: admin
    action: >
      The SwiftRoute administrator asks for password reset instructions for the user B1, for the identifier
      00000000-0000-0000-0000-000000000000 and for the text "not-an-identifier" (three requests, each one empty).
    expect_refusal: true
    via: api
  - step: 11
    actor: other_admin
    action: >
      The Bilimbaga administrator asks for password reset instructions for Hans's identifier (from the SwiftRoute Users screen
      of scenario 1).
    expect_refusal: true
    via: api
  - step: 12
    actor: admin
    action: >
      The administrator reads the audit log (same filter as step 1) and the delivery log again and counts the entries and the
      "password_reset_hint" rows; the Bilimbaga administrator reads Bilimbaga's audit log with the same filter.
    via: api

expected_outcomes:
  - id: EO-001
    description: A worker and the auditor are refused and nothing is written.
    verification:
      method: http_status
      detail: Steps 2 and 3 are answered 403 with no "requested" message.
      evidence: Statuses of steps 2 and 3.
    on_fail:
      severity: BLOCKER
      business_impact: A non-administrator could trigger mail to any colleague, or probe which users exist.
      suggested_action: route_to_security_review
  - id: EO-002
    description: A request that carries a password is refused before anything is checked about the user.
    verification:
      method: http_status
      detail: Step 4 is answered 422 with the reason "body_not_accepted". The answer does not repeat "Secret123".
      evidence: Status and body of step 4.
    on_fail:
      severity: BLOCKER
      business_impact: The route could accept or echo a password, which the product promises never to handle.
      suggested_action: route_to_security_review
  - id: EO-003
    description: A user without an identity-provider login, and a switched-off user, are refused with a named reason.
    verification:
      method: http_status
      detail: >
        Step 6 is answered 409 with the reason "no_identity_provider_login" (observed: a user made on the Users screen has no
        identity-provider login). Step 8 is answered 409 with the reason "user_inactive" (inactive is reported before the login kind).
      evidence: Status and reason of steps 6 and 8.
    on_fail:
      severity: MAJOR
      business_impact: The administrator cannot tell why no instruction was sent.
      suggested_action: route_to_wf03
  - id: EO-004
    description: Another company's users cannot be reached, and the answer does not tell a real user of another company from an unused identifier.
    verification:
      method: http_status
      detail: >
        All three requests of step 10 and the request of step 11 are answered with the same plain 404 (same status and same body; compare after
        dropping trace_id). Step 11 is not a 403.
      evidence: Statuses and bodies of steps 10 and 11.
    on_fail:
      severity: BLOCKER
      business_impact: One company could learn which users another company holds, or send mail to them.
      suggested_action: route_to_security_review
  - id: EO-005
    description: No refused request wrote an audit entry or a mail row in either company.
    verification:
      method: api_response
      detail: >
        Step 12: SwiftRoute's count of "user.password_reset_requested" entries and of "password_reset_hint" rows is still A and D from step 1;
        Bilimbaga's log holds no entry of this action.
      evidence: Counts of step 1 and step 12; Bilimbaga's filtered log.
    on_fail:
      severity: BLOCKER
      business_impact: A refused request still sent mail or left a false trail.
      suggested_action: route_to_security_review
