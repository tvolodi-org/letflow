# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-import. Live authenticated tenant enumeration not repeated.
# 2. Actors: actors.yaml maps actor-qoimeks-qa2-admin / TENANT_ADMIN and actor-qoimeks-qa2-storekeeper / STOREKEEPER to tenant/realm qoimeks-qa2, as supplied by the T-2219 PM decision. Both actors are available in the roster; live login not repeated; missing credentials block affected outcomes.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, units, responsible-key balances, QOI-OU-1, downloaded workbook, import history and effective quick-count approval rule: listed in scenario preconditions; responsible-key remarks checked against stock_workbook_import.ex and task baseline. A plain zero-stock item/place and independent approver are conditional fixtures, never presumed present. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the administrator used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-import.
# T-2190: run title UAT qoimeks-import; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2158 (BA): UAT walk for balance import and Excel load on the Qoimeks QA tenant.
# REQ-884 (GH #4607): module stock checks a Qoimeks-layout balances workbook against the stock of one org unit,
#   normalising look-alike letters and decimal commas, with Russian per-row warnings, and writes nothing.
# REQ-887 (GH #4604): web screen 'Загрузка остатков из Excel' — check a workbook, show remarks and differences,
#   write the balances from the file, list the loads and cancel one, in English, Russian and Kazakh.
# Sources:
#   docs/runbooks/stock-workbook-import.md (route, layout, normalising rules, remark list R1..R11)
#   web/src/modules/stock/workbook/workbookMessages.ts (en/ru/kk screen texts)
#   web/src/modules/stock/workbook/WorkbookImportPage.tsx (route: admin/stock/workbook-import, guard: StockQuickCount)
#   web/src/modules/stock/register/BalancesPage.tsx (button to workbook-import for holders of StockQuickCount)
#   test/fixtures/uat/actors.yaml (actor-qoimeks-qa2-admin: TENANT_ADMIN; TENANT_ADMIN holds StockQuickCount per REQ-854)
# Coverage notes (cases outside this walk and environment requirements): (a) normalising of Cyrillic look-alike letters (Russian remarks R11): covered in scenario 3;
#   (b) the load write path and document creation: covered in scenarios 4 and 5;
#   (c) a caller without StockQuickCount navigating to the import screen: actor-qoimeks-qa2-storekeeper is available and lacks StockQuickCount (lib/letflow/modules/stock/stock.ex role_grants); this is an available refusal check outside the existing administrator steps, not an environment blocker.
# Preparation: in the signed-in browser download the whole-stock workbook from Balances; save its exact bytes as uat-wb-exact.xlsx. Select QOI-OU-1 for the check.
# Source #4696 (T-2171 acceptance): unchanged downloaded workbook has R data rows and S distinct stocked articles (both read from the downloaded file at the start of the run), zero changes and S R7 remarks.
# docs/runbooks/stock-workbook-import.md rule (g): responsible balances are skipped per article; this is not a proof of plain-key equality.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-import-1-check-workbook-desktop
scope: qoimeks-qa2
title: >-
  The administrator checks the balances workbook on a desktop width, sees no changes for an exact-match file, and
  is refused when uploading a non-Excel file
version: '1.1'
tags:
- qoimeks
- import
- check
- desktop
- en
description: >-
  On a 1440 px desktop window in English, the administrator navigates from the stock Balances screen to the "Load
  balances from Excel" page. They choose an org unit, upload the xlsx workbook of that org unit's current balances
  (uat-wb-exact.xlsx, downloaded as described in the preparation section above) and press Check. The result shows
  the sheet name, the number of rows read, 0 changed rows (the file exactly matches the book) and S responsible-stock
  remarks. The "Write balances from the file" button is not enabled because there is nothing to change. The administrator
  then tries to drop a plain-text file into the file drop zone: the screen refuses it immediately with the message
  "Only .xlsx files are accepted" without sending any request to the server. This scenario writes nothing: no document,
  no ledger entry and no audit entry.
actors:
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant exists, the stock module is active, and the synthetic data is loaded (the places and items counted at the start of the run (the seed changes them), at least one org unit with balances). The administrator's credentials are available through the UAT credential
    source.
  check: system_seeded
  detail: >-
    If the tenant is not reachable or credentials are missing, report BLOCKED for the whole scenario.
- description: >-
    The run can drive a real browser at a window width of 1440 px.
  check: system_seeded
  detail: >-
    If no browser can be started, report BLOCKED for the whole scenario.
- description: >-
    The UAT runner has downloaded the exact-match balances workbook for one org unit (see the preparation section
    above) and saved it as uat-wb-exact.xlsx. Any org unit with existing balances works; note the org unit name
    used for step 3.
  check: runner_prepared
  detail: >-
    If the download fails or no org unit has balances, report BLOCKED for steps 3 and 4 and note which condition
    was not met.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. The item, place and non-zero balance counts are read at the start of the run (the seed changes them); every seeded
    balance carries a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    Before checking, download a fresh unchanged whole-stock workbook through the Balances workbook button. Select
    QOI-OU-1. Verify that this is the unchanged synthetic baseline of R data rows and S distinct stocked articles, both counted from the downloaded file at the start of the run (the seed changes them, so no fixed number is used)
    with responsible balances, as recorded in issue #4696.
  check: runner_prepared
  detail: >-
    Count the workbook data rows (R) and the distinct stocked articles (S) from the downloaded file and read the matching balances before Check; the expected number of remarks equals S. If another
    run has changed this baseline, report the count outcomes BLOCKED-by-environment and retain the observed
    counts; do not change the fixture to force zero remarks.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2)
    in a window 1440 px wide, in English.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator opens the stock Balances screen from the side navigation and finds the "Load balances from
    Excel" button in the page header.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator clicks "Load balances from Excel" and arrives on the import screen. They select the org unit
    whose workbook they downloaded, upload the file uat-wb-exact.xlsx using the file drop zone, and press the "Check"
    button.
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator reads the check result shown on the import screen.
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator drops notes.txt into the file drop zone. Its complete UTF-8 bytes are This is not a workbook.
    with no trailing newline.
  expect_refusal: true
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The import screen opens with its English title and an org-unit selector.
  verification:
    method: page_state
    detail: >-
      During step 3, immediately after opening the import screen and before uploading the workbook, read the page.
      The heading reads "Load balances from Excel" and an org-unit selector is shown; no error banner is present.
      The "Check" button is present but the file drop zone shows no file yet.
    evidence: >-
      Screenshot of the import screen before uploading.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Bookkeepers cannot reach the Excel import screen and have no way to load balances from their file.
    suggested_action: route_to_wf03
- id: EO-002
  description: >-
    The unchanged synthetic workbook gives zero changes and S responsible-stock remarks.
  verification:
    method: gui_screen
    detail: >-
      After step 3 the summary has R rows read, 0 changes and S remarks (R and S as recorded from the downloaded file). Each remark explains in Russian that
      the article is tracked separately by org units, responsible employees, lots or units and is left unchanged.
      The no-change message is shown and the write button is disabled. The remarks hint is present because remarks
      exist. The hint explains that the remarks are written in Russian.
    evidence: >-
      Screenshot of the check result panel showing the summary counts and the no-change message.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The check shows phantom differences for a file that already matches the book. Bookkeepers would see spurious
      change lists, raise unnecessary corrections and lose confidence in the tool.
    suggested_action: route_to_wf03
- id: EO-003
  description: >-
    Uploading a non-xlsx file is refused immediately on the client side.
  verification:
    method: gui_screen
    detail: >-
      In step 5, the screen shows the message "Only .xlsx files are accepted" at once after the file is dragged
      in, without navigating away and without a loading spinner. The file is not shown as selected and no server
      request is sent.
    evidence: >-
      Screenshot of the error message in the drop zone.
  on_fail:
    severity: MINOR
    business_impact: >-
      The screen sends an unusable file to the server and shows a less clear error. Bookkeepers may be confused
      when uploading the wrong file format by accident.
    suggested_action: route_to_frontend_dev
