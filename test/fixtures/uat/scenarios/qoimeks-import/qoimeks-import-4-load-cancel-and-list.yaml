# T-2267 code-reading pass (PM 2026-11-19), EXPECTATION CORRECTIONS 4: (1) step 7 was marked expect_refusal but only looks at a missing button; the refusal of a second cancel exists only at the server (422 import_already_cancelled, not reachable from the screen, which hides Cancel for cancelled rows): step 7 is now a read, EO-005 says so; (2) the Cancel button needs StockReverse (TENANT_ADMIN holds it): stated; (3) the 'User' column shows a dash always (the list has no user name): kept, source WorkbookImportPage; (4) the document number is a link in the Number column (T-2238): stated.
# T-2190: run title UAT qoimeks-import; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2158 (BA): UAT walk for balance import and Excel load on the Qoimeks QA tenant.
# REQ-884 (GH #4607): module stock checks a Qoimeks-layout balances workbook.
# REQ-885 (GH #4606): module stock loads a checked balances workbook, creates a quick_count document.
# REQ-886 (GH #4605): module stock lists the balances workbook loads and cancels one.
# REQ-887 (GH #4604): web screen 'Загрузка остатков из Excel'.
# Sources:
#   docs/runbooks/stock-workbook-import.md (load route POST /stock-workbook/apply, cancel route,
#     list route GET /stock-workbook/imports, states: issued/cancelled, cancel-before-approval answer)
#   web/src/modules/stock/workbook/workbookMessages.ts (en: load.success, loads.state.issued,
#     loads.state.cancelled, cancel.cancelled, err.import_already_cancelled)
#   test/fixtures/uat/actors.yaml (actor-qoimeks-qa2-admin: TENANT_ADMIN; holds StockWorkbookApply and StockReverse)
# Cleanup: this scenario cancels the load before approval, so no balance changes and no cleanup is needed.
#   The quick_count document created is left in state "cancelled".
# Preparation: choose an existing unstocked article and an existing shelf place from the downloaded workbook and catalog; prepare only that article, as detailed in preconditions. Do not edit a responsible-stock article.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-import-4-load-cancel-and-list
scope: qoimeks-qa2
title: >-
  The administrator loads a workbook with one change, sees the import in the list, cancels it before approval, then
  tries to cancel the same import again and is refused
version: '1.2'
tags:
- qoimeks
- import
- load
- cancel
- list
- desktop
- en
description: >-
  On desktop in English the administrator checks a single-row workbook for an existing unstocked article at an existing
  place. It shows book 0, file 1, difference 1 and zero remarks. The administrator loads it, records the document
  number, and cancels the load before approval. The history shows the cancelled load; the cancel action is no longer
  available. Re-read balances to confirm the key is still absent or zero. No approval is attempted and no seeded
  responsible balance changes.
actors:
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant is reachable, the stock module is active, and the administrator's credentials are available.
  check: system_seeded
  detail: >-
    If the tenant is not reachable or credentials are missing, report BLOCKED.
- description: >-
    The run can drive a real browser at a window width of 1440 px.
  check: system_seeded
  detail: >-
    If no browser can be started, report BLOCKED.
- description: >-
    Prepare uat-wb-one-change.xlsx with only one existing untracked article that has no non-zero stock anywhere
    in the tenant, and one existing shelf place. Read all stock of the article first. Copy its exact article code
    and name from the catalog and the place code from the location record. First sheet cells A1=Артикул; A2=the
    observed article code, B2=its observed name, C2=1, H2=the observed place code; all other cells blank. Save these
    exact cells as an xlsx file; no other data row. Select QOI-OU-1. Record the absence of a balance for this plain
    key as book quantity 0, before any load.
  check: runner_prepared
  detail: >-
    If no such article or place exists, or workbook creation is unavailable, BLOCKED-by-environment before any write.
    Never choose a responsible-stock article. Retain the workbook bytes and observed identifiers in evidence; create
    no new masters.
- description: >-
    No count order is open over the test key in QOI-OU-1. Read the count-order list and frozen-place state before
    loading.
  check: runner_prepared
  detail: >-
    If a count order covers the test key, BLOCKED-by-environment before writing. Do not complete or cancel somebody
    else’s count to make this walk run.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2)
    in a window 1440 px wide, in English.
  via: ui
- step: 2
  actor: admin
  action: >-
    Before any load, the administrator opens Balances, filters by the article code and the place of the prepared
    workbook (org unit QOI-OU-1, empty responsible slot), and records the balance reading: no row, or quantity 0
    (screenshot kept). Then the administrator opens "Load balances from Excel", selects QOI-OU-1, uploads the prepared single-row uat-wb-one-change.xlsx
    and presses "Check". They record book 0, file 1, difference 1 and zero remarks before proceeding.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator presses "Write balances from the file" to load the workbook.
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator scrolls to the "Previous loads" section at the bottom of the import screen and reads the list
    entry for the load they just created.
  via: ui
- step: 5
  actor: admin
  action: >-
    The administrator clicks the "Cancel" button for the new load in the list, enters the reason "UAT test cancel"
    in the dialog and confirms.
  via: ui
- step: 6
  actor: admin
  action: >-
    The administrator reads the updated cancelled history entry, then opens Balances and reads the recorded article,
    place, org unit and empty responsible slot again. It is still absent or zero. They return to the load history.
  via: ui
- step: 7
  actor: admin
  action: >-
    The administrator looks at the cancelled load entry in the list and reads its state and whether a "Cancel" button is
    still offered for it (a second cancel is refused by the server and is not reachable from this screen).
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The check result shows exactly 1 change and the load button is enabled.
  verification:
    method: gui_screen
    detail: >-
      After step 2, the English summary shows exactly one change and zero remarks. The only change has the recorded
      article and place, book 0, file 1 and difference 1. The Write balances from the file button is enabled.
    evidence: >-
      Screenshot of the check result panel showing the single change row.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The check does not detect a known one-unit difference. Bookkeepers cannot trust the check to identify what
      the load will change before they commit to it.
    suggested_action: route_to_wf03
- id: EO-002
  description: >-
    The load creates a document and shows its number with a link to it.
  verification:
    method: gui_screen
    detail: >-
      After step 3, the success message shows a QCT document number and the Open document link. It explains that
      balances change after approval. The document is issued, not posted.
    evidence: >-
      Screenshot of the load success message with the document number.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Loading a workbook does not create a document. Bookkeepers cannot apply file balances to the stock.
    suggested_action: route_to_wf03
- id: EO-003
  description: >-
    The import list shows the new load with state "Issued".
  verification:
    method: gui_screen
    detail: >-
      After step 4, Previous loads shows the recorded document number as a link in the Number column, the name of the administrator who made the load in the User column (the display name of actor-qoimeks-qa2-admin, not a dash and not an empty cell: a load list that does not say who loaded is a FAIL, product task), file uat-wb-one-change.xlsx,
      Lines 1, Remarks 0 and state Issued. Cancel is available for this row (the administrator holds the reverse right).
    evidence: >-
      Screenshot of the imports list showing the new entry in state Issued.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The load list does not show the pending import. Bookkeepers cannot track which imports are waiting for approval
      or cancel an erroneous one.
    suggested_action: route_to_wf03
- id: EO-004
  description: >-
    Cancelling the load before approval changes its state to "Cancelled" and leaves balances unchanged.
  verification:
    method: gui_screen
    detail: >-
      After step 5, the cancellation success is shown. The same history entry is Cancelled and Cancel is absent.
      Step 6 re-reads the full plain balance key and confirms it is still absent or zero.
    evidence: >-
      Screenshot of the imports list with the entry in state Cancelled.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A bookkeeper cannot cancel an erroneous load before it is approved. The document would proceed to approval
      and change the wrong balances.
    suggested_action: route_to_wf03
- id: EO-005
  description: >-
    The Cancel action is not offered for a cancelled load.
  verification:
    method: gui_screen
    detail: >-
      After step 7, the "Cancel" button is absent from the cancelled load entry in the list. The screen offers
      no way to cancel it again (the button is not shown; no cancel dialog opens). The load state remains "Cancelled".
    evidence: >-
      Screenshot of the imports list showing the cancelled entry without a Cancel button.
  on_fail:
    severity: MINOR
    business_impact: >-
      The Cancel button is shown for already-cancelled loads, which could mislead bookkeepers into thinking they
      need to cancel a load that is already in a final state.
    suggested_action: route_to_frontend_dev
