# T-2190 group verification (2026-11-19; source checks distinguished from live QA):
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-import. Live authenticated tenant enumeration not repeated.
# 2. Actors (T-2222, PM 2026-11-19): actor-qoimeks-qa2-admin / TENANT_ADMIN runs the Excel load, its approval and the ledger settings (administrator functions); actor-qoimeks-qa2-storekeeper / STOREKEEPER is used only in the refusal scenario qoimeks-import-6. Both exist in actors.yaml for tenant/realm qoimeks-qa2 (T-2219 PM decision); the live login was not exercised in this writing step (acceptance verifies it; credentials come from the acceptance credential source, never from files); missing credentials block the affected outcomes.
# 3. Host and screens: read-only HEAD to https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 returned HTTP 200 on 2026-11-19. stockRoutes.tsx and referenced web/src/modules/stock pages checked on main; this verifies source availability, not authenticated live rendering.
# 4. Data: Items, places, units, responsible-key balances, QOI-OU-1, downloaded workbook, import history and effective quick-count approval rule: listed in scenario preconditions; responsible-key remarks checked against stock_workbook_import.ex and task baseline. A plain zero-stock item/place and independent approver are conditional fixtures, never presumed present. Counts come from the owner task and scripts/pilot/qoimeks_gen.py (counts read at the start of the run, not hard-coded); live data/flags must be read before writes, otherwise BLOCKED-by-environment.
# 5. Executable: browser/HTTP-client steps reviewed against the referenced pages and routers; runner supplies its own script without pipeline_test. Unsupported controls and missing token/baseline preparation were corrected in T-2190; missing fixtures stop before writes, never become product FAIL.
# 6. Dry run: live uat.sh preflight not run in this scenario-writing step, explicitly permitted by the technical answer to T-2190; authenticated QA preflight belongs to acceptance. Static parse_scenario check passed for all 25 scenarios (qoimeks-qa2 and the administrator used by these steps; the roster also includes STOREKEEPER); acceptance must use title UAT qoimeks-import.
# T-2267 code-reading pass (PM 2026-11-19), EXPECTATION CORRECTIONS 5: (1) the self-approval refusal now quotes the real Kazakh texts of the task panel (hint 'Бұл құжатты сіз рәсімдедіңіз; оны басқа адам бекітуі керек.', refusal 'Бұл құжатты басқа адам бекітуі керек.', source pages/tasks/taskMessages.ts, testid task-sod-error) and drops the 'if the control is unavailable' escape; (2) the scenario no longer depends on scenario 4 having run: it prepares its own one-row workbook; (3) EO-001 and EO-003 on_fail text was copied from another outcome: corrected; (4) the quick-count four-eyes rule is ON on the tenant (task state), so a rule that reads OFF is a defect of the environment, not a skip; (5) the load success text carries the number of the QCT document.
# T-2190: run title UAT qoimeks-import; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2158 (BA): UAT walk for balance import and Excel load on the Qoimeks QA tenant.
# REQ-884 (GH #4607): module stock checks a Qoimeks-layout balances workbook.
# REQ-885 (GH #4606): module stock loads a checked balances workbook, creates a quick_count document.
# REQ-887 (GH #4604): web screen 'Загрузка остатков из Excel' — Kazakh locale, phone width; full approve flow.
# Sources:
#   docs/runbooks/stock-workbook-import.md (four-eyes ON default; four-eyes OFF: "loader can complete alone";
#     after approval one ledger entry of cause count_set; check same file → 0 changes after approval)
#   web/src/modules/stock/workbook/workbookMessages.ts (kk: title, load.hint, load.success, load.noChange)
#   test/fixtures/uat/actors.yaml (actor-qoimeks-qa2-admin: TENANT_ADMIN; holds StockQuickCount)
# #4697: opening approval OFF does not imply quick-count approval OFF. Read the effective quick-count rule first; never switch it here.
# Approval/posting and post-approval round trip excluded: no independent second actor exists. This walk cancels before approval and preserves the original balance.
# Workbook cells and zero-stock checks are specified in this scenario preconditions; scenario 4 need not run first if that same single-row fixture is prepared independently.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-import-5-load-approve-kk
scope: qoimeks-qa2
title: >-
  In Kazakh on a phone the administrator loads one unstocked article, is prevented from approving their own count
  with four-eyes ON, and cancels before posting
version: '1.2'
tags:
- qoimeks
- import
- load
- approve
- kk
- phone
description: >-
  At 390 px in Kazakh, use a single-row workbook for an unstocked article (prepared as in scenario 4, checked against current
  stock). The load creates an issued quick count. With the effective quick-count four-eyes rule ON the loader cannot
  approve alone. Cancel the load before approval, then re-read the plain key and history. It remains absent or zero;
  the original responsible-stock balances are untouched. Posting and the post-approval round trip are BLOCKED-by-environment
  because the roster has no independent approver. Do not switch the quick-count approval rule.
actors:
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The Qoimeks QA tenant is reachable, the stock module is active, and the administrator's credentials are available.
  check: system_seeded
  detail: >-
    If the tenant is not reachable or credentials are missing, report BLOCKED.
- description: >-
    The real browser can run at 390 px in Kazakh and retain screenshots.
  check: system_seeded
  detail: >-
    If no browser can be started, report BLOCKED.
- description: >-
    Prepare uat-wb-one-change.xlsx with only one existing untracked article that has no non-zero stock anywhere
    in the tenant, and one existing shelf place. Read all stock of the article first. Copy its exact article code
    and name from the catalog and the place code from the location record. First sheet cells A1=Артикул; A2=the
    observed article code, B2=its observed name, C2=1, H2=the observed place code; all other cells blank. Save these
    exact cells as an xlsx file; no other data row. Select QOI-OU-1. Record the absence of a balance for this plain
    key as book quantity 0, before any load.
  check: runner_prepared
  detail: >-
    If no such article or place exists, or workbook creation is unavailable, BLOCKED-by-environment before any write.
    Never choose a responsible-stock article. Retain the workbook bytes and observed identifiers in evidence; create
    no new masters.
- description: >-
    No count order is open over the test key in QOI-OU-1. Read the count-order list and frozen-place state before
    loading.
  check: runner_prepared
  detail: >-
    If a count order covers the test key, BLOCKED-by-environment before writing. Do not complete or cancel somebody
    else’s count to make this walk run.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    Before loading, read Approval rules and confirm the effective stock_quick_count approve rule is ON. The opening
    rule OFF is unrelated. The chosen unstocked article has no non-zero stock anywhere in the tenant. The effective rule is expected ON on this tenant.
  check: runner_prepared
  detail: >-
    If the quick-count rule is OFF or cannot be read, report an environment defect (the tenant baseline is ON) and stop
    before loading. Do not reconfigure it. If a second approver is needed for posting, BLOCKED-by-environment because
    no such roster actor exists.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in to the synthetic QA tenant at 390 px, switches to Kazakh and opens the workbook import
    page.
  via: ui
- step: 2
  actor: admin
  action: >-
    Before any load, the administrator opens Balances, filters by the article code and the place of the prepared
    workbook (org unit QOI-OU-1, empty responsible slot), and records the balance reading: no row, or quantity 0
    (screenshot kept). Then the administrator selects QOI-OU-1, uploads uat-wb-one-change.xlsx, checks that book is 0, file is 1, difference
    is 1 and remarks are 0, then loads the file. They record the document number and open its approval task in My
    Tasks.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator opens the approval task of their own new count in My Tasks and attempts to approve it. The panel
    shows the hint "Бұл құжатты сіз рәсімдедіңіз; оны басқа адам бекітуі керек." and the attempt is refused with
    "Бұл құжатты басқа адам бекітуі керек.".
  expect_refusal: true
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator returns to the load history, cancels this load with the reason UAT test cancel, and reads
    its state. They read the same plain balance key on Balances again, then restore English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The Kazakh check is readable at phone width.
  verification:
    method: gui_screen
    detail: >-
      At 390 px the heading is "Excel-ден қалдықтарды жүктеу"; the org-unit label is "Бөлімше" and the check button
      is "Тексеру". The check shows book 0, file 1 and one change with no remarks. Controls are readable and reachable.
    evidence: >-
      Screenshot of the Kazakh check at 390 px, with the single change and counts.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Bookkeepers working in Kazakh on a phone cannot read or use the import check.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    Loading records an issued document and shows its link in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      After loading the Kazakh success text contains the recorded document number and the link "Құжатты ашу". The
      document is issued and not posted.
    evidence: >-
      Screenshot of the Kazakh load success, issued document and its number.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Loading a workbook does not create a document. Bookkeepers cannot apply file balances to the stock.
    suggested_action: route_to_wf03
- id: EO-003
  description: >-
    The loader cannot self-approve with the quick-count rule ON.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the Kazakh hint "Бұл құжатты сіз рәсімдедіңіз; оны басқа адам бекітуі керек." and the approval attempt ends with the refusal text "Бұл құжатты басқа адам бекітуі керек.". The document
      remains issued, and the recorded balance is still absent or zero. No second actor is substituted.
    evidence: >-
      Task-panel hint and refusal screenshot, issued document and unchanged balance evidence.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The four-eyes rule is not enforced: the person who loaded the file could approve it alone and change the stock.
    suggested_action: route_to_wf03
- id: EO-004
  description: >-
    Cancellation withdraws the unapproved load without moving balances.
  verification:
    method: gui_screen
    detail: >-
      After step 4 the history shows this load cancelled, its Cancel action is absent, and the key remains absent
      or zero. Retain the cancellation and balance screenshots. The language is English again.
    evidence: >-
      Cancelled history entry and balance re-read, plus English restored.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A bookkeeper cannot cancel an erroneous load before it is approved. The document would proceed to approval
      and change the wrong balances.
    suggested_action: route_to_wf03
