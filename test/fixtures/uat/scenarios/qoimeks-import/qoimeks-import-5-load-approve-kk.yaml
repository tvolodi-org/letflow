# T-2335 (issue 4838, audit of T-2304) rewrite: the independent approver exists (actor-qoimeks-qa2-admin2, TENANT_ADMIN, added to actors.yaml by T-2334), so this walk now posts and reverses the load on the screens.
# 1. Scope: every scenario of the group is scope qoimeks-qa2, the synthetic QA tenant and realm of the roster; the directory name qoimeks-import is the run title UAT qoimeks-import, not the scope.
# 2. Actors: actor-qoimeks-qa2-admin (TENANT_ADMIN) loads the workbook and starts the reversal; actor-qoimeks-qa2-admin2 (TENANT_ADMIN, a different person, same tenant and realm, roster entry of T-2334) approves the load and completes the reversal task; actor-qoimeks-qa2-storekeeper is used only in qoimeks-import-6. The login of admin2 in the acceptance credential source is a precondition (UAT assumption, to be confirmed by the process owner): without it every step of admin2 and EO-005 to EO-007 are BLOCKED-by-environment and admin1 is never used in its place. No credentials are written here.
# 3. Host and screens: https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 answered HTTP 200 on 2026-11-19 (T-2190, not repeated). Read on main: stockRoutes.tsx (Balances page admin/stock/balances; import page), register/BalancesPage.tsx (Select filters Item, Location, Org unit, Responsible; table columns item, location, org unit, responsible, lot, unit, quantity), workbook/WorkbookImportPage.tsx (Previous loads: Cancel shown while the state is not cancelled, not reversed and no reversal pending, so it is shown for a posted load), pages/tasks/taskMessages.ts (Claim, Complete, done texts, self-approval hint and refusal).
# 4. Data: one existing article without any non-zero stock in the tenant and one existing shelf place (as in qoimeks-import-4), org unit QOI-OU-1, effective quick-count four-eyes rule ON (read at the start, never switched here), no count order over the key, admin2 login. All read at run time; a missing fixture is BLOCKED-by-environment before any write; no generator task is needed because nothing is seeded.
# 5. Executable: a runner with a browser (two separate sessions, one per administrator) at 390 px in Kazakh; the workbook is prepared by the runner (bytes kept). Every named control exists on the screens listed in point 3.
# 6. Dry run: live uat.sh preflight not run in this writing step (authenticated QA belongs to acceptance; run title UAT qoimeks-import); static check run on the group, result in the task summary.
# EXPECTATION CORRECTIONS (T-2335): 5. (1) posting is no longer excluded: the independent approver exists; (2) old step 4 cancelled the load before the approval and EO-004 asserted that cancellation: replaced by approval by admin2 and the posted balance; (3) the balance is read on the Balances screen (filter Item, Location, Org unit, empty responsible) before the load, after the posting and after the reversal, not by API; (4) the reversal is started with Cancel on the posted load (REQ-886 and docs/runbooks/stock-workbook-import.md: a cancel of a posted load answers reverse pending, balances change only when the reverse task is completed), and the reverse task is completed by admin2 in My Tasks; (5) the end state is Reversed, balance equal to the start and no open task, instead of Cancelled.
# Sources: docs/runbooks/stock-workbook-import.md (four eyes ON: the loader's own completion of the approve task is refused; after approval one ledger entry of cause count_set; cancel of a posted load starts a reversal, balances return when the reverse task is completed), REQ-885 (load creates an issued quick count), REQ-886 (list and cancel/reverse), REQ-887 (screen), web/src/modules/stock/workbook/workbookMessages.ts, web/src/pages/tasks/taskMessages.ts, test/fixtures/uat/actors.yaml.
# Group size scenarios: qoimeks-import-8 (workbook of about 1.5 MiB is checked) and qoimeks-import-9 (workbook above the application limit is refused) are already on main; not duplicated here.
# Execution contract (T-2190): the acceptance runner supplies its own real-browser script; retain screenshots per step, width and language and the workbook bytes. An unmet environment need is BLOCKED-by-environment, never PASS or a product failure. QA only; synthetic data; no other tenant's actor.
# Cleanup: the walk ends with the load reversed and the balance back to the start; the quick-count document stays in state Reversed (documents are never deleted). Nothing else was changed and no rule was switched.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, documents/documentsMessages.ts, web/src/pages/tasks/taskMessages.ts.
---
id: qoimeks-import-5-load-approve-kk
scope: qoimeks-qa2
title: >-
  In Kazakh on a phone the administrator loads one unstocked article, cannot approve their own load, a second administrator
  posts it, the balance is read on the Balances screen, and the posted load is reversed on the screens
version: '2.0'
tags:
- qoimeks
- import
- load
- approve
- reverse
- four_eyes
- kk
- phone
description: >-
  At 390 px in Kazakh, administrator 1 checks and loads a single-row workbook for an unstocked article (as in scenario 4),
  which creates an issued quick count. With the effective quick-count four-eyes rule ON the loader cannot approve it:
  the My Tasks panel refuses. Administrator 2 (a different person) claims and completes the approval in a separate browser
  session and the load is Posted. The balance of that one article at that one place is read on the Balances screen before
  the load, after the posting (the file quantity of 1) and after the reversal (back to the start). The posted load is
  then reversed through the screens (Cancel on the posted load in the load history starts the reversal, administrator 2
  completes the reverse task in My Tasks) and the load is Reversed. At the end no task of this walk is pending.
actors:
  admin: actor-qoimeks-qa2-admin
  admin2: actor-qoimeks-qa2-admin2
preconditions:
- description: >-
    Approval rule state, explicit (owner D-165: a new tenant has the second-person approval OFF by default, so this walk never relies on the default). Before the walk the operator has set stock_quick_count / approve ON (the qa2 tenant keeps explicit ON rows) and stock_opening / approve OFF. A workbook load creates an issued quick count; this scenario needs stock_quick_count / approve ON so that the loader cannot approve it and a second administrator does. It does not switch the rule.
  check: system_seeded
  detail: >-
    Read both rules on the Approval rules screen at the start (administrator) and record them. If a rule is not in the stated state or cannot be read, report BLOCKED-by-environment; do not switch a rule to make the walk pass and do not take the default as the state. This scenario never changes a rule.
- description: >-
    The Qoimeks QA tenant is reachable, the stock module is active, and the credentials of both administrators
    (actor-qoimeks-qa2-admin and actor-qoimeks-qa2-admin2, different persons, TENANT_ADMIN, same tenant and realm) are
    available in the acceptance credential source.
  check: system_seeded
  detail: >-
    If the tenant is not reachable or the credentials of admin 1 are missing, report BLOCKED. If only admin 2 has no
    login, steps 4, 6 and 7 and EO-004 to EO-007 are BLOCKED-by-environment; never use admin 1 in its place and never
    provision the account from the walk.
- description: >-
    The real browser can run at 390 px in Kazakh, in two separate sessions, and retain screenshots.
  check: system_seeded
  detail: >-
    If no browser can be started, report BLOCKED.
- description: >-
    Prepare uat-wb-one-change.xlsx with only one existing untracked article that has no non-zero stock anywhere
    in the tenant, and one existing shelf place. Read all stock of the article first. Copy its exact article code
    and name from the catalog and the place code from the location record. First sheet cells A1=Артикул; A2=the
    observed article code, B2=its observed name, C2=1, H2=the observed place code; all other cells blank. Save these
    exact cells as an xlsx file; no other data row. Select QOI-OU-1. Record the absence of a balance for this plain
    key as book quantity 0, before any load.
  check: runner_prepared
  detail: >-
    If no such article or place exists, or workbook creation is unavailable, BLOCKED-by-environment before any write.
    Never choose a responsible-stock article. Retain the workbook bytes and observed identifiers in evidence; create
    no new masters.
- description: >-
    No count order is open over the test key in QOI-OU-1 and its place is not frozen. Read the count-order list and
    frozen-place state before loading.
  check: runner_prepared
  detail: >-
    If a count order covers the test key, BLOCKED-by-environment before writing (a frozen place blocks the completion
    of the approval task). Do not complete or cancel somebody else's count to make this walk run.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those. Read the open tasks in My Tasks of both
    administrators at the start and note them as the baseline of foreign tasks.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Compare only what this walk did; other sessions on the same
    tenant may change other balances and tasks. Do not seed, grant roles or alter approval rules.
- description: >-
    Before loading, read Approval rules and confirm the effective stock_quick_count approve rule is ON. The opening
    rule is unrelated.
  check: runner_prepared
  detail: >-
    If the quick-count rule is OFF or cannot be read, report an environment defect (the tenant baseline is ON) and stop
    before loading. Do not reconfigure it.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator signs in to the synthetic QA tenant at 390 px, switches to Kazakh and opens the workbook import
    page.
  via: ui
- step: 2
  actor: admin
  action: >-
    Before any load, the administrator opens Balances, filters by the Item and the Location of the prepared workbook
    and the Org unit QOI-OU-1 (Responsible left on all) and records the reading of the row with an empty responsible
    slot: no row, or quantity 0, as B0 (screenshot kept). Then the administrator selects QOI-OU-1, uploads
    uat-wb-one-change.xlsx, checks that book is 0, file is 1, difference is 1 and remarks are 0, then loads the file.
    They record the document number and open its approval task in My Tasks.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator opens the approval task of their own new count in My Tasks and attempts to approve it. The panel
    shows the hint "Бұл құжатты сіз рәсімдедіңіз; оны басқа адам бекітуі керек." and the attempt is refused with
    "Бұл құжатты басқа адам бекітуі керек.". The administrator reads the load history: the load is still in the
    state "Жазылды" (issued).
  expect_refusal: true
  via: ui
- step: 4
  actor: admin2
  action: >-
    In a separate browser session, administrator 2 signs in to the same tenant at 390 px in Kazakh, opens My Tasks, finds
    the approval task of the load by its document number, claims it ("Жұмысқа алу") and completes it ("Орындау"). The
    completion text is "Бекітілді".
  via: ui
- step: 5
  actor: admin
  action: >-
    Administrator 1 opens the load history: the load is "Өткізілді" (posted). Then on Balances, with the same filters
    as in step 2, reads the row of the key (empty responsible slot) as B1 (screenshot kept). The administrator opens
    the document of the load and reads its state.
  via: ui
- step: 6
  actor: admin
  action: >-
    In the load history administrator 1 presses "Бас тарту" on the posted load, enters the reason UAT test reverse and
    confirms. The screen shows "Сторно басталды. Сторно құжаты аяқталғаннан кейін қалдықтар қайтарылады." with the link
    "Құжатты ашу", and the load shows "Сторно күтілуде". On Balances the row still reads B1 (screenshot kept).
  via: ui
- step: 7
  actor: admin2
  action: >-
    Administrator 2 opens My Tasks, finds the reverse task of this load by its document number, claims it and completes
    it. The completion text is "Сторнолады".
  via: ui
- step: 8
  actor: admin
  action: >-
    Administrator 1 reads the load history (the load is "Сторно жасалды" and has no "Бас тарту" button), reads the
    same Balances row as B2, opens My Tasks of both administrators (administrator 2 in the second session) and compares the
    open tasks with the baseline of foreign tasks, then restores English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The Kazakh check is readable at phone width and shows the balance before the load.
  verification:
    method: gui_screen
    detail: >-
      At 390 px the heading is "Excel-ден қалдықтарды жүктеу"; the org-unit label is "Бөлімше" and the check button
      is "Тексеру". The check shows book 0, file 1 and one change with no remarks. The Balances screen filtered by the
      key shows B0 as no row or quantity 0. Controls are readable and reachable.
    evidence: >-
      Screenshots of the Balances reading B0 and of the Kazakh check at 390 px, with the single change and counts.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Bookkeepers working in Kazakh on a phone cannot read or use the import check.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    Loading records an issued document and shows its link in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      After loading the Kazakh success text contains the recorded document number and the link "Құжатты ашу". The
      document is issued and not posted.
    evidence: >-
      Screenshot of the Kazakh load success, issued document and its number.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Loading a workbook does not create a document. Bookkeepers cannot apply file balances to the stock.
    suggested_action: route_to_wf03
- id: EO-003
  description: >-
    The loader cannot self-approve with the quick-count rule ON.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the Kazakh hint "Бұл құжатты сіз рәсімдедіңіз; оны басқа адам бекітуі керек." and the approval attempt ends with the refusal text "Бұл құжатты басқа адам бекітуі керек.". The document
      remains issued ("Жазылды") and the key is still at B0 on the Balances screen. No second actor is substituted.
    evidence: >-
      Task-panel hint and refusal screenshot, load history showing the issued state.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The four-eyes rule is not enforced: the person who loaded the file could approve it alone and change the stock.
    suggested_action: route_to_wf03
- id: EO-004
  description: >-
    A second administrator approves the load and it is posted.
  verification:
    method: gui_screen
    detail: >-
      Step 4: administrator 2 claims and completes the approval and the screen says "Бекітілді". Step 5: the load history
      shows "Өткізілді" and the document state is Posted (Kazakh "Өткізілген").
    evidence: >-
      Screenshots of the claim and completion by administrator 2, the load history in state posted and the document.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      An independent approver cannot post a loaded workbook, so the opening balances of the company cannot be loaded
      with two people.
    suggested_action: route_to_wf03
- id: EO-005
  description: >-
    The posted load changes only the one balance, by the file quantity, and it is visible on the Balances screen.
  verification:
    method: gui_screen
    detail: >-
      B1 on the Balances screen (filter Item, Location, Org unit; empty responsible slot) equals B0 plus the file
      quantity 1 (B0 is 0 when there was no row). Compare only this key; other balances changed by other sessions are
      not part of this check. The values come from the screen readings, not from fixed numbers.
    evidence: >-
      Balances screenshots of B0 and B1 for the same filter.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The posted load does not change the stock as the file says; the counted balance is wrong.
    suggested_action: route_to_wf03
- id: EO-006
  description: >-
    Reversing the posted load through the screens starts a reversal and leaves the balance unchanged until the reverse
    task is completed.
  verification:
    method: gui_screen
    detail: >-
      After step 6 the Kazakh text "Сторно басталды. Сторно құжаты аяқталғаннан кейін қалдықтар қайтарылады." and the
      link "Құжатты ашу" are shown, the load history shows "Сторно күтілуде", and the Balances row still reads B1.
    evidence: >-
      Screenshots of the reversal start, the load history and the Balances row.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A wrongly posted load cannot be taken back through the screens, or its balances move before the second person
      has completed the reversal.
    suggested_action: route_to_wf03
- id: EO-007
  description: >-
    After administrator 2 completes the reverse task the load is Reversed, the balance returns to the start and no task
    of this walk is pending.
  verification:
    method: gui_screen
    detail: >-
      Step 7 shows "Сторнолады". Step 8: the load history shows "Сторно жасалды" and no "Бас тарту" button; B2 on the
      Balances screen equals B0 (no row or quantity 0); My Tasks of both administrators hold no open task of this load
      and no more open tasks than the recorded baseline. English is restored.
    evidence: >-
      Screenshots of the reverse task completion, the load history in state reversed, the Balances row B2 and both
      task lists.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A posted load cannot be undone: the stock stays wrong after the correction, or a task is left hanging for
      somebody else.
    suggested_action: route_to_wf03
