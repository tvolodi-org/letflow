# T-2222 (BA, PM decision 2026-11-19): the one refusal scenario of the import group. The Excel balance load is an administrator function; since stock 0.22.0 (T-2239) it is guarded by its own permission StockWorkbookApply, which the storekeeper does not hold (the storekeeper holds StockQuickCount and counts).
# Sources opened: web/src/modules/stock/stockRoutes.tsx (admin/stock/workbook-import guarded by StockWorkbookApply); web/src/modules/stock/register/BalancesPage.tsx (the button to the load screen is for holders of StockWorkbookApply);
# lib/letflow/modules/stock/stock.ex role_grants (STOREKEEPER: StockRead, StockPost, StockReverse, StockCountOrder, StockCountRecord, StockQuickCount; no StockWorkbookApply, no StockReconcile); web/src/modules/stock/workbook/workbookMessages.ts ('stock.wb.balancesLink': Load balances from Excel);
# web/src/components/ui/feedbackMessages.ts (permissionDenied text).
# Read-only: nothing is loaded, nothing is written.
# T-2267 code-reading pass (PM 2026-11-19), EXPECTATION CORRECTIONS 2: (1) the refusal does not rest on the quick-count right alone: after T-2239 the storekeeper also holds StockQuickCount and CodesRead and the load gets its own permission, so the scenario expects the load refused whichever right guards it (target behavior); today main guards the screen and the load route with StockQuickCount (stock.ex role_grants, stockRoutes.tsx); (2) the check route needs only StockRead, so the storekeeper's refusal is of the screen and the load, not of reading balances.
---
id: qoimeks-import-6-storekeeper-refused-excel-load
scope: qoimeks-qa2
title: >-
  The storekeeper is not offered the button "Load balances from Excel" and is refused its screen when typed by hand
version: '1.1'
tags:
- qoimeks
- stock
- workbook
- refusal
- storekeeper
- desktop
- read_only
description: >-
  The storekeeper (a role without the right to load balances from Excel; today the quick count right guards the load, after T-2239 the load has its own permission) signs in at 1440 px in English and opens Balances. The button "Load balances from Excel" is not there for
  a user who does not hold the quick count right. The storekeeper then types the address of the load screen
  (the path /admin/stock/workbook-import) and gets the message "You do not have access to this area. Contact your tenant administrator."
  with no upload field. Nothing is loaded or changed.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The storekeeper account can sign in on https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2 and the stock module is active.
  check: runner_prepared
  detail: >-
    If sign-in fails, report BLOCKED-by-environment and name the account; credentials come from the acceptance credential source.
- description: >-
    The run can drive a real browser at 1440 px in English.
  check: runner_prepared
  detail: >-
    If no browser can be started, report BLOCKED-by-environment.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper signs in, opens Balances from the stock navigation and reads the buttons above the list.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper types the address of the load screen (the path /admin/stock/workbook-import of the tenant host) into the browser.
  expect_refusal: true
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The Excel load is not offered to the storekeeper.
  verification:
    method: gui_screen
    detail: >-
      Step 1 shows the Balances screen without the button "Load balances from Excel".
    evidence: >-
      Screenshot of step 1.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A clerk would be offered a load that replaces balances for the whole warehouse, or the role does not match the product's own permission table.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The load screen is refused when typed by hand and shows no upload field.
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows the message "You do not have access to this area. Contact your tenant administrator." and no file drop zone, no org unit select and no "Check" button.
    evidence: >-
      Screenshot of step 2.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A warehouse clerk could load a workbook that changes the stock balances of the tenant.
    suggested_action: route_to_frontend_dev
