# T-0825 (BA): WMS procurement slice 1, scenario 1: a requester saves a purchase request; wrong or incomplete requests and wrong roles are refused.
# Covers REQ-544 criterion 1 (mandatory fields, lines, kinds, work/service extras), criterion 2 (exact totals; a client total that differs is refused),
# criterion 3 (unknown unit or department), criterion 10 (only holders of the procurement write permission; others are refused).
# Sources: docs/requirements.yaml REQ-544 criteria 1, 2, 3, 10; lib/letflow/modules/procurement/router.ex (moduledoc: POST creates, 201 / 404 / 422; the requester is the signed-in user,
# never taken from the body); lib/letflow/modules/procurement/purchase_request.ex (moduledoc: error codes required, invalid, unknown, retired, mismatch; field names such as lines[2].quantity;
# priorities low, normal, high, urgent; kinds material, work, service); lib/letflow/modules/procurement/procurement.ex (moduledoc: in this slice only TENANT_ADMIN and platform administrator
# hold the write, read and decide permissions); lib/letflow/routers/tenant_modules.ex (POST installs a module, ModulesManage); docs/roles.md.
#
# SCREEN GAP (stated, not invented): REQ-544 is a backend slice. grep of web/src finds no purchase request screen, no procurement menu entry, and no module install screen. Every step is
# therefore an API step (via: api); nothing in this scenario can be clicked in a browser on QA today. The owner script (task folder owner-script.md) says the same.
# ROSTER GAP: the roster has no requester-only and no approver account. The permission is held by TENANT_ADMIN only, so the requester here is the SwiftRoute administrator.
# NOT UAT-observable, left to the product's own tests: the exact stored totals of 3 x 0.10 and 2 x 19.99 are read back here through the create answer (step 2); the decimal-precision caps
# (quantity below 1,000,000, cost below 1,000,000,000, four decimals, 200 lines) are covered by the module's unit tests; retired (as opposed to unknown) unit or department needs a deactivated master record the QA tenant does not have.
---
id: wms-procurement-1-purchase-request-create-and-validation
scope: wms-procurement
title: A requester saves a purchase request with calculated totals; incomplete, mismatched or unauthorized requests are refused and nothing is saved
version: "1.0"
tags: [wms, procurement, purchase-request, validation, totals, permissions]

description: >
  SwiftRoute has the procurement module installed, with the organisation and item catalog modules it depends on. The company administrator, acting as the requester, saves a purchase request
  for two material lines (3 pieces at 0.10 and 2 pieces at 19.99) and a service line. The system calculates every line total and the request total exactly (0.30, 39.98 and the service line
  total, sum shown) and the request is saved as a draft with a document id and version 1. A request that lacks a mandatory field, has no lines, names an unknown unit or department, has a
  service line without scope, deliverables or completion date, or states a total that differs from the calculated one is refused with a list of the problems and nothing is saved. A task
  worker, who does not hold the procurement permission, is refused and cannot tell whether any request exists.

actors:
  requester: actor-swiftroute-alice
  worker: actor-swiftroute-marco

preconditions:
  - description: The procurement module is installed and active for SwiftRoute (the administrator installs it with the company's own module install request, no database or Keycloak edit), together with the modules it depends on.
    check: system_seeded
    detail: If the module is not in the shipped catalog of the QA build, report BLOCKED for the whole scenario. Installing is an API step; no install screen exists (gap).
  - description: SwiftRoute has at least one active unit of measure in the item catalog and at least one active organisation unit. The runner notes their ids as UNIT and DEPT.
    check: system_seeded
    detail: Created through the company's own administration of those two modules. If none can be prepared, report BLOCKED for steps 2 to 8.
  - description: SwiftRoute's administrator holds TENANT_ADMIN and the worker holds TASK_WORKER only; neither holds an extra procurement grant.
    check: system_seeded
    detail: Per the actor roster.

steps:
  - step: 1
    actor: requester
    action: >
      The requester notes the module list of the company, installs the procurement module if it is not listed (reason text "UAT - procurement slice 1"), and asks for the list again.
    via: api
  - step: 2
    actor: requester
    action: >
      The requester saves a purchase request: department DEPT, justification "UAT office supplies and cleaning", required date 2026-12-15, priority "normal", and three lines.
      Line 1 material "Pen", quantity 3, unit UNIT, estimated unit cost 0.10. Line 2 material "Folder", quantity 2, unit UNIT, estimated unit cost 19.99. Line 3 service "Window cleaning",
      quantity 1, unit UNIT, estimated unit cost 100.00, scope "Ground floor windows", deliverables "Cleaned windows, signed sheet", completion date 2026-12-10. No totals are sent.
      The answer is noted as R1 (document id, version, status, saved content).
    via: api
  - step: 3
    actor: requester
    action: >
      The requester reads the request R1 by its document id and notes the answer as R1b.
    via: api
  - step: 4
    actor: requester
    action: >
      The requester saves the same request as in step 2 but sends a request total of 1.00 (the calculated total is different). The answer is noted.
    expect_refusal: true
    via: api
  - step: 5
    actor: requester
    action: >
      The requester saves a request with no lines and no justification, priority "normal", department DEPT, required date 2026-12-15. The answer is noted.
    expect_refusal: true
    via: api
  - step: 6
    actor: requester
    action: >
      The requester saves a request with one service line that has no scope, no deliverables and no completion date, and a second line with quantity 0. The answer is noted.
    expect_refusal: true
    via: api
  - step: 7
    actor: requester
    action: >
      The requester saves a request whose department is an id that does not exist in the company, and whose only line names a unit id that does not exist. The answer is noted.
    expect_refusal: true
    via: api
  - step: 8
    actor: worker
    action: >
      The task worker tries to save a valid purchase request (the same content as step 2) and then asks for R1 by its document id. Both requests are made; both must be refused.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: The procurement module is installed for SwiftRoute and a valid request is saved as a draft with exact calculated totals.
    verification:
      method: api_response
      detail: Step 1 leaves "procurement" in the module list. Step 2 answers 201 with a document id, version 1, status "draft". The saved content shows line totals 0.30, 39.98 and 100.00 and a request total of 140.28, with the requester equal to the administrator's own user id (not sent in the request).
      evidence: Module list after step 1 and the answer R1.
    on_fail:
      severity: MAJOR
      business_impact: A requester cannot raise a purchase request, or the money amounts shown to approvers are wrong.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: Reading the saved request returns the same content and totals.
    verification:
      method: api_response
      detail: Step 3 answers 200 for the requester, with the same document id and the same line and request totals as R1.
      evidence: R1 and R1b side by side.
    on_fail:
      severity: MAJOR
      business_impact: What the requester saved is not what is later shown for approval.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: A total that differs from the calculated one is refused and nothing is saved.
    verification:
      method: http_status
      detail: Step 4 answers 422 with the reason "validation" and an error list that names the total with the code "mismatch". The answer carries no document id, so no document was created by the refused request.
      evidence: The answer of step 4.
    on_fail:
      severity: MAJOR
      business_impact: A wrong amount can be put in front of approvers.
      suggested_action: route_to_elixir_dev
  - id: EO-004
    description: A request without mandatory fields or lines, with a service line missing its extras, or with a non-positive quantity is refused with each problem named.
    verification:
      method: http_status
      detail: Step 5 answers 422 and the error list names "lines" with code "required" and "justification" with code "required". Step 6 answers 422 and names the service line's scope, deliverables and completion date (field names under lines[1]) with code "required" and lines[2].quantity with code "invalid". No document is created by steps 5 and 6.
      evidence: The answers of steps 5 and 6.
    on_fail:
      severity: MAJOR
      business_impact: Incomplete purchase requests reach approvers.
      suggested_action: route_to_elixir_dev
  - id: EO-005
    description: A department or unit that is not in the company's masters is refused.
    verification:
      method: http_status
      detail: Step 7 answers 422 and names "department_id" and the line's unit field with code "unknown". The submitted ids are not echoed in the body.
      evidence: The answer of step 7.
    on_fail:
      severity: MAJOR
      business_impact: Purchase requests are raised against departments or units that do not exist.
      suggested_action: route_to_elixir_dev
  - id: EO-006
    description: A worker without the procurement permission cannot create or read a request, and the answer does not reveal whether R1 exists.
    verification:
      method: http_status
      detail: Step 8 create answers 403 (permission gate). Step 8 read of R1 answers 403 as well, identical in status and body (without the trace id) to a read of a document id that never existed.
      evidence: Both answers of step 8 and the answer for an absent id.
    on_fail:
      severity: BLOCKER
      business_impact: A person with no procurement role can raise requests or learn that a request exists.
      suggested_action: route_to_security_review
