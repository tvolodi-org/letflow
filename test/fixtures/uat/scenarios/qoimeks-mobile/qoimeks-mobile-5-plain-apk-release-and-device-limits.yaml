# T-2165 (BA): Qoimeks QA walk, the plain Android APK: what a browser can observe (the published release record and the APK file). QA only, no real data, no production.
# Covers: REQ-868 (signed Android release build, APK and AAB, release record latest.json, release runbook docs/runbooks/mobile-android-release.md; merged as build commit b8a8285de).
#   REQ-869 (update banner and "Check for updates") is CANCELLED (owner 2026-11-16): there is no update banner in the app; a phone updates by installing the newer APK over the old one (docs/runbooks/mobile-android-release.md, opening paragraph). Nothing here expects one.
# NOT UAT-OBSERVABLE (the install and the sign-in on the phone), with the reason for each - the run is a desktop browser and has no phone or emulator:
#   (a) Installing the APK on an Android phone ("allow installs from this source", package install): a device action.
#   (b) Signing in inside the Android app (identity redirect com.bizdala.letflow:/oauth2redirect, docs/runbooks/mobile-web-pwa-signin.md first paragraph): needs the installed app.
#   (c) Installing a newer APK over an older one and keeping saved drafts: needs two APKs on a device.
#   (d) Camera scan and voice in the app: need a device camera and microphone.
#   (e) Which key signed the APK: the apksigner check is run by the release script on the build machine (docs/runbooks/mobile-android-release.md section 2); it is not visible in a browser. This scenario checks only the published files.
#   The observable check for (a) to (d) is a person with an Android phone following docs/runbooks/mobile-android-release.md section 4 (install on a phone) by hand; the team does not run it, and this scenario does not claim it passed.
# The download address is given by the operator (infra): https://pwa.letflow.qa.bizdala.com/android/. If it does not answer, the whole scenario is BLOCKED, not passed.
# T-2192 rework (issue 4722; PM/infra 2026-11-19): checks: 1 scope qoimeks-qa2 exists; 2 actor actor-qoimeks-qa2-storekeeper (browser/HTTP client only; no sign-in is needed for the release page); 3 host https://pwa.letflow.qa.bizdala.com/android/ ;
# 4 data: no tenant data; the release files are published (read 2026-11-19), the scenario is BLOCKED-by-environment only if they stop answering; 5 browser and download steps; 6 uat.sh preflight not run by the writer (no QA credentials).
# T-2264 code-reading pass (group check lines are in file 1 of this group). EXPECTATION CORRECTIONS in this file: 4.
#   (1) the APK file name is no longer hard-coded: it is read from the url of latest.json and must have the form <prefix>-<versionName>-<versionCode>.apk with the record's own values (docs/runbooks/mobile-android-release.md, --name-prefix);
#   (2) the release is published (latest.json, the APK and its checksum file answered 200 on 2026-11-19), so the "BLOCKED-by-environment until the owner builds it" statement is replaced by: BLOCKED only if latest.json or the APK does not answer;
#   (3) the release notes are all empty strings today (issue 4772, next rebuild), so the notes check applies only when a note is not empty; empty notes are recorded, never failed;
#   (4) the checksum file holds the hexadecimal value alone, the record's sha256 equals it: both read at run time.
---
id: qoimeks-mobile-5-plain-apk-release-and-device-limits
scope: qoimeks-qa2
title: The QA download location of the plain Android APK publishes a readable release record and an APK whose checksum matches, and the on-phone install and sign-in are recorded as not observable here
version: "1.0"
tags: [qoimeks, mobile, apk, android, release, download, not_uat_observable]

description: >
  A person opens the QA download location of the Letflow Android app in a browser (window 390 px wide, then 1440 px) and reads the release record file latest.json:
  the version code and version name, the address of the APK, its checksum, the minimum version code, the release notes in Russian, Kazakh and English, and the publish time (UTC).
  They then download the APK that the record points to (the file name is read from the record), compute its SHA-256 checksum, and compare it with the checksum in the record and in the file next to the APK (the file with the same name and the ending .sha256).
  They check that the address of the APK is https, that the file name carries the version name and version code of the record, and that the release record's notes read in the three languages without cut-off at the narrow window.
  Nothing is installed and nobody signs in: see the list in the header. Cleanup: the downloaded APK is deleted from the run's folder at the end; nothing on the tenant is changed.

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The plain Android release is published at https://pwa.letflow.qa.bizdala.com/android/ (latest.json, the APK file whose name latest.json gives, and the same name with .sha256; the PWA itself is at https://pwa.letflow.qa.bizdala.com/) and is a build made after the G16 change (published on 2026-11-19; BLOCKED-by-environment only if the files do not answer, issue 4722).
    check: system_seeded
    detail: >-
      Precondition check, read-only: latest.json at https://pwa.letflow.qa.bizdala.com/android/latest.json answers 200, and the APK file name it gives answers 200.
      The files in release-out/ dated 2026-10-29 and 2026-10-30 are older than G16 and were built for the base address qoimeks-qa2.ai-dala.com: they are not a valid release for this scenario; a latest.json that names such a build, or one that does not answer, means BLOCKED-by-environment (name issue 4722).
      The owner builds a release by docs/runbooks/mobile-android-release.md section 2 with --base-url https://pwa.letflow.qa.bizdala.com/android/ --api-base-url https://qa.bizdala.com --platform-host qa.bizdala.com --first-release. Do not substitute another location and do not build the app in the run.
  - description: The run can drive a real browser at window widths of 390 px and 1440 px, can download a file, and can compute a SHA-256 checksum of a downloaded file.
    check: system_seeded
    detail: If a file cannot be downloaded, report BLOCKED for steps 3 and 4.

steps:
  - step: 1
    actor: storekeeper
    action: >
      In a window 390 px wide the storekeeper opens the address https://pwa.letflow.qa.bizdala.com/android/latest.json and reads the text.
    via: ui
  - step: 2
    actor: storekeeper
    action: >
      The storekeeper opens the same file in a window 1440 px wide and reads the text.
    via: ui
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper opens the checksum file (the APK's file name followed by .sha256) in the browser and reads it, then downloads the APK from the address in latest.json and computes the SHA-256 checksum of the downloaded file.
    via: ui
  - step: 4
    actor: storekeeper
    action: >
      The storekeeper deletes the downloaded APK from the run's folder.
    via: ui

expected_outcomes:
  - id: EO-001
    description: The release record is readable and complete.
    verification:
      method: file_content
      detail: Steps 1 and 2 show a JSON text with exactly the keys versionCode, versionName, url, sha256, minVersionCode, notes (with exactly the keys ru, kk and en) and published; versionCode and minVersionCode are whole numbers, minVersionCode is not above versionCode, url starts with https://, published is a UTC time. The text is readable at 390 px without a script error page.
      evidence: Saved text of latest.json and screenshots of steps 1 and 2.
    on_fail:
      severity: MAJOR
      business_impact: Infra and the next release cannot tell which build is published, and the next release cannot refuse an old version code.
      suggested_action: route_to_mobile_dev
  - id: EO-002
    description: The APK file name matches the record and the checksum matches the file.
    verification:
      method: file_content
      detail: The file name is read from url (never hard-coded in the run) and has the form <prefix>-<versionName>-<versionCode>.apk with the versionName and versionCode of the same record, and the file answers 200; the checksum file holds the same hexadecimal value as the record's sha256; the SHA-256 computed in step 3 equals that value.
      evidence: The three checksum values side by side in the run's report.
    on_fail:
      severity: BLOCKER
      business_impact: A phone could install a file that is not the one that was published (damaged or replaced).
      suggested_action: route_to_security_reviewer
  - id: EO-003
    description: The release notes read in three languages.
    verification:
      method: file_content
      detail: >-
        The run reads the ru, kk and en notes. A note that is not empty is text in its own language (the wording is not asserted) and holds no raw placeholder. A note that is empty is recorded as "no notes published" and is not a failure (the notes come with the next rebuild, issue 4772); the check applies only to notes that exist.
      evidence: The notes text in the run's report.
    on_fail:
      severity: MINOR
      business_impact: The person who hands the APK to storekeepers has no notes in their language.
      suggested_action: log_for_owner
  - id: EO-004
    description: The install and sign-in on the phone are recorded as not observed.
    verification:
      method: file_content
      detail: The run's report lists items (a) to (e) of this scenario's header as "not UAT-observable" with the reason, and does not mark them passed.
      evidence: The run's report.
    on_fail:
      severity: MINOR
      business_impact: The release is described as tested on a phone when nobody did.
      suggested_action: log_for_owner
