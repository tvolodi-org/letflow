# T-2165 (BA): Qoimeks QA walk, quick count at phone width (390 px) and at desktop width (1440 px). QA only, SYNTHETIC stock data, no real data, never the real Qoimeks tenant.
# Covers: REQ-854 (module stock quick count: one line sets the balance of one item at one place to the counted quantity; merged as build commit bbd6266d3),
#   REQ-855 (the web Quick count screen: book quantity, counted quantity, difference, reason, result, four-eyes hint; merged as build commit b890bae04).
#   REQ-856 (a phone-app Quick count screen with voice) is CANCELLED (owner 2026-11-16: typed count only), so "quick count on a phone" is the web screen at phone width in the phone's browser; the Android app and the PWA have no quick count screen
#   (grep of apps/mobile/lib for "quick" on origin/main finds only the formal-count files count_*.dart and stock_*.dart, none a quick count screen).
#   G15 voice (REQ-862 letter-name table, merged as build commit ac29bac1e; REQ-863 ElevenLabs provider, merged as build commit df10c01d2) acts on the voice draft of stock documents and counts, not on a quick count: not exercised here.
# Coverage notes (cases outside this walk and environment requirements):
#   (a) Voice (speaking a count phrase): needs a microphone and a speech provider key; and the quick count has no voice input after REQ-856 was cancelled.
#   (b) Scanning an item code with a phone camera into the item field: needs a camera; the screen also takes a typed code or a keyboard scanner, which is what this scenario types.
#   (c) Posting the count (balance becomes the counted number): with four eyes on, a second user must approve, and the second user would be actor-qoimeks-qa2-admin (not used in this phone walk, which runs as the storekeeper only); this phone walk cancels its draft, so the posted balance, the movement entry and the reversal are NOT walked here; they are covered by tests of REQ-854 criteria 1, 2, 5 and 12.
#   (d) A quick count refused count_in_progress or location_frozen: needs a formal count order opened on the synthetic data; not created by this scenario (it must not change counts of the tenant).
# Cleanup: every run of this scenario issues exactly one quick count document and ends by cancelling it with the reason "UAT T-2165 cleanup". Cancelled documents cannot be deleted by the product: the document number and the cancel reason are written in the run's report. The balance of the key is never changed.
# T-2204 rework (issue 4720, task #4740): the Quick count form has a 'Responsible employee' selector (default 'Unassigned stock'). Every seeded balance carries a responsible employee, so the run chooses the responsible of the Balances row it noted and compares B for that same key; there is no B = 0 fallback and no plain-key precondition.
# T-2264 code-reading pass (group check lines are in file 1 of this group). EXPECTATION CORRECTIONS in this file: 5.
#   (1) the storekeeper holds StockQuickCount (and CodesRead) after T-2239: the scenario is written for that TARGET behaviour, the old "expected to be refused" expectation is removed (open defect issue 4764);
#   (2) four-eyes is ON for the quick count in the tenant (tenant state), so the old "if an Approve button appears the switch is off, report BLOCKED" branch is removed: the counter is never offered Approve, an offered Approve is the defect of EO-004;
#   (3) a recorded quick count is in state Issued (waiting for the approval task) and the storekeeper can cancel it (cancel needs StockReverse and a reason TEXT only; the cancel dialog has no reason list), the steps and EO-006 say so;
#   (4) the "QOI-OU-1 is the only org unit" claim is removed: the org unit is read from the chosen Balances row at run time;
#   (5) no balance number is fixed: B is read from the Balances row at the start (Balances screen, Responsible column).
# Checks: 1 scope qoimeks-qa2 exists; 2 actor actor-qoimeks-qa2-storekeeper (STOREKEEPER, with StockQuickCount after T-2239); 3 the tenant host and the web Quick count screen exist (route admin/stock/quick-count), the Responsible column exists on the balances screen (stock.col.responsible);
# 4 data: read at the start, handled by precondition 1 (the form's Responsible employee selector is set to the employee of the chosen row); 5 executable with a browser script; 6 uat.sh preflight not run by the writer (no QA credentials). The independent HTTP 500 finding of issue 4720 is a product finding, not touched here.
---
id: qoimeks-mobile-3-quick-count-on-phone-width
scope: qoimeks-qa2
title: The Qoimeks QA storekeeper records one quick count at a phone width of 390 px and at 1440 px, sees the book quantity and the difference before and after submitting, cannot approve their own count alone, and cancels the test count
version: "1.0"
tags: [qoimeks, mobile, quick_count, phone, responsive, stock, refusal, cleanup]

description: >
  The Quick count form has a selector "Responsible employee" (default "Unassigned stock"); the count it submits is for the balance row of the chosen employee, and its book quantity is the quantity of that row only (a row held by another employee, or unassigned, is a different row).
  The storekeeper therefore looks up, on the stock balances screen, one item at one place and org unit and notes the row to count: its Responsible employee and its quantity B (every seeded balance carries a responsible employee, so the row to count is the employee-assigned one; never read the stock without a responsible as B).
  Then, at a window 390 px wide, they open the Quick count screen from the navigation (the button that unfolds it), choose the same item, place and org unit and the same Responsible employee, and read the book quantity the form shows, which must equal B.
  They type a counted quantity of B plus 1 and read the difference the form shows (1), choose the reason "Recount" and press "Submit count". The screen then shows "Count recorded" with the document number, the book quantity B,
  the counted quantity B plus 1, the difference 1 and the state, and tells that a second person approves the count in My Tasks. The storekeeper tries to approve their own count in My Tasks and is not allowed (four eyes: a person cannot approve what they counted).
  The balances screen still shows B for the row of that employee, and the other rows of the item unchanged (nothing is posted until a second person approves). The storekeeper opens the stock documents screen, opens the quick count document and cancels it with the reason "UAT T-2165 cleanup"; it reads Cancelled.
  The whole run is repeated at 1440 px. Screens fit the 390 px width: nothing is cut off, no sideways scrolling is needed, no two controls overlap, and the form fields and buttons can be reached with a thumb-sized tap target.

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The Qoimeks QA tenant holds the synthetic stock data (read the item, place and balance counts at the start of the run and record them; the seed changes them), the stock module is active, and one balance row that is not lot-tracked or serial-tracked and has a positive quantity can be chosen.
    check: system_seeded
    detail: >
      Every posted balance of the baseline carries a responsible employee. The run reads the balances screen (Responsible column) and chooses one positive row of an item that is not lot-tracked or serial-tracked; B is that row's quantity and its Responsible employee is chosen in the form's "Responsible employee" selector, so the form submits the key of that row (issue 4720, task 4740).
      The run records the combination, its Responsible employee, B, and every other row of the item at that place with its Responsible value. The quick count refuses serial-tracked items and needs a lot for lot-tracked ones; pick another row in that case. If no positive row of such an item exists, report BLOCKED-by-environment; never use a row without a responsible, never set B to 0.
  - description: The storekeeper's account holds the stock quick count permission (since stock 0.22.0, T-2239 merged) and the quick count has four-eyes ON in this tenant (tenant state of the acceptance environment).
    check: system_seeded
    detail: >-
      The permission StockQuickCount is in the STOREKEEPER role_grants of the stock module since 0.22.0 (lib/letflow/modules/stock/stock.ex, T-2239, issue 4764, merged). The storekeeper sees "Quick count" in the navigation. If the entry or screen is missing or refused for the storekeeper, report that PRODUCT defect and do not move the step to the administrator. Four-eyes is ON for the quick count in this tenant (the opening approval is OFF); the result screen of step 5 therefore shows the second-person hint, never an Approve button for the counter; an Approve button for the counter is the defect of EO-004: do not press it, report it, and carry on with the cancel in step 8.
  - description: No formal count order is open on the chosen item's place and org unit, and the place is not frozen.
    check: system_seeded
    detail: If the submit is refused with a message about a count in progress or a frozen place, choose another place and report the refusal as a finding.
  - description: The run can drive a real browser at window widths of 390 px and 1440 px, English language, and takes screenshots.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the whole scenario.

steps:
  - step: 1
    actor: storekeeper
    action: >
      In a window 390 px wide the storekeeper signs in on the tenant's own address (https://qoimeks-qa2.letflow.qa.bizdala.com), opens the stock balances screen through the navigation, chooses an item at a place and org unit as the precondition describes (not lot-tracked), and notes the item, the place, the org unit, the Responsible employee of the row and B (the quantity of that row), and every other row of the combination with its Responsible value and quantity.
    via: ui
  - step: 2
    actor: storekeeper
    action: >
      The storekeeper opens the navigation and chooses "Quick count", and reads the empty form.
    via: ui
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper chooses the noted item, the noted place, the noted org unit and the noted Responsible employee, and reads what the form shows below the fields.
    via: ui
  - step: 4
    actor: storekeeper
    action: >
      The storekeeper types the counted quantity B plus 1 (for example 11 when B is 10), reads the difference, chooses the reason "Recount" and presses "Submit count".
    via: ui
  - step: 5
    actor: storekeeper
    action: >
      The storekeeper reads the result that appears.
    via: ui
  - step: 6
    actor: storekeeper
    action: >
      The storekeeper opens My Tasks, finds the approval task of the count just recorded, and tries to approve it (complete it as approved) themselves.
    expect_refusal: true
    via: ui
  - step: 7
    actor: storekeeper
    action: >
      The storekeeper opens the stock balances screen again and reads the quantity of the noted item at the noted place and org unit for the noted Responsible employee.
    via: ui
  - step: 8
    actor: storekeeper
    action: >
      The storekeeper opens the stock documents screen, opens the quick count document by its number (it reads Issued), presses "Cancel document", types the reason text "UAT T-2165 cleanup" (the cancel dialog asks for a reason text only; an empty text is refused) and confirms.
    via: ui
  - step: 9
    actor: storekeeper
    action: >
      The storekeeper repeats steps 1 to 8 in a window 1440 px wide (a second quick count document, cancelled in the same way).
    via: ui

expected_outcomes:
  - id: EO-001
    description: The Quick count screen can be reached and used at a phone width.
    verification:
      method: gui_screen
      detail: At 390 px step 2 shows the title "Quick count" with the line "Count a single item at a location and record the actual quantity.", and the fields Item, Location, Org unit, Responsible employee, Counted quantity, Reason and the button "Submit count"; the text is inside the 390 px width, there is no horizontal scroll bar, no two controls overlap, and each field and button can be tapped.
      evidence: Screenshots of steps 2, 3, 4 and 5 at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: A storekeeper with a phone in the aisle cannot enter a count.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The form shows the book quantity of the chosen key and the difference of the typed count before submitting.
    verification:
      method: gui_screen
      detail: After step 3 the form shows "Book quantity" equal to B (the quantity of the row of the chosen Responsible employee noted in step 1); after step 4 it shows "Difference" equal to 1 (a plain number, 1 or 1.000 - compared as a number).
      evidence: Screenshots of steps 3 and 4.
    on_fail:
      severity: MAJOR
      business_impact: The counter does not see how far the book is from the shelf, and may confirm a wrong number.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: Submitting records one quick count document with the right numbers and says who must approve.
    verification:
      method: gui_screen
      detail: >-
        Step 5 shows "Count recorded" with a document number (a number starting with QCT), "Book quantity" B, "Counted quantity" B plus 1, "Difference" 1, a state, and the four-eyes hint "A second person needs to approve this count in My Tasks." (REQ-855 criterion 5); the alternative text "This count is waiting for approval. Open My Tasks to approve it." is a FAIL; no error banner. Before step 5 the run also notes T, the total of every Balances row of the item at that place and org unit (all Responsible values). REQ-854 sets the item/place total to the counted number when a count is posted: when T equals B the count ends with the total equal to the counted number; if T differs from B (stock split over several Responsible rows) the run records "split stock" and expects the submit to be refused with nothing stored (no document, no number) instead of a result that would leave a total of old plus counted; this walk does not post, so the posted total is covered by qoimeks-count-3.
      evidence: Screenshot of step 5, and the document number written in the run's report.
    on_fail:
      severity: MAJOR
      business_impact: A recorded count is lost or shows wrong numbers, so stock is corrected on a false basis.
      suggested_action: route_to_elixir_dev
  - id: EO-004
    description: The storekeeper cannot approve their own count alone.
    verification:
      method: gui_screen
      detail: In step 6 the approval is not completed - the Approve control is missing or disabled with a hint, or pressing it returns a refusal of separation of duties; the task stays open and the document stays not posted. Either form is accepted and the run records which one appeared.
      evidence: Screenshot of step 6.
    on_fail:
      severity: BLOCKER
      business_impact: One person could change stock numbers alone, which the company's four-eyes rule for counts forbids.
      suggested_action: route_to_security_reviewer
  - id: EO-005
    description: An unapproved count does not change the stock balance.
    verification:
      method: gui_screen
      detail: Step 7 shows B for the row of the noted Responsible employee and the other rows with the quantities noted in step 1; no new movement is added by the unapproved count.
      evidence: Screenshot of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: A count that nobody approved has already changed the stock numbers.
      suggested_action: route_to_elixir_dev
  - id: EO-006
    description: The test count is cancelled and leaves the stock as found.
    verification:
      method: gui_screen
      detail: After step 8 the document reads "Cancelled" and the balances screen still shows the same rows and quantities as in step 1. The same holds after step 9 for the second document at 1440 px.
      evidence: Screenshots of step 8 and of the balances screen afterwards; the two document numbers in the run's report.
    on_fail:
      severity: MINOR
      business_impact: A test count stays open and a later real approval would post a test number into the stock.
      suggested_action: route_to_frontend_dev
  - id: EO-007
    description: The 1440 px run gives the same results as the 390 px run.
    verification:
      method: gui_screen
      detail: In step 9 the book quantity, difference, result numbers, refusal and cancel behave as in steps 2 to 8; the form is laid out for the wider window without cut-off text.
      evidence: Screenshots of the same steps at 1440 px.
    on_fail:
      severity: MINOR
      business_impact: The desktop screen differs from the phone one and trainers cannot use one description for both.
      suggested_action: route_to_frontend_dev
