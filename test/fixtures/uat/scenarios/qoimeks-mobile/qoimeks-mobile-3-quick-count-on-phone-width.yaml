# T-2165 (BA): Qoimeks QA walk, quick count at phone width (390 px) and at desktop width (1440 px). QA only, SYNTHETIC stock data, no real data, never the real Qoimeks tenant.
# Covers: REQ-854 (module stock quick count: one line sets the balance of one item at one place to the counted quantity; merged as build commit bbd6266d3),
#   REQ-855 (the web Quick count screen: book quantity, counted quantity, difference, reason, result, four-eyes hint; merged as build commit b890bae04).
#   REQ-856 (a phone-app Quick count screen with voice) is CANCELLED (owner 2026-11-16: typed count only), so "quick count on a phone" is the web screen at phone width in the phone's browser; the Android app and the PWA have no quick count screen
#   (grep of apps/mobile/lib for "quick" on origin/main finds only the formal-count files count_*.dart and stock_*.dart, none a quick count screen).
#   G15 voice (REQ-862 letter-name table, merged as build commit ac29bac1e; REQ-863 ElevenLabs provider, merged as build commit df10c01d2) acts on the voice draft of stock documents and counts, not on a quick count: not exercised here.
# Not UAT-observable, with reasons:
#   (a) Voice (speaking a count phrase): needs a microphone and a speech provider key; and the quick count has no voice input after REQ-856 was cancelled.
#   (b) Scanning an item code with a phone camera into the item field: needs a camera; the screen also takes a typed code or a keyboard scanner, which is what this scenario types.
#   (c) Posting the count (balance becomes the counted number): with four eyes on, a second user must approve, and the roster has one account for this tenant (actor-qoimeks-qa-admin) - so the posted balance, the movement entry and the reversal are NOT walked here; they are covered by tests of REQ-854 criteria 1, 2, 5 and 12.
#   (d) A quick count refused count_in_progress or location_frozen: needs a formal count order opened on the synthetic data; not created by this scenario (it must not change counts of the tenant).
# Cleanup: every run of this scenario issues exactly one quick count document and ends by cancelling it with the reason "UAT T-2165 cleanup". Cancelled documents cannot be deleted by the product: the document number and the cancel reason are written in the run's report. The balance of the key is never changed.
# T-2192 rework (issue 4720): the book quantity is compared for the SAME key the form submits (item, place, org unit, no responsible employee), see the description and precondition 1; employee-assigned stock is never substituted.
# Checks: 1 scope qoimeks-qa exists; 2 actor actor-qoimeks-qa-admin (TENANT_ADMIN; no lower-role claim for quick count is made); 3 the tenant host and the web Quick count screen exist; the Responsible column exists on the balances screen (stock.col.responsible);
# 4 data: the synthetic balances all carry a responsible employee, handled by precondition 1 (B = 0 case); 5 executable with a browser script; 6 uat.sh preflight not run by the writer (no QA credentials). The independent HTTP 500 finding of issue 4720 is a product finding, not touched here.
---
id: qoimeks-mobile-3-quick-count-on-phone-width
scope: qoimeks-qa
title: The Qoimeks QA administrator records one quick count at a phone width of 390 px and at 1440 px, sees the book quantity and the difference before and after submitting, cannot approve their own count alone, and cancels the test count
version: "1.0"
tags: [qoimeks, mobile, quick_count, phone, responsive, stock, refusal, cleanup]

description: >
  The Quick count form has no field for a responsible employee: the count it submits is for the slot with NO responsible employee, and its book quantity is the quantity of that slot only (a balance held under an employee is a different slot and is not counted).
  The administrator therefore looks up, on the stock balances screen, one item at one place and org unit, and notes B: the quantity of the row that has an empty Responsible column; if the combination has no such row, B is 0. A combination with a positive row without a responsible employee is preferred; employee-assigned rows of the same combination are noted too and are never used as B.
  Then, at a window 390 px wide, they open the Quick count screen from the navigation (the button that unfolds it), choose the same item, place and org unit, and read the book quantity the form shows, which must equal B.
  They type a counted quantity of B plus 1 and read the difference the form shows (1), choose the reason "Recount" and press "Submit count". The screen then shows "Count recorded" with the document number, the book quantity B,
  the counted quantity B plus 1, the difference 1 and the state, and tells that a second person approves the count in My Tasks. The administrator tries to approve their own count in My Tasks and is not allowed (four eyes: a person cannot approve what they counted).
  The balances screen still shows B for the row without a responsible employee, and the employee-assigned rows unchanged (nothing is posted until a second person approves). The administrator opens the stock documents screen, opens the quick count document and cancels it with the reason "UAT T-2165 cleanup"; it reads Cancelled.
  The whole run is repeated at 1440 px. Screens fit the 390 px width: nothing is cut off, no sideways scrolling is needed, no two controls overlap, and the form fields and buttons can be reached with a thumb-sized tap target.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant holds the synthetic stock data (142 places, 666 items, 603 posted opening balances), the stock module is active, and one item/place/org unit combination that is not lot-tracked or serial-tracked can be chosen.
    check: system_seeded
    detail: >
      All 603 opening balances carry a responsible employee (QOI-OU-1 is the only org unit), and the form submits no responsible employee, so a positive row WITHOUT a responsible employee does not exist on the synthetic tenant (issue 4720).
      The run reads the balances screen (Responsible column) and chooses a combination in this order: (1) a row with an empty Responsible column and a positive quantity (B is its quantity); (2) if none exists, as on the synthetic tenant, any positive employee-assigned combination that is not lot-tracked or serial-tracked, with B = 0 for the form's slot and the assigned quantity noted as A (it must not be used as B and must not change). The run records the combination, B, and every row of the combination with its Responsible value. It is never reported that the form should show A. The quick count refuses serial-tracked items and needs a lot for lot-tracked ones; pick another combination in that case.
  - description: The administrator's account has the stock quick count permission and the quick count is on its four-eyes default (no approval rule switched off for the quick count approval step).
    check: system_seeded
    detail: The permission StockQuickCount is held by TENANT_ADMIN by the tenant-scope rule (docs/roles.md, stock module). UAT assumption, to be confirmed by the process owner - the four-eyes switch of the quick count in this tenant was not read; the opening approval is known to be off. If the result screen in step 5 offers an "Approve" button instead of the second-person hint, the switch is off, so do NOT press it, report BLOCKED for step 6 and carry on with the cancel in step 8.
  - description: No formal count order is open on the chosen item's place and org unit, and the place is not frozen.
    check: system_seeded
    detail: If the submit is refused with a message about a count in progress or a frozen place, choose another place and report the refusal as a finding.
  - description: The run can drive a real browser at window widths of 390 px and 1440 px, English language, and takes screenshots.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the whole scenario.

steps:
  - step: 1
    actor: admin
    action: >
      In a window 390 px wide the administrator signs in on the tenant's own address (https://qoimeks-qa.letflow.qa.bizdala.com), opens the stock balances screen through the navigation, chooses an item at a place and org unit as the precondition describes (not lot-tracked), and notes the item, the place, the org unit, B (the quantity of the row with an empty Responsible column, 0 when there is none) and every employee-assigned row of the combination with its quantity.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens the navigation and chooses "Quick count", and reads the empty form.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator chooses the noted item, the noted place and the noted org unit, and reads what the form shows below the fields.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator types the counted quantity B plus 1 (for example 11 when B is 10), reads the difference, chooses the reason "Recount" and presses "Submit count".
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator reads the result that appears.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator opens My Tasks, finds the approval task of the count just recorded, and tries to approve it (complete it as approved) themselves.
    expect_refusal: true
    via: ui
  - step: 7
    actor: admin
    action: >
      The administrator opens the stock balances screen again and reads the quantity of the noted item at the noted place and org unit.
    via: ui
  - step: 8
    actor: admin
    action: >
      The administrator opens the stock documents screen, opens the quick count document by its number, presses "Cancel document", types the reason "UAT T-2165 cleanup" and confirms.
    via: ui
  - step: 9
    actor: admin
    action: >
      The administrator repeats steps 1 to 8 in a window 1440 px wide (a second quick count document, cancelled in the same way).
    via: ui

expected_outcomes:
  - id: EO-001
    description: The Quick count screen can be reached and used at a phone width.
    verification:
      method: gui_screen
      detail: At 390 px step 2 shows the title "Quick count" with the line "Count a single item at a location and record the actual quantity.", and the fields Item, Location, Org unit, Counted quantity, Reason and the button "Submit count"; the text is inside the 390 px width, there is no horizontal scroll bar, no two controls overlap, and each field and button can be tapped.
      evidence: Screenshots of steps 2, 3, 4 and 5 at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: A storekeeper with a phone in the aisle cannot enter a count.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The form shows the book quantity of the chosen key and the difference of the typed count before submitting.
    verification:
      method: gui_screen
      detail: After step 3 the form shows "Book quantity" equal to B (the quantity of the slot with no responsible employee noted in step 1; 0 when the combination holds only employee-assigned rows, never the employee-assigned quantity); after step 4 it shows "Difference" equal to 1 (a plain number, 1 or 1.000 - compared as a number).
      evidence: Screenshots of steps 3 and 4.
    on_fail:
      severity: MAJOR
      business_impact: The counter does not see how far the book is from the shelf, and may confirm a wrong number.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: Submitting records one quick count document with the right numbers and says who must approve.
    verification:
      method: gui_screen
      detail: Step 5 shows "Count recorded" with a document number (a number starting with QCT), "Book quantity" B, "Counted quantity" B plus 1, "Difference" 1, a state, and either "A second person needs to approve this count in My Tasks." or "This count is waiting for approval. Open My Tasks to approve it."; no error banner.
      evidence: Screenshot of step 5, and the document number written in the run's report.
    on_fail:
      severity: MAJOR
      business_impact: A recorded count is lost or shows wrong numbers, so stock is corrected on a false basis.
      suggested_action: route_to_elixir_dev
  - id: EO-004
    description: The administrator cannot approve their own count alone.
    verification:
      method: gui_screen
      detail: In step 6 the approval is not completed - the Approve control is missing or disabled with a hint, or pressing it returns a refusal of separation of duties; the task stays open and the document stays not posted. Either form is accepted and the run records which one appeared.
      evidence: Screenshot of step 6.
    on_fail:
      severity: BLOCKER
      business_impact: One person could change stock numbers alone, which the company's four-eyes rule for counts forbids.
      suggested_action: route_to_security_reviewer
  - id: EO-005
    description: An unapproved count does not change the stock balance.
    verification:
      method: gui_screen
      detail: Step 7 shows B for the row without a responsible employee (no row at all when B is 0) and the employee-assigned rows with the quantities noted in step 1; no new movement is added by the unapproved count.
      evidence: Screenshot of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: A count that nobody approved has already changed the stock numbers.
      suggested_action: route_to_elixir_dev
  - id: EO-006
    description: The test count is cancelled and leaves the stock as found.
    verification:
      method: gui_screen
      detail: After step 8 the document reads "Cancelled" and the balances screen still shows the same rows and quantities as in step 1. The same holds after step 9 for the second document at 1440 px.
      evidence: Screenshots of step 8 and of the balances screen afterwards; the two document numbers in the run's report.
    on_fail:
      severity: MINOR
      business_impact: A test count stays open and a later real approval would post a test number into the stock.
      suggested_action: route_to_frontend_dev
  - id: EO-007
    description: The 1440 px run gives the same results as the 390 px run.
    verification:
      method: gui_screen
      detail: In step 9 the book quantity, difference, result numbers, refusal and cancel behave as in steps 2 to 8; the form is laid out for the wider window without cut-off text.
      evidence: Screenshots of the same steps at 1440 px.
    on_fail:
      severity: MINOR
      business_impact: The desktop screen differs from the phone one and trainers cannot use one description for both.
      suggested_action: route_to_frontend_dev
