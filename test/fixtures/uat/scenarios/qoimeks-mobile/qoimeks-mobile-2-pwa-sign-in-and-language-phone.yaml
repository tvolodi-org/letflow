# T-2165 (BA): Qoimeks QA walk, phone PWA: sign in with the company code and read the stock home in three languages. QA only, synthetic data, no real data.
# Covers: the PWA sign-in of the web build of apps/mobile (docs/runbooks/mobile-web-pwa-signin.md, "Mobile PWA sign-in: Keycloak setup per environment"; plan D-112), the bootstrap texts bootstrap.slugEntry.* and
#   bootstrap.error.tenantNotFound.* and stock.home.title in apps/mobile/lib/i18n/l10n/app_en.arb, app_ru.arb, app_kk.arb; REQ-867 (entry and install steps, merged as build commit 50548fe36) for the entry page.
#   REQ-810 (stay signed in 30 days behind a PIN) is behind the build flag LETFLOW_PWA_KEEP_SIGNED_IN, off by default; with the flag off the tokens are kept in memory only and a reload signs in again through the identity provider
#   (docs/runbooks/mobile-web-pwa-signin.md, "Behaviour to know"). Whether the QA build has the flag on is not recorded: step 7 is written for both cases and does not assume either.
# Not UAT-observable, with reasons:
#   (a) The plain Android app's sign-in (the redirect com.bizdala.letflow:/oauth2redirect) needs a phone or emulator: see scenario qoimeks-mobile-5-plain-apk-release-and-device-limits.
#   (b) Fingerprint or face unlock (REQ-811) and the PIN of REQ-810: need a real device and a build with the flag on; the PIN screen is not exercised.
#   (c) A sign-out button: no sign-out text exists in the app's three language files on origin/main (grep of apps/mobile/lib/i18n/l10n/app_en.arb, app_ru.arb, app_kk.arb for logout, sign out), so this scenario ends by clearing the site data of the PWA address.
#   (d) Lost-device revocation of a user's offline sessions: an infra step in the identity provider, not a screen of the product.
# T-2192 rework (issue 4721; PM/infra 2026-11-19): checks before this group is merged:
# 1 Scope: scope is qoimeks-qa2 (tenant and realm exist). 2 Actors (T-2222): actor-qoimeks-qa2-storekeeper (STOREKEEPER), the phone user.
# 3 Host and screens: the phone PWA lives at https://pwa.letflow.qa.bizdala.com/ ; the tenant host serves only the web SPA and is not installable, so it is used only for the web screens; the Android app and PWA have no quick count screen (REQ-856 cancelled).
# 4 Data: the synthetic tenant holds the data these steps read; no data precondition beyond the PWA address. 5 Executable: browser steps with the runner's own script. 6 uat.sh preflight not run by the writer (no QA credentials).
# T-2264 code-reading pass (group check lines are in file 1 of this group): EXPECTATION CORRECTIONS in this file: 5.
#   (1) an unknown company code now shows "Company not found" because the tenant-config answer carries company_found false (build commit 98848962e, T-2244, issue 4771 closed); the step is written for that behaviour and the HTTP twin (step 10) proves the answer is the same for every unknown code;
#   (2) the stock home lists "Counts" (Инвентаризации, Түгендеулер) and "Stock documents", and the empty-state line; the language control is NOT on the stock home (only on the entry page and the tenant home app bar), so the language is changed on the tenant home;
#   (3) the tenant home also offers "Scan a code" (Сканировать код, Кодты сканерлеу) when the codes module is installed; the storekeeper holds CodesRead only after T-2239 (issue 4764), target behaviour is written as step 3 and EO-001;
#   (4) the language switch also exists on the entry page, so a first reading in Russian can start before sign-in (step 6 may use it);
#   (5) one unauthorized-access step added (step 10): an unknown or missing company code gets identical answers and discloses nothing.
---
id: qoimeks-mobile-2-pwa-sign-in-and-language-phone
scope: qoimeks-qa2
title: The Qoimeks QA storekeeper signs in on the phone PWA with the company code, reaches the stock home, reads it in English, Russian and Kazakh, and a wrong company code or wrong password does not get in
version: "1.0"
tags: [qoimeks, mobile, pwa, sign_in, phone, i18n, ru, kk, en, refusal]

description: >
  The storekeeper opens the PWA in a window 390 px wide (and again at 1440 px), types the company code "qoimeks-qa2" and presses Continue; the browser goes to the sign-in page of the company's identity provider,
  the storekeeper signs in with their own account, and the browser returns to the PWA, which shows the tenant home screen with the entry "Stock" (the install hint and the language control EN, RU, KK are on this screen, not on the stock home). The storekeeper taps "Stock" and reaches the stock home with the title "Stock" and its entries (stock documents, counts). The address bar no longer holds the sign-in parameters.
  The storekeeper then switches the app language to Russian ("Склад") and Kazakh ("Қойма") and back to English with the language control of the tenant home screen (labels EN, RU, KK), and reads the "Stock" entry there and, after tapping it, the stock documents entry in each language.
  Two refusals are walked on their own: a company code that does not exist (the app says "Company not found" and goes no further), and the right company code with a wrong password (the sign-in page refuses and the PWA stays signed out).
  Last, the page is reloaded: with the "stay signed in" build flag off, the app signs in again by itself while the company's sign-in session lives, or asks for the sign-in page again; with the flag on it asks for a PIN, which this scenario does not enter.
  Cleanup: no record is created; at the end the storekeeper clears the site data of the PWA address so the next run starts signed out.

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The Flutter phone web app (PWA) is served at https://pwa.letflow.qa.bizdala.com/ (infrastructure fact of 2026-11-19) and the QA identity provider accepts that address for the qoimeks-qa2 mobile sign-in client.
    check: system_seeded
    detail: >-
      Precondition check, read-only: the entry address answers 200 with the web app (not the administration site), its manifest.json answers 200, and the manifest names the app "Letflow".
      The tenant host https://qoimeks-qa2.letflow.qa.bizdala.com serves only the web SPA and is NOT installable: it is never used as the PWA address, and qoimeks-client1-qa is never used.
      For the sign-in scenario: the company-code step must reach the company's sign-in page; an invalid-redirect error from the identity provider means the address is not registered for the mobile sign-in client: report BLOCKED-by-environment for the whole scenario and name issue 4721 (infrastructure registers the redirect and web origin). If the entry address does not answer, report BLOCKED-by-environment and name issue 4721.
  - description: The storekeeper account (actor-qoimeks-qa2-storekeeper) can sign in to the company's realm with a user name and password, and its credentials come from the UAT credential source variables, never from this file.
    check: system_seeded
    detail: If the account cannot sign in, report BLOCKED. The account holds the stock module access the stock home needs (STOREKEEPER holds StockRead and the other stock atoms, docs/roles.md; see test/fixtures/uat/actors.yaml); if the stock home shows no entry, report the missing access as the finding of step 3.
  - description: The run can drive a real browser at window widths of 390 px and 1440 px, with a fresh profile (no saved site data for the PWA address).
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the whole scenario.

steps:
  - step: 1
    actor: storekeeper
    action: >
      In a window 390 px wide the storekeeper opens the PWA address, types the company code qoimeks-qa2 in the field "Company code" and presses "Continue".
    via: ui
  - step: 2
    actor: storekeeper
    action: >
      On the company's sign-in page the storekeeper types their own user name and password and signs in.
    via: ui
  - step: 3
    actor: storekeeper
    action: >
      Back in the PWA the storekeeper reads the page that opens (the tenant home screen with the entry "Stock" and, if the codes module is installed in the company, the entry "Scan a code"; the second one is the target behaviour after T-2239) and its address bar, then taps "Stock" and reads the stock home (entries "Counts" and "Stock documents").
    via: ui
  - step: 4
    actor: storekeeper
    action: >
      On the tenant home screen the storekeeper opens the language control, chooses RU and reads the entry "Склад"; taps it and reads the stock home and the entry for stock documents; goes back to the tenant home screen, chooses KK and repeats the reading ("Қойма"); then chooses EN.
    via: ui
  - step: 5
    actor: storekeeper
    action: >
      In a window 1440 px wide the storekeeper repeats steps 1 to 3 (the browser keeps no sign-in from the narrow window: use a fresh profile or clear the site data first) and reads the stock home.
    via: ui
  - step: 6
    actor: storekeeper
    action: >
      After clearing the site data, the storekeeper opens the PWA address in the 390 px window, types the company code qoimeks-qa2-nosuchcompany and presses "Continue".
    expect_refusal: true
    via: ui
  - step: 7
    actor: storekeeper
    action: >
      The storekeeper opens the PWA address in the 390 px window, types the company code qoimeks-qa2, presses "Continue" and, on the sign-in page, types their own user name with a wrong password.
    expect_refusal: true
    via: ui
  - step: 8
    actor: storekeeper
    action: >
      The storekeeper signs in correctly as in steps 1 and 2, then reloads the page of the PWA and reads what appears.
    via: ui
  - step: 9
    actor: storekeeper
    action: >
      The storekeeper clears the site data of the PWA address in the browser, so that nobody stays signed in.
    via: ui
  - step: 10
    actor: storekeeper
    action: >
      With no sign-in, the runner reads the company lookup the PWA uses (the public tenant-config answer of the platform host https://qa.bizdala.com, with the parameter slug) three times: for the code qoimeks-qa2-nosuchcompany, for a second code that does not exist (qoimeks-qa2-missing2) and for no code at all, and once for the real code qoimeks-qa2, then compares the answers.
    expect_refusal: true
    via: api

expected_outcomes:
  - id: EO-001
    description: The company code leads to the company's own sign-in page, and a correct sign-in returns to the PWA with the stock home.
    verification:
      method: gui_screen
      detail: After step 1 the browser shows the sign-in page of the realm of the Qoimeks QA company (not another company's page and no error); after step 3 the PWA shows the tenant home screen with the entry "Stock" and, after tapping it, the stock home with the title "Stock" and the entries "Counts" and "Stock documents", with no error banner, and the address bar holds no "code=" or "state=" parameters. The text fits the 390 px width without sideways scrolling.
      evidence: Screenshots of steps 1, 2 and 3 at 390 px, and of step 5 at 1440 px.
    on_fail:
      severity: BLOCKER
      business_impact: A storekeeper cannot get into the phone app at all.
      suggested_action: route_to_mobile_dev
  - id: EO-002
    description: The stock home and the stock documents entry follow the chosen language.
    verification:
      method: gui_screen
      detail: >-
        Step 4 in Russian shows the entry "Склад" on the tenant home screen and, on the stock home, "Склад" and "Складские документы"; in Kazakh shows "Қойма" and "Қойма құжаттары"; in English shows "Stock" and "Stock documents". The stock home also lists the entry "Counts" ("Инвентаризации", "Түгендеулер"). Where the codes module is installed, the tenant home shows the entry "Scan a code" ("Сканировать код", "Кодты сканерлеу"); this entry is the target behaviour after T-2239 gives the storekeeper CodesRead (issue 4764): if it is missing, report that product defect, and if the codes module is not installed in the company report the entry as BLOCKED-by-environment, never as passed. No English words stay in the Russian or Kazakh screen except the language labels EN, RU, KK, and no text is shown as a raw key such as "stock.home.title".
      evidence: Screenshots of step 4 in the three languages at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: Russian and Kazakh storekeepers get a half-English app.
      suggested_action: route_to_mobile_dev
  - id: EO-003
    description: A company code that does not exist is refused and does not reach any company's data.
    verification:
      method: gui_screen
      detail: Step 6 shows "Company not found" with the text "We could not find a company for that code. Check the code and try again." (Russian "Компания не найдена" if the language is Russian), no sign-in page of any company and no sign-in page of the default realm opens (the known defect of issue 4771 is fixed on main; a "Client not found" page of the identity provider is a regression), and the app can be left with the code field available again.
      evidence: Screenshot of step 6.
    on_fail:
      severity: MAJOR
      business_impact: A mistyped code could lead to another company's sign-in page, or to a blank screen that the storekeeper cannot read.
      suggested_action: route_to_mobile_dev
  - id: EO-004
    description: A wrong password does not sign the storekeeper in.
    verification:
      method: gui_screen
      detail: Step 7 stays on the company's sign-in page with the identity provider's message that the credentials are wrong; the PWA shows no stock home and no tenant data afterwards. The message text is the identity provider's and is not asserted word for word.
      evidence: Screenshot of step 7.
    on_fail:
      severity: BLOCKER
      business_impact: Someone with a wrong password could reach company stock data on a phone.
      suggested_action: route_to_security_reviewer
  - id: EO-005
    description: After a reload the app asks for the sign-in again or resumes, and never shows company data without a sign-in.
    verification:
      method: gui_screen
      detail: >
        Step 8 shows one of three results, each acceptable and recorded as such: (a) flag off, company sign-in session alive: the app returns to the stock home by itself after a quick pass through the sign-in page; (b) the sign-in page asks for the password again; (c) flag on: a PIN screen appears (not entered).
        In no case does the stock home show data before one of these has been passed.
      evidence: Screenshot of step 8 and a note of which result appeared.
    on_fail:
      severity: MAJOR
      business_impact: Either a phone shows company data to whoever picks it up, or a storekeeper is thrown out and cannot get back in.
      suggested_action: route_to_mobile_dev
  - id: EO-007
    description: An unknown company code is refused with one identical answer that discloses nothing about other companies.
    verification:
      method: api_response
      detail: >-
        In step 10 the three answers for an unknown code, a second unknown code and no code are identical once the trace id is dropped: status 200, the default sign-in address of the platform (realm bpm-default, not any company's realm) and company_found false; no company name, id or realm of a real company appears.
        The answer for qoimeks-qa2 differs only in that its sign-in address ends with the realm qoimeks-qa2 and company_found is true. If the key company_found is missing from the live answers, the deployed platform is older than the build commit 98848962e: report it as a finding, do not weaken the expectation.
        No request of this step needs a credential and nothing is created or changed.
      evidence: The four answers side by side in the run's report.
    on_fail:
      severity: MAJOR
      business_impact: A mistyped or guessed code could lead to another company's sign-in page, or tell a stranger which company codes exist.
      suggested_action: route_to_elixir_dev
  - id: EO-006
    description: The run leaves no record and no sign-in behind.
    verification:
      method: gui_screen
      detail: After step 9 opening the PWA address shows the company-code entry again; no stock document, count or other record was created by this scenario (step 10 only read).
      evidence: Screenshot of step 9.
    on_fail:
      severity: MINOR
      business_impact: A later run starts signed in and skips the sign-in it is meant to test.
      suggested_action: log_for_owner
