# T-2164 (BA): Qoimeks QA walk scenarios — voice input: Russian and Kazakh letter names and zone words.
# Covers REQ-862 criterion 1 (letter-name table in the prompt: а A, бэ B … зэт Z, 23 pairs) and
# criterion 2 (spelled-article hint in the prompt: operators say the article letter by letter).
# Sources: docs/requirements.yaml REQ-862 (description: "Operators often say the article instead of the name,
# letter by letter and with digits as words"; letter-name table line exactly as in voice_prompt.ex rules/0;
# the kind words получил is for receipt); lib/letflow/modules/stock/voice_prompt.ex (rules/0: letter-name line,
# spelled-article hint, kind words list); docs/runbooks/stock-voice.md (Routes, the typed-text route body).
#
# PROVIDER DEPENDENCY: this scenario verifies that the language model resolves a letter-spelled article code
# to the matching catalog item. This requires the language-model step to be on (LETFLOW_VOICE_LLM_* settings set
# for the qoimeks-qa2 tenant's platform). If the model step is off the whole scenario is BLOCKED-by-environment; the
# provider-off transcript path is covered by qoimeks-voice-1.
#
# NOT UAT-observable: the speech recognition step (covered by qoimeks-voice-6 with synthetic audio); the prompt text itself (server-internal; tested in voice_prompt_test.exs VP-1..VP-5);
# the mobile voice panel UI (Flutter app is not driven by the UAT runner). Desktop (1440 px) and phone (390 px)
# widths produce the same API response; this is an API-only scenario.
# T-2225 (BA, PM/owner 2026-11-19): the voice provider keys are on QA (speech: ElevenLabs scribe; model: xAI with a JSON schema; read OK by infra), so these scenarios RUN the real function.
# Voice group of qoimeks-qa2. The Qoimeks team phrases are a draft (ids ru-01..ru-10, kk-01..kk-10; demo catalog, no customer data); the expected result per id is the validated draft, not model accuracy.
# Judge each phrase as PASS (equals the draft), PARTIAL (right kind and item, quantity or place differs) or MISS; a miss of a phrase the team flags "verify" is reported, not a defect.
# Audio: 20 SYNTHETIC test files made once with a text-to-speech model from the draft phrases (no real person), OUTSIDE the repository, webm/opus at /home/tvolodi/qoimeks-voice-audio/webm/<id>.webm on the run host. The web client sends webm; phone m4a and Safari audio are NOT tested here. Label every audio result "synthetic audio" and every Kazakh result "kk uncertain" (quality of the Kazakh synthetic speech is uncertain).
# BUDGET (rule of the owner): each of the 20 phrases goes through each route EXACTLY ONCE per run (20 text calls in qoimeks-voice-5, 20 audio calls in qoimeks-voice-6): no loops, no retries on a provider answer, no repeated runs. Calls that make no provider call (the refusals of qoimeks-voice-7) are not counted. Calls the other scenarios of the group make (qoimeks-voice-1: 2 typed phrases; -2: one; -3: three; -4: four) are counted separately. The run summary lists every call with a running count and reports the number of speech (STT) and model (LLM) calls actually made: expected 20 STT and 40 LLM for voices 5 and 6 plus the typed calls of voices 1 to 4.
# NOT UAT-observable: the microphone recording on a phone (a headless browser has no microphone); phone m4a/Safari audio; the prompt text sent to the model (server-internal); the log never holding the phrase or the key (a unit test captures the log).
# Group checks (T-2225; apply to the whole group qoimeks-voice, scenarios 1 to 8; the same lines are in every file):
# 1. Scope: every scenario has scope qoimeks-qa2, an existing synthetic tenant and realm; the group directory name is not the scope; run title UAT qoimeks-voice.
# 2. Actors: only actor-qoimeks-qa2-storekeeper (STOREKEEPER of qoimeks-qa2, who does the voice entry in real life; it holds StockPost and StockRead in the stock module role grants, lib/letflow/modules/stock/stock.ex) with the QOIMEKS_QA2_STOREKEEPER login of the acceptance environment. Its live login is NOT verified by this writing step (no QA credentials in the writer session); a missing login makes the steps BLOCKED-by-environment.
# 3. Host and screens: API routes of the stock voice (docs/runbooks/stock-voice.md; POST draft multipart and POST draft-text JSON); the only screen is the voice panel of the phone PWA https://pwa.letflow.qa.bizdala.com/ on the new receipt, issue or transfer document form (apps/mobile/lib/features/stock/documents/document_form_screen.dart, apps/mobile/lib/features/stock/voice/voice_panel.dart); the web SPA has no voice screen (grep voice in web/src finds none outside the print template fixtures).
# 4. Data: demo catalog and places of the generator task T-2189 (items BLT-M8-40, PNT-WH-10, WSH-8, CBL-3x1.5, NUT-M8, NUT-M10, BLT-M10-60, TAPE-48, GLV-L, SCR-4-40, PNT-GR-3, CBL-3x2.5; places A-01, A-02, A-03, B-01, B-02, C-01, RAMP, LA3; no C-02 and no D-03) read in each scenario before use; counts of documents, count records and balances rows are read at the start of the run and compared at the end, never assumed; a missing item or place makes the scenario BLOCKED-by-environment naming T-2189. The BLOCKED-by-keys markers of the earlier version are removed: the keys are set; the precondition is now a check that the settings are on (a typed answer with the notice llm_off means the model is off; a 503 speech_off on the audio route means speech is off; then report BLOCKED-by-environment, do not change settings, do not retry).
# 5. Executable: HTTP steps (the audio steps upload the webm file with the runner's own HTTP client: multipart field audio and field lang with the value ru or kk) and browser steps with the runner's own script; no step depends on pipeline_test.
# 6. Dry run: uat.sh preflight with the title UAT qoimeks-voice was not run by the writer (no QA credentials in the writer session); all files of the group were parsed with yaml.safe_load and the static check was run on the group.
---
id: qoimeks-voice-2-letter-name-article-ru
scope: qoimeks-qa2
title: When the language model is on, a typed Russian phrase that spells a catalog article code by letter names resolves to that article
version: "2.0"
tags: [qoimeks, voice, api, ru, letter-name, llm-on]

description: >
  Qoimeks operators say an article code letter by letter, using the Russian names of Latin letters. The voice prompt carries the
  letter-name table (REQ-862). The storekeeper sends the pinned phrase below, which spells the article code BLT-M10-60 of the demo catalog
  (бэ эл тэ эм десять шестьдесят), and the route resolves it to that article with the issue kind. The same phrase with one letter name changed
  (тэ replaced by эс, giving the code BLS-M10-60) must not resolve to BLT-M10-60. The expected result is the validated draft, not model accuracy.
  Needs the demo catalog of the generator task T-2189 (option "voice demo") and the language model.

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: The language model of the platform is on (the keys are set on QA; this is a check that the setting is on).
    check: system_seeded
    detail: >
      Check first: send the pinned phrase of step 2. The notice llm_off in the answer means the model step is off; report the whole scenario BLOCKED-by-environment (settings are infra's; change nothing, do not retry)
      (not a defect, not counted against the group). Do not change settings.
  - description: The demo catalog of the generator task T-2189 (option "voice demo") is loaded into qoimeks-qa2 (BLOCKED-by-environment until that task has merged and the data is loaded, issue 4718).
    check: system_seeded
    detail: >
      Read-only check: the active items of the tenant, all pages, include an item with the code BLT-M10-60 (a code with Latin letters, digits and hyphens;
      the synthetic generator alone writes digits-only codes 0001 to 0666 and cannot serve this scenario) and no item with the code BLS-M10-60.
      If BLT-M10-60 is absent report BLOCKED-by-environment and name T-2189. Do not create the item.
  - description: The stock module is installed and the voice typed-phrase route answers the storekeeper.
    check: system_seeded
    detail: If the route answers 404 for the stock module, report BLOCKED.

steps:
  - step: 1
    actor: storekeeper
    action: >
      The storekeeper reads the active catalog of the tenant (all pages) and notes that the item BLT-M10-60 exists and that BLS-M10-60 does not.
    via: api
  - step: 2
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase «расход, бэ эл тэ эм десять шестьдесят, двенадцать штук, с а два» with the language "ru". The answer is noted as V1.
    via: api
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase «расход, бэ эл эс эм десять шестьдесят, двенадцать штук, с а два» (one letter name changed) with the language "ru". The answer is noted as V2.
    via: api

expected_outcomes:
  - id: EO-001
    description: The letter-name spelling resolves to the catalog article.
    verification:
      method: api_response
      detail: >
        V1 answers 200; the transcript equals the sent phrase character for character; kind is "issue"; the items list holds exactly the item BLT-M10-60 with quantity 12.
        The location is expected to be A-02 (marked "verify" by the Qoimeks team: a different or empty location is recorded as an observation and is not a failure of this outcome).
      evidence: V1 body.
    on_fail:
      severity: MAJOR
      business_impact: Operators who say an article letter by letter get no match, and the voice input does not fill the form.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: A phrase with one changed letter name does not resolve to the original article.
    verification:
      method: api_response
      detail: >
        V2 answers 200; the items list does not contain BLT-M10-60 (it may be empty or hold another item, and no item BLS-M10-60 exists to match).
      evidence: V2 body.
    on_fail:
      severity: MINOR
      business_impact: A misspelled article is pre-filled as another article.
      suggested_action: route_to_elixir_dev
