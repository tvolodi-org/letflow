# T-2164 (BA): Qoimeks QA walk scenarios — voice input: Russian and Kazakh letter names and zone words.
# Covers REQ-862 criterion 3 (the Qoimeks kind words получил, отпустил, списал and по факту in the prompt;
# VoicePrompt.kinds() == ["receipt","issue","transfer","count"] is unchanged).
# Sources: docs/requirements.yaml REQ-862 (description: "(d) the Qoimeks kind words Letflow lacks: получил
# (receipt), отпустил and списал (issue), по факту (count). The kind names stay receipt, issue, transfer,
# count"); lib/letflow/modules/stock/voice_prompt.ex (rules/0: kind words list now includes получил, отпустил,
# списал, по факту); docs/runbooks/stock-voice.md (Routes, the typed-text route body).
#
# PROVIDER DEPENDENCY: this scenario verifies that the language model maps the Qoimeks-specific kind words to
# the correct draft kinds. This requires the language-model step to be on. If the model step is off every phrase
# returns kind "unknown" and the whole scenario is BLOCKED-by-environment; the provider-off path is covered by qoimeks-voice-1.
#
# NOT UAT-observable: the speech recognition step (covered by qoimeks-voice-6 with synthetic audio); the prompt text itself (server-internal; tested by voice_prompt_test.exs VP-1); the mobile voice
# panel (Flutter app is not driven by the UAT runner). Desktop (1440 px) and phone (390 px) produce the same
# API response; this is an API-only scenario.
# T-2225 (BA, PM/owner 2026-11-19): the voice provider keys are on QA (speech: ElevenLabs scribe; model: xAI with a JSON schema; read OK by infra), so these scenarios RUN the real function.
# Voice group of qoimeks-qa2. The Qoimeks team phrases are a draft (ids ru-01..ru-10, kk-01..kk-10; demo catalog, no customer data); the expected result per id is the validated draft, not model accuracy.
# Judge each phrase as PASS (equals the draft), PARTIAL (right kind and item, quantity or place differs) or MISS; a miss of a phrase the team flags "verify" is reported, not a defect.
# Audio: 20 SYNTHETIC test files made once with a text-to-speech model from the draft phrases (no real person), OUTSIDE the repository, webm/opus at /home/tvolodi/qoimeks-voice-audio/webm/<id>.webm on the run host. The web client sends webm; phone m4a and Safari audio are NOT tested here. Label every audio result "synthetic audio" and every Kazakh result "kk uncertain" (quality of the Kazakh synthetic speech is uncertain).
# BUDGET (rule of the owner): each of the 20 phrases goes through each route EXACTLY ONCE per run (20 text calls in qoimeks-voice-5, 20 audio calls in qoimeks-voice-6): no loops, no retries on a provider answer, no repeated runs. Calls that make no provider call (the refusals of qoimeks-voice-7) are not counted. Calls the other scenarios of the group make (qoimeks-voice-1: 2 typed phrases; -2: one; -3: three; -4: four) are counted separately. The run summary lists every call with a running count and reports the number of speech (STT) and model (LLM) calls actually made: expected 20 STT and 40 LLM for voices 5 and 6 plus the typed calls of voices 1 to 4.
# NOT UAT-observable: the microphone recording on a phone (a headless browser has no microphone); phone m4a/Safari audio; the prompt text sent to the model (server-internal); the log never holding the phrase or the key (a unit test captures the log).
# Group checks (T-2225; apply to the whole group qoimeks-voice, scenarios 1 to 8; the same lines are in every file):
# 1. Scope: every scenario has scope qoimeks-qa2, an existing synthetic tenant and realm; the group directory name is not the scope; run title UAT qoimeks-voice.
# 2. Actors: only actor-qoimeks-qa2-storekeeper (STOREKEEPER of qoimeks-qa2, who does the voice entry in real life; it holds StockPost and StockRead in the stock module role grants, lib/letflow/modules/stock/stock.ex) with the QOIMEKS_QA2_STOREKEEPER login of the acceptance environment. Its live login is NOT verified by this writing step (no QA credentials in the writer session); a missing login makes the steps BLOCKED-by-environment.
# 3. Host and screens: API routes of the stock voice (docs/runbooks/stock-voice.md; POST draft multipart and POST draft-text JSON); the only screen is the voice panel of the phone PWA https://pwa.letflow.qa.bizdala.com/ on the new receipt, issue or transfer document form (apps/mobile/lib/features/stock/documents/document_form_screen.dart, apps/mobile/lib/features/stock/voice/voice_panel.dart); the web SPA has no voice screen (grep voice in web/src finds none outside the print template fixtures).
# 4. Data: demo catalog and places of the generator task T-2189 (items BLT-M8-40, PNT-WH-10, WSH-8, CBL-3x1.5, NUT-M8, NUT-M10, BLT-M10-60, TAPE-48, GLV-L, SCR-4-40, PNT-GR-3, CBL-3x2.5; places A-01, A-02, A-03, B-01, B-02, C-01, RAMP, LA3; no C-02 and no D-03) read in each scenario before use; counts of documents, count records and balances rows are read at the start of the run and compared at the end, never assumed; a missing item or place makes the scenario BLOCKED-by-environment naming T-2189. The BLOCKED-by-keys markers of the earlier version are removed: the keys are set; the precondition is now a check that the settings are on (a typed answer with the notice llm_off means the model is off; a 503 speech_off on the audio route means speech is off; then report BLOCKED-by-environment, do not change settings, do not retry).
# 5. Executable: HTTP steps (the audio steps upload the webm file with the runner's own HTTP client: multipart field audio and field lang with the value ru or kk) and browser steps with the runner's own script; no step depends on pipeline_test.
# 6. Dry run: uat.sh preflight with the title UAT qoimeks-voice was not run by the writer (no QA credentials in the writer session); all files of the group were parsed with yaml.safe_load and the static check was run on the group.
---
id: qoimeks-voice-4-qoimeks-kind-words-ru
scope: qoimeks-qa2
title: When the language model is on, the Qoimeks kind words получил, отпустил, списал and по факту in a typed Russian phrase each produce the correct draft kind
version: "2.0"
tags: [qoimeks, voice, api, ru, kind-words, llm-on]

description: >
  Qoimeks operators say "получил" for a receipt, "отпустил" or "списал" for an issue, and "по факту" for a
  count. These kind words were not in the voice prompt before REQ-862. Now they are. The storekeeper sends a
  short typed phrase with each of these four Qoimeks kind words and verifies that the returned draft carries the
  expected kind. The existing kind words приход and расход are not retested here; they are already covered by
  the voice regression suite (voice_regression_test.exs R-1..R-9).

actors:
  storekeeper: actor-qoimeks-qa2-storekeeper

preconditions:
  - description: >
      The language-model step of the platform is on (LETFLOW_VOICE_LLM_* settings are set for this environment).
    check: system_seeded
    detail: >
      Check first: send any one typed phrase; the notice llm_off in the answer means the model step is off. Then report the whole scenario
      BLOCKED-by-environment (settings are infra's; change nothing, do not retry). The provider-off path is covered by qoimeks-voice-1.
  - description: >
      The stock module is installed and the voice draft-text route is reachable by the storekeeper's token.
    check: system_seeded
    detail: If the route answers 404 for the stock module, report BLOCKED.

steps:
  - step: 1
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase "получил сто единиц товара" with the language "ru". The answer
      is noted as V1.
    via: api
  - step: 2
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase "отпустил пятьдесят единиц товара" with the language "ru". The
      answer is noted as V2.
    via: api
  - step: 3
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase "списал двадцать единиц товара" with the language "ru". The
      answer is noted as V3.
    via: api
  - step: 4
    actor: storekeeper
    action: >
      The storekeeper sends the typed phrase "по факту тридцать единиц товара" with the language "ru". The
      answer is noted as V4.
    via: api

expected_outcomes:
  - id: EO-001
    description: >
      "Получил" produces a receipt draft.
    verification:
      method: api_response
      detail: >
        V1 answers 200 with kind "receipt". The transcript equals the sent phrase. Items may be empty (no specific
        item was said). The kind "receipt" is the proof that the
        language model recognised "получил" as the receipt word.
      evidence: V1 body.
    on_fail:
      severity: MAJOR
      business_impact: >
        Qoimeks operators who say "получил" to report a receipt get the wrong kind or no kind, and the form
        is not pre-filled for a receipt.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: >
      "Отпустил" produces an issue draft.
    verification:
      method: api_response
      detail: >
        V2 answers 200 with kind "issue". The transcript equals the sent phrase.
      evidence: V2 body.
    on_fail:
      severity: MAJOR
      business_impact: >
        Qoimeks operators who say "отпустил" to report an issue get the wrong kind, and the form is not
        pre-filled for an issue.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: >
      "Списал" produces an issue draft.
    verification:
      method: api_response
      detail: >
        V3 answers 200 with kind "issue". The transcript equals the sent phrase.
        (Both "отпустил" and "списал" map to "issue"; this checks that "списал" specifically is recognised.)
      evidence: V3 body.
    on_fail:
      severity: MAJOR
      business_impact: >
        Qoimeks operators who say "списал" to report an issue get the wrong kind.
      suggested_action: route_to_elixir_dev
  - id: EO-004
    description: >
      "По факту" produces a count draft.
    verification:
      method: api_response
      detail: >
        V4 answers 200 with kind "count". The transcript equals the sent phrase.
      evidence: V4 body.
    on_fail:
      severity: MAJOR
      business_impact: >
        Qoimeks operators who say "по факту" for a stock count get the wrong kind, and the form is not
        pre-filled for a count.
      suggested_action: route_to_elixir_dev
