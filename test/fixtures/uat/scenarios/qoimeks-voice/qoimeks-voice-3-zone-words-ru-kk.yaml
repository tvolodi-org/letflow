# T-2164 (BA): Qoimeks QA walk scenarios — voice input: Russian and Kazakh letter names and zone words.
# Covers REQ-862 criterion 2 (zone rule in the prompt: L left/слева/сол жақ, R right/справа/оң жақ,
# D straight ahead/прямо/тура; examples "слева а три" and "эл а три" are both LA3, "сол жақ эн екі" is LN2).
# Sources: docs/requirements.yaml REQ-862 (description: zone rule with six zone words слева, сол жақ, справа,
# оң жақ, прямо, тура; two examples); lib/letflow/modules/stock/voice_prompt.ex (rules/0: zone rule line);
# docs/runbooks/stock-voice.md (Routes, the typed-text route body).
#
# PROVIDER DEPENDENCY: this scenario verifies that the language model resolves zone words to location codes
# starting with L, R or D. This requires the language-model step to be on. If the model step is off the
# whole scenario is BLOCKED; the provider-off path is covered by qoimeks-voice-1.
#
# NOT UAT-observable: the speech recognition step (requires real audio); the prompt text itself (server-internal;
# tested by voice_prompt_test.exs VP-1..VP-5); the mobile voice panel (Flutter app is not driven by the UAT runner).
# Desktop (1440 px) and phone (390 px) produce the same API response; this is an API-only scenario.
# T-2192 rework (issues 4717, 4718): checks: 1 scope qoimeks-qa exists; 2 actor actor-qoimeks-qa-admin; 3 API route only (docs/runbooks/stock-voice.md);
# 4 data (T-2206, P17): the seed has the places A-01 A-02 A-03 B-01 B-02 C-01 RAMP LA3 (zone-coded place named «Слева A 3») and the demo items; it has NO place RA3.
# The scenario uses LA3 only; step 1 reads the locations list and the scenario is BLOCKED-by-environment if LA3 is missing. Right-zone phrases were removed, because no place exists to resolve them to;
# the second Russian step uses the other spoken form of the same place (эл а три);
# the language model must be on, BLOCKED-by-keys until the owner supplies the keys at O-015 (not a defect). One literal phrase per step, so the zone word is the only difference between the L and R steps.
# 5 HTTP steps only; 6 uat.sh preflight not run by the writer (no QA credentials).
---
id: qoimeks-voice-3-zone-words-ru-kk
scope: qoimeks-qa
title: When the language model is on, Russian and Kazakh zone words in a typed phrase resolve to the place with the matching zone letter
version: "1.1"
tags: [qoimeks, voice, api, ru, kk, zone-word, llm-on, blocked-by-keys]

description: >
  Place codes may start with a zone letter: L for left (слева, сол жақ), R for right (справа, оң жақ), D for straight ahead (прямо, тура) (REQ-862).
  The administrator sends three pinned typed phrases for the place LA3 (the seeded place named «Слева A 3»): "слева а три" and "эл а три" in Russian, "сол жақ а үш" in Kazakh; each must give LA3.
  The place RA3 does not exist in the seed, so the right-zone words are not exercised here.
  The expected result is the validated draft, not model accuracy.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The language model of the platform is on (BLOCKED-by-keys until the owner supplies the provider keys at O-015, issue 4717).
    check: system_seeded
    detail: >
      Check first: send the phrase of step 2. The notice llm_off in the answer means the model step is off; report the whole scenario BLOCKED-by-keys
      (not a defect, not counted against the group). Do not change settings.
  - description: The tenant has the place LA3 (BLOCKED-by-environment if the locations list lacks it).
    check: system_seeded
    detail: >
      Read-only check: the locations list of the tenant, all pages, holds the code LA3 (the seed places are A-01 A-02 A-03 B-01 B-02 C-01 RAMP LA3; read the list, do not rely on this text).
      If LA3 is absent report the whole scenario BLOCKED-by-environment. Do not create places.
  - description: The stock module is installed and the voice typed-phrase route answers the administrator.
    check: system_seeded
    detail: If the route answers 404 for the stock module, report BLOCKED.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator reads the locations list of the tenant (all pages, read first) and notes that the code LA3 exists; if it is missing, stop and report BLOCKED-by-environment.
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator sends the typed phrase «принял товар слева а три сто единиц» with the language "ru". The answer is noted as V1.
    via: api
  - step: 3
    actor: admin
    action: >
      The administrator sends the typed phrase «принял товар эл а три сто единиц» with the language "ru". The answer is noted as V2.
    via: api
  - step: 4
    actor: admin
    action: >
      The administrator sends the typed phrase «қабылдадым сол жақ а үш жүз дана» with the language "kk". The answer is noted as V3.
    via: api

expected_outcomes:
  - id: EO-001
    description: The Russian zone word слева gives the place LA3.
    verification:
      method: api_response
      detail: V1 answers 200; the transcript equals the sent phrase; the location is the place LA3.
      evidence: V1 body.
    on_fail:
      severity: MAJOR
      business_impact: Operators who say "слева" get a wrong or empty place.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: The Russian spoken form эл а три gives the place LA3.
    verification:
      method: api_response
      detail: V2 answers 200; the transcript equals the sent phrase; the location is the place LA3.
      evidence: V2 body.
    on_fail:
      severity: MAJOR
      business_impact: Operators who say "эл а три" get a wrong or empty place.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: The Kazakh zone word сол жақ gives the place LA3.
    verification:
      method: api_response
      detail: V3 answers 200; the transcript equals the sent phrase; the location is the place LA3.
      evidence: V3 body.
    on_fail:
      severity: MAJOR
      business_impact: Kazakh-speaking operators who say "сол жақ" get a wrong or empty place.
      suggested_action: route_to_elixir_dev
