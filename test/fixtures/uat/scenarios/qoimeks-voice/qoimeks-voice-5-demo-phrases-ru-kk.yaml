# T-2192 (PM 2026-11-19): the Qoimeks team's voice phrases (a draft, nothing recorded; demo catalog, no customer data).
# Checks: 1 scope qoimeks-qa2 exists; 2 actor actor-qoimeks-qa2-admin; 3 API typed-phrase route only (docs/runbooks/stock-voice.md);
# 4 data: needs the demo catalog and places of the generator task T-2189 (option "voice demo"): BLOCKED-by-environment until merged and loaded;
# the language model must be on: BLOCKED-by-keys until the owner supplies the keys at O-015 (not a defect, not counted against the group);
# 5 HTTP steps only, every phrase literal; 6 uat.sh preflight not run by the writer (no QA credentials).
# NOT UAT-observable: speech recognition (audio and keys). The expected result is the validated draft, not model accuracy.
---
id: qoimeks-voice-5-demo-phrases-ru-kk
scope: qoimeks-qa2
title: The twenty demo phrases of the Qoimeks team in Russian and Kazakh give validated drafts and store nothing
version: "1.0"
tags: [qoimeks, voice, api, ru, kk, llm-on, blocked-by-keys, demo-catalog]

description: >-
  The administrator sends the twenty typed demo phrases of the Qoimeks team (ten Russian, ten Kazakh) to the typed-phrase route one by one and checks the kind, the item,
  the quantity and the place of each draft against the demo catalog. No document or count is stored by any call.

actors:
  admin: actor-qoimeks-qa2-admin

preconditions:
  - description: The language model of the platform is on (BLOCKED-by-keys until the owner supplies the provider keys at O-015, issue 4717).
    check: system_seeded
    detail: >-
      Check first: the answer of phrase ru-01 carries the notice llm_off when the model is off. Then report the whole scenario BLOCKED-by-keys (not a defect). Do not change settings.
  - description: The demo catalog and places of the generator task T-2189 (option "voice demo") are loaded into qoimeks-qa2.
    check: system_seeded
    detail: >-
      Read-only check: the active items (all pages) include BLT-M8-40, PNT-WH-10, WSH-8, CBL-3x1.5, NUT-M8, NUT-M10, BLT-M10-60, TAPE-48, GLV-L, SCR-4-40, PNT-GR-3 and CBL-3x2.5,
      and the places include A-01, A-02, A-03, B-01, B-02, C-01 and RAMP, and do not include C-02 and D-03. Anything missing: report BLOCKED-by-environment and name T-2189. Do not create data.
  - description: The stock module is installed and the voice typed-phrase route answers the administrator.
    check: system_seeded
    detail: If the route answers 404 for the stock module, report BLOCKED.

steps:
  - step: 1
    actor: admin
    action: >-
      The administrator reads the stock documents list (GET /api/v1/modules/stock/documents) and the count records list (GET /api/v1/modules/stock/counts), following all pages, and notes the counts as D0 and C0; the counts are read at the start of the run, never hard-coded.
    via: api
  - step: 2
    actor: admin
    action: >-
      The administrator sends the typed phrase «приход, болт эм восемь на сорок, сто штук, на а один» with the language "ru". The answer is noted as ru-01.
    via: api
  - step: 3
    actor: admin
    action: >-
      The administrator sends the typed phrase «выдал краску белую десять литров, две штуки» with the language "ru". The answer is noted as ru-02.
    via: api
  - step: 4
    actor: admin
    action: >-
      The administrator sends the typed phrase «переместил шайбы плоские восемь, тридцать штук, из бэ два в цэ один» with the language "ru". The answer is noted as ru-03.
    via: api
  - step: 5
    actor: admin
    action: >-
      The administrator sends the typed phrase «инвентаризация, кабель три на полтора, по факту сто двадцать метров, бэ один» with the language "ru". The answer is noted as ru-04.
    via: api
  - step: 6
    actor: admin
    action: >-
      The administrator sends the typed phrase «приход гайки, пятьдесят штук, на а три» with the language "ru". The answer is noted as ru-05.
