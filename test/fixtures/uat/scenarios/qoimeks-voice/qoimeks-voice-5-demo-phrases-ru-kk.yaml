  - step: 12
    actor: admin
    action: >-
      The administrator sends the typed phrase «кіріс, гайка эм сегіз, жүз дана, а бір» with the language "kk". The answer is noted as kk-01.
    via: api
  - step: 13
    actor: admin
    action: >-
      The administrator sends the typed phrase «шығыс, болт эм сегіз қырық, жиырма дана, а бірден» with the language "kk". The answer is noted as kk-02.
    via: api
  - step: 14
    actor: admin
    action: >-
      The administrator sends the typed phrase «ауыстырдым, шайба сегіз, елу дана, бэ екіден цэ бірге» with the language "kk". The answer is noted as kk-03.
    via: api
  - step: 15
    actor: admin
    action: >-
      The administrator sends the typed phrase «түгендеу, сұр бояу, нөл, цэ бір» with the language "kk". The answer is noted as kk-04.
