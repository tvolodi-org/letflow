    action: >-
      The administrator sends the typed phrase «қабылдадым, кабель, жүз метр, бэ бір» with the language "kk". The answer is noted as kk-05.
    via: api
  - step: 17
    actor: admin
    action: >-
      The administrator sends the typed phrase «бердім, қолғап, он жұп» with the language "kk". The answer is noted as kk-06.
    via: api
  - step: 18
    actor: admin
    action: >-
      The administrator sends the typed phrase «кіріс, тэ а пэ е қырық сегіз, отыз дана, рампа» with the language "kk". The answer is noted as kk-07.
    via: api
  - step: 19
    actor: admin
    action: >-
      The administrator sends the typed phrase «шығыс, шайба сегіз, он бес дана, дэ үш» with the language "kk". The answer is noted as kk-08.
    via: api
  - step: 20
    actor: admin
    action: >-
      The administrator sends the typed phrase «санадым, гайка эм он, по факту қырық дана, бэ бір» with the language "kk". The answer is noted as kk-09.
    via: api
  - step: 21
    actor: admin
    action: >-
      The administrator sends the typed phrase «гайка қанша қалды» with the language "kk". The answer is noted as kk-10.
    via: api
  - step: 22
    actor: admin
    action: >-
      The administrator reads the stock documents list and the count records list again and notes the counts as D1 and C1.
    via: api

