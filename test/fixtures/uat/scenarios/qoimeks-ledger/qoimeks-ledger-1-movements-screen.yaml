# T-2258 code-reading pass (2026-11-19); source checks are not live acceptance evidence.
# EXPECTATION CORRECTIONS: 10 — rendered report cards and ru/kk phone coverage; runtime report dates/numbers and issued quantities; admin reversal completion; explicit L7 fixture block/cleanup; rule-independent opening banner; exact 403 and unchanged-rule evidence; stale actor/report-baseline commentary; live-state preconditions; cause/type filter impact; previous-run cleanup safety.
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-ledger. Live authenticated tenant enumeration not repeated.
# 2. Actors: actors.yaml names qoimeks-qa2 admin (TENANT_ADMIN) and storekeeper (STOREKEEPER) in this realm; storekeeper requests posting/reversal, admin completes their routed tasks (priv/modules/stock/pack.json). Preflight found NO_PASSWORD for both: no live login or effective permissions verified; acceptance credentials are a precondition.
# 3. Host and screens: stockRoutes.tsx, router.tsx and mounted stock, My reports and Approval rules pages read on main; read-only tenant-host HEAD returned 200. Live authenticated screens remain unverified.
# 4. Data: read counts, full stock keys, active masters, linked places, responsible employees, pending tasks and report data at run time. Read stock definitions ACTIVE, shared access enabled, quick-count four-eyes ON and opening approval OFF before dependent writes; generator qoimeks_gen.py does not establish live settings. Ledger-3 walks part A (retired place) on screens and part B (changed posting) only after the operator fixture script named in its header exists; part B is BLOCKED-by-environment until then; never assume the script exists.
# 5. Executable: source review covers every group outcome: journal filters/legs, receipt post/reversal, L7 rule order, opening approval/audit, report cards and approval-rule refusal. Browser/HTTP runner supplies its own script. Ledger-6 tests unauthorized reads; missing fixture or credentials blocks affected steps before writes.
# 6. Dry run: T-2258 ran uat.sh preflight with title UAT qoimeks-ledger; health and realm OK, deployed SHA behind main, both actors NO_PASSWORD, tenant and app-role checks UNKNOWN. Acceptance is BLOCKED-by-environment until credentials, deployed build and data preconditions are verified. Evidence: task T-2258/preflight.json and preflight.log; no UAT scenarios run.
# T-2190: run title UAT qoimeks-ledger; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2168 (BA): Qoimeks QA walk, ledger effects L6 and L7: movement history screen. QA only, SYNTHETIC data, never the real tenant, no production.
# REQ ids covered: REQ-830 (posting scope: the authority check accepts the TENANT_ADMIN's tenant-wide grant on the existing openings),
#   REQ-831 (stock document routes accept the full-access admin for the read path StockRead).
# Sources opened: docs/requirements.yaml REQ-830, REQ-831; web/src/modules/stock/stockMessages.ts (screen title "Movements" / "Движения" / "Қозғалыстар";
#   filters; empty-state "No movements found." / "Движений не найдено." / "Қозғалыс табылмады.");
#   web/src/modules/stock/stockRoutes.tsx (route admin/stock/movements, permission StockRead);
#   web/src/components/layout/navMessages.ts (nav entry "Movements" / "Движения" / "Қозғалыстар").
# Not UAT-observable here, with reasons:
#   (a) L6 scope_denied path (a storekeeper with limited org-unit access refused for an out-of-scope leg): actor-qoimeks-qa2-storekeeper exists, but restricted org-unit grants are not confirmed by actors.yaml; the check is covered by REQ-830 backend tests.
#   (b) The xlsx download of movements is outside this group; ledger-2 checks journal operations, not a workbook download.
# This scenario is read-only: it creates nothing and changes nothing.
# #4724 also applies here: item/location filters do not exist in MovementsPage.tsx. Use cause and document type.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-ledger-1-movements-screen
scope: qoimeks-qa2
title: >-
  The storekeeper reads movement operations and expanded legs and tests cause and document-type filters in English,
  Russian and Kazakh
version: '1.1'
tags:
- qoimeks
- ledger
- movements
- L6
- desktop
- phone_390
- ru
- kk
description: >-
  At desktop width read the posted journal operations and expand their legs. Filter by an observed cause, then add
  the document type of the recorded operation. Clearing both filters restores the initial page. Read the cause,
  document type and document filter labels in Russian and Kazakh, then check the Kazakh screen at 390 px. Operation
  counts are separate from balance rows. Nothing is written.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The stock module is active on the tenant; the storekeeper holds StockRead (stock module role_grants, docs/roles.md) and may open
    the Movements screen.
  check: system_seeded
  detail: >-
    If the stock nav entry is absent, report BLOCKED.
- description: >-
    Opening postings exist in the movement journal. One posting may contain many legs; the balance rows counted
    at the start of the run do not imply the same number of journal operations.
  check: runner_prepared
  detail: >-
    Read an opening operation and expand its legs. If no posting is present, BLOCKED-by-environment for movement
    outcomes. Record operation and leg counts separately; do not require the balance-row count as the operation count.
- description: >-
    The run can drive a real browser at 390 px width and screenshot it.
  check: system_seeded
  detail: >-
    If the width cannot be set, report BLOCKED for step 5 only; walk the desktop steps first.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
    Before dependent writes, obtain administrator read evidence of active stock definitions and shared access
    enabled, quick-count approval ON and opening approval OFF. Verify the chosen item and base unit, linked place,
    active responsible employee and absence of a location freeze from current tenant reads; if these prerequisites
    are absent or unreadable, stop the affected steps BLOCKED-by-environment. Do not infer live settings from the generator.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper opens Movements in English at 1440 px, records the first loaded page, selects an operation
    and opens its document link to record the document type. Return to Movements and expand that operation to read
    its cause and legs.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper opens the filters, selects the cause of the recorded operation and verifies that all displayed
    operations have that cause. Record the result.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper adds the recorded document type using the Document type selector. Confirm the original operation
    remains visible and all displayed operations have that cause and document type. Clear both filters and confirm
    the original first page returns.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper switches the language to Russian and reads the Movements screen title and the filter labels.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper switches the language to Kazakh and reads the Movements screen title and the filter labels.
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    At 390 px width the storekeeper opens the Movements screen in Kazakh and reads whether rows and filter controls
    are visible and reachable without sideways scrolling.
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The storekeeper switches the language back to English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The journal shows opening operations and their legs.
  verification:
    method: gui_screen
    detail: >-
      Step 1 shows posted operations with document, cause and quantity; selecting an operation shows its legs with
      item and location. The journal operation count is distinct from the number of balance rows.
    evidence: >-
      Screenshot of step 1 (1440 px, English).
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The storekeeper cannot see the posted movement history; stock audit is impossible.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: >-
    Supported cause and document-type selectors filter the recorded operation.
  verification:
    method: gui_screen
    detail: >-
      The cause selection returns only operations of that cause, including the recorded operation. Adding its document
      type keeps that operation visible and every shown operation has the selected cause and document type. Do not
      require the count to decrease if all seeded operations have the same type. Clearing both selectors restores
      the same first page.
    evidence: >-
      Screenshots of steps 2 and 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The storekeeper cannot search the movement history by cause and document type.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The actual movement filters are labelled in Russian.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows "Движения", "Причина", "Документ" and "Вид документа" in the filter area.
    evidence: >-
      Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking operators see English labels on the movement history screen.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    The actual movement filters are labelled in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows "Қозғалыстар", "Себебі", "Құжат" and "Құжат түрі" in the filter area.
    evidence: >-
      Screenshot of step 5.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Kazakh-speaking operators see non-Kazakh labels on the movement history screen.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    At 390 px width the Movements screen is usable in Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows rows and filter controls visible without a horizontal scroll bar; nothing is cut at the right
      edge; the filter area is reachable through the navigation menu if collapsed.
    evidence: >-
      Screenshot of step 6 at 390 px width.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Storekeepers on a phone cannot read the movement history.
    suggested_action: route_to_frontend_dev
