# T-2258 code-reading pass (2026-11-19); source checks are not live acceptance evidence.
# 1. Scope: every scenario parsed as qoimeks-qa2; existing synthetic tenant/realm confirmed by the owner task; directory and run title remain UAT qoimeks-ledger. Live authenticated tenant enumeration not repeated.
# 2. Actors: actors.yaml names qoimeks-qa2 admin (TENANT_ADMIN) and storekeeper (STOREKEEPER) in this realm; storekeeper requests posting/reversal, the completer of the posting and reversal tasks must hold the permission StockApprove (the administrator holds it, the storekeeper does not; in a one-person company that person is the tenant admin and holds it, docs/design/four-eyes-switch.md section 6); the tasks are only addressed to the administrator role for My Tasks (priv/modules/stock/pack.json, decision 0093). Preflight found NO_PASSWORD for both: no live login or effective permissions verified; acceptance credentials are a precondition.
# 3. Host and screens: stockRoutes.tsx, router.tsx and mounted stock, My reports and Approval rules pages read on main; read-only tenant-host HEAD returned 200. Live authenticated screens remain unverified.
# 4. Data: read counts, full stock keys, active masters, linked places, responsible employees, pending tasks and report data at run time. Read stock definitions ACTIVE, shared access enabled, quick-count four-eyes ON and opening approval OFF before dependent writes; generator qoimeks_gen.py does not establish live settings. Ledger-3 walks part A (retired place) on screens and part B (changed posting) only after the operator fixture script named in its header exists; part B is BLOCKED-by-environment until then; never assume the script exists.
# 5. Executable: source review covers every group outcome: journal filters/legs, receipt post/reversal, L7 rule order, opening approval/audit, report cards and approval-rule refusal. Browser/HTTP runner supplies its own script. Ledger-6 tests unauthorized reads; missing fixture or credentials blocks affected steps before writes.
# 6. Dry run: T-2258 ran uat.sh preflight with title UAT qoimeks-ledger; health and realm OK, deployed SHA behind main, both actors NO_PASSWORD, tenant and app-role checks UNKNOWN. Acceptance is BLOCKED-by-environment until credentials, deployed build and data preconditions are verified. Evidence: task T-2258/preflight.json and preflight.log; no UAT scenarios run.
# T-2190: run title UAT qoimeks-ledger; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
# Access-refusal checks may use actor-qoimeks-qa2-storekeeper where its actual permissions warrant refusal; its availability is not an environment blocker. Other required roles or restricted org-unit grants must be confirmed before checks that need them. Sources: actors.yaml and docs/roles.md.
# Do not substitute a platform or another tenant actor. No real data or production.
# T-2168 (BA): Qoimeks QA walk, ledger effects L6 and L7: post a new receipt, verify balance and movement, reverse it. QA only, SYNTHETIC data.
# REQ ids covered: REQ-830 (posting scope: the authority check passes for the TENANT_ADMIN's tenant-wide grant),
#   REQ-831 (stock document routes accept the full-access admin for create, issue, post, reverse),
#   REQ-832 (master validation passes for valid masters; the post task succeeds when item and location are live records).
# Sources opened: docs/requirements.yaml REQ-830, REQ-831, REQ-832;
#   lib/letflow/modules/stock/router.ex (moduledoc: routes /documents POST, PUT /:id, POST /:id/issue, POST /:id/post, POST /:id/reverse;
#   error "document_posted" on a second post attempt);
#   web/src/modules/stock/documents/documentsMessages.ts (state "Draft"/"Черновик"/"Жоба", "Issued"/"Выпущен"/"Шығарылған",
#   "Posted"/"Проведён"/"Өткізілген", "Reversed"/"Сторнирован"/"Қайта жазылған";
#   error message "The document is posted. Reverse it instead.").
# Writes: one stock receipt "UAT-LEDGER-REC-01" and its reversal. Both remain in the ledger (append-only); net balance change is zero.
# NOT UAT-observable here, with reasons:
#   (a) L6 scope_denied path: actor-qoimeks-qa2-storekeeper exists, but restricted org-unit grants are not confirmed by actors.yaml; covered by REQ-830 backend tests.
#   (b) L7 retired-master check: walked in qoimeks-ledger-3 (a run-owned place is created and retired there; no shared catalog master is retired).
# T-2334 (issue 4836): documents are created, issued and reversed on the screens (New document form, Issue, Reverse, My Tasks claim and complete); the API is used for reads and verification only. EO-002 keeps the expectation that after completion the document panel shows Posted (product defect 4835 is queued separately; this walk fails until it merges, intended).
# Runner API adapter (reads and verification only): obtain the current admin session token from the Authorization header of a successful read in the signed-in browser; keep it in memory, never log or save it.
# Send Authorization: Bearer <access_token> (exactly one Bearer prefix), Content-Type: application/json; base is https://qoimeks-qa2.letflow.qa.bizdala.com. No tenant id is accepted from another realm.
# Stock routes (router.ex): POST /api/v1/modules/stock/documents creates a draft; kind, org_unit_id, location_id, responsible_id, event_time (current ISO8601 with offset), lines [{catalog_item_id,catalog_uom_id,quantity:"1"}] for receipt/issue. All ids are read from this tenant; never article codes.
# Opening body: kind:"opening", org_unit_id, note, lines [{catalog_item_id,catalog_uom_id,location_id,responsible_id,received_on:<today YYYY-MM-DD>,quantity:"1"}]. No supplier_document_ref for opening.
# POST /api/v1/modules/stock/documents/<D1>/issue and /post use {}; /reverse uses {reason_code:"other",reason_text:<step note>}; /cancel uses {reason:<step note>}. GET the same document to verify final state.
# Use a fresh per-action idempotency-key if supplied; second-post refusal uses a new key, not a replay of the successful posting.
# Reverse starts a task: complete it in My Tasks before claiming restoration. Refusal is not a reachability probe; writes are only the named scenario actions.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
# Not UAT-observable (decision 0093 test T3, covered by the product tests): the refusal after the routing role of a process is renamed or removed; a UAT walk must not edit the shipped stock process definitions of the tenant. Reassignment (decision 0093 T2) IS walked: a role-routed task is reassigned by the administrator to the storekeeper through the tenant task service (reassign request with the user id, a plain HTTP client; the Users screen of the administrator shows the user ids; the web app has no reassign screen).
---
id: qoimeks-ledger-2-post-and-verify-movement
scope: qoimeks-qa2
title: >-
  The storekeeper creates receipt UAT-LEDGER-REC-01, posts it, sees the balance increase and the movement entry,
  is refused on a second post, then reverses it
version: '1.3'
tags:
- qoimeks
- ledger
- receipt
- posting
- balance
- movement
- reversal
- L6
- L7
- refusal
description: >-
  The storekeeper picks an existing item and place from the synthetic data (any row on the Balances screen) and
  notes the current balance as B0. The storekeeper creates a new stock receipt named "UAT-LEDGER-REC-01" for a positive quantity
  of that item at that place, issues it. The administrator hands the posting task to the storekeeper and the storekeeper is refused (the storekeeper lacks the approve permission StockApprove); the administrator takes the task back and completes the posting task in My Tasks. The balance increases by
  the issued quantity read at run time and the movement history shows the new entry. The storekeeper then tries to post the same receipt again and
  is refused (the document is already posted). As cleanup the storekeeper requests reversal and the administrator completes its task: the balance returns
  to B0 and the reversal entry appears in the movements. Both the original posting and its reversal remain in the
  movements log.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The stock module is active; the storekeeper knows at least one item code, location and org unit with a positive
    balance from the synthetic data. Any row on the Balances screen can be used.
  check: system_seeded
  detail: >-
    If the Balances screen is empty or inaccessible, report BLOCKED.
- description: >-
    No existing unposted document with supplier reference "UAT-LEDGER-REC-01" is left from a previous run. If one
    exists, stop BLOCKED-by-environment; do not cancel another run's document.
  check: system_seeded
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
    Before dependent writes, obtain administrator read evidence of active stock definitions and shared access
    enabled, quick-count approval ON and opening approval OFF. Verify the chosen item and base unit, linked place,
    active responsible employee and absence of a location freeze from current tenant reads; if these prerequisites
    are absent or unreadable, stop the affected steps BLOCKED-by-environment. Do not infer live settings from the generator.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: The user ids of the storekeeper and of the administrator are read at run time from the Users screen of the administrator (the ids the reassign request needs). The runner's HTTP client uses the administrator's own credential from the acceptance credential source for the reassign requests, never one from a file.
  check: runner_prepared
  detail: If an id or the credential for the request is not available, the reassignment steps are BLOCKED-by-environment and the rest of the walk is not moved or weakened. A reassign request is sent only for the task of this walk.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper opens Balances, selects a positive row and records its item, place, QOI-OU-1, responsible
    employee, unit, empty lot and quantity B0. They retain the exact full key and its identifiers from the signed-in
    balance response for comparison.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper creates a receipt for the recorded org unit, place and responsible employee, the recorded
    item and base unit, a positive quantity derived from the recorded balance and current event date and time in the tenant zone. The supplier reference is
    UAT-LEDGER-REC-01. Save the draft as D1.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper issues the receipt D1. The document state changes to "Issued" and a document number is assigned.
    The number is noted as REF-1. Read the issued line quantity as Q for balance and movement comparisons.
  via: ui
- step: 4
  actor: admin
  action: >-
    The test runner, with the administrator's credential, sends a reassign request for the posting task of REF-1 of this walk
    (identified in My Tasks or in the tenant task list by the document number noted before) to the user id of
    the storekeeper read at the start. The request is accepted: the task is now assigned to the storekeeper by name.
  via: api
- step: 5
  actor: storekeeper
  action: >-
    The storekeeper opens My Tasks; the reassigned task is now listed there (it is assigned to the storekeeper by name).
    The storekeeper selects it, takes it ("Claim") if the screen offers it, and presses the completing button of the
    task. Then the storekeeper reads the document REF-1 and Balances: the document is still "Issued" and the balance still reads B0.
  expect_refusal: true
  via: ui
- step: 6
  actor: admin
  action: >-
    The administrator first has the task given back, the test runner sends the same reassign request, with the administrator's credential, to the administrator's own user id read at the start. The administrator, who holds the approve permission StockApprove, opens My Tasks, finds the posting task for REF-1 and completes it. The document state is noted
    as S1.
  via: ui
- step: 7
  actor: storekeeper
  action: >-
    The storekeeper opens the Balances screen and filters by the item and location from step 1. The balance is
    noted as B1.
  via: ui
- step: 8
  actor: storekeeper
  action: >-
    The storekeeper opens Movements and selects the document filter using D1, the recorded document identifier,
    then reads the receipt operation and its expanded legs as M1.
  via: ui
- step: 9
  actor: storekeeper
  action: >-
    The storekeeper opens the posted document D1 on the document screen and looks for any way to post it again. The
    screen offers no posting action for a posted document (only Reverse); the runner reads D1 afterwards through the
    API (read only) to verify state and balance.
  expect_refusal: true
  via: ui
- step: 10
  actor: storekeeper
  action: >-
    The storekeeper opens D1 on the document screen, uses the Reverse action with reason Other and note UAT reversal
    of UAT-LEDGER-REC-01. Record the pending task shown; starting reversal alone does not restore balances.
  via: ui
- step: 11
  actor: admin
  action: >-
    The administrator opens My Tasks and completes the reversal task for D1. Record the resulting document state.
  via: ui
- step: 12
  actor: storekeeper
  action: >-
    The storekeeper opens the Balances screen (same filter as step 7) and the Movements screen (same filter as
    step 8). The balance is noted as B2 and the two newest movements are noted as M2.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The receipt is issued and receives a document number.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the document in state "Issued" (Russian: "Выпущен", Kazakh: "Шығарылған") with a non-empty document
      number; the posting task appears in My Tasks.
    evidence: >-
      Screenshot of step 3 (document detail panel) and My Tasks task list.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Stock documents cannot be issued; no stock postings can be made on the QA tenant.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: >-
    The posting task completes, the document is posted and the balance increases.
  verification:
    method: gui_screen
    detail: >-
      Step 6 shows the document in state "Posted" (Russian: "Проведён", Kazakh: "Өткізілген"); the task is gone
      from My Tasks. B1 equals B0 plus Q for the recorded full stock key.
    evidence: >-
      Screenshots of step 6 (document state) and step 7 (balance panel).
  on_fail:
    severity: BLOCKER
    business_impact: >-
      Posting stock movements is not working; stock accounting is not usable on the QA tenant.
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    The movement entry appears in the history for the item.
  verification:
    method: gui_screen
    detail: >-
      M1 is a posted receipt operation with document number REF-1 and the issued line item, location, unit and
      quantity Q. The displayed English cause is "Receipt".
    evidence: >-
      Screenshot of step 8 (Movements screen filtered to the document, with M1 visible).
  on_fail:
    severity: MAJOR
    business_impact: >-
      The movement history is incomplete; the storekeeper cannot trace the receipt in the ledger.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    Trying to post an already-posted document is refused.
  verification:
    method: gui_screen
    detail: >-
      Step 9: the document screen offers no posting action for the posted document D1 (only Reverse). Before reversal,
      re-read D1 through the API (read only), its movements and full-key balance: the document stays posted, there is
      only the original posting entry and the balance remains B1. The API refusal is not probed: writes go only
      through the screens.
    evidence: >-
      Screenshot of step 9 (document screen with its actions) and the read-only API responses.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A posted document could be posted a second time, creating duplicate balance entries.
    suggested_action: route_to_elixir_dev
- id: EO-005
  description: >-
    Completing reversal restores the exact original balance and leaves both entries in history.
  verification:
    method: gui_screen
    detail: >-
      After reversal-task completion B2 equals B0 for the full key including responsible and unit. The journal retains
      the original receipt entry and a reversal entry that negates it. Keep both entry identifiers and the reversal
      link; do not require a new reversal document number.
    evidence: >-
      Screenshots of step 12 (balance panel and Movements screen with both entries visible).
  on_fail:
    severity: MAJOR
    business_impact: >-
      Reversals do not restore the balance; stock accounting is unreliable.
    suggested_action: route_to_elixir_dev
- id: EO-006
  description: A posting task handed to the storekeeper still cannot be completed by the storekeeper, because completing a posting needs the approve permission (decision 0093 D2 and D4).
  verification:
    method: gui_screen
    detail: >-
      Step 4 is accepted. Step 5 shows the action is refused with the uniform not-found answer (HTTP 404, INV-5 and decision 0093: a caller who cannot act on the task is answered as for a missing task) and the generic text "The action failed. Try again." (not the "not permitted" text), or the task is no longer offered (the screen it does not show "Approved" or the completed state); the document REF-1 is still "Issued" and Balances still reads B0 (nothing posted). After step 6 the administrator completes the posting and the balance moves as in the later steps.
    evidence: Status of step 4, screenshots of step 5 and of Balances.
  on_fail:
    severity: BLOCKER
    business_impact: A storekeeper could post stock alone by being handed the task.
    suggested_action: route_to_backend_dev
