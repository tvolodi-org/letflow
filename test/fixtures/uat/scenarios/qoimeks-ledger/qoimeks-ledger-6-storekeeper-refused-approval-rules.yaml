# T-2222 (BA, PM decision 2026-11-19): the one refusal scenario of the ledger group. The four-eyes switch (approval rules) is an administrator function (qoimeks-ledger-4); a storekeeper is refused it.
# Sources opened: web/src/router.tsx (admin/approval-rules guarded by ApprovalRulesManage); docs/roles.md (ApprovalRulesManage: GET /approval-rules and PUT /approval-rules/:definition_name/:node_id, TENANT_ADMIN only);
# docs/roles.md STOREKEEPER (does not administer settings); web/src/components/ui/feedbackMessages.ts (permissionDenied text).
# Read-only: only the page and the list read are tried; the switch is never changed by the storekeeper.
---
id: qoimeks-ledger-6-storekeeper-refused-approval-rules
scope: qoimeks-qa2
title: >-
  The storekeeper does not find the approval rules page and is refused the list of approval rules
version: '1.0'
tags:
- qoimeks
- ledger
- four_eyes
- refusal
- storekeeper
- desktop
- read_only
description: >-
  The storekeeper signs in at 1440 px in English and looks through the side navigation, the admin section included, for the
  approval rules page. It is not offered. When the storekeeper types the address of the page (the tenant approval rules page),
  the page is refused with the message "You do not have access to this area. Contact your tenant administrator." and shows no rule.
  The storekeeper's session then asks the server for the list of approval rules (the read behind the page, no change is made):
  the answer is a refusal and carries no rule. The four-eyes switch of the stock approval steps stays as the administrator set it.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    Approval rule state, explicit (owner D-165: a new tenant has the second-person approval OFF by default, so this walk never relies on the default). Set by the operator before the walk: stock_opening / approve OFF and stock_quick_count / approve ON. The administrator records both at the start; the refusal steps must leave them exactly so.
  check: system_seeded
  detail: >-
    If a rule is not in the stated state or cannot be read by the administrator, report BLOCKED-by-environment. The storekeeper never sends a change of a rule; at the end the administrator reads both rules again and they equal the start values.
- description: >-
    Both roster accounts can sign in on https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    The administrator can read the approval rules; the storekeeper's effective permissions exclude their management.
  check: runner_prepared
  detail: >-
    If sign-in fails, report BLOCKED-by-environment and name the account; credentials come from the acceptance credential source.
- description: >-
    The run can drive a real browser at 1440 px and an HTTP client from the signed-in browser session.
  check: runner_prepared
  detail: >-
    If no browser can be started, report BLOCKED-by-environment. The storekeeper never sends a change of a rule.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator reads the current approval rules and records their values as the starting snapshot.
  via: api
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper signs in and looks through the side navigation, the admin section included, for an entry about approval rules.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper types the address of the approval rules page (the tenant approval rules page) into the browser.
  expect_refusal: true
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper's session asks the server for the list of approval rules twice (the read behind the page;
    nothing is changed). Record both refusals as R-AR and R-AR2.
  expect_refusal: true
  via: api
- step: 5
  actor: admin
  action: >-
    The administrator reads the approval rules again and compares their values to the starting snapshot.
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    The approval rules page is neither offered nor opened for the storekeeper.
  verification:
    method: gui_screen
    detail: >-
      Step 2 shows no approval rules entry in the side navigation. Step 3 shows the message "You do not have access to this area. Contact your tenant administrator." and no list of rules.
    evidence: >-
      Screenshots of steps 2 and 3.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A warehouse clerk could see or switch off the second-person check on stock postings.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    The server refuses the list of approval rules to the storekeeper and tells nothing about the rules.
  verification:
    method: api_response
    detail: >-
      R-AR and R-AR2 have HTTP status 403 and carry no rule row or switch value. Their insufficient-permissions
      answers are identical after excluding the request trace identifier. Step 5 confirms all rule
      values equal the snapshot from step 1; no value changed.
    evidence: >-
      HTTP status and body of R-AR.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A clerk could learn which stock steps need a second person and plan around the check.
    suggested_action: route_to_elixir_dev
