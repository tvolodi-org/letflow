# POST /api/v1/modules/stock/documents/<D1>/issue and /post use {}; /reverse uses {reason_code:"other",reason_text:<step note>}; /cancel uses {reason:<step note>}. GET the same document to verify final state.
# Use a fresh per-action idempotency-key if supplied; second-post refusal uses a new key, not a replay of the successful posting.
# Reverse starts a task: complete it in My Tasks before claiming restoration. Refusal is not a reachability probe; writes are only the named scenario actions.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.

# BLOCKED-by-environment: prerequisite generator task "Prepare a run-owned invalid-item posting harness for Qoimeks ledger L7" (not delivered by this scenario task).
# NOT UAT-observable on the baseline: L7 requires a prepared posting-variable harness. Unknown items fail issue-time unit validation first (Checks.masters/2), so save/issue of a fabricated item is not an L7 test.
---
id: qoimeks-ledger-3-L7-invalid-item-refused
scope: qoimeks-qa2
title: >-
  A prepared stock issue with an absent item identifier is refused at posting and cancelled without changing balances
version: '1.1'
tags:
- qoimeks
- ledger
- L7
- master_validation
- refusal
- api
description: >-
  The posting master check must refuse an absent item without writing stock. A normal document cannot reach that
  check with an unknown item because issuing checks the item unit first. This scenario therefore requires an environment-prepared
  issued stock issue whose pending posting command carries a verified absent item identifier, with all other masters
  valid. The walk reads that prepared document, attempts its pending posting task, and cancels it after refusal.
  Without that prepared fixture the whole scenario is BLOCKED-by-environment before any write; the run must not
  replace this with an earlier request-shape refusal.
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
  admin: actor-qoimeks-qa2-admin
preconditions:
- description: >-
    The stock module is active; the storekeeper holds StockPost (stock module role_grants, docs/roles.md).
  check: system_seeded
  detail: >-
    If the stock module is not installed, report BLOCKED.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
    Before dependent writes, obtain administrator read evidence of active stock definitions and shared access
    enabled, quick-count approval ON and opening approval OFF. Verify the chosen item and base unit, linked place,
    active responsible employee and absence of a location freeze from current tenant reads; if these prerequisites
    are absent or unreadable, stop the affected steps BLOCKED-by-environment. Do not infer live settings from the generator.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
- description: >-
    The environment supplies an already issued, run-owned stock issue and its pending posting task, prepared so
    the posting command references a canonical absent item identifier while its other masters are valid. Supply
    the document and task identifiers and read-only evidence that the missing item is absent, that the document
    is unposted and that its posting task remains pending. Record the original balance and movement baseline.
  check: runner_prepared
  detail: >-
    This fixture is not present in the supplied synthetic tenant and no supported browser action prepares it. The
    complete scenario is BLOCKED-by-environment until the prerequisite generator task named in the header supplies it.
    Preflight the manifest by read-only document, pending-task and item reads; missing manifest or any mismatch stops
    before step 1. The run owns only this prepared issue; step 4 withdraws its pending task and cancels the issue,
    retaining its history without modifying shared masters. Do not create
    a receipt with a fake article code, do not mutate shared masters, and do not assume an unknown item will pass
    issuing. Source: documents.ex check_issue, documents/checks.ex masters/2 and lines; the posting-variable test
    setup in REQ-832 criterion 2.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper reads the prepared test issue and records its document identifier D1, number, full stock key
    and the original balance and movement evidence. Confirm it is the run-owned fixture named in the precondition.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator opens My Tasks and the pending posting task of the prepared issue, recording the issued document
    state and matching task identifier before attempting completion.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator opens the posting task for D1 in My Tasks and attempts to complete it. Record the refusal
    and read the document state and balances again.
  expect_refusal: true
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper cancels the refused issue with reason UAT test cancel, then reads D1, the pending task list
    and balances to verify cleanup.
  via: api
expected_outcomes:
- id: EO-001
  description: >-
    The prepared issue is issued and has a matching pending posting task.
  verification:
    method: gui_screen
    detail: >-
      Steps 1 and 2 show the prepared run-owned issue in state Issued with its document number and pending posting
      task. Record the identifiers before completion. Missing or mismatched fixture is BLOCKED-by-environment.
    evidence: >-
      Prepared-fixture manifest, document and pending-task screenshots; no credentials.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The prepared invalid-master fixture did not reach posting. Record the actual response and stop; do not substitute
      a malformed article code or claim the posting check passed.
    suggested_action: route_to_elixir_dev
- id: EO-002
  description: >-
    The master check refuses the absent item before any posting.
  verification:
    method: api_response
    detail: >-
      The posting task refuses the absent item, the document stays unposted and no balance for the supplied missing
      item exists. Capture the completion response and the unchanged balance response rather than guessing words
      in a translated error.
    evidence: >-
      Screenshot of step 3 (the error state on the task panel) and confirmation that no balance for the fake item
      appears.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A typo in an item code creates a new unknown balance key whose initial unit and quantity become permanent
      (decision 0073 D6 consequence: without L7, the first posting with an unknown key pins it permanently).
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    Cancellation withdraws the refused issue without removing its history.
  verification:
    method: http_status
    detail: >-
      Cancellation returns the document in state cancelled; re-read D1 and confirm its posting task is no longer
      pending. No balance or movement for the missing item exists. The cancelled document remains visible as history.
    evidence: >-
      API response C1.
  on_fail:
    severity: MINOR
    business_impact: >-
      A stuck issued document with a fake item remains in the QA tenant; it blocks no functionality but adds noise
      to the document list.
    suggested_action: route_to_elixir_dev
