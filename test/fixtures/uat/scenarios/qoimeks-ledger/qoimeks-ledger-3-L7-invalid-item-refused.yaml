# T-2168 (BA): Qoimeks QA walk, ledger effect L7: master validation at posting refuses an invalid item. QA only, SYNTHETIC data.
# REQ ids covered: REQ-832 (Ledger slice L7: every master named by a line is a live record;
#   a non-existent item key is refused with validation_failed at posting time).
# Sources opened: docs/requirements.yaml REQ-832 (AC2: "refused with validation_failed" at the post task completion);
#   docs/migration/decisions/0073-domain-neutral-ledger-primitive.md (D6: OQ-R4 read facade used by L7 handlers;
#   "without L7 a typo in an item or location id creates a NEW balance key whose first-touch unit_ref and max_on_hand
#   pin is permanent");
#   lib/letflow/modules/stock/router.ex (moduledoc: routes /documents POST, /documents/:id/issue, /documents/:id/cancel).
# Writes: one draft stock receipt with item "UAT-FAKE-ITEM-NOT-IN-CATALOG"; issued but never posted; cancelled as cleanup.
#   No balance change.
# NOT UAT-observable here, with reasons:
#   (a) retired-master check (a valid item that was active at document creation but retired before posting): requires
#       changing an item's active flag in the shared synthetic catalog; not done here to avoid affecting shared QA data.
#   (b) L7 check for lot, unit, location, org_unit and responsible with invalid values: the web form uses pickers
#       that only allow valid values; API-only approach is used only for the item key to demonstrate the principle.
# Note: the web document form uses an item picker that only offers catalog items; it does not allow typing an arbitrary
#   key. Steps 1 and 2 therefore use the API to create a document with the fake item key.
---
id: qoimeks-ledger-3-L7-invalid-item-refused
scope: qoimeks-ledger
title: "The administrator creates a stock receipt with fake item UAT-FAKE-ITEM-NOT-IN-CATALOG via the API, issues it, and posting is refused with a master-not-found error (L7)"
version: "1.0"
tags: [qoimeks, ledger, L7, master_validation, refusal, api]

description: >
  Ledger slice L7 adds a master check at posting time: if any item named by a line is not in the catalog,
  the posting is refused. The document form in the browser only offers valid items through a picker, so
  the receipt with the fake item is created via the API (bypassing the form picker).
  The administrator creates a draft receipt whose line names the item code "UAT-FAKE-ITEM-NOT-IN-CATALOG",
  then issues it. The save and issue succeed because the master check runs only at posting, not at save or issue.
  When the administrator opens the posting task in My Tasks and tries to complete it, the system refuses
  the post with an error naming the invalid master.
  The document is cancelled to clean up.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The stock module is active; the administrator has StockPost through TENANT_ADMIN.
    check: system_seeded
    detail: If the stock module is not installed, report BLOCKED.
  - description: >
      No item with code "UAT-FAKE-ITEM-NOT-IN-CATALOG" exists in the catalog. This is a deliberately invented
      code that cannot match any synthetic item. If by chance an item with that exact code exists, use a different
      obviously-fake code and note the substitution in the results.
    check: system_seeded

steps:
  - step: 1
    actor: admin
    action: >
      The administrator creates a draft stock receipt via the API: org unit and location taken from any existing
      balance row on the Balances screen, item key "UAT-FAKE-ITEM-NOT-IN-CATALOG", quantity 1.
      The draft id is noted as D1 and the response as R1.
    via: api
  - step: 2
    actor: admin
    action: >
      The administrator issues D1 via the API. The document state and number are noted as R2.
    via: api
  - step: 3
    actor: admin
    action: >
      The administrator opens My Tasks, finds the posting task for the document from step 2 and tries to
      complete it. The error shown by the task panel is noted as E1.
    expect_refusal: true
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator cancels the issued document D1 via the API to clean up. The cancel response is noted as C1.
    via: api

expected_outcomes:
  - id: EO-001
    description: The draft and issue succeed even with a non-existent item (the master check is not at save or issue time).
    verification:
      method: http_status
      detail: >
        R1 answers 201 with state "draft"; R2 answers 200 with state "issued" and a document number.
        Neither step produces a 422 or 409.
      evidence: API responses R1 and R2.
    on_fail:
      severity: MAJOR
      business_impact: >
        If the check happened at issue time the master check is in the wrong place for decision 0073 D6's
        design; note the actual error and report it as a finding rather than a failure of this scenario.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: Completing the posting task with the invalid item is refused.
    verification:
      method: gui_screen
      detail: >
        Step 3 shows an error on the task completion panel: the error text names a master check failure
        (contains "invalid", "not found", or the equivalent in Russian or Kazakh); the document does not
        reach state "Posted"; no new balance row for "UAT-FAKE-ITEM-NOT-IN-CATALOG" appears on the Balances screen.
      evidence: Screenshot of step 3 (the error state on the task panel) and confirmation that no balance for the fake item appears.
    on_fail:
      severity: BLOCKER
      business_impact: >
        A typo in an item code creates a new unknown balance key whose initial unit and quantity become permanent
        (decision 0073 D6 consequence: without L7, the first posting with an unknown key pins it permanently).
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: The cancel cleans up the issued document.
    verification:
      method: http_status
      detail: "C1 answers 200 with an action of \"cancelled\"; the document does not appear in the main document list as active."
      evidence: API response C1.
    on_fail:
      severity: MINOR
      business_impact: >
        A stuck issued document with a fake item remains in the QA tenant; it blocks no functionality
        but adds noise to the document list.
      suggested_action: route_to_elixir_dev
