#   a non-existent item key is refused with validation_failed at posting time).
# Sources opened: docs/requirements.yaml REQ-832 (AC2: "refused with validation_failed" at the post task completion);
#   docs/migration/decisions/0073-domain-neutral-ledger-primitive.md (D6: OQ-R4 read facade used by L7 handlers;
