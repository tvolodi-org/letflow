#       only the initial received status is asserted for the newly submitted report, before any support processing.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
---
id: qoimeks-ledger-5-my-reports
scope: qoimeks-qa2
title: >-
  The Qoimeks QA storekeeper sends a problem report and sees it in My reports, in English, Russian and Kazakh
  and on a phone
version: '1.2'
tags:
- qoimeks
- my_reports
- G19
- REQ_872
- ru
- kk
- phone_390
description: >-
  The storekeeper presses "Report a problem" in the top bar, fills in the description "UAT qoimeks-ledger-5 test
  report" and submits the report. After submission the receipt panel shows a link "See my reports". The storekeeper
  follows it and sees the report in My reports with status "Received". The same screen is then verified in Russian
  ("Мои сообщения") and in Kazakh ("Менің хабарламаларым") and at a 390 px window width. The report remains in the
  system after the test (no delete route exists).
actors:
  storekeeper: actor-qoimeks-qa2-storekeeper
preconditions:
- description: >-
    The storekeeper is signed in and the "Report a problem" button is visible in the top bar.
  check: system_seeded
  detail: >-
    If the button is absent, report BLOCKED for the whole scenario.
- description: >-
    The run can drive a real browser at 390 px width and screenshot it.
  check: system_seeded
  detail: >-
    If the width cannot be set, report BLOCKED for step 5 only; walk desktop steps first.
- description: >-
    The language is set to English.
  check: system_seeded
  detail: >-
    If not, switch to English first and carry on.
- description: >-
    Sign in as actor-qoimeks-qa2-storekeeper (QOIMEKS_QA2_STOREKEEPER), the roster STOREKEEPER, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
    Before dependent writes, obtain administrator read evidence of active stock definitions and shared access
    enabled, quick-count approval ON and opening approval OFF. Verify the chosen item and base unit, linked place,
    active responsible employee and absence of a location freeze from current tenant reads; if these prerequisites
    are absent or unreadable, stop the affected steps BLOCKED-by-environment. Do not infer live settings from the generator.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
steps:
- step: 1
  actor: storekeeper
  action: >-
    The storekeeper clicks the "Report a problem" button in the top bar. The report dialog opens. The storekeeper
    fills in the description "UAT qoimeks-ledger-5 test report", gives consent and submits the report. The receipt
    panel (success message and link) is noted as RC1. Record the assigned report number from the receipt.
  via: ui
- step: 2
  actor: storekeeper
  action: >-
    The storekeeper follows the "See my reports" link in RC1 and reads the My reports screen. Match the card to
    the assigned report number and submitted text; record its number and received timestamp as CARD1.
  via: ui
- step: 3
  actor: storekeeper
  action: >-
    The storekeeper switches the language to Russian and reads the My reports screen title and CARD1's number,
    received-date label and formatted date, status and original report text.
  via: ui
- step: 4
  actor: storekeeper
  action: >-
    The storekeeper switches the language to Kazakh and reads the My reports screen title and the same card's
    number, received-date label and formatted date, status and original report text.
  via: ui
- step: 5
  actor: storekeeper
  action: >-
    At 390 px width the storekeeper reads the same card in Russian and then Kazakh. Check its number,
    received date, status and report text for readability without horizontal scrolling in each language.
  via: ui
- step: 6
  actor: storekeeper
  action: >-
    The storekeeper switches the language back to English.
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The report is submitted and the receipt shows the My reports link.
  verification:
    method: gui_screen
    detail: >-
      RC1 shows a success message and the link "See my reports" (not a raw message key, not an empty link). No error
      banner appears.
    evidence: >-
      Screenshot of step 1 (the receipt panel).
  on_fail:
    severity: MAJOR
    business_impact: >-
      The user cannot confirm the report was received and cannot navigate to their report list.
    suggested_action: route_to_frontend_dev
- id: EO-002
  description: >-
    My reports shows the submitted report with status Received.
  verification:
    method: gui_screen
    detail: >-
      CARD1 matches the receipt's assigned number and the submitted text "UAT qoimeks-ledger-5 test report".
      Its "Received" date label and formatted date correspond to the received timestamp read for this report;
      its status is "Received" in English. No error banner appears. Do not compare to the runner's calendar day.
    evidence: >-
      Screenshot of step 2 (My reports screen in English at 1440 px).
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The user cannot see the status of a problem they reported; the feedback loop is broken.
    suggested_action: route_to_frontend_dev
- id: EO-003
  description: >-
    The My reports screen is in Russian with correct labels.
  verification:
    method: gui_screen
    detail: >-
      Step 3 shows the title "Мои сообщения". CARD1 retains its recorded number and submitted text; its
      received-date label is "Получено" with the same timestamp formatted for Russian, and its status is
      "Получено". The title, date label and status show translated text rather than message keys.
    evidence: >-
      Screenshot of step 3.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Russian-speaking users see My reports with English labels.
    suggested_action: route_to_frontend_dev
- id: EO-004
  description: >-
    The My reports screen is in Kazakh with correct labels.
  verification:
    method: gui_screen
    detail: >-
      Step 4 shows the title "Менің хабарламаларым". The same card retains its recorded number and submitted text;
      its received-date label is "Қабылданды" with the same timestamp formatted for Kazakh, and its status is
      "Қабылданды". The title, date label and status show translated text rather than message keys.
    evidence: >-
      Screenshot of step 4.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Kazakh-speaking users see My reports with non-Kazakh labels.
    suggested_action: route_to_frontend_dev
- id: EO-005
  description: >-
    At 390 px width the My reports screen is readable in Russian and Kazakh.
  verification:
    method: gui_screen
    detail: >-
      Step 5 shows CARD1's number, text, received date and translated status without overlap or horizontal
      scrolling in both languages. The corresponding title "Мои сообщения" or "Менің хабарламаларым" is visible.
    evidence: >-
      Screenshots of step 5 at 390 px width in Russian and Kazakh.
  on_fail:
    severity: MAJOR
    business_impact: >-
      Storekeepers on a phone cannot read their problem report history.
    suggested_action: route_to_frontend_dev
