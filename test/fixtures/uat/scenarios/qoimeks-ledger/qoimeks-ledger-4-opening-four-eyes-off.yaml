# Do not substitute a platform or another tenant actor. No real data or production.
# T-2168 (BA): Qoimeks QA walk, ledger effects L6 and L7: stock opening with four-eyes rule OFF, self-approval, audit. QA only, SYNTHETIC data.
# REQ ids covered: REQ-831 (stock document routes accept the full-access admin for the opening process: submit, approve, reverse).
# Sources opened: docs/requirements.yaml REQ-831; docs/design/four-eyes-switch.md (sections 3.1, 3.3, 4: rule off enables self-approval;
#   audit entries "task.self_approved" with note "self-approved, four-eyes off" and "approval_rule.changed" with reason);
#   docs/status/qoimeks-migration-readiness.md section 1.4 (opening approval contract; T-2190 explicitly supplies the QA OFF baseline;
#   "four-eyes off for the opening approval");
#   lib/letflow/routers/approval_rules.ex (moduledoc: routes GET / and PUT /:definition_name/:node_id; permission ApprovalRulesManage);
#   priv/modules/stock/generate_pack.exs (two_step_definition for stock_opening: "submit" completed at issue;
#   "approve" kept apart by distinct_from);
#   web/src/modules/stock/documents/DocumentsWorkspace.tsx (banner on every issued opening, independent of rule);
#   web/src/modules/stock/documents/documentsMessages.ts (waiting message:
#   "A second administrator approves the posting in the task inbox. The person who issued it cannot.");
#   web/src/components/layout/navMessages.ts ("Approval rules" / "Правила утверждения" / "Бекіту ережелері").
# Writes: one stock opening "UAT-LEDGER-OPE-01" (posted, reversed as cleanup) and one "UAT-LEDGER-OPE-02" (self-approved after restoring OFF, then reversed as cleanup).
# NOT UAT-observable here, with reasons:
#   (a) API-token self-approval is outside this interactive-user walk; SeparationOfDuties.check/6 requires :oidc for the OFF exception.
#   (b) Storekeeper approval-rule access is covered by ledger-6 with the existing roster actor.
# T-2334 (issue 4836): documents are created, issued, claimed and completed on the screens (New document form, Issue, My Tasks); the API is used for reads and verification only (document, balance, audit) and for nothing that creates, issues, posts or reverses a document. Rule switches use the Approval rules screen.
# Runner API adapter (reads and verification only): obtain the current admin session token from the Authorization header of a successful read in the signed-in browser; keep it in memory, never log or save it.
# Send Authorization: Bearer <access_token> (exactly one Bearer prefix), Content-Type: application/json; base is https://qoimeks-qa2.letflow.qa.bizdala.com. No tenant id is accepted from another realm.
# Stock routes (router.ex): POST /api/v1/modules/stock/documents creates a draft; kind, org_unit_id, location_id, responsible_id, event_time (current ISO8601 with offset), lines [{catalog_item_id,catalog_uom_id,quantity:"1"}] for receipt/issue. All ids are read from this tenant; never article codes.
# Opening body: kind:"opening", org_unit_id, note, lines [{catalog_item_id,catalog_uom_id,location_id,responsible_id,received_on:<today YYYY-MM-DD>,quantity:"1"}]. No supplier_document_ref for opening.
# POST /api/v1/modules/stock/documents/<D1>/issue and /post use {}; /reverse uses {reason_code:"other",reason_text:<step note>}; /cancel uses {reason:<step note>}. GET the same document to verify final state.
# Use a fresh per-action idempotency-key if supplied; second-post refusal uses a new key, not a replay of the successful posting.
# Reverse starts a task: complete it in My Tasks before claiming restoration. Refusal is not a reachability probe; writes are only the named scenario actions.
# Approval adapter (approval_rules.ex): GET /api/v1/approval-rules; PUT /api/v1/approval-rules/stock_opening/approve with {four_eyes:true|false,reason:<step reason>}. Restore only the value read at start.
# Audit adapter (routers/audit.ex): GET /api/v1/audit?from=<run start ISO8601>&to=<run end ISO8601>, page by next_cursor; filter records locally by task/rule. Do not filter the whole audit by the stock document id.
# Correction from Posting.cancellable/2: an opening with a pending approve task cannot be cancelled. Restore OFF, approve OPE-2, and reverse BOTH openings, completing both reversal tasks.
# Label sources: web/src/modules/stock/stockMessages.ts, workbook/workbookMessages.ts, quickCount/quickCountMessages.ts, documents/documentsMessages.ts under web/src/modules/stock; rendered by the corresponding real page via stockRoutes.tsx.
# This temporary opening-rule switch is the existing QA scenario action; it does not set production policy or change quick-count rules.
# Audit producers: lib/letflow/approval_rules.ex audit!/6 emits approval_rule.changed; lib/letflow/engine.ex self_approved_audit_multi/3 emits task.self_approved. lib/letflow/routers/audit.ex audit_item/2 serializes before_state/after_state.
---
id: qoimeks-ledger-4-opening-four-eyes-off
scope: qoimeks-qa2
title: >-
  The Qoimeks QA administrator checks the four-eyes rule, issues a stock opening and self-approves it (rule OFF),
  sees the audit entry, then switches the rule ON and is refused, then restores the rule OFF
version: '1.2'
tags:
- qoimeks
- ledger
- opening
- four_eyes
- approval
- self_approval
- audit
- L6
- refusal
description: >-
  The QA tenant was seeded with the four-eyes rule for the stock opening approval step switched OFF (the administrator
  may approve their own opening). The administrator first reads the current rule state to confirm it is OFF, then
  creates a stock opening "UAT-LEDGER-OPE-01" for a positive quantity derived from the recorded balance, issues it (the submit step completes automatically
  at issue) and approves it in My Tasks. The approval succeeds because the rule is OFF. The administrator reads
  the audit log and finds the "self-approved, four-eyes off" note and the rule-change entry. The administrator then
  switches the rule to ON with a reason, creates a second stock opening "UAT-LEDGER-OPE-02", issues it and tries
  to approve it — the approval is refused because the rule is ON (separation of duties). The second administrator (a different person) then approves OPE-2 in a browser sign-in with the rule ON and the
  creator's own attempt is refused. Only then is the rule switched back to OFF to restore the QA state, and the audit is
  read. As cleanup both openings are reversed and the reversal tasks completed.
actors:
  admin: actor-qoimeks-qa2-admin
  admin2: actor-qoimeks-qa2-admin2
preconditions:
- description: >-
    The stock module is active; the administrator holds ApprovalRulesManage through TENANT_ADMIN and the Approval
    rules admin page is accessible.
  check: system_seeded
  detail: >-
    If the Approval rules screen is absent from the navigation, report BLOCKED.
- description: >-
    Read the effective stock_opening approve rule and confirm it is OFF before any write. T-2190 supplies this QA
    baseline. Confirm no other walk is using this setting during the temporary switch test.
  check: system_seeded
  detail: >-
    If ON, unreadable or another walk is in progress, BLOCKED-by-environment; do not silently restore a setting
    as preparation.
- description: >-
    A second administrator, actor-qoimeks-qa2-admin2 (a different person, TENANT_ADMIN, same tenant and realm), has a
    login in the acceptance credential source and can sign in to a browser session.
  check: runner_prepared
  detail: >-
    If the account is not provisioned, step 8 and EO-006 are BLOCKED-by-environment; do not use the first
    administrator in its place and do not provision it from the walk.
- description: >-
    At least one item with a known code and org unit exists in the synthetic data (read from the Balances screen).
  check: system_seeded
  detail: >-
    Use an eligible item and complete stock key from the Balances screen. Read the issued quantity for each opening;
    its reversal removes that quantity. Do not assume a fixed change to the balance.
- description: >-
    Sign in as actor-qoimeks-qa2-admin (QOIMEKS_QA2_ADMIN), the roster TENANT_ADMIN, at https://qoimeks-qa2.letflow.qa.bizdala.com/?realm=qoimeks-qa2.
    Confirm the tenant before any action. Record the item, place and balance counts at the start of the run
    (Items screen total, Locations total, Balances rows) and compare to those; every seeded
    balance with a responsible employee, one org unit QOI-OU-1. Four-eyes OFF is confirmed for opening approval
    only; read the quick-count rule separately.
    Before dependent writes, obtain administrator read evidence of active stock definitions and shared access
    enabled, quick-count approval ON and opening approval OFF. Verify the chosen item and base unit, linked place,
    active responsible employee and absence of a location freeze from current tenant reads; if these prerequisites
    are absent or unreadable, stop the affected steps BLOCKED-by-environment. Do not infer live settings from the generator.
  check: runner_prepared
  detail: >-
    Check the signed-in tenant and existing stock before walking. Missing login, modules, browser, or required fixture
    means BLOCKED-by-environment for the affected steps. Record actual baseline counts if an earlier UAT write has
    changed them. Do not seed, grant roles or alter approval rules to satisfy a precondition.
- description: >-
    The acceptance runner can execute these business steps with its own real-browser script, capture the requested
    viewport and language, and retain screenshots and any workbook bytes in the run evidence.
  check: runner_prepared
  detail: >-
    Prepare the script before the walk; no pipeline_test dependency. If browser, workbook reading or file upload
    support is unavailable, report the affected outcomes BLOCKED-by-environment; the absence of pipeline_test alone
    is not a blocker under this task contract.
steps:
- step: 1
  actor: admin
  action: >-
    The administrator opens the Approval rules admin page and reads the entry for the stock opening approval step.
    The current four_eyes value is noted as R0.
  via: ui
- step: 2
  actor: admin
  action: >-
    The administrator records the complete starting balance key and B0, including org unit, location, responsible
    employee and unit. They create an opening with that org unit, note UAT-LEDGER-OPE-01, and one line for the recorded
    item, unit, location and responsible employee, a positive quantity derived from that balance and the current
    tenant date as received date. Save and issue it as OPE-1; read its issued quantity as Q1.
  via: ui
- step: 3
  actor: admin
  action: >-
    The administrator opens My Tasks, finds the approval task for OPE-1 and approves it. The identifier of that approve
    task is noted as T1. The document state and task result are noted as S1.
  via: ui
- step: 4
  actor: admin
  action: >-
    The administrator reads the audit log of the run time window (the audit list with a from and to time covering the
    run so far, paged to the end; the audit log cannot be read by document) and picks the self-approval entry whose task
    identifier is T1. The entries found are noted as A1.
  via: api
- step: 5
  actor: admin
  action: >-
    The administrator switches the four-eyes rule for the stock opening approval step to ON with reason "UAT test:
    switching on". The switch response is noted as SW1.
  via: api
- step: 6
  actor: admin
  action: >-
    The administrator creates a second opening using the same full key, received date and quantity as OPE-1 and note UAT-LEDGER-OPE-02.
    Save and issue it as OPE-2; record its identifier for cleanup.
  via: ui
- step: 7
  actor: admin
  action: >-
    With the rule ON, the administrator who created OPE-2 opens My Tasks, finds the approval task for OPE-2 and tries to
    approve it. The refusal (403, reason separation_of_duties) and the message the task screen shows are recorded.
  expect_refusal: true
  via: ui
- step: 8
  actor: admin2
  action: >-
    With the rule still ON, the second administrator signs in to a separate browser session, opens My Tasks, claims
    the approval task for OPE-2 (created by the first administrator) and completes it. The approval succeeds and
    OPE-2 reaches the state Posted. Read the issued quantity of OPE-2 as Q2 and the document state as S2.
  via: ui
- step: 9
  actor: admin
  action: >-
    Only after OPE-2 is approved by the second administrator, the first administrator switches the four-eyes rule for
    the stock opening approval step back to OFF on the Approval rules screen with reason "UAT test: restored". The
    switch result is noted as SW2.
  via: ui
- step: 10
  actor: admin
  action: >-
    The administrator starts reversal of each posted opening (OPE-1 and OPE-2) on the document screen with reason Other and
    the corresponding test note; the reversal tasks are claimed and completed in My Tasks (by the second administrator
    for OPE-2 where the rule asks for two people). Re-read both documents and the full balance key through the API
    (read only): both documents are reversed and the balance equals B0. Finally read the audit again to include both
    rule changes and both approvals (the self-approval of OPE-1 and the approval by admin2 of OPE-2).
  via: ui
expected_outcomes:
- id: EO-001
  description: >-
    The current rule is OFF (four_eyes false) before the test.
  verification:
    method: gui_screen
    detail: >-
      R0 shows four_eyes false for the stock opening approval step; the Approval rules screen labels the step as
      "stock_opening / approve" or the translated equivalent.
    evidence: >-
      Screenshot of step 1.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The rule state differs from the agreed QA setup; the test may not reproduce the documented one-administrator
      walk.
    suggested_action: route_to_wf03
- id: EO-002
  description: >-
    With the rule OFF the administrator approves their own opening and the opening is posted.
  verification:
    method: gui_screen
    detail: >-
      Step 3 permits self-approval; the issued-opening information banner is independent of the rule. The approval succeeds and the document reaches
      state "Posted" (Russian: "Проведён", Kazakh: "Өткізілген"); the balance of the item used in OPE-1 increased by the issued line quantity read at run time.
    evidence: >-
      Screenshots of step 3 (task completion) and balance after.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      A one-administrator company cannot post the stock opening; this is the required Qoimeks Client 1 path (docs/status/qoimeks-migration-readiness.md
      section 1.4).
    suggested_action: route_to_elixir_dev
- id: EO-003
  description: >-
    The final audit includes the self-approval of OPE-1, the approval of OPE-2 by the second administrator and both rule changes.
  verification:
    method: api_response
    detail: >-
      Read audit after step 10, not only the snapshot from step 4. Page through the run time window and match task.self_approved
      to each opening approve task. Match the one task.self_approved entry to OPE-1's approve task (OPE-2 has none); match the two
      approval_rule.changed events to the opening approve rule and the supplied switch reasons. Rule changes are
      not document-scoped entries.
    evidence: >-
      Final audit response after step 10, with task and rule identifiers and run time window; redact the token.
  on_fail:
    severity: MAJOR
    business_impact: >-
      A lowered approval control leaves no trace in the audit log.
    suggested_action: route_to_elixir_dev
- id: EO-004
  description: >-
    With the rule ON the administrator cannot approve their own opening.
  verification:
    method: gui_screen
    detail: >-
      The approval action in step 7 by the creator is refused (separation of duties, 403) with a visible message on the
      task screen (record its text; none is invented here) and OPE-2 remains in state "Issued". Re-read its full-key balance
      and movements: neither changed during the refused approval. The issued document's information banner says
      "A second administrator approves the posting in the task inbox. The person who issued it cannot."
      in English; this banner is on the document, not a required task-panel error message.
    evidence: >-
      Screenshot of step 7.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The four-eyes control does not work; a single person can bypass the two-person approval requirement.
    suggested_action: route_to_elixir_dev
- id: EO-006
  description: >-
    With the rule ON a second administrator can approve OPE-2, and only after that the rule is switched OFF.
  verification:
    method: gui_screen
    detail: >-
      Step 8 by admin2 in a separate browser session: the approval completes and OPE-2 reaches Posted, while the rule
      is still ON (read the rule on the Approval rules screen before step 9). Step 9 happens after, not before.
      The audit read in step 10 shows the approval of OPE-2 by admin2 (a person other than the creator) and not a
      self-approval entry for OPE-2.
    evidence: >-
      Screenshots of step 8 and the Approval rules screen before step 9; audit response of step 10.
  on_fail:
    severity: BLOCKER
    business_impact: >-
      The two-person control cannot be completed by a second administrator, or the rule was weakened before the approval.
    suggested_action: route_to_elixir_dev
- id: EO-005
  description: >-
    The opening rule and original balance are restored after both reversals.
  verification:
    method: gui_screen
    detail: >-
      SW2 shows four_eyes false on the Approval rules screen. After both reversal tasks complete, both opening documents are reversed
      and the full key is back to B0. Neither document has a pending approval or reversal task.
    evidence: >-
      Approval rules screen after step 9 and read-only API responses of step 10.
  on_fail:
    severity: MAJOR
    business_impact: >-
      The QA tenant is left with the four-eyes rule ON, breaking the agreed one-administrator walk of the QA rehearsal
      (docs/status/qoimeks-migration-readiness.md section 1.4).
    suggested_action: route_to_elixir_dev
