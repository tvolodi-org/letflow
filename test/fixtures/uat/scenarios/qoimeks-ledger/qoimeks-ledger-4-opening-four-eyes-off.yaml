# 3. Host and screens: stockRoutes.tsx, router.tsx and mounted stock, My reports and Approval rules pages read on main; read-only tenant-host HEAD returned 200. Live authenticated screens remain unverified.
# 4. Data: read counts, full stock keys, active masters, linked places, responsible employees, pending tasks and report data at run time. Read stock definitions ACTIVE, shared access enabled, quick-count four-eyes ON and opening approval OFF before dependent writes; generator qoimeks_gen.py does not establish live settings. Ledger-3 walks part A (retired place) on screens and part B (changed posting) only after the operator fixture script named in its header exists; part B is BLOCKED-by-environment until then; never assume the script exists.
# 5. Executable: source review covers every group outcome: journal filters/legs, receipt post/reversal, L7 rule order, opening approval/audit, report cards and approval-rule refusal. Browser/HTTP runner supplies its own script. Ledger-6 tests unauthorized reads; missing fixture or credentials blocks affected steps before writes.
# 6. Dry run: T-2258 ran uat.sh preflight with title UAT qoimeks-ledger; health and realm OK, deployed SHA behind main, both actors NO_PASSWORD, tenant and app-role checks UNKNOWN. Acceptance is BLOCKED-by-environment until credentials, deployed build and data preconditions are verified. Evidence: task T-2258/preflight.json and preflight.log; no UAT scenarios run.
# T-2190: run title UAT qoimeks-ledger; tenant and realm qoimeks-qa2 only. QA only; synthetic data.
# Execution contract (T-2190 owner task): the acceptance runner supplies its own real-browser script.
# No pipeline_test is required for this walk. Retain screenshots per step/width/language and downloaded files.
# Before writes, evaluate preconditions using reads; an unmet environment need is BLOCKED-by-environment, never PASS or a product failure.
