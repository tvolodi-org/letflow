# T-2129 (BA): first acceptance run on the Qoimeks QA tenant. QA only, no real data.
# Sources: the task text (language switch ru/kk); web/src/components/ui/LanguageSwitcher.tsx (globe with the current code; menu of languages with their own names; the choice is saved per user in the browser);
# web/src/components/layout/AppShell.tsx (UI_LOCALES and UI_LOCALE_LABELS feed the switcher);
# texts in three languages: web/src/modules/locations/locationsMessages.ts ("No locations yet" / "Локаций пока нет" / "Әзірге орын жоқ"),
# web/src/modules/stock/documentsMessages.ts ("No stock documents found." / "Складских документов не найдено." / "Қойма құжаттары табылмады.").
# The browser keeps the language choice for the account, so the last step puts the language back to English to leave the account as found.
---
id: qoimeks-qa-4-language-switch-ru-kk
scope: qoimeks-qa
title: The Qoimeks QA administrator switches the screen language to Russian and Kazakh and back to English, and the empty-state messages of the locations and stock screens follow
version: "1.0"
tags: [smoke, qoimeks, i18n, ru, kk, en, empty_state]

description: >
  The administrator opens the locations screen in English, switches the language to Russian, reads it, then opens the stock documents screen and reads
  that; switches to Kazakh and reads both screens again; then switches back to English. In each language the title, the empty message and the
  hint of the screen are in that language, with no English words left over and no message shown as a raw key (for example a text like "locations.tree.emptyTitle").
  Not exercised, with reasons: (a) the sign-in page language: the choice is made after sign-in, so this scenario starts at the workspace; (b) the languages of the catalog items screen:
  covered on that screen's own scenarios in a later group, the two screens chosen here are enough to show that the switch reaches module screens.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant has the modules locations and stock installed and active, and holds no location and no stock document.
    check: system_seeded
    detail: If a screen already holds rows, report BLOCKED for the steps that read that screen's empty message, and still check that the title and the navigation change language.
  - description: The administrator's browser language choice is English at the start (a fresh browser profile).
    check: system_seeded
    detail: If the screen opens in another language, switch to English first and carry on.
  - description: The run can drive a real browser at a window width of 1440 px.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED for the whole scenario.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator signs in on the tenant's own address (https://qoimeks-qa.letflow.qa.bizdala.com) and opens the locations screen in English.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens the language menu (the globe with the current language code in the top bar) and chooses Russian, then reads the locations screen.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator opens the stock documents screen from the side navigation and reads it, still in Russian.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator opens the language menu and chooses Kazakh, then reads the stock documents screen.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator opens the locations screen from the side navigation and reads it, still in Kazakh.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator opens the language menu, chooses English, and reads the locations screen.
    via: ui

expected_outcomes:
  - id: EO-001
    description: In Russian the locations and stock documents screens speak Russian.
    verification:
      method: gui_screen
      detail: Step 2 shows "Локаций пока нет" with the hint "Создайте первую локацию, затем добавляйте дочерние."; step 3 shows "Складских документов не найдено." with the hint "Создайте первый документ или измените фильтры."; the language code in the top bar reads RU; no raw message key and no leftover English sentence.
      evidence: Screenshots of steps 2 and 3.
    on_fail:
      severity: MAJOR
      business_impact: Russian-speaking users of the tenant get a half-English product.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: In Kazakh the stock documents and locations screens speak Kazakh.
    verification:
      method: gui_screen
      detail: Step 4 shows "Қойма құжаттары табылмады." with the hint "Алғашқы құжатты жасаңыз немесе сүзгілерді өзгертіңіз."; step 5 shows "Әзірге орын жоқ" with the hint "Алғашқы орынды жасаңыз, содан кейін ішкі орындарды қосыңыз."; the language code reads KK; no raw message key.
      evidence: Screenshots of steps 4 and 5.
    on_fail:
      severity: MAJOR
      business_impact: Kazakh-speaking users of the tenant get a half-English product.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: Switching back to English restores the English texts and the choice holds across a screen change.
    verification:
      method: gui_screen
      detail: Step 6 shows "No locations yet" with the hint "Create the first location, then add its children."; the language code reads EN. Step 3 and step 5 show that the language chosen earlier stayed after moving to another screen (no jump back to English).
      evidence: Screenshots of steps 3, 5 and 6.
    on_fail:
      severity: MINOR
      business_impact: The language jumps back by itself or does not return, so the user fights the screen on each move.
      suggested_action: route_to_frontend_dev
