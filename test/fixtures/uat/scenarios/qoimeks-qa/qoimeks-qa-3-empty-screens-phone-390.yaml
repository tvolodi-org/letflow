# T-2129 (BA): first acceptance run on the Qoimeks QA tenant. QA only, no real data.
# Sources: the task text (same screens "on a phone width 390 px"); the same screens and message texts as scenario qoimeks-qa-2-empty-screens-desktop
# (web/src/modules/locations/locationsMessages.ts, catalog_items/catalogItemsItemsMessages.ts, stock/documentsMessages.ts and stockMessages.ts); web/src/components/layout/AppShell.tsx (the side navigation of a narrow window).
# The 390 px width is a browser window setting of the run, not a device test: no real phone is used.
---
id: qoimeks-qa-3-empty-screens-phone-390
scope: qoimeks-qa
title: On a phone width of 390 px the locations, catalog items and stock screens of the empty Qoimeks QA tenant show the same empty states, fit the width and can be reached
version: "1.0"
tags: [smoke, qoimeks, empty_state, phone, responsive]

description: >
  Same tenant, same empty data, but the browser window is 390 px wide (a phone). The administrator signs in, finds the
  navigation (on a narrow window the side navigation is folded away and is opened by a button), and opens the locations,
  catalog items, stock documents and stock balances screens. Each shows its plain empty message, the text is not cut
  off at the edge, nothing needs sideways scrolling to be read, and no control overlaps another.
  Not exercised, with reasons: (a) a real phone or the mobile application: the task asks for a window width only; (b) the scanner of the stock count: it needs
  data and a count order that this empty tenant does not hold.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The Qoimeks QA tenant has the modules locations, catalog_items and stock installed and active, and holds no location, no catalog item, no stock document and no stock balance.
    check: system_seeded
    detail: If a module is not active, report BLOCKED for the steps of that module. If a screen already holds rows, report BLOCKED for the empty-state outcome of that screen only.
  - description: The run can drive a real browser at a window width of 390 px, English language.
    check: system_seeded
    detail: If no browser can be started or the width cannot be set, report BLOCKED for the whole scenario.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator signs in on the tenant's own address (https://qoimeks-qa.letflow.qa.bizdala.com) in a window 390 px wide, in English, and reads the page that opens.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens the navigation (the button that unfolds it on a narrow window) and chooses the locations screen, then reads it.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator opens the navigation again, chooses the catalog items screen, and reads it.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator opens the navigation again, chooses the stock documents screen, and reads it.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator opens the navigation again, chooses the stock balances screen, and reads it.
    via: ui

expected_outcomes:
  - id: EO-001
    description: After sign-in on a phone width the workspace opens and the navigation can be reached.
    verification:
      method: gui_screen
      detail: Step 1 shows the workspace without an error banner and a control that opens the navigation; in steps 2 to 5 that control opens it and each chosen entry opens the right screen.
      evidence: Screenshots of step 1 and of the opened navigation.
    on_fail:
      severity: MAJOR
      business_impact: Nobody can move between screens on a phone.
      suggested_action: route_to_frontend_dev
  - id: EO-002
    description: The four screens show the same empty messages as on a desktop.
    verification:
      method: gui_screen
      detail: Step 2 shows "No locations yet"; step 3 shows "No items yet"; step 4 shows "No stock documents found."; step 5 shows "No balances found."; no error banner and no permanent "Loading" mark on any of them.
      evidence: One screenshot per step at 390 px.
    on_fail:
      severity: MAJOR
      business_impact: A phone user sees a broken screen where the desktop user sees an honest empty one.
      suggested_action: route_to_frontend_dev
  - id: EO-003
    description: Nothing is cut off at the edge and nothing needs sideways scrolling to be read.
    verification:
      method: gui_screen
      detail: In every screenshot of steps 1 to 5 the title, the message and the hint are fully inside the 390 px width, there is no horizontal scroll bar, and no two controls overlap.
      evidence: The five screenshots at 390 px, checked at the right edge.
    on_fail:
      severity: MINOR
      business_impact: Messages are unreadable on a phone and the first-use experience looks unfinished.
      suggested_action: route_to_frontend_dev
