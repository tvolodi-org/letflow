# Ported from R-Co tests/simulation/scenarios/swiftroute-shipment-ops-timeout-escalation.yaml
# (https://github.com/tvolodi/R-Co, commit d19bfec4a9ec492345346bfccd8e389bd9cd92db).
# Read by UAT-RUNNER as a narrative scenario script (prose action/detail/evidence fields) -- NOT
# consumed by Letflow.Simulation.Runner.run/1, which requires the differently-shaped fixtures under
# test/fixtures/simulation/<company>/scenarios/ instead.
#
# EXCEPTION (ISS-1009(a) / Q-991, BA-SWIFTROUTE, process-audit PA-SWIFTROUTE-003): aligned with the
# deployed definition test/fixtures/qa/swiftroute_process_definition.json, which is the source of
# truth: ops-review has escalation_timer_duration PT2H (not 4 hours) with escalation_role role-ceo,
# and the escalated task ceo-approval reads variables.ceo_decision (not capacity_decision).
#
# Revised for T-0322 (process audit T-0295, BA decision T-0321): the dispatcher is Lena, not Tobias
# (Tobias must stay an uninvolved TASK_WORKER); the timer step names who advances it; the stale
# "4 real hours" is corrected to the 2-hour timer.
---
id: swiftroute-shipment-ops-timeout-escalation
company_id: swiftroute
process_id: proc-swiftroute-shipment-approval
title: Shipment escalates to CEO when ops manager does not respond in time
version: "1.1"
tags: [escalation, timeout]

description: >
  When an operations manager does not act on a shipment approval request
  within 2 hours, the process must automatically escalate to the CEO.
  This scenario verifies the timer escalation path works correctly --
  the CEO receives the escalated task and can approve or reject directly,
  without waiting for the ops manager. This is a critical safety mechanism
  that prevents time-sensitive deliveries from being stuck indefinitely.

  WHO ADVANCES THE TIMER (BA decision 3221, replacing T-0321 point 5): advancing the clock is test
  control, not a business act, so it is not a persona's step. UAT-RUNNER does it with the tooling
  account swiftroute-admin-user, for the timer advance only: never for a persona's business step and
  never as the actor of a refusal check. It is a tooling account, not in the actor roster. The run
  report names the account used for the advance. If the advance-timer endpoint is unavailable, step
  2 is SKIP and the scenario must not be reported PASS.

actors:
  dispatcher: actor-swiftroute-lena
  ceo:        actor-swiftroute-alice

preconditions:
  - description: Shipment approval process definition is active
    check: process_definition_active
  - description: >
      The dispatcher can start a shipment (she holds the Process Operator responsibility in the
      swiftroute realm, BA decision T-0321). If step 1 is refused for lack of that right, the
      scenario is BLOCKED, not PASS.
    check: custom
    detail: Step 1 returns a created instance; a refusal at step 1 means BLOCKED.
  - description: >
      The tooling account swiftroute-admin-user is available to UAT-RUNNER for the timer advance of
      step 2 only (BA decision 3221; UAT assumption, to be confirmed by the process owner).
    check: custom
    detail: The run report names the account used for the advance.

steps:
  - step: 1
    actor: dispatcher
    action: >
      Submits a shipment request for 5 packages to Berlin,
      declared value €200, cargo type standard.
      The operations manager is not available and will not respond.
    via: api
    input:
      shipment_id: sim-ship-002
      destination: Berlin
      declared_value: 200
      cargo_type: standard
      requesting_actor_id: actor-swiftroute-lena
    produces:
      instance_id: "the process instance ID for this shipment"

  - step: 2
    actor: system
    action: >
      The 2-hour operations manager review timer fires. UAT-RUNNER, using the swiftroute
      tooling account swiftroute-admin-user (not a persona), advances the timer by injecting a
      timer-fire event rather than waiting the 2 real hours.
    via: api
    input:
      timer_node_id: ops-review
    note: >
      Requires the advance-timer endpoint of the instance and an account that may advance
      timers. If either is not available, this scenario is marked SKIP with severity MINOR.

  - step: 3
    actor: ceo
    action: Receives the escalated task and approves the shipment
    via: gui
    input:
      ceo_decision: approve

expected_outcomes:
  - id: EO-001
    description: >
      After the 2-hour timer fires, the CEO (not the operations manager)
      receives an escalated approval task
    verification:
      method: task_assigned
      detail: >
        After timer-fire event: a task is assigned to role-ceo.
        No task remains assigned to role-ops-manager.
    on_fail:
      severity: BLOCKER
      business_impact: >
        Shipments can stall indefinitely when an operations manager is
        unavailable. The escalation path is broken -- the CEO has no way
        to unblock time-sensitive deliveries.
      suggested_action: route_to_wf03

  - id: EO-002
    description: >
      After the CEO approves, the shipment is released and the process
      completes successfully. The escalation goes straight to the CEO's
      task, so the CEO's one approval is sufficient; no second sign-off is asked.
    verification:
      method: instance_state
      detail: instance status == COMPLETED and end node is 'end-approved'
    on_fail:
      severity: MAJOR
      business_impact: >
        Even after CEO escalation approval, the shipment is not released.
        Escalated deliveries are permanently stuck regardless of who approves.
      suggested_action: route_to_wf03

  - id: EO-003
    description: >
      The original operations manager task is no longer actionable after
      the escalation fires -- they cannot retroactively approve or reject
      after the CEO has already acted
    verification:
      method: audit_event
      detail: >
        Audit log shows ops-review task moved to timeout/cancelled state
        before ceo-approval task was created
    on_fail:
      severity: MINOR
      business_impact: >
        Dual-approval risk: if both the ops manager and CEO can act on the
        same shipment simultaneously, conflicting decisions could occur.
      suggested_action: route_to_backend_dev

cleanup:
  cancel_open_instances: true
  description: Cancel the sim-ship-002 instance if not already completed
