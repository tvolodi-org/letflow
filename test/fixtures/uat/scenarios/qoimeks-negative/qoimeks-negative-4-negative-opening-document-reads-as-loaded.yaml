# T-2160 (BA): Qoimeks QA walk, negative balances. QA only (qoimeks-qa, SYNTHETIC data), never the real tenant.
# REQ ids covered: REQ-833 (decision 0090 section 7: a negative row moves as a negative opening line; one opening document does not mix signs),
#   REQ-834 (the ledger accepts the negative opening line when the setting allows it), REQ-837 (converter writes negative lines into documents of their own; zero rows are skipped).
# Sources opened: docs/migration/decisions/0090-negative-balances-per-tenant.md sections 5 and 7; docs/requirements.yaml REQ-837 (converter criteria 1 to 3);
#   docs/runbooks/qoimeks-rehearsal.md lines 25, 54, 73 to 79 and 90 to 93 (positive and negative lines never share one file; negative headers only after the setting is on, else 422 quantity_invalid; read-back of negative keys after the load);
#   web/src/modules/stock/documents/documentsMessages.ts (kind "Opening balance" / "Начальный остаток").
# How a negative opening line loads, in business words: the old balances are moved in documents of the kind Opening balance; a negative balance goes into a document that holds only negative lines, and such a document can be created only while the tenant allows negative balances; then it is posted like the others (four-eyes is off for the opening approval in this tenant).
# Read-only walk: the administrator opens existing posted opening documents; nothing is created, so nothing to clean up.
# Not UAT-observable in a browser, with reasons (each has the observable check given):
#   (a) the converter (scripts/pilot/qoimeks_convert.py) writing the negative lines into files and skipping zero rows: a command-line tool; observable check is its report file and manifest, covered by test/scripts/qoimeks_rehearsal_test.exs; recorded as a GAP sidecar;
#   (b) a header with a negative line refused while the setting is Refused (422 quantity_invalid): needs the setting switched off, which scenario 2 does not do; an API call by the admin after a switch would be the check, not run here;
#   (c) a document mixing positive and negative lines being refused: the web form's behaviour on this input was not read; the check would be an API call by the administrator, and is not run in this walk, since it is a write.
---
id: qoimeks-negative-4-negative-opening-document-reads-as-loaded
scope: qoimeks-qa
title: The Qoimeks QA administrator finds a posted opening balance document with a negative line and the same figure on the Balances screen
version: "1.0"
tags: [qoimeks, negative_balance, opening_balance, stock_documents, ru, kk, phone_390]

description: >
  The administrator opens the Stock documents list, filters or scans for documents of the kind Opening balance, opens one that holds a negative line (the three negative balances were loaded in documents that
  hold only negative lines), reads that its status is posted and that the line shows the negative quantity with its sign, and then checks on the Balances screen that the same item at the same place reads the same negative quantity.
  Then it is checked that one opening document does not mix signs: the opened negative document holds negative lines only, and an opening document of positive lines holds no negative line.
  The same is read in Russian ("Начальный остаток") and Kazakh and at 390 px. Read-only, so nothing to clean up.
  Precondition risk: if the negative lines were loaded some other way (not as opening documents), the scenario reports BLOCKED and says what was found.

actors:
  admin: actor-qoimeks-qa-admin

preconditions:
  - description: The 603 opening balances were loaded as posted documents of the kind Opening balance, and 3 negative lines exist in them (synthetic data).
    check: system_seeded
    detail: If no posted opening document with a negative line can be found, report BLOCKED and say what the Stock documents list holds.
  - description: The administrator may read stock documents and balances.
    check: system_seeded
    detail: If either screen is missing from the navigation, report BLOCKED.
  - description: The run can drive a real browser at 1440 px and 390 px.
    check: system_seeded
    detail: If no browser can be started, report BLOCKED.

steps:
  - step: 1
    actor: admin
    action: >
      The administrator signs in on https://qoimeks-qa.letflow.qa.bizdala.com in English at 1440 px, opens Stock documents and finds the documents of the kind Opening balance.
    via: ui
  - step: 2
    actor: admin
    action: >
      The administrator opens opening documents one by one until one shows a line with a minus sign, and notes its status, the item, the place and the quantity.
    via: ui
  - step: 3
    actor: admin
    action: >
      The administrator reads all lines of that document and checks that every line has a minus sign; then opens one opening document with positive lines and checks that none of its lines has a minus sign.
    via: ui
  - step: 4
    actor: admin
    action: >
      The administrator opens Balances and finds the noted item at the noted place.
    via: ui
  - step: 5
    actor: admin
    action: >
      The administrator switches the language to Russian, reads the negative document again (kind "Начальный остаток"), then switches to Kazakh and reads it again.
    via: ui
  - step: 6
    actor: admin
    action: >
      The administrator narrows the window to 390 px wide, opens the same document and reads its line; then switches the language back to English and widens the window.
    via: ui

expected_outcomes:
  - id: EO-001
    description: A posted opening document holds the negative line with its sign and the quantity as loaded.
    verification:
      method: gui_screen
      detail: Step 2 shows a document of the kind Opening balance in the posted status with a line whose quantity has a minus sign, non-zero, with its item and place named.
      evidence: Screenshot of step 2.
    on_fail:
      severity: MAJOR
      business_impact: A negative balance moved from the old system was not recorded as it was, so the opening stock is wrong.
      suggested_action: route_to_elixir_dev
  - id: EO-002
    description: Signs are not mixed inside one opening document.
    verification:
      method: gui_screen
      detail: Step 3 shows only minus-sign lines in the negative document and no minus-sign line in the positive one.
      evidence: Screenshots of step 3, one per document.
    on_fail:
      severity: MINOR
      business_impact: The loading rule of the migration (negative lines in documents of their own) was not followed; the figures may still be right, so the finding is about the load procedure.
      suggested_action: route_to_elixir_dev
  - id: EO-003
    description: The Balances screen reads the same negative quantity for that item and place.
    verification:
      method: gui_screen
      detail: Step 4 shows the same item at the same place with the same quantity and minus sign as in step 2.
      evidence: Screenshot of step 4.
    on_fail:
      severity: BLOCKER
      business_impact: The document and the balance disagree, so the stock figures cannot be trusted.
      suggested_action: route_to_elixir_dev
  - id: EO-004
    description: The document reads in Russian and Kazakh and at 390 px with the sign intact.
    verification:
      method: gui_screen
      detail: Step 5 shows the kind as "Начальный остаток" in Russian and the Kazakh name in Kazakh, the quantity with its minus sign in both; step 6 shows the line at 390 px with the sign and digits unclipped.
      evidence: Screenshots of steps 5 and 6.
    on_fail:
      severity: MINOR
      business_impact: Users reading in Russian, Kazakh or on a phone may misread a negative quantity as positive.
      suggested_action: route_to_frontend_dev
