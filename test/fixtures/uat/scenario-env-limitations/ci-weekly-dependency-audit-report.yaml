applies_to: "Weekly dependency audit workflow (.github/workflows/dependency-audit.yml, report only, Mondays 05:23 UTC) and the first audit report docs/status/dependency-audit-2026-11.md"
reason: >
  NOT A PRODUCT FEATURE A TENANT USER OR PLATFORM OPERATOR CAN SEE, so there is no business scenario and no actor. The
  workflow runs in the code host's build service, on a timer, with a read-only token; its result is a job summary and a
  downloadable artifact in that service, and the first audit is a document in the repository. It changes no running
  instance, no screen, no route, no data and no access rule, so a UAT run against QA cannot observe it. It is not a required
  check and every step may fail without blocking a change. Whether the next scheduled run produced a summary is read on the
  code host's Actions page by the operator; the team's own test pins the workflow file's shape (test/letflow/dependency_audit_workflow_test.exs; it reads
  .github/workflows/dependency-audit.yml). Excluded from the acceptance scope, not counted as passed.
