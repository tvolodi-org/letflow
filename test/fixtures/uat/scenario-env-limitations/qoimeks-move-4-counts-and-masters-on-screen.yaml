reason: >
  The compare tools (scripts/pilot/qoimeks_compare.sh, qoimeks_balances_compare.py, qoimeks_masters_compare.py, REQ-880 and REQ-881) are offline command line scripts that read files outside the browser (the Qoimeks extract, a saved tenant snapshot, saved export pages)
  and print counts, hashes and DIFF lines to a terminal; no Letflow screen shows a hash, and the Qoimeks extract is not in the QA tenant. The write freeze, ANALYZE, rollback, working-hours and 30-day-copy rules are operator and infrastructure steps with no screen.
  The visible facts the tools compare (the numbers of places, items and balances, and a few names) are in scenario qoimeks-move-4-counts-and-masters-on-screen; the stock workbook and its round-trip check are in qoimeks-move-1 to qoimeks-move-3.
  Checked meanwhile by test/scripts/qoimeks_masters_compare_test.exs and test/scripts/qoimeks_balances_compare_test.exs.
