scenario_id: assets-cards-large-list-notice-and-load-more
applies_to_environments: [qa]
classification: GAP
applies_to: "Asset cards screen with more than 100 cards (B16#1, GH #4320): the notice \"Showing the first N cards\", the plus sign on the count, the \"Load more\" button, the notice for a search with more matches than one page, and the same texts in Russian and Kazakh"
reason: >
  NOT OBSERVABLE, not PASS. The screen shows a partial-list notice and a "Load more" button only while the register holds more than 100 active cards (one page), and a search notice only when a search has more than 100 matches. A card cannot be deleted, only retired, so a UAT run that built 101 cards on the shared QA company would leave them there for good, and the roster has no way to seed or reset a list that long (the opening import creates document lines, not cards). The case that matters most to a pilot, a register past 10 000 cards that the old screen silently cut, is far out of reach. The product's own tests prove it (web/src/modules/assets/__tests__/AssetCardsPaging.test.tsx; harness fixture web/src/dev/harness/fixtures/assets.tsx). The scenario assets-cards-2-screen-search-and-paging-notice covers what QA can show: the short list without a notice, the server-side search, wildcard characters, three languages and the access refusals.
