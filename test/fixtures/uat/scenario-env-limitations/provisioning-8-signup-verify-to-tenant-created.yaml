applies_to_environments: [qa]
classification: GAP
applies_to: "the whole end-to-end path of the public sign-up: the mailed link, following it, the realm and first administrator being made, the Letflow customer being created, the welcome mail, and the first sign-in"
reason: >
  BLOCKED, not PASS. The verification link and the one-time first credential exist only in the mail
  (lib/letflow/signup.ex moduledoc: "The token exists only in the mail; token_hash is its SHA-256"), and the UAT
  roster has no mailbox it can read: the sign-up scenario uses addresses on a domain without mailboxes
  (provisioning-6-signup-public-form-neutral-answers). Without the link no step after "verified" can be started
  from the outside. What UAT does cover: the form, its neutral answers and the single refusal for a wrong link
  (provisioning-6), and the Letflow side of the same creation call through the front door
  (provisioning-1, -2, -7). Covered in CI only by test/letflow/signup_test.exs, signup_provisioning_test.exs,
  routers/signup_http_test.exs and the saga tests of TA-SL2b (#4126), which are not UAT.
