# Fix of issue #4701 (T-2191): this sidecar no longer names the read-only walk
# qoimeks-negative-4-negative-opening-document-reads-as-loaded as its scenario_id. With that id the
# preflight marked the WHOLE walk GAP and uat-scope.md dropped it, although its four expected outcomes
# (among them the REQ-837 BLOCKER: a posted opening document with a negative line reads the same figure
# on Balances) are all checkable on screen. The sidecar now carries a placeholder scenario_id that no
# scenario file has, so it excludes nothing; it stays in the directory as the permanent record of the
# checks that are not UAT-observable (they are not expected outcomes of any scenario of the group).
