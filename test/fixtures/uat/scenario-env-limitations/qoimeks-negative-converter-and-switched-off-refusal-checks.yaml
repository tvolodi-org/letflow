reason: >
  The converter (scripts/pilot/qoimeks_convert.py) is a command-line tool, not a screen. The refusal of a negative header needs the tenant setting switched to Refused,
  which would change how the whole QA tenant posts, and the mixed-sign refusal is a write whose web behaviour was not read; the UAT runner drives screens and does not probe write endpoints.
  The visible result (a posted opening document with a negative line, the same figure on Balances) is checked by the read-only walk qoimeks-negative-4-negative-opening-document-reads-as-loaded,
  which this sidecar deliberately does not exclude.
  Checked meanwhile in CI by test/scripts/qoimeks_rehearsal_test.exs (converter) and the backend tests of REQ-834 (ledger rules).
