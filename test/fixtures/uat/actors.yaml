    note: "seed_meridian_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-meridian-thomas:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-cro]
    note: "seed_meridian_persona_actors.sh PERSONAS line; role-cro inferred from org structure per script header; TASK_WORKER implicit"
  actor-meridian-eva:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-ceo]
    note: "seed_meridian_persona_actors.sh PERSONAS line; role-ceo inferred from org structure per script header; TASK_WORKER implicit"
  actor-meridian-marcus:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-loan-ops]
    note: "seed_meridian_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-meridian-lars:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-credit-approver-l1]
    note: "seed_meridian_persona_actors.sh PERSONAS line (role-credit-approver-l1 since ISS-1028: independent L1 approver, distinct from memo reviewer Ben); TASK_WORKER implicit per script header"
  actor-meridian-sophie:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: []
    note: "seed_meridian_persona_actors.sh PERSONAS line (no routing role); TASK_WORKER implicit per script header"
  actor-meridian-oliver:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: []
    note: "seed_meridian_persona_actors.sh PERSONAS line (actor-meridian-oliver|, no routing role; dept-risk member per org_structure.yaml); TASK_WORKER implicit per script header. Process-audit WF05-BASELINE3 PA-MERIDIAN-009 / ISS-1006 / Q-988: seeded account now recorded in the roster"
  actor-meridian-hannah:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-loan-ops-lead]
    note: "seed_meridian_persona_actors.sh PERSONAS line (actor-meridian-hannah|role-loan-ops-lead, no approval role; Q-1048 / GH #2390: the loan-ops lead who completes the disbursement escalation); TASK_WORKER implicit per script header"

  actor-swiftroute-lena:
    tenant: swiftroute
    builtin_roles: [TASK_WORKER]
    routing_roles: []
    note: "seed_swiftroute_persona_actors.sh: Dispatcher, TASK_WORKER only"
  actor-swiftroute-marco:
    tenant: swiftroute
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-ops-manager]
    note: "seed_swiftroute_persona_actors.sh: Ops Manager, TASK_WORKER + role-ops-manager"
  actor-swiftroute-alice:
    tenant: swiftroute
    builtin_roles: [TASK_WORKER, TENANT_ADMIN]
    routing_roles: [role-ceo]
    note: "seed_swiftroute_persona_actors.sh: CEO, TASK_WORKER + role-ceo. Holds TENANT_ADMIN in realm swiftroute (ai-dala-infra T-0177 live re-check 2026-10-07: TASK_WORKER + TENANT_ADMIN, no PLATFORM_ADMIN). Scenario swiftroute/tenant-onboarding-happy.yaml names her alias tenant_admin"
  actor-swiftroute-auditor:
    tenant: swiftroute
    builtin_roles: [TENANT_AUDITOR]
    routing_roles: []
    note: "GH #2363 / REQ-457: read-only auditor persona, new (no existing persona reused). The TENANT_AUDITOR realm role exists in the QA realms (infra T-0214) and was assigned to this account only: the owner APPROVED it in writing on 2026-10-22 (GH #3047) and infra created the account (ai-dala-infra commit 9ebd1ee). No team seed script creates it"

  actor-swiftroute-tobias:
    tenant: swiftroute
    builtin_roles: [TASK_WORKER]
    routing_roles: []
    note: "seed_swiftroute_persona_actors.sh PERSONAS line (actor-swiftroute-tobias|, no routing role): Dispatcher, TASK_WORKER only, same as lena. Evidence: test/fixtures/simulation/swiftroute/org_structure.yaml puts him in dept-dispatch with lena; scenario swiftroute/shipment-ops-timeout-escalation.yaml has him only submit a shipment request, never claim a role task, so no routing role is granted (least privilege). Process-audit PA-SWIFTROUTE-008 / ISS-1011 / Q-993: moved out of unresolved. Whether a plain TASK_WORKER may start shipment instances is the separate PA-SWIFTROUTE-006, not decided here"
  actor-swiftroute-hans:
    tenant: swiftroute
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-accountant]
    note: "seed_swiftroute_persona_actors.sh PERSONAS line (actor-swiftroute-hans|role-accountant): Accountant, TASK_WORKER + role-accountant. Evidence: org_structure.yaml has Hans Richter alone in dept-finance; the finance-estimate task of the Driver Incident Report (test/fixtures/qa/swiftroute_incident_process_definition.json) routes to role-accountant; scenario swiftroute/driver-incident-assess-and-estimate.yaml uses him as the accountant. Process-audit PA-SWIFTROUTE-005 / ISS-1011 / Q-993 (D3): moved out of unresolved"

  actor-vortex-sabine:
    tenant: vortex
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-production-manager]
    note: "seed_vortex_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-vortex-stefan:
