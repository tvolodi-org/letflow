    note: "seed_vortex_persona_actors.sh PERSONAS line (actor-vortex-greta|role-finance-director); TASK_WORKER implicit per script header. REQ-471 / GH #2479: decides escalate-budget-approval-to-finance-director. Persona name proposed by the requirement, BA-VORTEX confirms. UAT-class: the Keycloak account is unrequested, so scenarios using this actor are blocked until it exists"
