# Actors whose built-in role could not be established. A recorded gap, not a pass for SCHEMA-8..10.
# Empty since ISS-1011 / Q-993 resolved actor-swiftroute-hans and actor-swiftroute-tobias.
unresolved: {}

# Scenario id -> reason a platform-tenant actor may appear outside scope platform.
platform_actor_allowed:
  swiftroute-tenant-onboarding-happy: "tenant onboarding is performed by the platform operator"
  swiftroute-first-login-administrator-binding: "the platform operator reads the onboarding grant list (decision 0048 section 1.7)"

# Scopes with at least one scenario and no expect_refusal step on the day of landing (may only shrink).
refusal_coverage_exempt: []

# Tenant actors seeded as PLATFORM_ADMIN, dated. Empty since REQ-454 (T-0114): no tenant actor holds
# PLATFORM_ADMIN and the seed scripts prepare tenants with TENANT_ADMIN or PROCESS_DESIGNER tokens.
# The per-realm <slug>-admin-user and promo-proposer accounts are tooling accounts, not scenario
# actors, so they are not listed here.
legacy_platform_admin: {}
