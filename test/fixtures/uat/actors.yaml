# REQ-452: UAT actor roster. One entry per login actor id used in the scenario corpus
# (actor-system-* and actor-any are not logins). Checked by
# mix letflow.check_uat_scenario_schema (SCHEMA-7..12); see docs/agents/uat-scenario-schema.md.
#
# Evidence: scripts/seed_{meridian,swiftroute,vortex}_persona_actors.sh (persona lines give
# routing_roles; their headers state TASK_WORKER is implicit for every persona),
# scripts/uat_preflight.sh (actor-platform-admin needs a seeded PLATFORM_ADMIN user),
# priv/keycloak/realms/bpm-default.json (only users: admin-user, designer-user, operator-user,
# worker-user; no actor-* accounts). Anything not established is under `unresolved`.
actors:
  actor-platform-admin:
    tenant: platform
    builtin_roles: [PLATFORM_ADMIN]
    routing_roles: []
    note: "scripts/uat_preflight.sh: actor-platform-admin needs a seeded PLATFORM_ADMIN user (qa-login admin-user)"

  actor-meridian-ben:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-credit-manager]
    note: "seed_meridian_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-meridian-miriam:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-risk-manager]
    note: "seed_meridian_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-meridian-claudia:
    tenant: meridian
    builtin_roles: [TASK_WORKER]
    routing_roles: [role-compliance-officer]
    note: "seed_meridian_persona_actors.sh PERSONAS line; TASK_WORKER implicit per script header"
  actor-meridian-julia:
