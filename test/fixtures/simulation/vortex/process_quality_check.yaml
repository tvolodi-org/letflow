# Ported from R-Co tests/simulation/companies/vortex/process_production_order_release.yaml (ISS-0388).
# Filename kept as process_quality_check.yaml to avoid breaking test references.
name: Production Order Release
version: "1.8"
description: >
  Multi-level release gate for a new production order. Planner creates the order;
  Production Manager reviews; if value > 10000 Financial Controller signs off.
  Timer escalation to CEO. Exercises: sequential chain, timer escalation,
  conditional branch.
  Escalation follows D-ESC: timer -> higher role -> fail closed (ISS-1002 / Q-984):
  capacity-review -> escalate-to-ceo -> auto-reject-order; budget-approval ->
  escalate-budget-approval-to-finance-director -> auto-reject-order. A stalled level repeats
  its own role as escalation_role (co-required attribute only; no third level).
  Budget escalation to a finance director (v1.8, REQ-471 / GH #2479):
  escalate-budget-approval-to-ceo is renamed escalate-budget-approval-to-finance-director
  and routed to role-finance-director, so it can name escalate-to-ceo, capacity-review
  and budget-approval in distinct_from (the CEO who decided escalate-to-ceo can no
  longer decide the budget escalation). budget-approval's escalation_role follows its
  timeout target.
graph:
  nodes:
    - id: start
      node_type: START
    - id: capacity-review
      node_type: HUMAN_TASK
      attributes:
        role: role-production-manager
        escalation_timer_duration: PT4H
        escalation_role: role-ceo
    - id: escalate-to-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        description: "top of chain: escalation_role is nominal; stalled = fail closed"
        escalation_timer_duration: PT4H
        escalation_role: role-ceo
    - id: budget-gate
      node_type: EXCLUSIVE_GATEWAY
    - id: budget-approval
      node_type: HUMAN_TASK
      attributes:
        role: role-controller
        escalation_timer_duration: P2D
        escalation_role: role-finance-director
        distinct_from: [capacity-review, escalate-to-ceo]
    - id: escalate-budget-approval-to-finance-director
      node_type: HUMAN_TASK
      attributes:
        role: role-finance-director
        description: "top of chain: escalation_role is nominal; stalled = fail closed"
        escalation_timer_duration: P2D
        escalation_role: role-finance-director
        distinct_from: [capacity-review, escalate-to-ceo, budget-approval]
    - id: assign-line
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /mes/orders/{order_id}/assign
        timeout_ms: 300000
    - id: auto-reject-order
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /mes/orders/{order_id}/reject
        timeout_ms: 300000
    - id: notify-planner
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /webhooks/notify
        timeout_ms: 300000
    - id: notify-planner-rejected
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /webhooks/notify
        timeout_ms: 300000
    - id: end-released
      node_type: END
    - id: end-rejected
      node_type: END
  edges:
    - id: e0
      source: start
      target: capacity-review
    - id: e1
      source: capacity-review
      target: budget-gate
      condition: "variables.capacity_decision == 'approve'"
    - id: e2
      source: capacity-review
      target: notify-planner-rejected
      condition: "variables.capacity_decision == 'reject'"
    # on_timeout for capacity-review (also fallback)
    - id: timeout-capacity-review
      source: capacity-review
      target: escalate-to-ceo
    - id: e3
      source: escalate-to-ceo
      target: budget-gate
      condition: "variables.capacity_decision == 'approve'"
    - id: e4
      source: escalate-to-ceo
      target: auto-reject-order
      condition: "variables.capacity_decision == 'reject'"
    # on_timeout for escalate-to-ceo (also fallback)
    - id: timeout-escalate-to-ceo
      source: escalate-to-ceo
      target: auto-reject-order
    - id: e5
      source: budget-gate
      target: budget-approval
      condition: "variables.order_value_eur > 10000"
    - id: e6
      source: budget-gate
      target: assign-line
      condition: "variables.order_value_eur <= 10000"
    - id: budget-gate-default
      source: budget-gate
      target: budget-approval
      is_default: true
    - id: e7
      source: budget-approval
      target: assign-line
      condition: "variables.budget_decision == 'approve'"
    - id: e8
      source: budget-approval
      target: auto-reject-order
      condition: "variables.budget_decision == 'reject'"
    # on_timeout for budget-approval (also fallback)
    - id: timeout-budget-approval
      source: budget-approval
      target: escalate-budget-approval-to-finance-director
    - id: e7-escalated
      source: escalate-budget-approval-to-finance-director
      target: assign-line
      condition: "variables.budget_decision == 'approve'"
    - id: e8-escalated
      source: escalate-budget-approval-to-finance-director
      target: auto-reject-order
      condition: "variables.budget_decision == 'reject'"
    - id: timeout-escalate-budget-approval-to-finance-director
      source: escalate-budget-approval-to-finance-director
      target: auto-reject-order
    - id: e9
      source: assign-line
      target: notify-planner
    - id: e10
      source: notify-planner
      target: end-released
    - id: e11
      source: auto-reject-order
      target: end-rejected
    - id: e12
      source: notify-planner-rejected
      target: end-rejected
