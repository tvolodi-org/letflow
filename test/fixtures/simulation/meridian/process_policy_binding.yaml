# Ported from R-Co tests/simulation/companies/meridian/process_regulatory_compliance_review.yaml (ISS-0388).
# Filename kept as process_policy_binding.yaml to avoid breaking test references.
name: Regulatory Compliance Review
version: "1.10"
description: >
  Periodic BaFin-mandated compliance review. Compliance Officer collects evidence;
  Risk Manager evaluates within 21 days. If risk-evaluation is still open when its
  P21D escalation timer fires, the flow auto-escalates to a BaFin regulatory notice
  and closes. Critical findings go to a remediation step.
  Exercises: HUMAN_TASK escalation timer, DLQ path.
  Remediation is a person, not a sub-process (ISS-1025 / Q-1007): remediation-subprocess
  is a HUMAN_TASK for role-compliance-officer recording remediation_status =
  resolved | unresolved; only 'resolved' reaches findings-sign-off, everything else
  (including no answer within P30D) ends at remediation-unresolved-escalation.
  Edge e3 carries the constant condition 'true' on purpose: it always wins on normal
  task completion but is skipped by the escalation-timer path, which follows the
  single non-conditioned edge timeout-risk-evaluation.
graph:
  nodes:
    - id: start
      node_type: START
    - id: evidence-collection
      node_type: HUMAN_TASK
      attributes:
        role: role-compliance-officer
        escalation_timer_duration: P7D
        escalation_role: role-risk-manager
        form_schema: {"type": "object", "properties": {"evidence_summary": {"type": "string", "title": "Evidence summary", "description": "Summary of the evidence collected for this review (what was gathered and where it is filed). Recorded for audit; no gateway reads it. Optional. No personal data beyond what the process needs.", "minLength": 1}}}
    - id: evidence-collection-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/reviews/{review_id}/flag
        timeout_ms: 300000
    - id: risk-evaluation
      node_type: HUMAN_TASK
      attributes:
        role: role-risk-manager
        escalation_timer_duration: P21D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"highest_severity": {"type": "string", "title": "Highest finding severity", "description": "Highest severity among the findings. 'critical' (or no answer) goes to remediation; the others go straight to CRO sign-off.", "enum": ["none", "low", "medium", "high", "critical"]}}, "required": ["highest_severity"]}
    - id: regulatory-auto-escalation
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /compliance/regulatory-notice
        timeout_ms: 300000
    - id: remediation-unresolved-escalation
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /compliance/regulatory-notice
        timeout_ms: 300000
    - id: severity-routing
      node_type: EXCLUSIVE_GATEWAY
    - id: remediation-subprocess
      node_type: HUMAN_TASK
      attributes:
        role: role-compliance-officer
        escalation_timer_duration: P30D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"remediation_status": {"type": "string", "title": "Remediation status", "description": "Whether the critical findings were remediated. Only 'resolved' reaches CRO sign-off; 'unresolved' (or no answer) files a BaFin regulatory notice.", "enum": ["resolved", "unresolved"]}}, "required": ["remediation_status"]}
    - id: post-remediation-check
      node_type: EXCLUSIVE_GATEWAY
    - id: findings-sign-off
      node_type: HUMAN_TASK
      attributes:
        role: role-cro
        escalation_timer_duration: P3D
        escalation_role: role-ceo
        distinct_from: [evidence-collection, risk-evaluation, remediation-subprocess]
        form_schema: {"type": "object", "properties": {"cro_decision": {"type": "string", "title": "CRO decision", "description": "CRO decision on the findings: 'sign_off' archives the review, 'reject_and_reopen' reopens it.", "enum": ["sign_off", "reject_and_reopen"]}}, "required": ["cro_decision"]}
    - id: cro-sign-off-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/reviews/{review_id}/escalate
        timeout_ms: 300000
    - id: ceo-override
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        escalation_timer_duration: P3D
        escalation_role: role-ceo
        distinct_from: [evidence-collection, risk-evaluation, remediation-subprocess, findings-sign-off]
        form_schema: {"type": "object", "properties": {"ceo_decision": {"type": "string", "title": "CEO decision", "description": "CEO decision after the CRO did not respond: 'sign_off' archives the review; 'reject_and_reopen' (or no answer) reopens it.", "enum": ["sign_off", "reject_and_reopen"]}}, "required": ["ceo_decision"]}
    - id: archive-review
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /compliance/reviews/{review_id}/archive
        timeout_ms: 300000
    - id: reopen-review
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /compliance/reviews/{review_id}/reopen
        timeout_ms: 300000
    - id: end-closed
      node_type: END
    - id: end-reopened
      node_type: END
  edges:
    - id: e0
      source: start
      target: evidence-collection
    - id: e1
      source: evidence-collection
      target: risk-evaluation
      condition: "true"
    # on_timeout for evidence-collection
    - id: timeout-evidence-collection
      source: evidence-collection
      target: evidence-collection-timeout
    - id: e2
      source: evidence-collection-timeout
      target: risk-evaluation
    - id: e3
      source: risk-evaluation
      target: severity-routing
      condition: "true"
    # escalation timer (P21D) fallback for risk-evaluation -> BaFin notice
    - id: timeout-risk-evaluation
      source: risk-evaluation
      target: regulatory-auto-escalation
    - id: e5
      source: regulatory-auto-escalation
      target: end-closed
    - id: e6
      source: severity-routing
      target: remediation-subprocess
      condition: "variables.highest_severity == 'critical'"
    - id: e7
      source: severity-routing
      target: findings-sign-off
      condition: "variables.highest_severity == 'none' || variables.highest_severity == 'low' || variables.highest_severity == 'medium' || variables.highest_severity == 'high'"
    - id: severity-routing-default
      source: severity-routing
      target: remediation-subprocess
      is_default: true
    - id: e8
      source: remediation-subprocess
      target: post-remediation-check
      condition: "true"
    # escalation timer (P30D) fallback for remediation-subprocess -> unresolved notice
    - id: timeout-remediation-subprocess
      source: remediation-subprocess
      target: remediation-unresolved-escalation
    - id: e9
      source: post-remediation-check
      target: findings-sign-off
      condition: "variables.remediation_status == 'resolved'"
    - id: e10
      source: post-remediation-check
      target: remediation-unresolved-escalation
      condition: "variables.remediation_status == 'unresolved'"
    - id: post-remediation-check-default
      source: post-remediation-check
      target: remediation-unresolved-escalation
      is_default: true
    - id: e11
      source: findings-sign-off
      target: archive-review
      condition: "variables.cro_decision == 'sign_off'"
    - id: e12
      source: findings-sign-off
      target: reopen-review
      condition: "variables.cro_decision == 'reject_and_reopen'"
    # on_timeout for findings-sign-off (also fallback)
    - id: timeout-findings-sign-off
      source: findings-sign-off
      target: cro-sign-off-timeout
    - id: e13
      source: cro-sign-off-timeout
      target: ceo-override
    - id: e14
      source: ceo-override
      target: archive-review
      condition: "variables.ceo_decision == 'sign_off'"
    - id: e15
      source: ceo-override
      target: reopen-review
      condition: "variables.ceo_decision == 'reject_and_reopen'"
    # fallback for ceo-override (ISS-1018: more scrutiny, never close-by-default)
    - id: fallback-ceo-override
      source: ceo-override
      target: reopen-review
    - id: e16
      source: archive-review
      target: end-closed
    - id: e17
      source: reopen-review
      target: end-reopened
    - id: e18
      source: remediation-unresolved-escalation
      target: end-closed
