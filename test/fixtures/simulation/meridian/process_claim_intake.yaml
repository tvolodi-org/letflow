# Ported from R-Co tests/simulation/companies/meridian/process_loan_origination.yaml (ISS-0388).
# Filename kept as process_claim_intake.yaml to avoid breaking test references.
# Graph translated from R-Co's YAML format to Letflow's native schema.
name: Loan Origination
version: "1.1"
description: >
  Full SME loan origination flow. Three parallel assessment tracks (credit,
  risk, KYC/AML). Standard path uses L1+L2 sign-off; large loans go to
  Credit Committee (multi-voter, mapped to HUMAN_TASK). Exercises: parallel
  fork-join, conditional authority routing, service-task core banking.
graph:
  nodes:
    - id: start
      node_type: START
    - id: parallel-assessment-fork
      node_type: PARALLEL_GATEWAY
    - id: credit-memo-review
      node_type: HUMAN_TASK
      attributes:
        role: role-credit-manager
        escalation_timer_duration: P2D
        escalation_role: role-credit-director
        form_schema: {"type": "object", "properties": {"credit_decision": {"type": "string", "title": "Credit decision", "description": "Credit memo outcome. 'pass' lets the application proceed to the eligibility gate; 'fail' declines it. eligibility-gate reads this.", "enum": ["pass", "fail"]}}, "required": ["credit_decision"]}
    - id: credit-memo-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: credit-memo-escalation-review
      node_type: HUMAN_TASK
      attributes:
        role: role-credit-director
        escalation_timer_duration: P2D
        escalation_role: role-credit-director
        form_schema: {"type": "object", "properties": {"credit_decision": {"type": "string", "title": "Credit decision", "description": "Escalation review of a credit memo that was not completed in time. Record the credit decision yourself: 'pass' proceeds to the eligibility gate, 'fail' declines. Leaving it unset declines the application (fail-closed).", "enum": ["pass", "fail"]}}, "required": ["credit_decision"]}
    - id: risk-assessment
      node_type: HUMAN_TASK
      attributes:
        role: role-risk-manager
        escalation_timer_duration: P2D
        escalation_role: role-cro
        form_schema: {"type": "object", "properties": {"risk_rating": {"type": "string", "title": "Risk rating", "description": "Risk assessment outcome. 'unacceptable' declines the application; any other rating lets it proceed to the eligibility gate. eligibility-gate reads this.", "enum": ["low", "medium", "high", "unacceptable"]}}, "required": ["risk_rating"]}
    - id: risk-assessment-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: risk-assessment-escalation-review
      node_type: HUMAN_TASK
      attributes:
        role: role-cro
        escalation_timer_duration: P2D
        escalation_role: role-cro
        form_schema: {"type": "object", "properties": {"risk_rating": {"type": "string", "title": "Risk rating", "description": "Escalation review of a risk assessment that was not completed in time. Record the risk rating yourself: 'unacceptable' declines, any other rating proceeds to the eligibility gate. Leaving it unset declines the application (fail-closed).", "enum": ["low", "medium", "high", "unacceptable"]}}, "required": ["risk_rating"]}
    - id: kyc-aml-check
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /kyc/screen
        timeout_ms: 300000
    - id: kyc-manual-review
      node_type: HUMAN_TASK
      attributes:
        role: role-compliance-officer
        escalation_timer_duration: P2D
        escalation_role: role-cro
        form_schema: {"type": "object", "properties": {"kyc_outcome": {"type": "string", "title": "KYC/AML outcome", "description": "Result of the manual KYC/AML review. Only 'cleared' lets the application proceed; 'rejected' (or no answer) declines it.", "enum": ["cleared", "rejected"]}}, "required": ["kyc_outcome"]}
    - id: kyc-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: kyc-routing
      node_type: EXCLUSIVE_GATEWAY
    - id: assessment-join
      node_type: PARALLEL_GATEWAY
    - id: eligibility-gate
      node_type: EXCLUSIVE_GATEWAY
    - id: authority-routing
      node_type: EXCLUSIVE_GATEWAY
    - id: l1-approval
      node_type: HUMAN_TASK
      attributes:
        role: role-credit-approver-l1
        escalation_timer_duration: P2D
        escalation_role: role-credit-director
        form_schema: {"type": "object", "properties": {"l1_decision": {"type": "string", "title": "L1 decision", "description": "Level 1 credit decision: 'approve' or 'escalate' passes to L2 approval, 'reject' declines.", "enum": ["approve", "escalate", "reject"]}}, "required": ["l1_decision"]}
    - id: l2-approval
      node_type: HUMAN_TASK
      attributes:
        role: role-credit-director
        escalation_timer_duration: P2D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"l2_decision": {"type": "string", "title": "L2 decision", "description": "Level 2 credit decision: 'approve' creates the facility, 'reject' (or no answer) declines.", "enum": ["approve", "reject"]}}, "required": ["l2_decision"]}
    - id: committee-vote-fork
      node_type: PARALLEL_GATEWAY
    - id: committee-vote-cro
      node_type: HUMAN_TASK
      attributes:
        role: role-cro
        escalation_timer_duration: P2D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"committee_vote_cro": {"type": "string", "title": "CRO vote", "description": "The CRO's committee vote. Two matching votes of three decide; a missing vote counts for neither side.", "enum": ["approve", "reject"]}}, "required": ["committee_vote_cro"]}
    - id: committee-vote-director
      node_type: HUMAN_TASK
      attributes:
        role: role-credit-director
        escalation_timer_duration: P2D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"committee_vote_director": {"type": "string", "title": "Credit director vote", "description": "The credit director's committee vote. Two matching votes of three decide; a missing vote counts for neither side.", "enum": ["approve", "reject"]}}, "required": ["committee_vote_director"]}
    - id: committee-vote-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        escalation_timer_duration: P2D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"committee_vote_ceo": {"type": "string", "title": "CEO vote", "description": "The CEO's committee vote. Two matching votes of three decide; a missing vote counts for neither side.", "enum": ["approve", "reject"]}}, "required": ["committee_vote_ceo"]}
    - id: committee-vote-cro-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: committee-vote-director-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: committee-vote-ceo-timeout
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/flag
        timeout_ms: 300000
    - id: committee-vote-join
      node_type: PARALLEL_GATEWAY
    - id: committee-tally
      node_type: EXCLUSIVE_GATEWAY
    - id: create-facility
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /core-banking/facilities
        timeout_ms: 300000
    - id: disburse-loan
      node_type: HUMAN_TASK
      attributes:
        role: role-loan-ops
        escalation_timer_duration: P1D
        escalation_role: role-loan-ops-lead
        form_schema: {"type": "object", "properties": {"disbursement_reference": {"type": "string", "title": "Disbursement reference", "description": "Core-banking reference of the disbursement that was made. Recorded for audit; no gateway reads it. Optional. No personal data beyond what the process needs.", "minLength": 1}}}
    - id: escalate-l2-approval-to-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        escalation_timer_duration: P2D
        escalation_role: role-ceo
        form_schema: {"type": "object", "properties": {"l2_decision": {"type": "string", "title": "L2 decision (CEO escalation)", "description": "Escalation of an L2 credit decision that the credit director did not make in time: 'approve' creates the facility, 'reject' (or no answer within the escalation deadline) declines. Same decision variable as l2-approval.", "enum": ["approve", "reject"]}}, "required": ["l2_decision"]}
    - id: escalate-disburse-loan-to-loan-ops-lead
      node_type: HUMAN_TASK
      attributes:
        role: role-loan-ops-lead
        escalation_timer_duration: P1D
        escalation_role: role-loan-ops-lead
        distinct_from: [l1-approval, l2-approval, escalate-l2-approval-to-ceo, committee-vote-cro, committee-vote-director, committee-vote-ceo]
        form_schema: {"type": "object", "properties": {"disbursement_reference": {"type": "string", "title": "Disbursement reference", "description": "Escalation of a disbursement that loan operations did not make in time: core-banking reference of the disbursement that was made. Recorded for audit; no gateway reads it. Optional. No personal data beyond what the process needs. If nobody completes this task within the escalation deadline the loan is held undisbursed and a hold notice is filed.", "minLength": 1}}}
    - id: disbursement-held-notice
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/applications/{application_id}/disbursement-hold
        timeout_ms: 300000
    - id: decline-application
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /crm/applications/{application_id}/decline
        timeout_ms: 300000
    - id: end-disbursed
      node_type: END
    - id: end-declined
      node_type: END
    - id: end-disbursement-held
      node_type: END
  edges:
    - id: e0
      source: start
      target: parallel-assessment-fork
    - id: e1
      source: parallel-assessment-fork
      target: credit-memo-review
    - id: e2
      source: parallel-assessment-fork
      target: risk-assessment
    - id: e3
      source: parallel-assessment-fork
      target: kyc-aml-check
    - id: e4
      source: credit-memo-review
      target: assessment-join
      condition: "true"
    # on_timeout for credit-memo-review
    - id: timeout-credit-memo-review
      source: credit-memo-review
      target: credit-memo-timeout
    # ISS-1015: a timeout goes to a human escalation review that records credit_decision, then rejoins
    - id: e5
      source: credit-memo-timeout
      target: credit-memo-escalation-review
    - id: e5-escalation-reviewed
      source: credit-memo-escalation-review
      target: assessment-join
      condition: "true"
    - id: timeout-credit-memo-escalation-review
      source: credit-memo-escalation-review
      target: assessment-join
    - id: e6
      source: risk-assessment
      target: assessment-join
      condition: "true"
    # on_timeout for risk-assessment
    - id: timeout-risk-assessment
      source: risk-assessment
      target: risk-assessment-timeout
    # ISS-1015: likewise for risk_rating
    - id: e7
      source: risk-assessment-timeout
      target: risk-assessment-escalation-review
    - id: e7-escalation-reviewed
      source: risk-assessment-escalation-review
      target: assessment-join
      condition: "true"
    - id: timeout-risk-assessment-escalation-review
      source: risk-assessment-escalation-review
      target: assessment-join
    - id: e8
      source: kyc-aml-check
      target: kyc-routing
    - id: e9
      source: kyc-routing
      target: assessment-join
      condition: "variables.kyc_status == 'clear'"
    - id: e10
      source: kyc-routing
      target: kyc-manual-review
      condition: "variables.kyc_status == 'hit'"
    - id: e11
      source: kyc-routing
      target: kyc-manual-review
      condition: "variables.kyc_status == 'inconclusive'"
    - id: kyc-routing-default
      source: kyc-routing
      target: kyc-manual-review
      is_default: true
    - id: e12
      source: kyc-manual-review
      target: assessment-join
      condition: "true"
    # on_timeout for kyc-manual-review
    - id: timeout-kyc-manual-review
      source: kyc-manual-review
      target: kyc-timeout
    - id: e13
      source: kyc-timeout
      target: assessment-join
    - id: e14
      source: assessment-join
      target: eligibility-gate
    # ISS-1020: KYC/AML fails closed -- approval path only on a clear screening or a
    # compliance review that recorded kyc_outcome 'cleared'; rejected / missing / timed-out
    # review falls to eligibility-gate-default (decline). Missing or null risk_rating also declines.
    - id: e15
      source: eligibility-gate
      target: authority-routing
      condition: "variables.credit_decision == 'pass' && variables.risk_rating != null && variables.risk_rating != '' && variables.risk_rating != 'unacceptable' && variables.kyc_status == 'clear'"
    - id: e15-kyc-cleared
      source: eligibility-gate
      target: authority-routing
      condition: "variables.credit_decision == 'pass' && variables.risk_rating != null && variables.risk_rating != '' && variables.risk_rating != 'unacceptable' && variables.kyc_outcome == 'cleared'"
    - id: e16
      source: eligibility-gate
      target: decline-application
      condition: "variables.credit_decision == 'fail' || variables.risk_rating == 'unacceptable'"
    - id: eligibility-gate-default
      source: eligibility-gate
      target: decline-application
      is_default: true
    - id: e17
      source: authority-routing
      target: l1-approval
      condition: "variables.requested_amount_eur <= 500000"
    - id: e18
      source: authority-routing
      target: committee-vote-fork
      condition: "variables.requested_amount_eur > 500000"
    - id: authority-routing-default
      source: authority-routing
      target: decline-application
      is_default: true
    - id: e19
      source: l1-approval
      target: l2-approval
      condition: "variables.l1_decision == 'approve' || variables.l1_decision == 'escalate'"
    - id: e20
      source: l1-approval
      target: decline-application
      condition: "variables.l1_decision == 'reject'"
    # fallback for l1-approval
    - id: fallback-l1-approval
      source: l1-approval
      target: l2-approval
    - id: e21
      source: l2-approval
      target: create-facility
      condition: "variables.l2_decision == 'approve'"
    - id: e22
      source: l2-approval
      target: decline-application
      condition: "variables.l2_decision == 'reject'"
    # fallback for l2-approval (ISS-1001: more scrutiny, never approval by default)
    - id: fallback-l2-approval
      source: l2-approval
      target: escalate-l2-approval-to-ceo
    - id: e21-escalated
      source: escalate-l2-approval-to-ceo
      target: create-facility
      condition: "variables.l2_decision == 'approve'"
    - id: e22-escalated
      source: escalate-l2-approval-to-ceo
      target: decline-application
      condition: "variables.l2_decision == 'reject'"
    - id: timeout-escalate-l2-approval-to-ceo
      source: escalate-l2-approval-to-ceo
      target: decline-application
    - id: e29
      source: committee-vote-fork
      target: committee-vote-cro
    - id: e30
      source: committee-vote-fork
      target: committee-vote-director
    - id: e31
      source: committee-vote-fork
      target: committee-vote-ceo
    - id: e32
      source: committee-vote-cro
      target: committee-vote-join
      condition: "true"
    - id: e33
      source: committee-vote-director
      target: committee-vote-join
      condition: "true"
    - id: e34
      source: committee-vote-ceo
      target: committee-vote-join
      condition: "true"
    # on_timeout for committee-vote-cro
    - id: timeout-committee-vote-cro
      source: committee-vote-cro
      target: committee-vote-cro-timeout
    # on_timeout for committee-vote-director
    - id: timeout-committee-vote-director
      source: committee-vote-director
      target: committee-vote-director-timeout
    # on_timeout for committee-vote-ceo
    - id: timeout-committee-vote-ceo
      source: committee-vote-ceo
      target: committee-vote-ceo-timeout
    - id: e35
      source: committee-vote-cro-timeout
      target: committee-vote-join
    - id: e36
      source: committee-vote-director-timeout
      target: committee-vote-join
    - id: e37
      source: committee-vote-ceo-timeout
      target: committee-vote-join
    - id: e38
      source: committee-vote-join
      target: committee-tally
    - id: e39
      source: committee-tally
      target: create-facility
      condition: "(variables.committee_vote_cro == 'approve' && variables.committee_vote_director == 'approve') || (variables.committee_vote_cro == 'approve' && variables.committee_vote_ceo == 'approve') || (variables.committee_vote_director == 'approve' && variables.committee_vote_ceo == 'approve')"
    - id: e40
      source: committee-tally
      target: decline-application
      condition: "(variables.committee_vote_cro == 'reject' && variables.committee_vote_director == 'reject') || (variables.committee_vote_cro == 'reject' && variables.committee_vote_ceo == 'reject') || (variables.committee_vote_director == 'reject' && variables.committee_vote_ceo == 'reject')"
    - id: e40-default
      source: committee-tally
      target: decline-application
      is_default: true
    - id: e26
      source: create-facility
      target: disburse-loan
    - id: e27
      source: disburse-loan
      target: end-disbursed
      condition: "true"
    - id: timeout-disburse-loan
      source: disburse-loan
      target: escalate-disburse-loan-to-loan-ops-lead
    - id: e27-escalated
      source: escalate-disburse-loan-to-loan-ops-lead
      target: end-disbursed
      condition: "true"
    - id: timeout-escalate-disburse-loan-to-loan-ops-lead
      source: escalate-disburse-loan-to-loan-ops-lead
      target: disbursement-held-notice
    - id: e41
      source: disbursement-held-notice
      target: end-disbursement-held
    - id: e28
      source: decline-application
      target: end-declined
