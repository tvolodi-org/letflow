# Ported from R-Co tests/simulation/companies/swiftroute/process_incident_report.yaml (ISS-0388).
# Filename kept as process_shipment_dispatch.yaml to avoid breaking test references.
# Graph translated from R-Co's YAML node/edge format to Letflow's native graph schema.
#
# GH #2933 (v1.1): the `ops-escalation-timer` TIMER node and its edges e12/e13 described below were
# REMOVED. It fed parallel-join, so the AND-join waited for the timer (P1D) even after ops-assessment
# and finance-estimate completed; ops-assessment has its own escalation timer (ISS-1007), so the
# branch was redundant. scenarios/shipment-ops-timeout-escalation.yaml now force-fires
# ops-assessment's escalation timer instead. The history below is kept as the record.
#
# ISS-0389 (2026-09-05, TEST-DESIGNER): added the `ops-escalation-timer` TIMER
# node below, forked in parallel with `ops-assessment`. The pre-existing
# `timeout-ops-assessment` edge (a comment-only "on_timeout" annotation on a
# HUMAN_TASK) was never a real timer in this engine's architecture -- REQ-187's
# design (lib/letflow/design/req187-timer-engine-wiring.md) only arms a timer
# for a genuine `node_type: TIMER` node; a HUMAN_TASK has no boundary-timer
# mechanism at all. This addition is what actually lets
# `shipment-ops-timeout-escalation.yaml` step 2 exercise a real, armed,
# force-fireable timer (`POST /instances/:id/advance-timer`, ISS-0389) end to
# end, matching this file's own top-of-file description ("Exercises: parallel
# fork/join, timer escalation") for the first time. The old
# `timeout-ops-assessment` edge is left untouched -- out of this issue's scope,
# and no test exercises completing the `ops-assessment` HUMAN_TASK today.
#
# Also fixes a genuine, independent, pre-existing structural bug this same
# TEST-DESIGNER pass uncovered while un-skipping the scenario: `parallel-fork`
# had in_degree 2 (both `injury-check`'s false-branch edge and
# `safety-notification`'s edge converged directly onto it) AND out_degree 2+
# (its own fork edges) -- `Letflow.Engine.Transition`'s own
# `gateway_role/2` (lib/letflow/engine/transition.ex) classifies any
# PARALLEL_GATEWAY with both in_degree > 1 and out_degree > 1 as
# `:combined_unsupported`, which `Engine.create/2` rejects with
# `{:error, {:activation_failed, {:combined_split_join_not_supported, "parallel-fork"}}}`.
# This was never caught before because no test ever actually dispatched this
# specific graph through a real `Engine.create/2` call end to end (this
# file's own req206_swiftroute_test.exs had an independent bug -- see that
# file's own comment on its `swiftroute-shipment-ops-timeout-escalation`
# describe block -- that silently substituted an unrelated graph instead).
# Fixed here with a new pure-merge `injury-check-merge` EXCLUSIVE_GATEWAY
# (in_degree 2, out_degree 1, no condition needed on its own single outgoing
# edge) inserted between the injury-check branches and `parallel-fork`, so
# `parallel-fork` itself is now a pure split (in_degree 1, out_degree 3).
#
# ISS-1007 / Q-989 (2026-10-07; BA ruling D-ESC, GH #2281): ops-assessment and finance-estimate now
# carry the escalation_timer_duration + escalation_role pair. The engine follows a timed-out
# HUMAN_TASK's FIRST unconditioned edge, so the normal-completion edges e6 / e8 became
# `condition: "true"` (otherwise they would be the "timeout" edge and a stalled task would skip
# straight to parallel-join) and the `timeout-*` edges now lead to a new role-ceo escalation task
# whose own timer fails closed to the existing *-auto-close notice service task. Because each
# human task now arms its own timer, `POST /instances/:id/advance-timer` is ambiguous for this
# definition without a `timer_id`; the simulation Runner resolves `timer_node_id` to it
# (scenarios/shipment-ops-timeout-escalation.yaml). The QA copy is test/fixtures/qa/swiftroute_incident_process_definition.json
# (seed: scripts/seed_swiftroute_incident_definition.sh; ISS-1022 / Q-1004, GH #2294); the two are kept in
# step by test/letflow/scripts/swiftroute_incident_qa_fixture_test.exs.
# REQ-530 / GH #3086 (v1.2): the four people-steps (ops-assessment, escalate-ops-assessment-to-ceo,
# finance-estimate, escalate-finance-estimate-to-ceo) carry a form_schema and required_outputs, and
# variable_schemas types assessment_notes, estimated_cost_eur and finance_notes. Mirrors the QA JSON;
# test/letflow/scripts/swiftroute_incident_qa_fixture_test.exs keeps the two equal.
name: Driver Incident Report
version: "1.2"
description: >
  Driver submits a field incident (accident, cargo damage, theft).
  Ops assessment and finance estimate run in parallel. Exercises:
  parallel fork/join, timer escalation.
  v1.2 (REQ-530, GH #3086; process audit T-0295, EO-003): the people-steps had no form, so
  assessment_notes and estimated_cost_eur could not be entered. The ops steps require
  assessment_notes; the finance steps require estimated_cost_eur (minimum 0) and take finance_notes
  optionally. The required fields are required_outputs (a completion without them is refused 422).
  Escalation follows D-ESC: timer -> higher role -> fail closed (ISS-1007 / Q-989):
  ops-assessment (role-ops-manager, P1D) -> escalate-ops-assessment-to-ceo (role-ceo, P1D) ->
  stalled: ops-auto-close (the notice: the incident closes unresolved for that branch, it is never
  marked assessed); finance-estimate (role-accountant, P1D) -> escalate-finance-estimate-to-ceo
  (role-ceo, P1D) -> stalled: finance-auto-close. Deviations (documented, no waivers): P1D rather
  than the operational PT4H default because the incident scenario's own SLA for both tasks is 24
  hours and the former ops-escalation-timer was P1D. The CEO levels are the top of the chain
  (E4): their escalation_role repeats their own role (nominal CHK-21 co-required attribute only)
  and their timeout edge goes straight to the fail-closed notice. The branch is joined by
  parallel-join (AND), so the stalled branch rejoins the flow through its notice node instead of
  ending the whole instance.
graph:
  nodes:
    - id: start
      node_type: START
    - id: injury-check
      node_type: EXCLUSIVE_GATEWAY
    - id: injury-check-merge
      node_type: EXCLUSIVE_GATEWAY
    - id: safety-notification
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /webhooks/safety-alert
        timeout_ms: 300000
    - id: parallel-fork
      node_type: PARALLEL_GATEWAY
    - id: ops-assessment
      node_type: HUMAN_TASK
      attributes:
        role: role-ops-manager
        escalation_timer_duration: "P1D"
        escalation_role: role-ceo
        required_outputs: [assessment_notes]
        form_schema:
          type: object
          properties:
            assessment_notes:
              type: string
              title: Assessment
              description: "Operations Manager assessment of the incident: what happened and what must be done next. Required; the incident record keeps it."
          required: [assessment_notes]
    - id: escalate-ops-assessment-to-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        description: "top of chain: escalation_role is nominal; stalled = fail closed"
        escalation_timer_duration: "P1D"
        escalation_role: role-ceo
        required_outputs: [assessment_notes]
        form_schema:
          type: object
          properties:
            assessment_notes:
              type: string
              title: Assessment
              description: "CEO assessment of the incident, escalated from Operations: what happened and what must be done next. Required; the incident record keeps it."
          required: [assessment_notes]
    - id: finance-estimate
      node_type: HUMAN_TASK
      attributes:
        role: role-accountant
        escalation_timer_duration: "P1D"
        escalation_role: role-ceo
        required_outputs: [estimated_cost_eur]
        form_schema:
          type: object
          properties:
            estimated_cost_eur:
              type: number
              minimum: 0
              title: "Estimated cost (EUR)"
              description: "Estimated cost of the incident in euro. Required; zero is a valid estimate."
            finance_notes:
              type: string
              title: Finance notes
              description: "Optional notes on how the estimate was reached."
          required: [estimated_cost_eur]
    - id: escalate-finance-estimate-to-ceo
      node_type: HUMAN_TASK
      attributes:
        role: role-ceo
        description: "top of chain: escalation_role is nominal; stalled = fail closed"
        escalation_timer_duration: "P1D"
        escalation_role: role-ceo
        required_outputs: [estimated_cost_eur]
        form_schema:
          type: object
          properties:
            estimated_cost_eur:
              type: number
              minimum: 0
              title: "Estimated cost (EUR)"
              description: "Estimated cost of the incident in euro, escalated from Finance. Required; zero is a valid estimate."
            finance_notes:
              type: string
              title: Finance notes
              description: "Optional notes on how the estimate was reached."
          required: [estimated_cost_eur]
    - id: ops-auto-close
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/incidents/{incident_id}/ops-timeout
        timeout_ms: 300000
    - id: finance-auto-close
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/incidents/{incident_id}/finance-timeout
        timeout_ms: 300000
    - id: parallel-join
      node_type: PARALLEL_GATEWAY
    - id: case-summary
      node_type: SERVICE_TASK
      attributes:
        endpoint: POST /internal/incidents/{incident_id}/close
        timeout_ms: 300000
    - id: end
      node_type: END
  edges:
    - id: e0
      source: start
      target: injury-check
    - id: e1
      source: injury-check
      target: safety-notification
      condition: "variables.injury_involved == true"
    - id: e2
      source: injury-check
      target: injury-check-merge
      condition: "variables.injury_involved == false"
    - id: injury-check-default
      source: injury-check
      target: safety-notification
      is_default: true
    - id: e3
      source: safety-notification
      target: injury-check-merge
    - id: e3b
      source: injury-check-merge
      target: parallel-fork
      is_default: true
    - id: e4
      source: parallel-fork
      target: ops-assessment
    - id: e5
      source: parallel-fork
      target: finance-estimate
    - id: e6
      source: ops-assessment
      target: parallel-join
      condition: "true"
    # on_timeout (D-ESC): escalate to the CEO (the node's only unconditioned edge)
    - id: timeout-ops-assessment
      source: ops-assessment
      target: escalate-ops-assessment-to-ceo
    - id: e6-escalated
      source: escalate-ops-assessment-to-ceo
      target: parallel-join
      condition: "true"
    # stalled escalation fails closed: the notice, then the join
    - id: timeout-escalate-ops-assessment-to-ceo
      source: escalate-ops-assessment-to-ceo
      target: ops-auto-close
    - id: e7
      source: ops-auto-close
      target: parallel-join
    - id: e8
      source: finance-estimate
      target: parallel-join
      condition: "true"
    # on_timeout (D-ESC): escalate to the CEO (the node's only unconditioned edge)
    - id: timeout-finance-estimate
      source: finance-estimate
      target: escalate-finance-estimate-to-ceo
    - id: e8-escalated
      source: escalate-finance-estimate-to-ceo
      target: parallel-join
      condition: "true"
    # stalled escalation fails closed: the notice, then the join
    - id: timeout-escalate-finance-estimate-to-ceo
      source: escalate-finance-estimate-to-ceo
      target: finance-auto-close
    - id: e9
      source: finance-auto-close
      target: parallel-join
    - id: e10
      source: parallel-join
      target: case-summary
    - id: e11
      source: case-summary
      target: end

variable_schemas:
  - variable_key: injury_involved
    json_schema:
      type: boolean
  - variable_key: assessment_notes
    json_schema:
      type: string
  - variable_key: estimated_cost_eur
    json_schema:
      type: number
      minimum: 0
  - variable_key: finance_notes
    json_schema:
      type: string
